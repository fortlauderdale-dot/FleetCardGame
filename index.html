      ctx.beginPath(); ctx.arc(dx, postTop, dividerThickness, 0, Math.PI * 2);
      ctx.fillStyle = '#e7fbf8'; ctx.fill();
    }
    // Clearly flag the 3 drop lanes at the top of the board so it's obvious which button drops
    // from where, instead of leaving the player to guess at an unmarked gap above the pegs.
    const dropLabels = ['L', 'C', 'R'];
    for (let i = 0; i < FLEET_PLINKO_CONFIG.dropSlotFractions.length; i++) {
      const x = dropSlotX(i);
      ctx.beginPath();
      ctx.moveTo(x - 7, pegTop - 14);
      ctx.lineTo(x + 7, pegTop - 14);
      ctx.lineTo(x, pegTop - 4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,196,77,0.85)';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,196,77,0.9)';
      ctx.font = 'bold 11px Aptos, Arial'; ctx.textAlign = 'center';
      ctx.fillText(dropLabels[i], x, pegTop - 20);
      ctx.strokeStyle = 'rgba(255,196,77,0.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, pegTop - 4); ctx.lineTo(x, pegTop + 10); ctx.stroke();
    }
    if (state.chip) {
      const chip = state.chip;
      ctx.beginPath(); ctx.arc(chip.x, chip.y, chip.r + 5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(31,182,166,0.20)'; ctx.fill();
      ctx.beginPath(); ctx.arc(chip.x, chip.y, chip.r, 0, Math.PI * 2);
      const chipGradient = ctx.createRadialGradient(chip.x - 2, chip.y - 2, 1, chip.x, chip.y, chip.r);
      chipGradient.addColorStop(0, '#eafffb'); chipGradient.addColorStop(0.4, '#6fe8d9'); chipGradient.addColorStop(1, '#0d8377');
      ctx.fillStyle = chipGradient; ctx.fill();
      ctx.strokeStyle = 'rgba(230,255,250,0.85)'; ctx.stroke();
    }
  }

  function startDrop(slotIndex) {
    if (state.animating || state.finished) return;
    state.animating = true; state.drops++; state.round++; state.displayRound = state.round; state.currentSlot = null;
    state.physicsFrames = 0;
    const dropX = dropSlotX(slotIndex);
    state.chip = { x: dropX + (Math.random() - 0.5) * 14, y: FLEET_PLINKO_CONFIG.dropStartY, vx: (Math.random() - 0.5) * 1.4, vy: 0, r: FLEET_PLINKO_CONFIG.chipRadius };
    hideButtons();
    setMessage('The chip is in motion...', '');
    updateUI();
    runPhysics();
  }
  // The walls used to sit a flat 8px from the board edge, well inside the reach of the leftmost/
  // rightmost peg column (those pegs sit at sidePadding, and the peg+chip radii together reach
  // wide enough to overlap that spot). That let a chip get caught right at the edge, wall-bounced
  // one way and immediately peg-bounced back the other way, over and over, with almost no net
  // progress. Pushing the wall in to sidePadding - chipRadius + 2 keeps it just past that edge
  // peg's center, so a peg correction there now shoves the chip further IN (away from the wall,
  // toward the middle) instead of back OUT into the wall - the two corrections work together
  // instead of fighting. It also closes most of the empty corridor next to the wall in the
  // staggered rows (which have no peg that close to the edge at all), where a chip could
  // otherwise drift for a while doing nothing but weak, repeated wall grazes.
  const wallInset = sidePadding - FLEET_PLINKO_CONFIG.chipRadius + 2;
  function clampToWalls(chip) {
    if (chip.x - chip.r < wallInset) chip.x = wallInset + chip.r;
    if (chip.x + chip.r > W - wallInset) chip.x = W - wallInset - chip.r;
  }
  // Bucket-divider collision - only matters once the chip has dropped low enough to reach the
  // divider posts. Pushes the chip back to whichever side of the post it was already on and
  // kills its sideways speed, so once a chip has committed to a bucket it settles there instead
  // of bouncing back and forth across the boundary.
  const dividerZoneTop = slotTop - dividerHeight;
  function collideDividers(chip) {
    if (chip.y + chip.r < dividerZoneTop) return;
    const halfW = dividerThickness / 2 + chip.r;
    for (const dx0 of dividerXs) {
      const dx = chip.x - dx0;
      if (Math.abs(dx) < halfW) {
        chip.x = dx0 + (dx < 0 ? -halfW : halfW);
        chip.vx *= -0.3;
      }
    }
  }
  function runPhysics() {
    const chip = state.chip;
    chip.vy += FLEET_PLINKO_CONFIG.gravity;
    chip.vx *= FLEET_PLINKO_CONFIG.horizontalFriction;
    chip.x += chip.vx; chip.y += chip.vy;
    // A wall hit now kicks noticeably harder than a peg-to-peg bounce (wallBounce/wallNudge
    // instead of the weaker peg bounce/nudge) and always adds a little extra downward push, so
    // the chip can't stall out purely oscillating side to side against a wall - every wall touch
    // is guaranteed some real vertical progress on top of the stronger sideways kick.
    let hitWall = false;
    if (chip.x - chip.r < wallInset) { chip.x = wallInset + chip.r; chip.vx = Math.abs(chip.vx) * FLEET_PLINKO_CONFIG.wallBounce + Math.random() * FLEET_PLINKO_CONFIG.wallNudge; hitWall = true; }
    if (chip.x + chip.r > W - wallInset) { chip.x = W - wallInset - chip.r; chip.vx = -Math.abs(chip.vx) * FLEET_PLINKO_CONFIG.wallBounce - Math.random() * FLEET_PLINKO_CONFIG.wallNudge; hitWall = true; }
    if (hitWall) chip.vy += 0.15;
    for (const peg of pegs) {
      const dx = chip.x - peg.x, dy = chip.y - peg.y;
      const minDistance = chip.r + peg.r;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared < minDistance * minDistance) {
        const distance = Math.sqrt(distanceSquared) || 0.001;
        const nx = dx / distance, ny = dy / distance;
        const overlap = minDistance - distance;
        chip.x += nx * overlap; chip.y += ny * overlap;
        const dot = chip.vx * nx + chip.vy * ny;
        chip.vx = chip.vx - 2 * dot * nx; chip.vy = chip.vy - 2 * dot * ny;
        chip.vx += (Math.random() - 0.5) * 0.35;
        chip.vx *= FLEET_PLINKO_CONFIG.bounce; chip.vy *= FLEET_PLINKO_CONFIG.bounce;
      }
    }
    // Re-clamp after the peg pass so a peg correction can never shove the chip back out past a
    // wall it just bounced off in this same frame.
    clampToWalls(chip);
    collideDividers(chip);
    // The chip now actually falls into its bucket and rests on the floor there, instead of being
    // credited and vanishing the instant it reaches the top of the bucket row - the divider posts
    // (collideDividers above) keep it boxed inside whichever bucket it entered on the way down.
    // A frame-count safety valve forces a settle if a chip ever gets stuck oscillating between a
    // peg and a divider post right at the edge of the bucket zone for an unreasonably long time,
    // so a rare unlucky bounce pattern can never leave the board stuck forever.
    state.physicsFrames = (state.physicsFrames || 0) + 1;
    if (chip.y >= H - chip.r - 4 || state.physicsFrames > 900) { chip.y = H - chip.r - 4; drawBoard(); settleChip(); return; }
    drawBoard();
    state.animationId = requestAnimationFrame(runPhysics);
  }
  function settleChip() {
    state.animating = false;
    let index = Math.floor((state.chip.x - sidePadding) / slotWidth);
    index = Math.max(0, Math.min(slotCount - 1, index));
    const slot = slotsForRound(state.round)[index];
    state.currentSlot = slot;
    state.chip.x = sidePadding + index * slotWidth + slotWidth / 2;
    state.chip.y = slotTop + 20;
    drawBoard();
    if (slot.type === 'loss') { handleLoss(); return; }
    handleReward(slot);
  }
  function handleReward(slot) {
    const amount = slot.amount || 0;
    if (slot.type === 'coins') { state.haul.coins += amount; state.rewardHistory.push(`+${amount} Coins`); }
    else if (slot.type === 'gems') { state.haul.gems += amount; state.rewardHistory.push(`+${amount} Gem${amount === 1 ? '' : 's'}`); }
    else if (slot.type === 'fuel') { state.haul.fuel += amount; state.rewardHistory.push(`+${amount} Fuel`); }
    updateUI();
    setMessage(`Landed on ${slot.label}.`, 'positive');
    playSfx('open');
    // Preview next round's Game Over columns now, while the player is deciding whether to drop
    // again - the escalation should be visible information to plan around, not a hidden trap
    // that only reveals itself once they've already committed to the next drop.
    state.displayRound = state.round + 1;
    drawBoard();
    showDecisionButtons();
  }
  function handleLoss() {
    const lostText = formatHaul();
    state.haul = { coins: 0, gems: 0, fuel: 0 };
    state.rewardHistory = [];
    updateUI();
    setMessage(`Total loss - ${lostText} was lost.`, 'danger');
    playSfx('lose');
    dropSlotBtns.forEach(b => b.classList.add('fleet-plinko-hidden')); takeBtn.classList.add('fleet-plinko-hidden');
    setTimeout(finishAfterLoss, 1100);
  }
  function finishAfterLoss() {
    if (state.finished) return;
    state.finished = true;
    hideButtons();
    setTimeout(() => { closeGame(); onComplete({ coins: 0, gems: 0, fuel: 0, drops: state.drops, lost: true }); }, 250);
  }

  dropSlotBtns.forEach((btn, i) => btn.addEventListener('click', () => startDrop(i)));
  takeBtn.addEventListener('click', () => { if (!state.animating && !state.finished) finishWithHaul(); });
  exitBtn.addEventListener('click', () => { if (state.animating || state.finished) return; if (numericHaulValue() > 0) finishWithHaul(); else closeGame(); });

  updateUI();
  drawBoard();
}
/* ============================================================
   FLEET BLACKJACK - Fleet Compound bonus minigame.
   Three EMPTY hands and a real dealer. Each hand's reward is locked in and shown before a
   single card is dealt, but there are no starting cards - hitting draws 3 cards you freely
   allocate across whichever hands are still live (including onto a hand with zero cards),
   so even the very first hit is a real placement decision. A hand that busts forfeits its
   reward; a hand that hits exactly 21 locks (no more cards can go to it). The dealer shows
   one card face-up and one face-down from the start for a bit of real strategy, then plays
   a standard hit-to-17 hand once you Stand - each surviving hand only pays out if it beats
   the dealer's final total (a push pays nothing, same convention as Fleet Poker).
   Opened with openFleetBlackjack({ onComplete(haul) }); reward weights live in
   FLEET_BLACKJACK_CONFIG below.
   ============================================================ */
const FLEET_BLACKJACK_CONFIG = {
  handCount: 3,
  drawSize: 3,
  rewardSlots: [
    { id: 'coins_small', label: '+10 Coins', type: 'coins', amount: 10, weight: 22 },
    { id: 'coins_medium', label: '+20 Coins', type: 'coins', amount: 20, weight: 16 },
    { id: 'coins_large', label: '+35 Coins', type: 'coins', amount: 35, weight: 7 },
    { id: 'fuel', label: '+1 Fuel', type: 'fuel', amount: 1, weight: 14 },
    { id: 'fuel_big', label: '+2 Fuel', type: 'fuel', amount: 2, weight: 6 },
    { id: 'gems', label: '+1 Gem', type: 'gems', amount: 1, weight: 9 },
    { id: 'gems_big', label: '+2 Gems', type: 'gems', amount: 2, weight: 3 },
  ],
};
// Standard soft-ace blackjack scoring: Aces count as 11 unless that would bust the hand, in
// which case they drop to 1 one at a time until the hand is 21 or under (or still busted).
function blackjackHandValue(cards) {
  let total = 0, aces = 0;
  for (const c of cards) {
    if (c.rank === 14) { aces++; total += 11; }
    else if (c.rank >= 11) total += 10;
    else total += c.rank;
  }
  let softAces = aces;
  while (total > 21 && softAces > 0) { total -= 10; softAces--; }
  return { total, soft: softAces > 0, busted: total > 21 };
}
function weightedBlackjackReward() {
  const slots = FLEET_BLACKJACK_CONFIG.rewardSlots;
  let totalWeight = 0; for (const s of slots) totalWeight += Math.max(0, s.weight || 0);
  let roll = Math.random() * totalWeight;
  for (const s of slots) { roll -= Math.max(0, s.weight || 0); if (roll <= 0) return s; }
  return slots[slots.length - 1];
}
function applyBlackjackHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.blackjackPlayed = true;
  const parts = [];
  if (!haul.lost) {
    if (haul.coins) { RUN.chips += haul.coins; parts.push(`${haul.coins} coins`); }
    if (haul.gems) { RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems); parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`); }
    if (haul.fuel) { RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel); parts.push(`${haul.fuel} fuel`); }
  }
  RUN.lastNotice = parts.length ? `Blackjack haul banked: ${parts.join(', ')}.` : 'Blackjack: nothing banked this round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetBlackjack(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetBlackjackOverlay');
  if (old) old.remove();

  // Locks Blackjack for the world the moment it's opened (not just on completion) - the
  // starting hands and reward slots are randomized and visible immediately, so without this
  // a player could back out before drawing and re-open for a better starting deal for free.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.blackjackPlayed = true;
  saveRun();

  let deck = shuffle(freshDeck());
  function drawCard() { if (!deck.length) deck = shuffle(freshDeck()); return deck.pop(); }

  const state = {
    hands: Array.from({ length: FLEET_BLACKJACK_CONFIG.handCount }, () => ({ cards: [], reward: weightedBlackjackReward() })),
    dealer: { cards: [drawCard(), drawCard()], revealed: false },
    pool: [],
    finished: false,
    hasDrawnOnce: false,
  };
  // No starting cards for the player - every card, including the first, arrives via a Hit and
  // has to be placed into one of the 3 (initially empty) hands, so the very first decision is a
  // real one instead of an automatic 2-card freebie.

  function handStatus(hand) {
    const v = blackjackHandValue(hand.cards);
    return { total: v.total, soft: v.soft, busted: v.busted, natural: hand.cards.length === 2 && v.total === 21 };
  }
  function canReceiveCard(hand) { const st = handStatus(hand); return !st.busted && st.total < 21; }
  function liveHands() { return state.hands.filter(canReceiveCard); }
  function anyStillStanding() { return state.hands.some(h => !handStatus(h).busted); }

  const overlay = document.createElement('div');
  overlay.id = 'fleetBlackjackOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML = `
    <div class="wo wide" style="max-width:820px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Blackjack</em></h1>
        <div class="note" style="margin-top:2px;text-align:center">Every hand's reward is locked in from the start. Hit to fill your hands, or Stand once you like your totals - each hand only pays out if it beats the dealer.</div>
        <div id="fleetBjDealerWrap" class="fleetBjDealerWrap">
          <div class="fleetBjHandReward" style="color:var(--dim)">Dealer</div>
          <div id="fleetBjDealerCards" class="fleetBjHandCards"></div>
          <div id="fleetBjDealerTotal" class="fleetBjHandTotal"></div>
        </div>
        <div id="fleetBjMessage" style="min-height:22px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetBjHands" class="fleetBjHands"></div>
        <div id="fleetBjPoolWrap" class="fleetMiniPoolWrap" style="display:none">
          <div class="note" style="text-align:center;margin:8px 0 4px">Click a card, then click a hand to place it.</div>
          <div id="fleetBjPool" style="display:flex;justify-content:center;gap:8px"></div>
        </div>
        <div id="fleetBjControls" style="display:flex;justify-content:center;gap:10px;padding-top:14px;flex-wrap:wrap">
          <button class="wo-btn green" id="fleetBjDrawBtn">Hit (Draw 3)</button>
          <button class="wo-btn amber" id="fleetBjBankBtn">Stand</button>
          <button class="wo-btn gray" id="fleetBjExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const dealerCardsEl = document.getElementById('fleetBjDealerCards');
  const dealerTotalEl = document.getElementById('fleetBjDealerTotal');
  const handsWrap = document.getElementById('fleetBjHands');
  const poolWrap = document.getElementById('fleetBjPoolWrap');
  const poolEl = document.getElementById('fleetBjPool');
  const message = document.getElementById('fleetBjMessage');
  const drawBtn = document.getElementById('fleetBjDrawBtn');
  const bankBtn = document.getElementById('fleetBjBankBtn');
  const exitBtn = document.getElementById('fleetBjExitBtn');

  let selectedPoolIdx = null;
  function cardHTML(c) { return `<div class="card big ${suitColorClass(c.color, c.suit)}"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`; }
  function cardBackHTML() { return `<div class="card back big"></div>`; }

  function renderDealer() {
    const visibleCards = state.dealer.revealed ? state.dealer.cards : [state.dealer.cards[0]];
    dealerCardsEl.innerHTML = visibleCards.map(cardHTML).join('') + (state.dealer.revealed ? '' : cardBackHTML());
    if (state.dealer.revealed) {
      const v = blackjackHandValue(state.dealer.cards);
      dealerTotalEl.textContent = v.busted ? 'Bust' : String(v.total) + (v.soft ? ' (soft)' : '');
      dealerTotalEl.className = 'fleetBjHandTotal ' + (v.busted ? 'bjBust' : '');
    } else {
      dealerTotalEl.textContent = 'Showing ' + rankLabel(state.dealer.cards[0].rank);
      dealerTotalEl.className = 'fleetBjHandTotal';
    }
  }

  function renderHands() {
    handsWrap.innerHTML = state.hands.map((hand, i) => {
      const st = handStatus(hand);
      const canTarget = state.pool.length > 0 && selectedPoolIdx != null && canReceiveCard(hand);
      const statusLabel = st.busted ? 'Bust' : st.natural ? 'Blackjack!' : st.total === 21 ? '21 - Locked' : hand.cards.length ? String(st.total) + (st.soft ? ' (soft)' : '') : 'Empty';
      const statusClass = st.busted ? 'bjBust' : (st.natural || st.total === 21) ? 'bjLocked' : '';
      const resultLabel = hand.outcome ? `<div class="fleetBjHandOutcome ${hand.outcome}">${hand.outcome === 'win' ? 'Win' : hand.outcome === 'push' ? 'Push' : 'Lose'}</div>` : '';
      return `<div class="fleetBjHand ${st.busted ? 'busted' : ''} ${canTarget ? 'targetable' : ''}" data-bjhand="${i}">
        <div class="fleetBjHandReward">${hand.reward.label}</div>
        <div class="fleetBjHandCards">${hand.cards.map(cardHTML).join('')}</div>
        <div class="fleetBjHandTotal ${statusClass}">${statusLabel}</div>
        ${resultLabel}
      </div>`;
    }).join('');
    handsWrap.querySelectorAll('[data-bjhand]').forEach(el => {
      el.onclick = () => { if (selectedPoolIdx == null) return; placeCard(+el.dataset.bjhand); };
    });
  }
  function renderPool() {
    if (!state.pool.length) { poolWrap.style.display = 'none'; poolEl.innerHTML = ''; return; }
    poolWrap.style.display = '';
    poolEl.innerHTML = state.pool.map((c, i) => `<div class="card big ${suitColorClass(c.color, c.suit)} ${selectedPoolIdx === i ? 'selected' : ''}" data-poolcard="${i}" style="cursor:pointer"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`).join('');
    poolEl.querySelectorAll('[data-poolcard]').forEach(el => { el.onclick = () => { selectedPoolIdx = +el.dataset.poolcard; renderPool(); renderHands(); }; });
  }
  function updateControls() {
    const dealing = state.pool.length > 0;
    drawBtn.style.display = dealing ? 'none' : '';
    bankBtn.style.display = dealing ? 'none' : '';
    exitBtn.style.display = dealing ? 'none' : '';
    drawBtn.disabled = liveHands().length === 0;
    // Stand only pays out hands that survived a real hit - with no starting cards, every hand
    // is empty (and un-busted) until you hit at least once, so without this a player could open
    // Blackjack and Stand for free with 3 empty "0" hands that can never actually beat a dealer.
    bankBtn.disabled = !state.hasDrawnOnce;
    bankBtn.textContent = state.hasDrawnOnce ? 'Stand' : 'Stand (hit first)';
  }

  function placeCard(handIdx) {
    const hand = state.hands[handIdx];
    if (!canReceiveCard(hand)) return;
    const card = state.pool.splice(selectedPoolIdx, 1)[0];
    hand.cards.push(card);
    selectedPoolIdx = null;
    const st = handStatus(hand);
    if (st.busted) { playSfx('lose'); message.textContent = `Hand ${handIdx + 1} busted - reward forfeited.`; }
    else if (st.total === 21) { playSfx('open'); message.textContent = `Hand ${handIdx + 1} locked at 21.`; }
    else { message.textContent = ''; }
    // If cards remain in the pool but every hand is now busted or locked, there's nowhere left
    // to put them - discard the rest and force the round to a close instead of stranding cards.
    if (state.pool.length && liveHands().length === 0) {
      state.pool = [];
      message.textContent = 'No hands left to draw for.';
    }
    if (!anyStillStanding()) { finishRound(); return; }
    renderPool(); renderHands(); renderDealer(); updateControls();
  }

  function startDraw() {
    if (state.finished || state.pool.length || liveHands().length === 0) return;
    state.hasDrawnOnce = true;
    for (let i = 0; i < FLEET_BLACKJACK_CONFIG.drawSize; i++) state.pool.push(drawCard());
    selectedPoolIdx = null;
    message.textContent = 'Assign all 3 cards before hitting again.';
    renderPool(); renderHands(); renderDealer(); updateControls();
  }

  function formatBjHaul(h) {
    const parts = [];
    if (h.coins) parts.push(`${h.coins} Coins`);
    if (h.gems) parts.push(`${h.gems} Gem${h.gems > 1 ? 's' : ''}`);
    if (h.fuel) parts.push(`${h.fuel} Fuel`);
    return parts.length ? parts.join(' + ') : '0';
  }
  function finishRound() {
    if (state.finished) return;
    state.finished = true;
    drawBtn.style.display = 'none'; bankBtn.style.display = 'none'; exitBtn.style.display = 'none';
    poolWrap.style.display = 'none';

    const haul = { coins: 0, gems: 0, fuel: 0 };
    // Guards against a bank/exit that happens before any hit ever occurred - with no starting
    // cards, every hand is empty (and un-busted) until you hit at least once, so without this
    // check every hand would still read as "standing" and pay out for free against the dealer.
    if (!state.hasDrawnOnce) {
      message.textContent = 'Nothing to Stand on.';
      haul.lost = true;
      showResultPopup(haul, 'Nothing to Stand on', 'You left without hitting, so nothing was banked.');
      return;
    }

    // Reveal the dealer's hidden card, then play a standard hit-to-17 dealer hand - but only if
    // at least one player hand is still alive to beat it (no point risking a dealer bust reveal
    // when every hand already busted itself out).
    state.dealer.revealed = true;
    if (anyStillStanding()) {
      let dv = blackjackHandValue(state.dealer.cards);
      while (dv.total < 17) { state.dealer.cards.push(drawCard()); dv = blackjackHandValue(state.dealer.cards); }
    }
    renderDealer();
    const dealerFinal = blackjackHandValue(state.dealer.cards);

    for (const hand of state.hands) {
      const st = handStatus(hand);
      if (st.busted || !hand.cards.length) { hand.outcome = 'lose'; continue; }
      if (dealerFinal.busted || st.total > dealerFinal.total) hand.outcome = 'win';
      else if (st.total < dealerFinal.total) hand.outcome = 'lose';
      else hand.outcome = 'push';
      if (hand.outcome === 'win') {
        if (hand.reward.type === 'coins') haul.coins += hand.reward.amount;
        else if (hand.reward.type === 'gems') haul.gems += hand.reward.amount;
        else if (hand.reward.type === 'fuel') haul.fuel += hand.reward.amount;
      }
    }
    renderHands();
    haul.lost = haul.coins === 0 && haul.gems === 0 && haul.fuel === 0;
    const dealerLabel = dealerFinal.busted ? 'Dealer busts!' : `Dealer stands on ${dealerFinal.total}.`;
    message.textContent = `${dealerLabel} ${haul.lost ? 'Nothing banked.' : `Banked: ${formatBjHaul(haul)}`}`;
    playSfx(haul.lost ? 'lose' : 'open');
    showResultPopup(haul, dealerLabel, haul.lost ? 'No hand beat the dealer. Nothing banked.' : `You won ${formatBjHaul(haul)}.`);
  }
  // Final hands stay on screen. The popup sits at the bottom so the hands and dealer stay visible, and
  // the round only closes when the player clicks Collect.
  function showResultPopup(haul, headline, detail) {
    if (document.getElementById('fleetBjResultPop')) return;
    const pop = document.createElement('div');
    pop.id = 'fleetBjResultPop';
    pop.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10001;width:min(440px,92vw);background:var(--panel,#10202a);border:2px solid ' + (haul.lost ? 'var(--red,#e0524d)' : 'var(--green,#2fd18b)') + ';border-radius:12px;padding:14px 16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.55)';
    pop.innerHTML = `
      <div style="font-size:13px;color:var(--dim)">${headline}</div>
      <div style="font-size:20px;font-weight:700;margin:4px 0 10px">${haul.lost ? 'Better luck next hand' : 'You won!'}</div>
      <div style="font-size:15px;margin-bottom:12px">${detail}</div>
      <button class="wo-btn ${haul.lost ? 'gray' : 'green'}" id="fleetBjCollectBtn">${haul.lost ? 'Close' : 'Collect'}</button>`;
    overlay.appendChild(pop);
    document.getElementById('fleetBjCollectBtn').onclick = () => { pop.remove(); overlay.remove(); onComplete(haul); };
  }

  drawBtn.onclick = startDraw;
  bankBtn.onclick = finishRound;
  exitBtn.onclick = finishRound;

  renderHands(); renderPool(); renderDealer(); updateControls();
}

/* ============================================================
   FLEET POKER - Fleet Compound bonus minigame.
   Texas Hold'em, but you get 3 hole cards instead of 2. Build three 3-hole-card hands from
   nine dealt cards (3 cards x 3 deals), assigning each card to one of your three hands as
   it's dealt - once placed, a card can never be moved. Three hidden computer hands (3 hole
   cards each) are generated up front; each of your hands has its own visible reward, revealed
   before a single card is dealt. Once all nine of your cards are placed, a single shared
   community board deals out - flop, then turn, then river - right on this same screen. Once
   the river lands, all three computer hands and all three outcomes (best 5-of-8 using the
   game's existing evaluateHand tiers via bestHandFromPool) reveal together, not one at a time.
   Opened with openFleetPoker({ onComplete(haul) }).
   ============================================================ */
const FLEET_POKER_CONFIG = { handCount: 3, cardsPerHand: 3, deals: 3, cardsPerDeal: 3, communityCount: 5 };
function pokerHandRewards() {
  const ownedIds = new Set(RUN.hero?.items || []);
  const itemPool = Object.values(ITEMS).filter(it => it.cost > 0 && !ownedIds.has(it.id));
  const itemId = itemPool.length ? shuffle([...itemPool])[0].id : 'supply_bag';
  const item = ITEMS[itemId] || ITEMS['supply_bag'];
  const currencyOptions = shuffle([
    { type: 'coins', amount: 25, label: '+25 Coins' },
    { type: 'coins', amount: 45, label: '+45 Coins' },
    { type: 'gems', amount: 1, label: '+1 Gem' },
    { type: 'gems', amount: 2, label: '+2 Gems' },
    { type: 'fuel', amount: 2, label: '+2 Fuel' },
    { type: 'fuel', amount: 3, label: '+3 Fuel' },
  ]);
  return shuffle([{ type: 'item', itemId: item.id, label: item.name }, currencyOptions[0], currencyOptions[1]]);
}
function applyPokerHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.pokerPlayed = true;
  const parts = [];
  if (haul.coins) { RUN.chips += haul.coins; parts.push(`${haul.coins} coins`); }
  if (haul.gems) { RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems); parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`); }
  if (haul.fuel) { RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel); parts.push(`${haul.fuel} fuel`); }
  if (haul.itemIds && haul.itemIds.length) {
    for (const id of haul.itemIds) { if (ITEMS[id]) { RUN.hero.items.push(id); parts.push(`${ITEMS[id].name} added to your Fleet`); } }
  }
  RUN.lastNotice = parts.length ? `Poker haul banked: ${parts.join(', ')}.` : 'Poker: no matches won this round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetPoker(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetPokerOverlay');
  if (old) old.remove();

  // See openFleetBlackjack's note - locked the moment it opens so the visible computer-hand
  // rewards can't be scummed by backing out and reopening for a better set.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.pokerPlayed = true;
  saveRun();

  let deck = shuffle(freshDeck());
  function drawCard() { if (!deck.length) deck = shuffle(freshDeck()); return deck.pop(); }

  const rewards = pokerHandRewards();
  const state = {
    playerHands: Array.from({ length: FLEET_POKER_CONFIG.handCount }, (_, i) => ({ cards: [], reward: rewards[i], outcome: null })),
    computerHands: Array.from({ length: FLEET_POKER_CONFIG.handCount }, () => ({ cards: Array.from({ length: FLEET_POKER_CONFIG.cardsPerHand }, () => drawCard()) })),
    community: [],
    pool: [],
    dealsUsed: 0,
    finished: false,
  };
  const haul = { coins: 0, gems: 0, fuel: 0, itemIds: [] };

  const overlay = document.createElement('div');
  overlay.id = 'fleetPokerOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML = `
    <div class="wo wide" style="max-width:900px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Poker</em></h1>
        <div class="note" style="margin-top:2px;text-align:center">Hold'em, with 3 hole cards instead of 2. Build three hands from nine cards - once a card is placed, it's locked in for good.</div>
        <div id="fleetPokerMessage" style="min-height:22px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetPokerCommunity" style="display:none"></div>
        <div id="fleetPokerHands" class="fleetPokerHands"></div>
        <div id="fleetPokerPoolWrap" class="fleetMiniPoolWrap" style="display:none">
          <div class="note" style="text-align:center;margin:8px 0 4px">Click a card, then click a hand to place it.</div>
          <div id="fleetPokerPool" style="display:flex;justify-content:center;gap:8px"></div>
        </div>
        <div id="fleetPokerControls" style="display:flex;justify-content:center;gap:10px;padding-top:14px;flex-wrap:wrap">
          <button class="wo-btn green" id="fleetPokerDealBtn">Deal 3</button>
          <button class="wo-btn amber" id="fleetPokerRevealBtn" style="display:none">Reveal the Flop</button>
          <button class="wo-btn gray" id="fleetPokerExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const handsWrap = document.getElementById('fleetPokerHands');
  const poolWrap = document.getElementById('fleetPokerPoolWrap');
  const poolEl = document.getElementById('fleetPokerPool');
  const communityWrap = document.getElementById('fleetPokerCommunity');
  const message = document.getElementById('fleetPokerMessage');
  const controlsWrap = document.getElementById('fleetPokerControls');
  const dealBtn = document.getElementById('fleetPokerDealBtn');
  const revealBtn = document.getElementById('fleetPokerRevealBtn');
  const exitBtn = document.getElementById('fleetPokerExitBtn');

  let selectedPoolIdx = null;
  function cardHTML(c) { return `<div class="card big xl ${suitColorClass(c.color, c.suit)}"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`; }
  function cardBackHTML() { return `<div class="card back big xl"></div>`; }
  function rewardLabelFor(reward) { return reward.type === 'item' ? `🚚 ${reward.label}` : reward.label; }

  // The computer's hole cards are face-up for the whole build phase (dealing, flop, turn) so the player
  // knows what they're up against, then flip face-down once the river is out (all five community cards
  // showing) and stay hidden until the final showdown reveals them.
  function computerRowHTML(i) {
    if (!state.allPlaced) return '';
    const hide = state.community.length >= FLEET_POKER_CONFIG.communityCount;
    const cards = state.computerHands[i].cards;
    return `<div class="fleetPokerCompRow"><div class="note" style="margin:6px 0 2px">Computer${hide ? '' : ' (face up until the river)'}</div>
      <div class="fleetPokerHandCards" style="justify-content:center">${cards.map(c => hide ? '<div class="card back mini"></div>' : `<div class="card mini ${suitColorClass(c.color, c.suit)}"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`).join('')}</div></div>`;
  }
  function renderHands() {
    handsWrap.innerHTML = state.playerHands.map((hand, i) => {
      const full = hand.cards.length >= FLEET_POKER_CONFIG.cardsPerHand;
      const canTarget = state.pool.length > 0 && selectedPoolIdx != null && !full;
      const placeholders = Array.from({ length: FLEET_POKER_CONFIG.cardsPerHand - hand.cards.length }).map(() => '<div class="card back big xl"></div>').join('');
      return `<div class="fleetPokerHand ${full ? 'full' : ''} ${canTarget ? 'targetable' : ''}" data-pkhand="${i}">
        <div class="fleetPokerHandReward">${rewardLabelFor(hand.reward)}</div>
        <div class="fleetPokerHandCards">${hand.cards.map(cardHTML).join('')}${placeholders}</div>
        ${computerRowHTML(i)}
      </div>`;
    }).join('');
    handsWrap.querySelectorAll('[data-pkhand]').forEach(el => {
      el.onclick = () => { if (selectedPoolIdx == null) return; placeCard(+el.dataset.pkhand); };
    });
  }
  function renderPool() {
    if (!state.pool.length) { poolWrap.style.display = 'none'; poolEl.innerHTML = ''; return; }
    poolWrap.style.display = '';
    poolEl.innerHTML = state.pool.map((c, i) => `<div class="card big xl ${suitColorClass(c.color, c.suit)} ${selectedPoolIdx === i ? 'selected' : ''}" data-poolcard="${i}" style="cursor:pointer"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`).join('');
    poolEl.querySelectorAll('[data-poolcard]').forEach(el => { el.onclick = () => { selectedPoolIdx = +el.dataset.poolcard; renderPool(); renderHands(); }; });
  }
  function updateControls() {
    const dealing = state.pool.length > 0;
    dealBtn.style.display = (dealing || state.dealsUsed >= FLEET_POKER_CONFIG.deals) ? 'none' : '';
    exitBtn.style.display = dealing ? 'none' : '';
  }

  function placeCard(handIdx) {
    const hand = state.playerHands[handIdx];
    if (hand.cards.length >= FLEET_POKER_CONFIG.cardsPerHand) return;
    const card = state.pool.splice(selectedPoolIdx, 1)[0];
    hand.cards.push(card);
    selectedPoolIdx = null;
    renderPool(); renderHands(); updateControls();
    if (!state.pool.length) {
      if (state.dealsUsed >= FLEET_POKER_CONFIG.deals) startReveal();
      else message.textContent = 'Deal the next 3 cards when ready.';
    }
  }
  function startDeal() {
    if (state.pool.length || state.dealsUsed >= FLEET_POKER_CONFIG.deals) return;
    for (let i = 0; i < FLEET_POKER_CONFIG.cardsPerDeal; i++) state.pool.push(drawCard());
    state.dealsUsed++;
    selectedPoolIdx = null;
    message.textContent = `Round ${state.dealsUsed} of ${FLEET_POKER_CONFIG.deals} - place all 3 cards.`;
    renderPool(); renderHands(); updateControls();
  }

  // Community board reveals in stages (flop, turn, river) right on this same screen, then every
  // hand's outcome shows at once - no clicking through matches one at a time.
  function communityCardsHTML() {
    const slots = [];
    for (let i = 0; i < FLEET_POKER_CONFIG.communityCount; i++) slots.push(state.community[i] ? cardHTML(state.community[i]) : cardBackHTML());
    return slots.join('');
  }
  function renderCommunityStrip(label) {
    communityWrap.style.display = '';
    communityWrap.innerHTML = `
      <div class="note" style="text-align:center;margin:6px 0 4px">${label}</div>
      <div class="fleetPokerHandCards" style="justify-content:center">${communityCardsHTML()}</div>
    `;
  }
  // Community board reveal is now player-paced: the deal/placement controls hide once all hole
  // cards are placed, and a single "Reveal" button steps through flop -> turn -> river -> showdown.
  // No player action is possible while waiting (there's nothing left to place), but pacing it out
  // one click at a time gives them a beat to read the board and think about what they need before
  // the next card lands, instead of everything flashing up at once.
  let revealStage = 0;
  function startReveal() {
    poolWrap.style.display = 'none';
    dealBtn.style.display = 'none';
    exitBtn.style.display = 'none';
    revealStage = 0;
    state.allPlaced = true;
    renderHands();
    renderCommunityStrip('Hole cards locked in.');
    message.textContent = 'Ready when you are.';
    revealBtn.textContent = 'Reveal the Flop';
    revealBtn.style.display = '';
    revealBtn.disabled = false;
  }
  function revealNextStage() {
    revealBtn.disabled = true;
    if (revealStage === 0) {
      state.community.push(drawCard(), drawCard(), drawCard());
      renderCommunityStrip('Flop'); renderHands(); playSfx('open');
      message.textContent = 'The flop is down.';
      revealStage = 1; revealBtn.textContent = 'Reveal the Turn'; revealBtn.disabled = false;
    } else if (revealStage === 1) {
      state.community.push(drawCard());
      renderCommunityStrip('Turn'); renderHands(); playSfx('open');
      message.textContent = 'The turn is down.';
      revealStage = 2; revealBtn.textContent = 'Reveal the River'; revealBtn.disabled = false;
    } else if (revealStage === 2) {
      state.community.push(drawCard());
      renderCommunityStrip('River'); renderHands(); playSfx('open');
      message.textContent = 'The river is down.';
      revealStage = 3; revealBtn.textContent = 'Show Hands';
      revealBtn.disabled = false;
    } else {
      revealBtn.style.display = 'none';
      resolveShowdown();
    }
  }
  revealBtn.onclick = revealNextStage;
  function resolveShowdown() {
    state.playerHands.forEach((hand, i) => {
      const cHand = state.computerHands[i];
      const pBest = bestHandFromPool([...hand.cards, ...state.community], 5);
      const cBest = bestHandFromPool([...cHand.cards, ...state.community], 5);
      const pSum = pBest.cards.reduce((a, c) => a + c.rank, 0);
      const cSum = cBest.cards.reduce((a, c) => a + c.rank, 0);
      let outcome;
      if (pBest.tier > cBest.tier) outcome = 'win';
      else if (pBest.tier < cBest.tier) outcome = 'lose';
      else if (pSum > cSum) outcome = 'win';
      else if (pSum < cSum) outcome = 'lose';
      else outcome = 'push';
      hand.outcome = outcome; hand.pBest = pBest; hand.cBest = cBest;
      if (outcome === 'win') {
        if (hand.reward.type === 'item') haul.itemIds.push(hand.reward.itemId);
        else if (hand.reward.type === 'coins') haul.coins += hand.reward.amount;
        else if (hand.reward.type === 'gems') haul.gems += hand.reward.amount;
        else if (hand.reward.type === 'fuel') haul.fuel += hand.reward.amount;
      }
    });
    message.textContent = '';
    renderCommunityStrip('Community Cards');
    handsWrap.innerHTML = state.playerHands.map((hand, i) => {
      const cHand = state.computerHands[i];
      return `<div class="fleetPokerShowdownRow">
        <div class="wo-eyebrow" style="text-align:center">Hand ${i + 1} - ${rewardLabelFor(hand.reward)}</div>
        <div class="fleetPokerMatchup">
          <div class="fleetPokerMatchSide">
            <div class="note">Your Hole Cards</div>
            <div class="fleetPokerHandCards">${hand.cards.map(cardHTML).join('')}</div>
            <div class="fleetPokerTierLabel">${hand.pBest.label}</div>
          </div>
          <div class="fleetPokerVs">vs</div>
          <div class="fleetPokerMatchSide">
            <div class="note">Computer</div>
            <div class="fleetPokerHandCards">${cHand.cards.map(cardHTML).join('')}</div>
            <div class="fleetPokerTierLabel">${hand.cBest.label}</div>
          </div>
        </div>
        <div class="fleetPokerOutcome ${hand.outcome}">${hand.outcome === 'win' ? `You win - ${rewardLabelFor(hand.reward)}` : hand.outcome === 'lose' ? 'You lose' : 'Push'}</div>
      </div>`;
    }).join('');
    playSfx(state.playerHands.some(h => h.outcome === 'win') ? 'open' : 'lose');
    controlsWrap.style.display = '';
    controlsWrap.innerHTML = `<button class="wo-btn amber" id="fleetPokerFinishBtn" style="width:100%">Collect Winnings</button>`;
    document.getElementById('fleetPokerFinishBtn').onclick = finishPoker;
  }
  function finishPoker() {
    if (state.finished) return;
    state.finished = true;
    overlay.remove();
    onComplete(haul);
  }

  dealBtn.onclick = startDeal;
  exitBtn.onclick = () => { overlay.remove(); onComplete({ coins: 0, gems: 0, fuel: 0, itemIds: [] }); };

  renderHands(); renderPool(); updateControls();
}

/* ============================================================
   FLEET AUCTION - Fleet Compound bonus minigame.
   Three mystery lots, bid on one at a time against two computer bidders with different
   behavior. Pay a flat coin fee to inspect a lot before bidding on it, or bid blind. Passing
   walks away from that lot for free at any point. A lot resolves the moment no bidder wants to
   raise further - if that's you, it's yours for the current bid; if it's a computer, it's gone.
   Opened with openFleetAuction({ onComplete(haul) }).
   ============================================================ */
const FLEET_AUCTION_CONFIG = {
  inspectCost: 5,
  bidIncrement: 5,
  // Computer bidders never bid past a lot's real value (blind ranges sit well under it, revealed
  // ranges top out at exactly its value), so a lot can never cost the player more than it is
  // worth from the bots' pushing alone. Each bot also skips a random share of lots outright and has a
  // small coin pool, which is what leaves real deals on the table. blindRange / revealedRange are
  // fractions of the lot's value, rolled fresh per lot; skipChance is the odds the bot ignores a lot.
  bidders: [
    { id: 'steady', name: 'Steady Eddie', blindRange: [0.35, 0.6], revealedRange: [0.5, 0.75], skipChance: 0.3, chipsRange: [40, 70],
      style: "Bids cautiously - never pays more than the lot is worth, and sits out some lots entirely." },
    { id: 'bigspender', name: 'Big Spender', blindRange: [0.3, 0.5], revealedRange: [0.7, 1.0], skipChance: 0.2, chipsRange: [60, 95],
      style: "Lowballs a mystery lot, but will pay up to a revealed lot's full value - never more." },
  ],
};
function auctionLotPool() {
  const ownedIds = new Set(RUN.hero?.items || []);
  const allItems = Object.values(ITEMS).filter(it => it.cost > 0 && !ownedIds.has(it.id));
  // One lot is always a real Item, and it leans toward the better ones (60+ coin value) when any are left.
  const goodItems = allItems.filter(it => it.cost >= 60);
  const itemPool = goodItems.length ? goodItems : allItems;
  const itemId = itemPool.length ? shuffle([...itemPool])[0].id : 'supply_bag';
  const item = ITEMS[itemId] || ITEMS['supply_bag'];
  const currencyOptions = shuffle([
    { type: 'coins', amount: 60, label: '+60 Coins', value: 60 },
    { type: 'coins', amount: 90, label: '+90 Coins', value: 90 },
    { type: 'gems', amount: 3, label: '+3 Gems', value: 75 },
    { type: 'fuel', amount: 5, label: '+5 Fuel', value: 40 },
  ]);
  const itemLot = { type: 'item', itemId: item.id, label: item.name, value: item.cost || 50 };
  return shuffle([itemLot, currencyOptions[0], currencyOptions[1]]);
}
// Opening bids start low (about a fifth of the lot's value) so there is room to actually win a deal.
function startingBidFor(lot) { return Math.max(5, Math.round((lot.value * 0.2 + Math.random() * 8) / 5) * 5); }
function applyAuctionHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.auctionPlayed = true;
  const parts = [];
  if (haul.coins) { RUN.chips += haul.coins; parts.push(`${haul.coins} coins`); }
  if (haul.gems) { RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems); parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`); }
  if (haul.fuel) { RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel); parts.push(`${haul.fuel} fuel`); }
  if (haul.itemIds && haul.itemIds.length) {
    for (const id of haul.itemIds) { if (ITEMS[id]) { RUN.hero.items.push(id); parts.push(`${ITEMS[id].name} added to your Fleet`); } }
  }
  // The Fleet Auction now shows its own full results screen (contents/outcome per lot, coins spent
  // vs. coins won) before returning here, so this top-bar notice only needs to be a short recap -
  // it no longer has to carry the whole explanation on its own the way it used to.
  RUN.lastNotice = parts.length ? `Auction lots won: ${parts.join(', ')}.` : 'Auction: no lots won this round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetAuction(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetAuctionOverlay');
  if (old) old.remove();

  // See openFleetBlackjack's note - locked the moment it opens for the same scumming reason.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.auctionPlayed = true;
  saveRun();

  // Each computer bidder gets its own real coin pool for this auction (randomized within its
  // configured range) that actually depletes when it wins a lot - previously "how much can the
  // computer afford" was an invisible multiplier with no pool behind it at all, which is why there
  // was no way to know what you were bidding against.
  const bidderChips = {};
  for (const b of FLEET_AUCTION_CONFIG.bidders) bidderChips[b.id] = Math.round(b.chipsRange[0] + Math.random() * (b.chipsRange[1] - b.chipsRange[0]));

  const state = {
    lots: auctionLotPool().map(reward => {
      const startBid = startingBidFor(reward);
      // Each bot's hidden willingness to pay for this specific lot, rolled once: blind, revealed, and
      // whether it is interested at all. Always at or under the lot's value.
      const caps = {};
      for (const b of FLEET_AUCTION_CONFIG.bidders) {
        const roll = r => Math.min(reward.value, Math.round(reward.value * (r[0] + Math.random() * (r[1] - r[0]))));
        caps[b.id] = { blind: roll(b.blindRange), revealed: roll(b.revealedRange), interested: Math.random() >= b.skipChance };
      }
      return { reward, startBid, currentBid: startBid, highBidder: null, revealed: false, resolved: false, won: false, caps };
    }),
    lotIndex: 0,
    haul: { coins: 0, gems: 0, fuel: 0, itemIds: [] },
    bidderChips,
    totalSpent: 0,
    finished: false,
  };

  const overlay = document.createElement('div');
  overlay.id = 'fleetAuctionOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML = `
    <div class="wo wide" style="max-width:820px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Auction</em></h1>
        <div class="note" style="margin-top:2px;text-align:center">Three mystery lots, and one is always an Item. Inspect before you bid, or take the gamble blind.</div>
        <div id="fleetAuctionBidders" class="fleetAuctionBidders"></div>
        <div id="fleetAuctionLots" class="fleetAuctionLots"></div>
        <div id="fleetAuctionMessage" style="min-height:22px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetAuctionControls" style="display:flex;justify-content:center;gap:10px;padding-top:10px;flex-wrap:wrap"></div>
        <div style="display:flex;justify-content:center;padding-top:10px">
          <button class="wo-btn gray" id="fleetAuctionExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const lotsWrap = document.getElementById('fleetAuctionLots');
  const biddersWrap = document.getElementById('fleetAuctionBidders');
  const message = document.getElementById('fleetAuctionMessage');
  const controls = document.getElementById('fleetAuctionControls');
  const exitBtn = document.getElementById('fleetAuctionExitBtn');

  function bidderDef(id) { return FLEET_AUCTION_CONFIG.bidders.find(x => x.id === id); }
  function bidderName(id) { const b = bidderDef(id); return b ? b.name : id; }
  function rewardLabelFor(reward) { return reward.type === 'item' ? `🚚 ${reward.label}` : reward.label; }
  function currentLot() { return state.lots[state.lotIndex]; }

  // Shows each computer bidder's name, live remaining coin pool, and a one-line description of
  // how it decides whether to raise - so it's clear who you're bidding against and why, instead
  // of an invisible cap with no explanation.
  function renderBidders() {
    const youBox = `
      <div class="fleetAuctionBidder fleetAuctionYou">
        <div class="fleetAuctionBidderName">You</div>
        <div class="fleetAuctionBidderChips" style="color:var(--amber);font-weight:800">${ICON.coin} ${RUN.chips} coins</div>
      </div>`;
    biddersWrap.innerHTML = youBox + FLEET_AUCTION_CONFIG.bidders.map(b => `
      <div class="fleetAuctionBidder hoverTip" data-title="${b.style}">
        <div class="fleetAuctionBidderName">${b.name}</div>
        <div class="fleetAuctionBidderChips">${ICON.coin} ${state.bidderChips[b.id]} coins left</div>
      </div>`).join('');
  }

  function renderLots() {
    lotsWrap.innerHTML = state.lots.map((lot, i) => {
      const isActive = i === state.lotIndex && !lot.resolved;
      // A lot's contents now show once it's resolved even if it was never inspected - passing on
      // a lot or losing it to a computer bidder used to leave it a permanent "???", so there was
      // no way to ever learn what you walked away from or lost out on.
      const contents = (lot.revealed || lot.resolved) ? rewardLabelFor(lot.reward) : '???';
      const status = lot.resolved
        ? (lot.won ? `Won for ${lot.currentBid} coins!` : (lot.highBidder ? `Went to ${bidderName(lot.highBidder)} for ${lot.currentBid} coins` : 'Passed'))
        : (lot.highBidder ? `High bid: ${lot.currentBid} (${lot.highBidder === 'player' ? 'You' : bidderName(lot.highBidder)})` : `Starting bid: ${lot.startBid}`);
      return `<div class="fleetAuctionLot ${isActive ? 'active' : ''} ${lot.resolved ? 'resolved' : ''}">
        <div class="fleetAuctionLotTitle">Lot ${i + 1}</div>
        <div class="fleetAuctionLotContents">${contents}</div>
        <div class="fleetAuctionLotStatus">${status}</div>
      </div>`;
    }).join('');
    renderBidders();
  }
  function renderControls() {
    const lot = currentLot();
    if (!lot || lot.resolved) { controls.innerHTML = ''; return; }
    const canInspect = !lot.revealed && RUN.chips >= FLEET_AUCTION_CONFIG.inspectCost;
    const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
    const canBid = RUN.chips >= nextBid;
    controls.innerHTML = `
      <button class="wo-btn teal" id="fleetAuctionInspectBtn" ${lot.revealed || !canInspect ? 'disabled' : ''}>${lot.revealed ? 'Inspected' : `Inspect (${FLEET_AUCTION_CONFIG.inspectCost} coins)`}</button>
      <button class="wo-btn green" id="fleetAuctionBidBtn" ${!canBid ? 'disabled' : ''}>Bid ${nextBid} Coins</button>
      <button class="wo-btn gray" id="fleetAuctionPassBtn">Pass</button>
    `;
    const inspectBtn = document.getElementById('fleetAuctionInspectBtn'); if (inspectBtn) inspectBtn.onclick = doInspect;
    document.getElementById('fleetAuctionBidBtn').onclick = doBid;
    document.getElementById('fleetAuctionPassBtn').onclick = doPass;
  }

  function doInspect() {
    const lot = currentLot();
    if (!lot || lot.revealed || RUN.chips < FLEET_AUCTION_CONFIG.inspectCost) return;
    RUN.chips -= FLEET_AUCTION_CONFIG.inspectCost;
    lot.revealed = true;
    playSfx('buy');
    message.textContent = `Lot ${state.lotIndex + 1} revealed: ${rewardLabelFor(lot.reward)}.`;
    saveRun();
    renderLots(); renderControls();
  }
  function computerRespond(lot) {
    let best = null;
    for (const bidder of FLEET_AUCTION_CONFIG.bidders) {
      if (lot.highBidder === bidder.id) continue;
      if (!lot.caps[bidder.id].interested) continue;
      const cap = lot.revealed ? lot.caps[bidder.id].revealed : lot.caps[bidder.id].blind;
      const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
      // A bidder now also needs the coins in its own remaining pool to raise, not just to stay
      // under its willingness-to-pay cap - previously the cap was the only limit, so a bidder
      // could in theory keep outbidding forever with no real budget behind it.
      if (nextBid <= cap && nextBid <= state.bidderChips[bidder.id]) { if (!best || nextBid > best.nextBid) best = { bidder, nextBid }; }
    }
    if (best) { lot.currentBid = best.nextBid; lot.highBidder = best.bidder.id; return best.bidder; }
    return null;
  }
  function doBid() {
    const lot = currentLot();
    if (!lot) return;
    const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
    if (RUN.chips < nextBid) return;
    lot.currentBid = nextBid;
    lot.highBidder = 'player';
    playSfx('buy');
    const counter = computerRespond(lot);
    if (counter) { message.textContent = `${counter.name} counters at ${lot.currentBid} coins.`; renderLots(); renderControls(); }
    else { message.textContent = `No other bidders. Lot ${state.lotIndex + 1} is yours for ${lot.currentBid} coins!`; winLot(lot); }
  }
  function doPass() {
    const lot = currentLot();
    if (!lot) return;
    lot.resolved = true; lot.won = false; lot.revealed = true;
    if (lot.highBidder) {
      // The winning bidder actually pays for the lot out of its own pool now, so its remaining
      // coins shown for the rest of the auction reflect what it really has left to spend.
      state.bidderChips[lot.highBidder] = Math.max(0, state.bidderChips[lot.highBidder] - lot.currentBid);
      message.textContent = `Lot ${state.lotIndex + 1} went to ${bidderName(lot.highBidder)} for ${lot.currentBid} coins - it was ${rewardLabelFor(lot.reward)}.`;
    } else {
      message.textContent = `Lot ${state.lotIndex + 1} passed - it was ${rewardLabelFor(lot.reward)}.`;
    }
    playSfx('lose');
    renderLots();
    setTimeout(advanceLot, 900);
  }
  function winLot(lot) {
    RUN.chips -= lot.currentBid;
    state.totalSpent += lot.currentBid;
    lot.resolved = true; lot.won = true; lot.revealed = true;
    if (lot.reward.type === 'item') state.haul.itemIds.push(lot.reward.itemId);
    else if (lot.reward.type === 'coins') state.haul.coins += lot.reward.amount;
    else if (lot.reward.type === 'gems') state.haul.gems += lot.reward.amount;
    else if (lot.reward.type === 'fuel') state.haul.fuel += lot.reward.amount;
    saveRun();
    renderLots();
    setTimeout(advanceLot, 900);
  }
  function advanceLot() {
    state.lotIndex++;
    if (state.lotIndex >= state.lots.length) { finishAuction(); return; }
    message.textContent = '';
    renderLots(); renderControls();
  }
  // Auction Results screen - Drew's report: he won a bidding war (paying 43 coins total) but the
  // only feedback was a passing top-bar notice reading "Auction lots won: 30 coins," which read
  // as if he'd made money when he'd actually netted a 13-coin loss on that lot, and the auction
  // never showed what he'd actually paid or what any of the 3 lots even were. This screen replaces
  // the old instant-close-and-return-to-Compound behavior with a real summary: every lot's
  // contents and outcome, what was actually paid, and a coins-in/coins-out breakdown so the math
  // is never a mystery again.
  function finishAuction() {
    if (state.finished) return;
    state.finished = true;
    controls.innerHTML = '';
    message.textContent = '';
    const rows = state.lots.map((lot, i) => {
      const contents = rewardLabelFor(lot.reward);
      let outcome;
      if (lot.won) outcome = `<span style="color:var(--green)">Won for ${lot.currentBid} coins</span>`;
      else if (lot.highBidder) outcome = `<span style="color:var(--dim)">Went to ${bidderName(lot.highBidder)} for ${lot.currentBid} coins</span>`;
      else outcome = `<span style="color:var(--dim)">Passed</span>`;
      return `<div class="fleetAuctionResultRow"><span>Lot ${i + 1}: ${contents}</span>${outcome}</div>`;
    }).join('');
    const coinsGained = state.haul.coins || 0;
    const netCoins = coinsGained - state.totalSpent;
    const otherWins = [];
    if (state.haul.gems) otherWins.push(`${state.haul.gems} Gem${state.haul.gems > 1 ? 's' : ''}`);
    if (state.haul.fuel) otherWins.push(`${state.haul.fuel} Fuel`);
    if (state.haul.itemIds.length) otherWins.push(...state.haul.itemIds.map(id => ITEMS[id] ? ITEMS[id].name : id));
    lotsWrap.innerHTML = '';
    biddersWrap.innerHTML = '';
    message.innerHTML = `
      <div style="text-align:left;max-width:420px;margin:0 auto">
        ${rows}
        <div class="fleetAuctionResultTotals">
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Coins spent bidding</span><span>${state.totalSpent}</span></div>
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Coins won from lots</span><span>${coinsGained}</span></div>
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Net coins</span><span style="color:${netCoins >= 0 ? 'var(--green)' : 'var(--red)'}">${netCoins >= 0 ? '+' : ''}${netCoins}</span></div>
          ${otherWins.length ? `<div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Also won</span><span>${otherWins.join(', ')}</span></div>` : ''}
        </div>
      </div>`;
    controls.innerHTML = `<button class="wo-btn amber" id="fleetAuctionResultsDoneBtn" style="width:100%;max-width:420px">Back to Compound</button>`;
    document.getElementById('fleetAuctionResultsDoneBtn').onclick = () => { overlay.remove(); onComplete(state.haul); };
    exitBtn.style.display = 'none';
  }

  exitBtn.onclick = () => {
    const lot = currentLot();
    if (lot && !lot.resolved) { lot.resolved = true; lot.won = false; lot.revealed = true; }
    finishAuction();
  };

  renderLots(); renderControls();
}

function castleMatchScreen() {
  const st = getMatchState();
  if (JOKER_GLITCH_POPUP) {
    return `<div class="map-popup-overlay"><div class="wo" style="max-width:440px;border-color:#7a0000">
      <div class="wo-stripe" style="background:#7a0000"></div>
      <div class="wo-body" style="text-align:center;background:#1a0000;color:#ffbdbd;border-radius:0 0 8px 8px">
        <div class="wo-eyebrow" style="color:#ff5c5c">⚠️ Critical System Glitch Detected!</div>
        <div class="note" style="color:#ffbdbd;margin-top:8px">You flipped a Red Joker and a Black Joker together. The Carnival Board's data core scrambled and every card reset - any pairs you'd found are gone, but the board's ready for a fresh run at it.</div>
        <button class="wo-btn red" id="jokerGlitchReRouteBtn" style="width:100%;margin-top:14px">[ Re-Route Systems ]</button>
      </div>
    </div></div>`;
  }
  if (!st.matchCards) {
    const groups = ['♦', '♣', '♥', '♠', 'RJ', 'BJ'];
    st.matchCards = shuffle(
      groups.flatMap((g, gi) => Array.from({ length: 4 }, (_, k) => ({
        id: gi * 4 + k, group: g,
        color: (g === '♥' || g === '♦' || g === 'RJ') ? 'red' : 'blk',
        flipped: false, matched: false,
      })))
    );
    st.matchGuesses = 4;
    st.matchPick = [];
    const ownedIds = new Set(RUN.hero?.items || []);
    const jackpotPool = Object.values(ITEMS).filter(it => it.cost > 0 && !ownedIds.has(it.id));
    st.matchJackpotItemId = jackpotPool.length ? shuffle([...jackpotPool])[0].id : 'supply_bag';
  }
  // Joker tiles each render their own dedicated image (Hazards/joker-red.png, Hazards/joker-black.png)
  // with an onerror fallback to the 🃏 emoji, matching the art() pattern used for hero/opponent art.
  const groupSymbol = {
    '♦': '♦', '♣': '♣', '♥': '♥', '♠': '♠',
    // Bumped from 38px to 68px (was smaller than a plain suit symbol's 46px font, so the "special"
