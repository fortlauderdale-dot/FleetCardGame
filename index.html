// ██  Tuning Garage, Treasure And Run End                                           ██
// ██  Card boosts, supply caches, ending a run and forfeiting.                      ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████

let BLACKSMITH_OPTIONS = null;
let GARAGE_SELECTED_ITEM = null;
let BLACKSMITH_VISIT = null;
const SCOPE_TUNE_COST = { card: 30, rank: 60, suit: 90 };
const SCOPE_TUNE_DAMAGE = { card: 10, rank: 5, suit: 3 };
const SCOPE_TUNE_MAX_STACKS = 3;
function tuneCost(bonus, isSecondary, scope) {
  return SCOPE_TUNE_COST[scope] || 30;
}
function pickBlacksmithOptions() {
  const su1 = SUITS[Math.floor(Math.random() * SUITS.length)];
  const r1 = 2 + Math.floor(Math.random() * 13);
  const r2 = 2 + Math.floor(Math.random() * 13);
  const su3 = SUITS[Math.floor(Math.random() * SUITS.length)];
  return [
    { scope: 'card', rank: r1, suit: su1.s, label: `${rankLabel(r1)}${su1.s}`, desc: `Just this one card.` },
    { scope: 'rank', rank: r2, label: `Every ${rankLabel(r2)}`, desc: `Any ${rankLabel(r2)} you draw, any suit.` },
    { scope: 'suit', suit: su3.s, label: `Every ${su3.s}`, desc: `Any card of that suit you draw.` },
  ].sort((a, b) => SCOPE_TUNE_COST[a.scope] - SCOPE_TUNE_COST[b.scope]);
}
function findBoost(opt) {
  return RUN.cardBoosts.find((b) => b.scope === opt.scope && b.rank === opt.rank && b.suit === opt.suit);
}
function boostCard(opt) {
  let b = findBoost(opt);
  if (!b) {
    b = { scope: opt.scope, rank: opt.rank, suit: opt.suit, bonus: 0, count: 0 };
    RUN.cardBoosts.push(b);
  }
  if ((b.count || 0) >= SCOPE_TUNE_MAX_STACKS) return;
  b.bonus += SCOPE_TUNE_DAMAGE[opt.scope] || 0;
  b.count = (b.count || 0) + 1;
  saveRun();
}
function rollTreasure(big = false) {
  const mult = big ? 2 : 1;
  const choices = [
    { kind: 'coins', label: 'Coins', amount: (20 + Math.floor(Math.random() * 31)) * mult, icon: ICON.coin },
    usesCoinTravel()
      ? { kind: 'coins', label: 'Travel Budget', amount: FUEL_COIN_VALUE * mult, icon: ICON.coin }
      : { kind: 'fuel', label: 'Fuel', amount: 1 * mult, icon: ICON.fuel },
    { kind: 'gems', label: 'Gems', amount: (1 + Math.floor(Math.random() * 2)) * mult, icon: ICON.gem },
    { kind: 'energy', label: 'Energy', amount: (5 + Math.floor(Math.random() * 6)) * mult, icon: ICON.energy },
    { kind: 'points', label: 'Career Points', amount: (6 + Math.floor(Math.random() * 10)) * mult, icon: ICON.star },
  ];
  const prize = choices[Math.floor(Math.random() * choices.length)];
  let actual = prize.amount;
  if (prize.kind === 'coins') {
    const before = RUN.chips;
    RUN.chips = Math.min(999, RUN.chips + prize.amount);
    actual = RUN.chips - before;
  }
  if (prize.kind === 'fuel') {
    const before = RUN.fuel;
    RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + prize.amount);
    actual = RUN.fuel - before;
  }
  if (prize.kind === 'gems') {
    const before = RUN.gems;
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + prize.amount);
    actual = RUN.gems - before;
  }
  if (prize.kind === 'energy') {
    const before = RUN.energy;
    RUN.energy = Math.min(RUN.maxEnergy, RUN.energy + prize.amount);
    actual = RUN.energy - before;
  }
  if (prize.kind === 'points') {
    earnPoints(prize.amount);
    RUN.careerPointsFromTreasure = (RUN.careerPointsFromTreasure || 0) + prize.amount;
  }
  saveRun();
  return { ...prize, amount: actual };
}
function endRun(won) {
  IN_BATTLE = false;
  clearBattleSave();
  playSfx(won ? 'win' : 'lose');
  const cleared = !!RUN.worldCleared;
  const bonus = worldCareerPoints(RUN.world, cleared);
  earnPoints(bonus);
  META.bestRun = Math.max(META.bestRun, RUN.path.length);
  META.highScore = Math.max(META.highScore, RUN.scoreThisRun);
  META.runsPlayed++;
  saveMeta();
  const bonusWorld = RUN.world;
  clearRunSave();
  render(runEndScreen(won, bonus, bonusWorld, cleared));
}
window.forfeitRun = function () {
  if (!confirm('Forfeit this run? This will count as a loss.')) return;
  IN_BATTLE = false;
  clearBattleSave();
  endRun(false);
};


// ████████████████████████████████████████████████████████████████████████████████████
// ██                                                                                ██
// ██  Battle Logic                                                                  ██
// ██  Starting a fight, drawing cards, curses, burns, freezes and targeting.        ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████

// World 1 is a soft-difficulty world: any non-castle fight there gets its HP capped and its curse items

        if (spec?.type === 'lifesteal') {
          const healAmt = Math.round(oppDmg * (spec.pct ?? 0.5));
          if (healAmt > 0) {
            BATTLE.opponent.hpNow = Math.min(BATTLE.opponent.hp, BATTLE.opponent.hpNow + healAmt);
            specialLog = ` It heals ${healAmt}.`;
          }
        } else if (spec?.type === 'redSteal') {
          const redCount = best.cards.filter((c) => c.color === 'red').length;
          if (redCount >= (spec.redThreshold ?? 3)) {
            const stealRes = takeFuel(spec.fuelSteal ?? 1);
            const fuelStolen = stealRes.took;
            drawOpponentPoolCards(spec.extraDraw ?? 1);
            specialLog = ` It steals ${fuelStolen} ${stealRes.unit} and draws an extra card!`;
          }
        }
        const dmgPhrase =
          armorBlocked > 0
            ? `${rawDmg} damage, but your armor ` +
              `absorbed ${armorBlocked}${oppDmg > 0 ? ` (${oppDmg} got through)` : ''}${
                BATTLE.playerArmor > 0
                  ? ` and you have ${BATTLE.playerArmor} armor ` + `remaining`
                  : ', and your armor is ' + 'gone'
              }`
            : `${oppDmg} damage`;
        let hexLog = '';
        if (hexStolenCards.length) {
          hexStolenCards.forEach((c) => {
            c.revealed = true;
          });
          BATTLE.hand.push(...hexStolenCards);
          resortHandAndRelink(RUN.handSortMode);
          const stolenText = hexStolenCards.map((c) => `${rankLabel(c.rank)}${c.suit}`).join(' ');
          hexLog = ` The hex trap kicks in - you pull the ${stolenText} straight into your hand.`;
        }
        battleLog(
          `${BATTLE.opponent.name} ` +
            `used ${item.name}${cond.label ? ` with ${cond.label}` : ''} (${usedText}) ` +
            `- ${diffPureDraw(item) ? 'no damage' : dmgPhrase}.${specialLog}${hexLog} Your health: ${RUN.health}/${RUN.maxHealth}.`
        );
        BATTLE.recentDiscard.push(...best.cards.filter((c) => !cardIncludes(hexStolenCards, c)));
        BATTLE.oppPool = BATTLE.oppPool.filter((c) => !cardIncludes(best.cards, c));
        diffOppItemDraw(item);
        if (burnBackfire > 0 && RUN.health > 0) {
          const before = BATTLE.opponent.hpNow;
          BATTLE.opponent.hpNow = Math.max(0, before - burnBackfire);
          if (burnBackfire === before && before > 0) BATTLE.exactKill = true;
          battleLog(
            `${BATTLE.opponent.name}'s ${item.name} was burning. They still attack, but ` +
              `the burn hits them for ${burnBackfire} damage.`
          );
          if (BATTLE.opponent.hpNow <= 0) {
            winBattle();
            return;
          }
        }
        if (RUN.health <= 0) break;
        continue;
      }
      const choices = BATTLE.opponent.attacks && BATTLE.opponent.attacks.length ? BATTLE.opponent.attacks : [{}];
      let pick = null;
      for (const a of choices) {
        const best = a.autoFire
          ? { cards: [], tier: 999, label: 'Auto', mult: 0 }
          : bestHandFromPool(BATTLE.oppPool, a.maxCards ?? maxCards);
        if (a.minTurn != null && BATTLE.turn < a.minTurn) continue;
        let viable;
        if (a.autoFire) viable = true;
        else if (a.discardHand) viable = best.cards.length > 0;
        else if (a.exactSuitCount)
          viable = BATTLE.oppPool.filter((c) => c.suit === a.exactSuitCount.suit).length === a.exactSuitCount.count;
        else viable = best.tier >= (a.minTier ?? BATTLE.opponent.minTier);
        if (viable && !opponentAttackIsValid(a, best, BATTLE.oppPool, a.maxCards ?? maxCards)) viable = false;
        if (viable) {
          pick = { a, best };
          break;
        }
      }
      if (!pick) break;
      const { a: attackDefPicked, best } = pick;
      attackDef = attackDefPicked;
      anyAttack = true;
      let oppDmg;
      if (attackDef.autoFire) {
        oppDmg = Math.round(attackDef.autoFire.damage);
      } else if (attackDef.discardHand) {
        oppDmg = 0;
      } else if (attackDef.exactSuitCount) {
        oppDmg = Math.round(attackDef.exactSuitCount.damage);
      } else {
        oppDmg = Math.round(damageFor(best.cards, best.mult));
      }
      const swingCap = diffSwingCap();
      oppDmg = Math.min(oppDmg, swingCap);
      oppDmg = applyDodgeIfActive(oppDmg);
      const rawDmg = oppDmg;
      let armorBlocked = 0;
      if (BATTLE.playerArmor > 0) {
        armorBlocked = Math.min(BATTLE.playerArmor, oppDmg);
        BATTLE.playerArmor -= armorBlocked;
        oppDmg -= armorBlocked;
      }
      RUN.health = Math.max(0, RUN.health - oppDmg);
      if (armorBlocked > 0) playSfx('shield');
      if (oppDmg > 0) {
        playSfx('hurt');
        flashScreen('hurt');
        BATTLE.lastHit = { amount: oppDmg, source: BATTLE.opponent.name };
        showDamagePopup(oppDmg, BATTLE.opponent.name);
      }
      const usedText = best.cards.map((c) => `${rankLabel(c.rank)}${c.suit}`).join(' ');
      let specialLog = resolveOpponentAttackEffect(attackDef, oppDmg);
      const spec = BATTLE.opponent.special;
      if (spec?.type === 'lifesteal') {
        const healAmt = Math.round(oppDmg * (spec.pct ?? 0.5));
        if (healAmt > 0) {
          BATTLE.opponent.hpNow = Math.min(BATTLE.opponent.hp, BATTLE.opponent.hpNow + healAmt);
          specialLog = ` It heals ${healAmt}.`;
        }
      } else if (spec?.type === 'redSteal') {
        const redCount = best.cards.filter((c) => c.color === 'red').length;
        if (redCount >= (spec.redThreshold ?? 3)) {
          const stealRes = takeFuel(spec.fuelSteal ?? 1);
          const fuelStolen = stealRes.took;
          drawOpponentPoolCards(spec.extraDraw ?? 1);
          specialLog = ` It steals ${fuelStolen} ${stealRes.unit} and draws an extra card!`;
        }
      }
      const dmgPhrase =
        armorBlocked > 0
          ? `${rawDmg} damage, but your armor ` +
            `absorbed ${armorBlocked}${oppDmg > 0 ? ` (${oppDmg} got through)` : ''}${
              BATTLE.playerArmor > 0
                ? ` and you have ${BATTLE.playerArmor} armor ` + `remaining`
                : ', and your armor is ' + 'gone'
            }`
          : `${oppDmg} damage`;
      battleLog(
        attackDef.autoFire
          ? `${BATTLE.opponent.name}'s ${attackDef.name || 'attack'} kicks in ` +
              `- ${dmgPhrase}.${specialLog} Your health: ${RUN.health}/${RUN.maxHealth}.`
          : `${BATTLE.opponent.name} used ${attackDef.name || best.label} with ${best.label} ` +
              `(${usedText}) - ${dmgPhrase}.${specialLog} Your health: ${RUN.health}/${RUN.maxHealth}.`
      );
      BATTLE.recentDiscard.push(...best.cards);
      BATTLE.oppPool = BATTLE.oppPool.filter((c) => !cardIncludes(best.cards, c));
      if (RUN.health <= 0) break;
    }
    if (!anyAttack) {
      battleLog(`${BATTLE.opponent.name} didn't have enough to attack this turn.`);

      const stillHidden = BATTLE.oppPool.filter((c) => !c.revealed);
      if (!(BATTLE.opponent.items || []).some((id) => ITEMS[id] && ITEMS[id].followUp))
        shuffle(stillHidden)
          .slice(0, 2)
          .forEach((c) => (c.revealed = true));
    } else opponentLandedHit = true;
    // Follow-up Items sit to the right of another Item and only work when that Item did not fire:
    // the opponent throws out its whole hand and draws that many cards plus a bonus next turn.
    (BATTLE.opponent.items || []).forEach((fid, fpos) => {
      const fu = ITEMS[fid];
      if (!fu || !fu.followUp || fpos < 1) return;
      const left = ITEMS[BATTLE.opponent.items[fpos - 1]];
      if (!left || oppItemUsesThisTurn[left.id]) return;
      const dumped = BATTLE.oppPool.length;
      BATTLE.recentDiscard.push(...BATTLE.oppPool);
      BATTLE.oppPool = [];
      const nextDraw = Math.min(fu.followUp.maxDraw || 12, dumped + (fu.followUp.drawBonus || 2));
      BATTLE.opponent.nextDrawOverride = nextDraw;
      battleLog(
        `${BATTLE.opponent.name} used ${fu.name}: it threw out its whole hand ` +
          `(${dumped} card${dumped === 1 ? '' : 's'}) and will draw ${nextDraw} next turn.`
      );
    });
    if (!attackDef || attackDef.effect !== 'curse') tryApplyCurse();
  }
  if (BATTLE.opponentItemCurses && Object.keys(BATTLE.opponentItemCurses).length) {
    Object.keys(BATTLE.opponentItemCurses).forEach((k) => detonateOpponentItemCurse(k, 'it never fired this turn'));
    if (BATTLE.opponent.hpNow <= 0) {
      winBattle();
      return;
    }
  }

  if (BATTLE.opponentItemBurns && Object.keys(BATTLE.opponentItemBurns).length) {
    Object.keys(BATTLE.opponentItemBurns).forEach((k) => {
      BATTLE.opponentItemBurns[k] += (BATTLE.opponentItemBurnStep && BATTLE.opponentItemBurnStep[k]) || 1;
    });
  }
  // Burning player Items grow too, except on the turn they were set on fire.
  if (BATTLE.itemBurns && Object.keys(BATTLE.itemBurns).length) {
    BATTLE.itemBurnFresh = BATTLE.itemBurnFresh || {};
    Object.keys(BATTLE.itemBurns).forEach((k) => {
      if (BATTLE.itemBurnFresh[k]) {
        delete BATTLE.itemBurnFresh[k];
        return;
      }
      BATTLE.itemBurns[k] += (BATTLE.itemBurnStep && BATTLE.itemBurnStep[k]) || 1;
    });
  }

  diffTickPlayerDots();
  if (RUN.health <= 0 && !offerRevive()) {
    IN_BATTLE = false;
    clearBattleSave();
    playSfx('lose');
    render(nodeResultScreen(false, { lastHit: BATTLE.lastHit }));
    return;
  }

  if (BATTLE.playerHandPurgeActive) {
    const stashedIdxs = new Set();
    Object.entries(BATTLE.slots).forEach(([key, idxs]) => {
      const itemId = key.replace(/_\d+$/, '');
      const item = ITEMS[itemId];
      if (item && item.kind === 'storage') idxs.forEach((i) => stashedIdxs.add(i));
    });
    const purgeIdxs = BATTLE.hand
      .map((_, i) => i)
      .filter((i) => !stashedIdxs.has(i))
      .sort((a, b) => b - a);
    if (purgeIdxs.length) {
      purgeIdxs.forEach((i) => {
        BATTLE.recentDiscard.push(BATTLE.hand[i]);
        BATTLE.hand.splice(i, 1);
      });
      battleLog(
        `Grid Storm purges your hand - ${purgeIdxs.length} ` + `card${purgeIdxs.length > 1 ? 's' : ''} sent to discard.`
      );
    }
  }

  // Reveal the opponent's whole current pool at the end of every turn. Only cards drawn after this point
  // (via drawOpponentCards) stay hidden.
  BATTLE.oppPool.forEach((c) => {
    c.revealed = true;
  });

  BATTLE.turn++;
  BATTLE.weaken = 0;
  drawCards(RUN.drawPerTurn);
  resortHandAndRelink(RUN.handSortMode);

  if ((BATTLE.opponent.discardPoolEachTurn || BATTLE.opponent.reckless) && BATTLE.oppPool.length) {
    BATTLE.recentDiscard.push(...BATTLE.oppPool);
    BATTLE.oppPool = [];
  }
  drawOpponentCards();

  if (BATTLE.opponent.armorRegen) {
    BATTLE.opponent.armor = (BATTLE.opponent.armor || 0) + BATTLE.opponent.armorRegen;
  }
  BATTLE.turnStartedAt = Date.now();
  render(battleScreen());
}
function battleRewardsFor(opp, row) {
  const isElite = /\[Elite\]/.test(opp.name || '');
  const rating = opponentDifficultyRating(opp);
  const gemReward = opp.boss ? 5 : isElite ? 2 : rating >= 45 ? 1 : 0;
  // Regular kills do not give fuel. Fuel comes from Perfect Kills, node stops and chests.
  const fuelReward = 0;
  const rewardMult = opp.rewardMult || 1;
  // Reward scales off the difficulty rating (HP + armor + offense + draw speed) rather than
  // HP alone, so a tougher-than-average opponent at a given HP pays out more.
  const chipReward = Math.round((9 + rating * 0.95) * rewardMult);
  return { chipReward, gemReward, fuelReward };
}
function winBattle(outlast) {
  diffLogFight(true);
  IN_BATTLE = false;
  clearBattleSave();
  if (BATTLE.castleStage) {
    const stage = BATTLE.castleStage;
    const reward =
      stage === 1
        ? { coins: 45, gems: 1, fuel: 1, energy: 2 }
        : stage === 2
          ? { coins: 100, gems: 2, fuel: 2, energy: 4 }
          : { coins: 160, gems: 4, fuel: 4, energy: 8 };
    RUN.chips += reward.coins;
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + reward.gems);
    addFuel(reward.fuel);
    RUN.energy = Math.min(RUN.maxEnergy, RUN.energy + reward.energy);
    if (!RUN.castleState) RUN.castleState = {};
    if (stage === 1) {
      RUN.castleState.firstDone = true;
    }
    if (stage === 2) RUN.castleState.secondDone = true;
    if (stage === 3) {
      RUN.castleState.thirdDone = true;

      {
        let wonItem;
        if (RUN.world === 1) {
          wonItem = ITEMS.supply_bag;
        } else {
          const ownedIds = new Set(RUN.hero.items);
          const fullPool = Object.values(ITEMS).filter((it) => !ownedIds.has(it.id));
          const eligiblePool =
            equippedItemCount(RUN.hero) >= RUN.itemCap ? fullPool.filter((it) => it.weightless) : fullPool;
          const pool = eligiblePool.length ? eligiblePool : fullPool;
          wonItem = (pool.length ? pool : Object.values(ITEMS))[
            Math.floor(Math.random() * (pool.length ? pool.length : Object.values(ITEMS).length))
          ];
        }
        // Weightless rewards bypass the item-cap check entirely.
        // No item reward is converted into coins; the awarded item is preserved.
        RUN.hero.items.push(wonItem.id);
        DUNGEON_WIN_POPUP = { reward, itemName: wonItem.name, itemId: wonItem.id };
      }
      saveRun();
      render(castleDungeonScreen());
      return;
    }

    DUNGEON_CONTINUE_POPUP = { stage, reward };
    saveRun();
    render(castleDungeonScreen());
    return;
  }
  const scale = outlast ? 0.7 : 1;
  const base = battleRewardsFor(BATTLE.opponent, BATTLE.row);
  const baseChipReward = Math.round(base.chipReward * scale);
  const exactKillBonus = BATTLE.exactKill && !outlast;
  let chipReward = baseChipReward + (exactKillBonus ? 15 : 0);
  const gemReward = base.gemReward + (exactKillBonus ? 1 : 0);
  // Fuel is scarce on purpose now - only a Perfect Kill refuels you at all.
  const fuelReward = exactKillBonus ? 1 : 0;
  // Career Points are otherwise a flat end-of-run bonus now, but a Perfect Kill is a
  // skill-gated moment worth a small nod on its own, same as the fuel it grants.
  const pointsReward = exactKillBonus ? PERFECT_KILL_CP : 0;
  RUN.chips += chipReward;
  RUN.gems = Math.min(RUN.maxGems, RUN.gems + gemReward);
  addFuel(fuelReward);
  if (pointsReward) {
    earnPoints(pointsReward);
    RUN.careerPointsFromPerfectKills = (RUN.careerPointsFromPerfectKills || 0) + pointsReward;
    RUN.perfectKillsThisRun = (RUN.perfectKillsThisRun || 0) + 1;
  }
  battleLog(outlast ? `You outlasted the ${BATTLE.opponent.name}!` : `${BATTLE.opponent.name} is done for!`);
  if (exactKillBonus)
    battleLog(
      `Perfect Win Bonus: +15 coins, +1 gem, +${PERFECT_KILL_CP} ` +
        `Career Points${fuelReward ? (usesCoinTravel() ? `, +${FUEL_COIN_VALUE} ` + `coins` : ', +1 fuel') : ''}!`
    );
  battleLog(formatRewardParts({ coins: chipReward, gems: gemReward, fuel: fuelReward }) + '.');
  if (BATTLE.row === RUN.bossRow) {
    RUN.pendingWorldWin = true;
  }
  if (!BATTLE.castleStage) {
    META.enemiesBeaten = (META.enemiesBeaten || 0) + 1;
    RUN.opponentsBeatenThisRun = (RUN.opponentsBeatenThisRun || 0) + 1;
    if (exactKillBonus) META.perfectWins = (META.perfectWins || 0) + 1;
    if (/\[Elite\]/.test(BATTLE.opponent.name || '')) {
      META.elitesBeaten = (META.elitesBeaten || 0) + 1;
      RUN.elitesBeatenThisRun = (RUN.elitesBeatenThisRun || 0) + 1;
      RUN.careerPointsFromElites = (RUN.careerPointsFromElites || 0) + ELITE_KILL_CP;
      earnPoints(ELITE_KILL_CP);
      battleLog(`Elite Bonus: +${ELITE_KILL_CP} Career Points!`);
    }
    saveMeta();
  }
  playSfx(exactKillBonus ? 'perfect' : 'win');
  render(
    nodeResultScreen(true, {
      chipReward: baseChipReward,
      gemReward: base.gemReward,
      fuelReward: 0,
      perfectFuel: fuelReward,
      pointsReward,
      exactKillBonus,
    })
  );
}

      rows: [['HP', `${o.hp}${armorTag}`], ['Draws', `${o.drawRate}/turn`], ...diffDifficultyRow(o, diff)],

function mapScreen() {
  const rows = RUN.map.nodes;
  const colW = 118;
  // Taller map on a phone held upright so it fills more of the screen
  const mapH =
    window.innerHeight > window.innerWidth && window.innerWidth <= 700
      ? Math.round(Math.min(620, Math.max(336, window.innerHeight * 0.58)))
      : 336;
  // Rows keep a small fixed margin from the top and bottom edge, so a taller map spreads the rows apart
  // instead of adding empty space above and below them.
  // The map box has 16px of padding and border above the nodes and 14px below, so the top row sits 6px in from the
  // top (still room for the tag) and the bottom row ends 22px above the bottom edge. Both edges then look the same.
  const NODE_R = 45;
  const rowTop = 6 + NODE_R,
    rowBottom = mapH - 38 - NODE_R;
  const rowY = [rowTop, Math.round((rowTop + rowBottom) / 2), rowBottom];
  const CASTLE_GAP = 65;
  const castleR = rows.findIndex((row) => row.some((n) => n && n.type === 'castle'));
  const colX = (r) =>
    25 + r * colW + colW / 2 + (castleR < 0 ? 0 : r > castleR ? CASTLE_GAP * 2 : r === castleR ? CASTLE_GAP : 0);
  const totalW = rows.length * colW + 50 + (castleR >= 0 ? CASTLE_GAP * 2 : 0);
  const totalH = mapH;
  const avail = availableNextNodes();
  const visibleRange = 3 + META.levels.range + (RUN.runUpgrades?.sightRange || 0);
  let svgLines = '';

  for (const e of RUN.map.edges) {
    const x1 = colX(e.fromRow);
    const x2 = colX(e.toRow);
    // Nodes from a run saved before lanes existed have no .lane - fall back to the column index (same
    // rule the node placement below uses) so the connection lines still draw for those saves.
    const fromNode = rows[e.fromRow] && rows[e.fromRow][e.fromCol],
      toNode = rows[e.toRow] && rows[e.toRow][e.toCol];
    const fromLane = fromNode && fromNode.lane != null ? fromNode.lane : e.fromCol;
    const toLane = toNode && toNode.lane != null ? toNode.lane : e.toCol;
    const y1 = rowY[Math.min(fromLane, rowY.length - 1)];
    const y2 = rowY[Math.min(toLane, rowY.length - 1)];
    const traveled =
      RUN.path.some((p) => p.row === e.fromRow && p.col === e.fromCol) &&
      RUN.path.some((p) => p.row === e.toRow && p.col === e.toCol);
    svgLines +=
      `<path d="M ${x1} ${y1} C ${x1 + 28} ${y1}, ${x2 - 28} ${y2}, ${x2} ${y2}"
      fill="none" stroke="${traveled ? '#ffc44d' : '#7f9180'}" stroke-width="${traveled ? 5 : 3}" ` +
      `stroke-linecap="round" ${traveled ? 'style="filter:drop-shadow(0 0 4px ' + '#1fb6a6)"' : ''}/>`;
  }

  let nodesHTML = '';
  const NODE_ICON = {
    shop: ICON.cart,
    rest: ICON.wrench,
    blacksmith: ICON.hammer,
    chopshop: ICON.curse,
    overdrive: ICON.energy,
    treasure: ICON.gift,
    castle: ICON.castle,
    match_hazard: JOKER_MAP_ICON,
    plinko_hazard: '🎯',
    blackjack_hazard: '♠️',
    poker_hazard: '♣️',
    auction_hazard: '🔨',
  };
  // Icon file for each map-node type. match_hazard is left out because it uses Hazards/joker-map.png
  // (NODE_ICON.match_hazard). Anything without a file falls back to its NODE_ICON emoji through
  // iconImg()'s onerror handler.
  const NODE_ICON_FILE = {
    shop: 'node-dealership.png',
    rest: 'node-service-station.png',
    blacksmith: 'node-tuning-garage.png',
    chopshop: 'node-chop-shop.png',
    overdrive: 'node-overdrive-bay.png',
    treasure: 'node-supply-cache.png',
    castle: 'node-fleet-compound.png',
    plinko_hazard: 'node-fleet-plinko.png',
    blackjack_hazard: 'node-fleet-blackjack.png',
    poker_hazard: 'node-fleet-poker.png',
    auction_hazard: 'node-fleet-auction.png',
  };
  const NODE_TITLE = {
    shop: 'Dealership',
    rest: 'Service Station',
    blacksmith: 'Tuning Garage',
    chopshop: 'Chop Shop',
    overdrive: 'Overdrive Bay',
    treasure: 'Supply Cache',
    castle: 'Fleet Compound',
    match_hazard: 'Grid Anomaly',
    plinko_hazard: 'Fleet Plinko',
    blackjack_hazard: 'Fleet Blackjack',
    poker_hazard: 'Fleet Poker',
    auction_hazard: 'Fleet Auction',
  };

  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const node = rows[r][c],
        x = colX(r),
        lane = node.lane != null ? node.lane : c,
        y = rowY[Math.min(lane, rowY.length - 1)];
      const isDone = RUN.path.some((p) => p.row === r && p.col === c);
      const isCurrent = r === RUN.currentRow && c === RUN.currentCol;
      const isAvail = avail.some((n) => n.row === r && n.col === c);
      const isBoss = r === rows.length - 1;
      const isCastle = node.type === 'castle';
      const isElite = node.type === 'battle' && node.opponent && /\[Elite\]/.test(node.opponent.name || '');
      const withinSight = r <= RUN.currentRow + visibleRange;
      const showReal = isBoss || isDone || isAvail || withinSight || isCastle;
      const isWorldBossNode = isBoss;
      const cls =
        (isCurrent
          ? 'current'
          : isDone
            ? 'done'
            : isAvail
              ? 'avail'
              : withinSight || isCastle
                ? 'future'
                : 'farfuture') +
        (isWorldBossNode ? ' worldboss' : '') +
        (isElite ? ' elitenode' : '') +
        (showReal ? '' : ' fogged');
      const iconSize = isCastle && showReal ? 104 : isWorldBossNode && showReal ? 62 : 56;
      const battleIconSize = isWorldBossNode ? 104 : 94;
      const icon = !showReal
        ? ''
        : node.type === 'battle'
          ? art(node.opponent, battleIconSize)
          : NODE_ICON_FILE[node.type]
            ? iconImg(NODE_ICON_FILE[node.type], NODE_ICON[node.type], iconSize)
            : `<span class="vart" style="width:${iconSize}px;` +
              `height:${iconSize}px;font-size:${iconSize}px">${NODE_ICON[node.type]}</span>`;
      const title = !showReal ? 'Unscouted' : node.type === 'battle' ? node.opponent.name : NODE_TITLE[node.type];
      let tip;
      if (!showReal) tip = 'Move closer to scout this stop.';
      else if (node.type === 'battle') {
        const o = effectiveOpponentDef(node.opponent);
        tip = `HP: ${o.hp}<br>Draws ${o.drawRate}/turn${o.boss ? '<br><b>World Boss</b>' : ''}${
          node.gridStorm ? '<br><b style="color:var(--red)">Grid Storm: purges ' + 'your hand at end of turn</b>' : ''
        }`;
      } else if (node.type === 'shop') tip = 'Dealership - buy and sell Items.';
      else if (node.type === 'rest') tip = 'Restore 30 health.';
      else if (node.type === 'blacksmith') tip = 'Spend coins to permanently boost a card, rank, or suit for this run.';
      else if (node.type === 'chopshop')
        tip = 'Spend coins to convert an Item to poison, burn, or ' + 'curse, or add card slots.';
      else if (node.type === 'overdrive') tip = 'Spend coins to add uses per turn to your equipped Items.';
      else if (node.type === 'castle') tip = 'Choose battles, shopping, refueling, a matching game, or other rewards.';
      else if (node.type === 'match_hazard')
        tip = 'Grid Anomaly Detected: Tap to hack the Carnival Board ' + 'for extra fleet gear.';
      else if (node.type === 'plinko_hazard')
        tip = 'A Plinko board found out on the road: drop chips for ' + 'coins, fuel, or gems.';
      else if (node.type === 'blackjack_hazard')
        tip = 'A roadside Blackjack table: draw and Stand against the ' + 'dealer for a haul.';
      else if (node.type === 'poker_hazard')
        tip = "A roadside Hold'em table: build your best hands " + 'against the dealer for a haul.';
      else if (node.type === 'auction_hazard') tip = 'A pop-up Fleet Auction: bid for coins, fuel, gems, or Items.';
      else tip = 'Find coins, fuel, and gems.';

      nodesHTML +=
        `<div class="mapnode-wrap ${isBoss ? 'bossnode ' : ''}${isCastle ? 'castlenode ' : ''}${lane === 0 ? 'toprow' : lane === 1 ? 'midrow' : 'bottomrow'}" ` +
        `style="left:${(x / totalW) * 100}%;top:${y}px">
        ${isCurrent ? '<div class="hereTag">You Are Here</div>' : ''}
        <button class="mapnode ${cls} ` +
        `type-${node.type}" ${showReal ? `data-nodeinfo="${r}:${c}"` : ''} ${showReal ? '' : 'disabled'}>${icon}</button>
        <div class="tooltip">` +
        `<b>${title}</b>${isCurrent ? ' <span style="color:var(--amber)">(current)</span>' : ''}<br>${tip}</div>
      </div>`;
    }
  }
  return (
    `<div id="map-viewport">${noticeHTML()}<div ` +
    `class="panel">${currencyBar(
      `<div style="margin-left:auto;display:flex;gap:6px">` +
        `<button class="wo-btn purple runBarBtn" id="openRunUpgradeFromMapBtn">Run Upgrade</button>` +
        `<button class="wo-btn red runBarBtn" id="forfeitRunBtn">Forfeit Run</button></div>`
    )}</div>` +
    `<div class="panel"><div class="mapwrap" style="width:100%;height:${totalH}px;overflow-x:auto;` +
    `overflow-y:hidden;position:relative"><div style="position:relative;width:${totalW}px;` +
    `height:${totalH}px"><svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" ` +
    `style="position:absolute;left:0;top:0;` +
    `pointer-events:none">${svgLines}</svg>${nodesHTML}${(() => {
      const parsedName = String(META.playerName || 'Commander')
        .trim()
        .replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
      return RUN.world === 1 && RUN.currentRow === -1 && !RUN.onboardingDismissed
        ? `<div class="floating-tutorial-card"><div ` +
            `class="wo-eyebrow">Fleet Onboarding</div><h3>Welcome, ${parsedName}!</h3><p>Click the node to ` +
            `the left to start your journey.</p></div>`
        : '';
    })()}</div>${MAP_POPUP ? nodePopupScreen(MAP_POPUP.row, MAP_POPUP.col) : ''}${TREASURE_POPUP ? treasureScreen(TREASURE_POPUP) : ''}${GARAGE_POPUP ? garageScreen(GARAGE_MESSAGE) : ''}${MATCH_OVERLAY_ACTIVE ? castleMatchScreen() : ''}</div>` +
    `<div class="regionCaption">World ${RUN.world}: ${WORLD_NAMES[RUN.world] || WORLD_NAMES[1]}</div></div></div>`
  );
}

function runUpgradeCost(kind) {
  const def = RUN_UPGRADE_DEFS[kind],
    n = RUN.runUpgrades[kind] || 0;
  return def.mult ? Math.round(def.baseCost * Math.pow(def.mult, n)) : def.baseCost + def.add * n;
}
let RUN_UPGRADE_RETURN = 'map';
let RUN_UPGRADE_RETURN_FROMCASTLE = false;
function runUpgradeScreen() {
  const rows = Object.entries(RUN_UPGRADE_DEFS)
    .map(([kind, def]) => {
      const n = RUN.runUpgrades[kind] || 0;
      const maxed = n >= def.cap;
      const full = kind === 'health' && RUN.health >= RUN.maxHealth;
      const cost = runUpgradeCost(kind);
      const canAfford = RUN.chips >= cost && !maxed && !full;
      const currentLabel = def.isHeal ? `${RUN.health}/${RUN.maxHealth} HP` : `${def.base ? def.base() : 0} (+${n})`;
      return (
        `<div class="shopcard" style="padding:8px 10px"><div class="hdr" style="margin:0">` +
        `<span>${def.label}</span><span class="note" style="margin:0">Current: ${currentLabel}</span></div>
      <div class="note" style="margin:2px 0 6px">${def.desc}</div>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px">
        <span class="price" style="white-space:nowrap">${maxed ? 'Maxed' : cost + ' coins'}</span>
        <button class="wo-btn amber" data-runupgrade="${kind}" ${canAfford ? '' : 'disabled'} ` +
        `style="padding:8px 12px;font-size:13px;` +
        `white-space:nowrap">${maxed ? 'Maxed for this run' : full ? 'Full health' : 'Buy'}</button>
      </div>
    </div>`
      );
    })
    .join('');
  const backLabel =
    RUN_UPGRADE_RETURN === 'battle'
      ? 'Back to Battle'
      : RUN_UPGRADE_RETURN === 'shop'
        ? RUN_UPGRADE_RETURN_FROMCASTLE
          ? 'Back to Compound'
          : roadExitLabel()
        : RUN_UPGRADE_RETURN === 'blacksmith'
          ? 'Back to Tuning Garage'
          : RUN_UPGRADE_RETURN === 'rest'
            ? 'Back to Service Station'
            : RUN_UPGRADE_RETURN === 'chopshop'
              ? 'Back to Chop Shop'
              : RUN_UPGRADE_RETURN === 'overdrive'
                ? 'Back to Overdrive Bay'
                : RUN_UPGRADE_RETURN === 'dungeon'
                  ? 'Back to Dungeon'
                  : RUN_UPGRADE_RETURN === 'inn'
                    ? 'Back to Body Shop'
                    : roadExitLabel();
  return (
    `${noticeHTML()}<div class="wo" style="max-width:640px;margin-left:auto;` +
    `margin-right:auto"><div class="wo-stripe"></div><div class="wo-body">
    <div class="wo-eyebrow">Run Upgrade</div><h1>Run <em>Upgrades</em></h1>${currencyBar()}
    <div style="margin:6px 0">${rows}</div>
    <button class="wo-btn teal" id="leaveRunUpgradeBtn" style="width:100%;margin-top:10px">${backLabel}</button>
  </div></div>`
  );
}

function battleScreen() {
  const opp = BATTLE.opponent;
  const hpPct = Math.max(0, (opp.hpNow / opp.hp) * 100);
  const healthPct = Math.max(0, (RUN.health / RUN.maxHealth) * 100);

  // The opponent's face-up cards can be sorted by value or suit, same as your hand. Face-down cards always sit at
  // the end so sorting never gives away where they are.
  const oppSuitOrder = { '♠': 0, '♥': 1, '♦': 2, '♣': 3 };
  const oppSortMode = RUN.handSortMode || 'value';
  const oppUp = BATTLE.oppPool
    .filter((c) => c.revealed)
    .sort((a, b) =>
      oppSortMode === 'suit'
        ? oppSuitOrder[a.suit] - oppSuitOrder[b.suit] || a.rank - b.rank
        : a.rank - b.rank || oppSuitOrder[a.suit] - oppSuitOrder[b.suit]
    );
  const oppDown = BATTLE.oppPool.filter((c) => !c.revealed);
  const poolHTML =
    [
      ...oppUp.map(
        (c) =>
          `<div class="card ${suitColorClass(c.color, c.suit)}">` +
          `<div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
      ),
      ...oppDown.map(() => `<div class="card back">` + `</div>`),
    ].join('') || '<span class="note" style="margin:0">' + 'empty</span>';

  const hero = HEROES[RUN.hero.heroId];
  const itemsHTML = RUN.hero.items
    .map((itemId, index) => {
      const item = ITEMS[itemId];
      if (!item) return `<div class="shopcard error">Missing Item Data: ${itemId}</div>`;

      const slotKey = `${itemId}_${index}`;
      const idxs = BATTLE.slots[slotKey] || [];
      const cards = idxs.map((i) => BATTLE.hand[i]);
      const level = itemLevel(itemId);
      const cursedAmt = BATTLE.itemCurses && BATTLE.itemCurses[slotKey];
      const burnedAmt = BATTLE.itemBurns && BATTLE.itemBurns[slotKey];
      const hexedFlag = BATTLE.itemHexes && BATTLE.itemHexes[slotKey];
      const frozenState = BATTLE.itemFrozen && BATTLE.itemFrozen[slotKey];

      if (item.kind === 'storage') {
        const cardHTML = idxs
          .map((cardHandIdx) => {
            const c = BATTLE.hand[cardHandIdx];
            return (
              `<div class="card mini ${suitColorClass(c.color, c.suit)}" ` +
              `data-unassign="${slotKey}|${cardHandIdx}" data-title="Click to take this card back"
          onmousedown="startDragSweep('slot','${slotKey}',${cardHandIdx})"
          onmouseenter="if(event.buttons===1)updateDragSweep(${cardHandIdx})">` +
              `<div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
            );
          })
          .join('');
        return (
          `<div class="itemCard kind-storage${item.weightless ? ' kind-weightless' : ''}" ` +
          `data-assign="${slotKey}" style="border-style:dashed;border-width:2px">
        <div class="usesBadge hoverTip" data-title="Cards currently ` +
          `held">${idxs.length}/${effectiveMaxCards(item)}</div>
        <div class="itemCard-sec">
          <div class="hdr" style="font-weight:600">${item.name}</div>
          ${
            item.weightless
              ? `<div class="note" style="margin:2px 0"><span class="effectTip" ` +
                `style="color:#1a1a2e" data-tip="Doesn't consume an item card slot">Weightless</span></div>`
              : ''
          }
          <div class="note" style="font-size:11px">${stashHoldsLineHTML(item)}</div>
        </div>
        <div class="itemDivider"></div>
        <div class="itemCard-cards-sec">
          <div class="vcards">${cardHTML}</div>
          ${
            idxs.length > 0
              ? `<button class="wo-btn gray" style="padding:3px 6px;` +
                `font-size:10px;margin-top:6px" data-clear="${slotKey}">Release All</button>`
              : ''
          }
        </div>
      </div>`
        );
      }

      const condResult = frozenState
        ? { met: cards.length > 0, label: 'Thawing' }
        : cards.length
          ? checkCondition(item.condition, cards)
          : { met: false, label: '' };
      const ready = condResult.met;
      let lightningRollForPreview = null;
      if (ready && !frozenState && item.kind === 'lightning') {
        lightningRollForPreview = diffLightningRoll();
      }
      const previewCalc =
        ready && !frozenState
          ? computeItemAmount(item, cards, level, condResult, false, lightningRollForPreview)
          : null;

      let hypPreviewHTML = '';
      if (!frozenState && !idxs.length && typeof selectedIdx !== 'undefined' && selectedIdx.length) {
        const hypCards = selectedIdx
          .filter((i) => !BATTLE.usedThisTurn.has(i))
          .slice(0, effectiveMaxCards(item))
          .map((i) => BATTLE.hand[i]);
        const hypCond = hypCards.length ? checkCondition(item.condition, hypCards) : { met: false };
        if (hypCond.met) {
          const hypCalc = computeItemAmount(item, hypCards, level, hypCond);
          const hypKind = effectiveKind(item, index);
          const hypWord =
            hypKind === 'defense'
              ? 'armor'
              : hypKind === 'poison'
                ? 'poison'
                : hypKind === 'burn'
                  ? 'burn (1st turn)'
                  : hypKind === 'curse'
                    ? 'curse'
                    : 'damage';
          if (hypCalc.amount > 0)
            hypPreviewHTML =
              `<div class="note hoverTip" style="margin:4px 0 0;` +
              `color:var(--amber);font-weight:700" data-title="What your selected cards would do if dropped ` +
              `into this Item.">${hypCalc.amount} ${hypWord}</div>`;
        }
      }
      const eKind = effectiveKind(item, index);
      const effectWord =
        eKind === 'defense'
          ? 'armor'
          : eKind === 'poison'
            ? 'poison'
            : eKind === 'burn'
              ? 'burn'
              : eKind === 'curse'
                ? 'curse'
                : 'dmg';
      const cap = itemUsesCap(item, itemUsesLevel(itemId)) + (BATTLE && BATTLE.overtime ? 1 : 0);
      const usesLeft = cap - ((BATTLE.itemUses && BATTLE.itemUses[slotKey]) || 0);

      const isChargingUnlockItem =
        item.unlockThreshold != null && !(BATTLE.itemUnlocked && BATTLE.itemUnlocked[slotKey]);
      const cardHTML = idxs
        .map((cardHandIdx) => {
          const c = BATTLE.hand[cardHandIdx];
          return (
            `<div class="card mini ${suitColorClass(c.color, c.suit)}" data-unassign="${slotKey}|${cardHandIdx}"
        onmousedown="startDragSweep('slot','${slotKey}',${cardHandIdx})"
        onmouseenter="if(event.buttons===1)updateDragSweep(${cardHandIdx})">` +
            `<div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
          );
        })
        .join('');
      const bonusLine = itemBonusLineHTML(item, level);
      // Lightning items roll a random power multiplier (25%-100%) each time they're loaded up to
      // fire. Roll it as soon as the slot is active - not only once it's actually ready - and show
      // it in the bonus section so the player knows what they're working with before committing cards.
      let lightningRollLine = '';
      if (item.kind === 'lightning' && !frozenState) {
        const rollPct = Math.round(diffLightningRoll() * 100);
        lightningRollLine =
          `<div class="itemBonusLine hoverTip" style="color:var(--lightning)" ` +
          `data-title="Lightning uses one shared roll. Whoever fires a Lightning attack next, you or the ` +
          `opponent, uses this roll, then it rerolls.">⚡ Shared roll ${rollPct}% power</div>`;
      }
      const drawNPreview = item.drawUsesCardCount
        ? cards.length + (item.drawBonusFlat || 0) + (item.drawPerLevel || 0) * level
        : item.drawAmount
          ? item.drawAmount + (item.drawPerLevel || 0) * level
          : 0;
      const drawBonusLine =
        item.drawAmount || item.drawUsesCardCount
          ? `<div class="itemBonusLine hoverTip" ` +
            `data-title="Draws ${drawNPreview} card${drawNPreview === 1 ? '' : 's'} immediately after this item is ` +
            `used.">Draw ${drawNPreview} card${drawNPreview === 1 ? '' : 's'}</div>`
          : '';

      const usesBadgeText = isChargingUnlockItem ? '∞' : cap === Infinity ? '∞' : `${Math.max(0, usesLeft)}`;
      const cooldownLeft = item.cooldown != null ? BATTLE.itemCooldowns?.[slotKey] || 0 : 0;
      const isDepletedThisTurn = !isChargingUnlockItem && cap !== Infinity && usesLeft <= 0;
      return (
        `<div class="itemCard ` +
        `kind-${eKind} ${ready ? 'ready' : ''} ${cursedAmt ? 'cursed' : ''} ${burnedAmt ? 'burned' : ''} ${frozenState ? 'frozenLock' : ''} ${isDepletedThisTurn ? 'depleted-lockout' : ''}" ` +
        `data-assign="${slotKey}" style="border-style:dashed;border-width:2px">
      ${
        isDepletedThisTurn
          ? ''
          : `<div class="usesBadge hoverTip" data-title="Uses left this ` + `turn">${usesBadgeText}</div>`
      }
      <div class="itemCard-sec">
        <div class="hdr" ` +
        `style="font-weight:600">${item.name}${
          cursedAmt
            ? ` <span class="vart" style="width:12px;height:12px;` +
              `font-size:12px;color:var(--purple)">${ICON.curse}</span> cursed`
            : ''
        }${
          burnedAmt
            ? ` <span class="burnBadge hoverTip" data-title="This ` +
              `Item is on fire. The burn grows ` +
              `by ${(BATTLE.itemBurnStep && BATTLE.itemBurnStep[slotKey]) || 1} each turn. If you fire it, the ` +
              `attack still lands, but you take ${burnedAmt} burn damage.">Burn ${burnedAmt}</span>`
            : ''
        }${
          hexedFlag
            ? ` <span class="vart" style="width:12px;height:12px;` +
              `font-size:12px;color:var(--hex)">${ICON.hex}</span> hexed${hexedFlag > 1 ? ` x${hexedFlag}` : ''}`
            : ''
        }${
          frozenState
            ? ` <span class="vart" style="width:12px;height:12px;` +
              `font-size:12px;color:var(--ice)">${ICON.ice}</span> frozen`
            : ''
        }</div>
        <div class="itemReqLine">${
          frozenState
            ? `<span class="hoverTip" data-title="This Item is frozen ` +
              `and can't fire normally. Drop any cards into it - their value counts toward thawing it out.">` +
              `Frozen: ${Math.max(0, frozenState.threshold - frozenState.progress)} to thaw</span>`
            : itemRequirementText(item, eKind)
        }</div>
      </div>
      <div class="itemDivider"></div>
      <div class="itemCard-cards-sec">
        ${bonusLine}
        ${lightningRollLine}
        ${drawBonusLine}
        ${
          item.unlockThreshold != null
            ? `<div class="itemBonusLine" style="color:#f5c451;` +
              `font-weight:700;text-align:center">${
                item.id === 'impound_release'
                  ? 'Once charged: Draw 4 cards each ' + 'turn'
                  : 'Draw 4 cards each turn once ' + 'unlocked'
              }</div>`
            : ''
        }
        ${hypPreviewHTML}
        <div class="vcards">${cardHTML}</div>
      </div>
      <div class="itemCard-footer">
      <div class="itemDivider"></div>
      <div class="itemCard-sec">
      ${
        cooldownLeft > 0
          ? `<div class="note" style="margin:4px 0 0"><span class="hoverTip" ` +
            `data-title="This item can't be used again until its cooldown runs out.">On ` +
            `cooldown: ${cooldownLeft} turn${cooldownLeft > 1 ? 's' : ''} left</span></div>`
          : ''
      }
      ${(() => {
        const hasKindAmount = item.flatAmount != null || (item.baseMult ?? 1) > 0;
        const kindTag =
          eKind === 'poison'
            ? `<span class="effectTip poisonText" data-tip="Poison ` +
              `deals its damage at the end of the opponent's turn, then drops by 3 each turn until it's gone.">Poison</span>`
            : eKind === 'burn'
              ? `<span class="effectTip burnText" data-tip="Burn sets an Item on ` +
                `fire. The burn grows every turn, so you can detonate it right away for less or let it build. If ` +
                `the Item is fired while it burns, it still attacks, but its owner takes the burn damage.">Burn</span>`
              : eKind === 'curse'
                ? `<span class="effectTip curseText" data-tip="Curse goes off if this ` +
                  `item isn't fired again before the opponent's next turn.">Curse</span>`
                : eKind === 'defense'
                  ? `<span class="effectTip" style="color:var(--defense)" ` +
                    `data-tip="Armor protects against incoming attacks, absorbing damage equal to the amount shown.">Armor</span>`
                  : eKind === 'hex'
                    ? `<span class="effectTip" style="color:var(--hex)" data-tip="Hex messes ` +
                      `with card flow between you and the opponent - firing a hexed Item feeds one of its cards to ` +
                      `whoever cast the hex.">Hex</span>`
                    : eKind === 'ice'
                      ? `<span class="effectTip" style="color:var(--ice)" ` +
                        `data-tip="${
                          item.freezeThreshold
                            ? `Freezes one of their Items solid. It stays frozen ` +
                              `until ${item.freezeThreshold} points of cards have been dropped into it.`
                            : "Freezes an Item solid so it can't fire until it thaws " + 'out on its own.'
                        }">${item.freezeThreshold ? `Frozen: ${item.freezeThreshold} to ` + `thaw` : 'Freeze'}</span>`
                      : eKind === 'lightning'
                        ? `<span class="effectTip" style="color:var(--lightning)" ` +
                          `data-tip="Lightning uses one shared roll between ${Math.round(LIGHTNING_MIN_ROLL * 100)}% and ` +
                          `100%. Whenever anyone fires a Lightning attack, that roll is used and then rerolled.">Lightning</span>`
                        : '';
        const effUnlockThreshold =
          item.id === 'impound_release'
            ? Math.max(35, (item.unlockThreshold || 45) - utilityLevel('impound_release') * 5)
            : item.unlockThreshold;
        const unlockText =
          item.unlockThreshold != null
            ? BATTLE.itemUnlocked && BATTLE.itemUnlocked[slotKey]
              ? '<span class="hoverTip" data-title="Charged for the ' +
                'rest of this battle - playing cards through it now draws 4, once per turn.">Charged: Draw 4/turn</span>'
              : `<span class="hoverTip" data-title="Locked: This card ` +
                `cannot trigger actions until you drop cards into it to fulfill the listed point total.">` +
                `Locked</span>: ${Math.max(0, effUnlockThreshold - ((BATTLE.itemUnlockProgress && BATTLE.itemUnlockProgress[slotKey]) || 0))} ` +
                `to charge`
            : '';
        if (frozenState) {
          const feedText = cards.length
            ? `<b>Feeds the ice ${cards.reduce((a, c) => a + cardValue(c.rank), 0)} points</b>`
            : '<b>Frozen</b> - drop cards in to ' + 'thaw';
          return `<div class="note" style="margin:4px 0 0">${feedText}</div>`;
        }
        if (cards.length && ready) {
          const kindText = hasKindAmount
            ? `${previewCalc.breakdown} ${kindTag || '<b>Damage</b>'}`
            : kindTag || '<b>Ready</b>';
          return (
            `<div class="note" style="margin:4px 0 ` +
            `0">${kindText}</div>${
              unlockText ? `<div class="note" style="margin:2px 0 ` + `0">${unlockText}</div>` : ''
            }`
          );
        }
        if (cards.length && !ready) return `<div class="note" style="margin:4px 0 0">Requirement not met</div>`;
        const staticKindText = formatKindAmount(item, kindTag);
        return (
          `<div class="note" style="margin:4px 0 ` +
          `0">${staticKindText}</div>${
            unlockText ? `<div class="note" style="margin:2px 0 ` + `0">${unlockText}</div>` : ''
          }`
        );
      })()}
      <div>
        <div style="margin-top:4px">
          ${
            ready && (usesLeft > 0 || isChargingUnlockItem || frozenState) && cooldownLeft <= 0
              ? `<span class="attackChip ${eKind === 'defense' ? 'defendChip' : ''}" ` +
                `data-attack="${slotKey}" style="font-size:10px; padding:3px ` +
                `6px">${BATTLE.targeting && BATTLE.targeting.slotKey === slotKey ? (BATTLE.targeting.targetKey ? targetVerb(BATTLE.targeting.type) + ' ▶' : 'Pick a target') : frozenState ? 'Feed Cards ▶' : item.unlockThreshold != null ? (isChargingUnlockItem ? 'Deposit Card(s) ▶' : 'Draw ▶') : eKind === 'defense' ? 'Defend ▶' : item.flatAmount == null && (item.baseMult ?? 1) === 0 && (item.drawAmount || item.drawUsesCardCount) ? 'Draw ▶' : 'Attack ▶'}</span>`
              : ''
          }
        </div>
      </div>
      </div>
      </div>
    ${burnedAmt ? '<div class="burnedOverlay"></div>' : ''}
    </div>`
      );
    })
    .join('');
  const assignedIdx = new Set(Object.values(BATTLE.slots).flat());
  const handHTML = BATTLE.hand
    .map((c, i) => {
      if (assignedIdx.has(i) || BATTLE.turnDiscard.includes(i) || BATTLE.usedThisTurn.has(i)) return '';
      return (
        `<div class="card ${suitColorClass(c.color, c.suit)} ${selectedIdx.includes(i) ? 'selected' : ''}" ` +
        `data-card="${i}"
      onmousedown="startDragSweep('hand',null,${i})"
      onmouseenter="if(event.buttons===1)updateDragSweep(${i})" style="position:relative">
    ${
      c.bonus
        ? `<div style="position:absolute;bottom:1px;right:2px;font-size:8px;` + `color:var(--green)">+${c.bonus}</div>`
        : ''
    }
    <div>${rankLabel(c.rank)}</div><div>${c.suit}</div>
  </div>`
      );
    })
    .join('');

  return (
    `<div id="battle-viewport">
    <div class="panel">${currencyBar(`<div style="margin-left:auto;display:flex;gap:6px">
        <button class="wo-btn purple runBarBtn" id="openRunUpgradeFromBattleBtn">Run Upgrade</button>
        <button class="wo-btn red runBarBtn" id="forfeitRunBtn">Forfeit Run</button>
      </div>`)}</div>
    <div class="panel duelHead">
      <div class="duelArt you"><div class="artZoomTrigger" ` +
    `data-artzoom="you">${art(HEROES[RUN.hero?.heroId] || PLAYER_ART, 72)}</div></div>
      <div class="duelSide you">
        <div class="sideInfo">
          <h3 style="justify-content:flex-end"><span style="color:var(--blue)">${fleetLabel()}</span></h3>
          <div class="bar-wrap"><div class="bar-fill bar-health" style="width:${healthPct}%">` +
    `</div><div class="bar-text">${RUN.health} / ${RUN.maxHealth}</div></div>
          <div class="sideRow" style="margin-top:6px;display:flex;justify-content:space-between;` +
    `align-items:center;gap:10px;flex-wrap:wrap">
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start">
              ${
                BATTLE.playerArmor
                  ? `<span class="armorText hoverTip" style="font-weight:800;` +
                    `font-size:13px" data-title="Armor protects against incoming attacks, absorbing damage equal to ` +
                    `the amount shown."><span class="vart" style="width:12px;height:12px;` +
                    `font-size:12px">${ICON.shield}</span> ${BATTLE.playerArmor} armor</span>`
                  : ''
              }
              ${diffLightningChip()}
              ${
                (BATTLE.playerPoison || []).length
                  ? `<span class="status poisonStatus hoverTip" ` +
                    `data-title="Poison hits you for ${(BATTLE.playerPoison || []).reduce((a, n) => a + n, 0)} at the end of ` +
                    `this turn and skips armor. It weakens by 3 after each ` +
                    `tick.">${ICON.poison} ${(BATTLE.playerPoison || []).reduce((a, n) => a + n, 0)}</span>`
                  : ''
              }
              ${
                BATTLE.itemBurns && Object.keys(BATTLE.itemBurns).length
                  ? `<span class="status burnStatus hoverTip" ` +
                    `data-title="${Object.entries(BATTLE.itemBurns)
                      .map(([k, v]) => `${ITEMS[k.replace(/_\d+$/, '')]?.name || 'Item'}: ${v}`)
                      .join(' | ')}. ` +
                    `Fire a burning Item and the attack still lands, but you take its burn ` +
                    `damage.">${ICON.fire} ${Object.keys(BATTLE.itemBurns).length} of your Items burning</span>`
                  : ''
              }
              ${
                (BATTLE.playerBurns || []).length
                  ? `<span class="status burnStatus hoverTip" ` +
                    `data-title="Burn hits you ` +
                    `for ${BATTLE.playerBurns.reduce((a, x) => a + (x.stages[x.stageIdx] || 0), 0)} at the end of this turn, ` +
                    `then fades.">${ICON.fire} ${BATTLE.playerBurns.reduce((a, x) => a + (x.stages[x.stageIdx] || 0), 0)}</span>`
                  : ''
              }
              ${
                BATTLE.itemCurses && Object.keys(BATTLE.itemCurses).length
                  ? `<span class="status curseStatus hoverTip" ` +
                    `data-title="One or more of your Items is cursed - fire it before your turn ends or take its ` +
                    `curse damage."><span class="vart" style="width:12px;height:12px;` +
                    `font-size:12px">${ICON.curse}</span> ${Object.keys(BATTLE.itemCurses).length} ` +
                    `Item${Object.keys(BATTLE.itemCurses).length > 1 ? 's' : ''} cursed</span>`
                  : ''
              }
              ${
                BATTLE.itemHexes && Object.keys(BATTLE.itemHexes).length
                  ? `<span class="status hoverTip" style="color:var(--hex);` +
                    `font-weight:800;font-size:13px" data-title="One or more of your Items is hexed - firing it will ` +
                    `feed a card to the opponent."><span class="vart" style="width:12px;height:12px;` +
                    `font-size:12px">${ICON.hex}</span> ${Object.keys(BATTLE.itemHexes).length} ` +
                    `Item${Object.keys(BATTLE.itemHexes).length > 1 ? 's' : ''} hexed</span>`
                  : ''
              }
              ${
                BATTLE.itemFrozen && Object.keys(BATTLE.itemFrozen).length
                  ? `<span class="status hoverTip" style="color:var(--ice);` +
                    `font-weight:800;font-size:13px" data-title="One or more of your Items is frozen - drop cards ` +
                    `into it to thaw it."><span class="vart" style="width:12px;height:12px;` +
                    `font-size:12px">${ICON.ice}</span> ${Object.keys(BATTLE.itemFrozen).length} ` +
                    `Item${Object.keys(BATTLE.itemFrozen).length > 1 ? 's' : ''} frozen</span>`
                  : ''
              }
            </div>
            <button class="wo-btn green" id="fuelHealBtn" ` +
    `data-title="${
      usesCoinTravel()
        ? 'Coins also pay for every stop on the map - spending ' + 'them here means less for travel.'
        : 'Fuel also gets you across the map - spending it here ' + 'means less for travel.'
    }" ` +
    `style="padding:6px 10px;font-size:11px;` +
    `white-space:nowrap" ${(usesCoinTravel() ? RUN.chips < FUEL_HESTORE_COST * FUEL_COIN_VALUE : RUN.fuel < FUEL_HESTORE_COST) || RUN.health >= RUN.maxHealth ? 'disabled' : ''}>` +
    `Heal ${FUEL_HEAL_AMOUNT} ` +
    `= ${usesCoinTravel() ? `${FUEL_HESTORE_COST * FUEL_COIN_VALUE} ${ICON.coin}` : `${FUEL_HESTORE_COST} ${ICON.fuel}`}</button>
          </div>
        </div>
      </div>
      <div class="vsMark">vs</div>
      <div class="duelSide opp">
        <div class="sideInfo">
          <h3 style="justify-content:flex-start;gap:6px;flex-wrap:nowrap"><span ` +
    `style="color:var(--red)">${opp.name}</span>${

function pickShopStock() {
  const row = Math.max(0, RUN.currentRow || 0);
  const SUIT_STASH_IDS = ['spade_bag', 'heart_bag', 'club_bag', 'diamond_bag'];
  const SUIT_INFERNO_IDS = ['spade_inferno', 'heart_inferno', 'club_inferno', 'diamond_inferno'];
  const ownedIds = new Set(RUN.hero?.items || []);
  const starterIds = new Set(RUN.starterItemIds || []);
  const allowHexItems = Math.random() < HEX_SHOP_CHANCE;
  const pool = Object.values(ITEMS).filter(
    (it) =>
      it.cost > 0 &&
      (it.minRow == null || it.minRow <= row) &&
      (it.kind !== 'hex' || allowHexItems) &&
      (!ownedIds.has(it.id) || starterIds.has(it.id)) &&
      (it.kind !== 'storage' || it.id === 'supply_bag' || SUIT_STASH_IDS.includes(it.id))
  );
  const defensePool = pool.filter((it) => it.kind === 'defense');
  const nonDefensePool = pool.filter((it) => it.kind !== 'defense');
  const picked = [];
  let suitStashUsed = false;
  let suitInfernoUsed = false;
  const tryAdd = (it) => {
    if (picked.length >= 6 || picked.includes(it)) return;
    if (SUIT_STASH_IDS.includes(it.id)) {
      if (suitStashUsed) return;
      suitStashUsed = true;
    }
    if (SUIT_INFERNO_IDS.includes(it.id)) {
      if (suitInfernoUsed) return;
      suitInfernoUsed = true;
    }
    picked.push(it);
  };
  // Guarantee at least one defense/armor card on the shelves when one is available.
  if (defensePool.length) tryAdd(shuffle([...defensePool])[0]);
  // Early on, make sure the shelves carry easy-to-read attacks (2 of a suit, or 2-3 Red/Black) so
  // new players have an obvious first purchase: two of them in World 1, one in Worlds 2 and 3.
  const easyWanted = (RUN.world || 1) <= 1 ? 2 : (RUN.world || 1) <= 3 ? 1 : 0;
  if (easyWanted) {
    const easyPool = shuffle(
      nonDefensePool.filter(
        (it) =>
          it.condition &&
          ((it.condition.type === 'suitCount' && it.condition.count <= 2) ||
            (it.condition.type === 'colorCount' && it.condition.count <= 3))
      )
    );
    let added = 0;
    for (const it of easyPool) {
      if (added >= easyWanted) break;
      const before = picked.length;
      tryAdd(it);
      if (picked.length > before) added++;
    }
  }
  const shuffled = shuffle([...nonDefensePool]);
  for (const it of shuffled) {
    if (picked.length >= 6) break;
    tryAdd(it);
  }
  // The guaranteed defense/armor card was always pushed in first above, which made it land in
  // the same shelf slot every visit - shuffle the final picks so its position (and everything
  // else's) is randomized each time instead of feeling staged.
  return shuffle(picked);
}

function shopScreen(fromCastle = false) {
  // Stock is tied to the specific node you're standing on (row:col), not just "do we have any
  // stock at all" - that way re-entering the same Dealership visit keeps the same 6 items, but
  // arriving at a genuinely different node (a new world's Fleet Compound, a different roadside
  // Dealership) always reshuffles, even via paths that don't explicitly clear RUN.shopStock
  // (like the Fleet Compound's "Visit the Dealership" button).
  const nodeKey = `${RUN.currentRow}:${RUN.currentCol}`;
  if (!RUN.shopStock || RUN.shopStockNodeKey !== nodeKey) {
    RUN.shopStock = pickShopStock().map((it) => it.id);
    RUN.shopStockNodeKey = nodeKey;
  }
  const options = RUN.shopStock.map((id) => ITEMS[id]).filter(Boolean);
  const itemRows = options
    .map((it) =>
      dealerItemCardHTML(it, {
        mode: 'buy',
        disabled: RUN.chips < it.cost || equippedItemCount(RUN.hero) >= RUN.itemCap,
        disabledLabel: equippedItemCount(RUN.hero) >= RUN.itemCap ? 'No open slot' : null,
      })
    )
    .join('');
  const ownedRows = RUN.hero.items
    .map((id, i) => {
      const it = ITEMS[id];
      if (!it) return '';
      const modCost =
        (itemLevel(id) > 0 ? itemTuneCost(it, Math.max(0, itemLevel(id) - 1)) : 0) +
        (itemUsesLevel(id) > 0 ? itemUsesTuneCost(itemUsesLevel(id) - 1) : 0) +
        (itemMaxCardsLevel(id) > 0 ? itemMaxCardsTuneCost(itemMaxCardsLevel(id) - 1) : 0) +
        (RUN.itemKindOverride[`${id}_${i}`] || RUN.itemKindOverride[id] ? itemKindConvertCost() : 0);
      const sell = it.sellValue != null ? it.sellValue + Math.floor(modCost / 2) : Math.floor((it.cost + modCost) / 2);
      return dealerItemCardHTML(it, { mode: 'sell', sell, index: i });
    })
    .join('');
  const emptyCount = Math.max(0, RUN.itemCap - equippedItemCount(RUN.hero));
  const emptySlotRows = Array.from({ length: emptyCount }, emptyItemSlotHTML).join('');
  return (
    `${noticeHTML()}
  <div id="dealer-viewport">
    <div class="wo">
      <div class="wo-stripe"></div><div class="wo-body">
        <h1>Dealership</h1>${currencyBar()}
        <div style="display:flex;gap:8px;margin:10px 0">
          <button class="wo-btn teal" id="leaveShopBtn" ` +
    `style="flex:1">${fromCastle ? 'Back to Compound' : roadExitLabel()}</button>
          <button class="wo-btn purple" id="openRunUpgradeFromShopBtn" ` +
    `data-fromcastle="${fromCastle ? '1' : '0'}" style="flex:1">Upgrades</button>
        </div>
        <div class="dealerRow" style="margin:10px 0 ` +
    `12px">${itemRows || '<div class="note">No items in this ' + 'category.</div>'}</div>
        <div class="hdr" style="margin-top:14px;font-weight:800;font-size:14px"><span>Equipped ` +
    `Items</span><span>${equippedItemCount(RUN.hero)}/${RUN.itemCap}</span></div>
        ${
          ownedRows || emptySlotRows
            ? `<div class="dealerRow" style="margin-top:8px;` +
              `justify-content:start;margin-left:0">${ownedRows}${emptySlotRows}</div>`
            : `<div class="note" style="margin-top:6px">Nothing ` + `equipped yet.</div>`
        }
      </div>
      </div>
    </div>`
  );
}

function blacksmithScreen() {
  const rows = BLACKSMITH_OPTIONS.map((opt, i) => {
    const b = findBoost(opt);
    const bonus = b ? b.bonus : 0;
    const count = b ? b.count || 0 : 0;
    const maxed = count >= SCOPE_TUNE_MAX_STACKS;
    const isPrimary = BLACKSMITH_VISIT.primary === i;
    const isSecondary = BLACKSMITH_VISIT.secondary === i;
    const primaryTaken = BLACKSMITH_VISIT.primary !== null;
    const secondaryTaken = BLACKSMITH_VISIT.secondary !== null;
    const cost = SCOPE_TUNE_COST[opt.scope];
    let btnHTML;
    if (isPrimary || isSecondary) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Upgraded ✓</button>`;
    } else if (maxed) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Maxed out</button>`;
    } else if (!primaryTaken || !secondaryTaken) {
      btnHTML =
        `<button class="wo-btn amber" data-forge="${i}" style="padding:6px 14px;` +
        `font-size:14px;font-weight:800" ${RUN.chips < cost ? 'disabled' : ''}>Upgrade</button>`;
    } else {
      btnHTML =
        `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">` +
        `Visit's extra upgrade used</button>`;
    }
    // All three upgrade options - single card, whole rank, whole suit - use the exact same card
    // shape and background so "every 7" or "every heart" reads as a card upgrade too, not a
    // smaller, differently-styled afterthought next to the one that upgrades a single card.
    const leftVisual =
      opt.scope === 'card'
        ? `<div class="card ${suitColorClass(SUITS.find((s) => s.s === opt.suit)?.color, opt.suit)}">` +
          `<div>${rankLabel(opt.rank)}</div><div style="font-size:16px">${opt.suit}</div></div>`
        : opt.scope === 'rank'
          ? `<div class="card"><div>${rankLabel(opt.rank)}</div><div style="font-size:11px;` +
            `letter-spacing:.02em">All</div></div>`
          : `<div class="card ${suitColorClass(SUITS.find((s) => s.s === opt.suit)?.color, opt.suit)}">` +
            `<div style="font-size:11px;letter-spacing:.02em">All</div><div style="font-size:16px">${opt.suit}</div></div>`;
    const badge = (amt) =>
      amt > 0
        ? `<span style="position:absolute;top:-6px;right:-6px;` +
          `background:#2fae66;color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 5px;` +
          `box-shadow:0 0 0 2px #12163a">+${amt}</span>`
        : '';
    const leftMini = `<div style="position:relative;display:inline-block">${leftVisual}${badge(bonus)}</div>`;
    const rightMini =
      `<div style="position:relative;` +
      `display:inline-block">${leftVisual}${badge(maxed ? bonus : bonus + SCOPE_TUNE_DAMAGE[opt.scope])}</div>`;
    return `<div class="shopcard">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap">
        ${leftMini}
        <span style="font-size:20px;color:var(--dim)">➔</span>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          ${btnHTML}
          ${maxed || isPrimary || isSecondary ? '' : `<span class="price" style="font-size:11px">${cost} coins</span>`}
        </div>
        <span style="font-size:20px;color:var(--dim)">➔</span>
        ${rightMini}
      </div>
    </div>`;
  }).join('');
  const equippedChecklist = [...new Set(RUN.hero.items)]
    .map((id) => {
      const item = ITEMS[id];
      if (!item) return '';
      const lvlCap = itemLevelCap(item);
      if (lvlCap <= 0) return '';
      const lvl = itemLevel(id),
        maxed = lvl >= lvlCap;
      const cost = maxed ? 0 : itemTuneCost(item, lvl);
      const before = renderStandardItemCard(item, { level: lvl });
      const after = maxed ? before : renderStandardItemCard(item, { level: lvl + 1 });
      return `<div class="shopcard holoCard">
      <div class="holoRow" style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap">
        <div>${before}</div>

          <span style="font-size:24px;color:var(--amber);line-height:1">➔</span>

              : `<button class="wo-btn amber" data-bonusup="${id}" ` +
                `style="padding:6px 14px;font-size:14px;font-weight:800" ${RUN.chips < cost ? 'disabled' : ''}>Level Up</button>`

              : ''
          }
        </div>
        <div>${after}</div>
      </div>
    </div>`;
    })
    .filter(Boolean)
    .join('');
  return (
    `<div id="blacksmith-viewport">${noticeHTML()}
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1>Tuning <em>Garage</em></h1>

        <div style="display:flex;gap:8px;margin:10px 0">
          <button class="wo-btn facilityExitBtn" id="leaveBlacksmithBtn" ` +
    `style="flex:1">${RETURN_TO_CASTLE_MENU ? 'Back to Compound' : roadExitLabel()}</button>
          <button class="wo-btn purple" id="openRunUpgradeFromBlacksmithBtn" style="flex:1">Upgrades</button>
        </div>
        <div style="font-weight:800;font-size:15px;text-align:center;margin:14px 0 8px">Card Upgrades</div>

    `auto">${equippedChecklist || '<div class="note">No items with a Bonus Level track ' + 'equipped.</div>'}</div>
      </div>
    </div></div>
  `
  );
}

        `<div class="ptag" style="margin:0">${starterLockNote(id)}</div></div>
        </div>

      );
    }
    const itemCards = (hero.starterItems || []).map(heroItemCardPreviewHTML).join('');
    const abilityCard = heroPerkCardHTML(id) + heroAbilityCardHTML(id);

      `<div class="pickrow" style="padding:10px;margin-bottom:8px">

      `style="padding:3px 14px;font-size:12px;white-space:nowrap">Choose</button></div>
        <div class="pickPortrait" data-hero="${hero.id}">${art(hero, 140)}</div>
      </div>

  }).join('');
  return `
    <div class="wo" style="max-width:800px;margin:0 auto">
      <div class="wo-stripe"></div>

        <div style="display:flex;gap:8px;margin:8px 0">
          <button class="wo-btn gray" id="starterBackBtn" style="flex:1">Back</button>
          <button class="wo-btn amber" id="starterUpgradesBtn" style="flex:1">Spend Career Points</button>

function upgradeScreen() {
  // One long list. The colour stripe and bar show which kind of upgrade it is: red = core stats, teal = resource
  // capacity, blue = situational and utility. Upgrades are in the order they unlock (see UPGRADE_DEFS,
  // unlock.points).
  const TIER_COLOR = { high: 'var(--red)', medium: 'var(--amber)', low: '#5a8fe8' };
  const cardFor = (u) => {
    const lvl = META.levels[u.id];
    const maxed = lvl >= MAX_LEVEL;
    const unlocked = upgradeUnlocked(u);
    const col = TIER_COLOR[u.tier || 'medium'];
    const cost = maxed ? 0 : upgradeCost(u, lvl);
    const refund = lvl > 0 ? upgradeCost(u, lvl - 1) : 0;
    if (!unlocked) {
      return (
        `<div class="shopcard upgRow" style="opacity:0.6;border-left:5px solid ${col}">
        <div class="hdr" style="margin:0"><span><b>${u.label}</b></span><span ` +
        `class="price">${ICON.lock || '🔒'} Locked</span></div>
        <div class="note" style="margin:2px 0 0;color:var(--red)">Unlock: ${upgradeUnlockText(u)}</div>
      </div>`
      );
    }
    return (
      `<div class="shopcard upgRow" style="border-left:5px solid ${col}">
      <div class="hdr" style="margin:0"><span><b>${u.label}</b> (Lv ${lvl}/${MAX_LEVEL})</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;` +
      `flex-wrap:wrap;margin-top:3px">
        <div class="note hoverTip" style="margin:0;font-weight:700;color:var(--ink)" ` +
      `data-title="${u.desc}">Currently: ${u.currentValue(lvl)}</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:nowrap">
          <span class="price" style="white-space:nowrap">${maxed ? 'Max' : cost + ' pts'}</span>
          ${
            lvl > 0
              ? `<button class="wo-btn gray hoverTip" data-leveldown="${u.id}" ` +
                `data-title="Refunds +${refund} points" style="padding:6px 10px;font-size:12px;white-space:nowrap">Refund</button>`
              : ''
          }
          ${
            maxed
              ? ''
              : `<button class="wo-btn amber" data-levelup="${u.id}" ` +
                `style="padding:6px 10px;font-size:12px;white-space:nowrap" ${META.points < cost ? 'disabled' : ''}>Level Up</button>`
          }
        </div>
      </div>
      <div class="upgBar"><i style="width:${(lvl / MAX_LEVEL) * 100}%;background:${col}"></i></div>
    </div>`
    );
  };
  const legend = `<div style="display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;font-size:12px;color:var(--dim)">
      <span><span class="upgDot" style="background:var(--red)"></span>Core stats</span>
      <span><span class="upgDot" style="background:var(--amber)"></span>Resource capacity</span>
      <span><span class="upgDot" style="background:#5a8fe8"></span>Situational and utility</span></div>`;
  return (
    `
    <div class="wo" style="max-width:820px;margin:16px auto">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1>Spend Your <em>Career Points</em></h1>
        <div class="wo-sub">Career Points: ${META.points} &middot; Earned in ` +
    `total: ${META.lifetimePoints} &middot; High score: ${META.highScore}</div>
        ${legend}
        <button class="wo-btn" id="upgradeContinueBtn" style="width:100%;margin-bottom:6px">Back</button>
        <div style="margin:8px 0">${UPGRADE_DEFS.map(cardFor).join('')}</div>
        <button class="wo-btn" id="upgradeContinueBtn2" style="width:100%;margin-top:12px">Back</button>
      </div>
    </div>
  `
  );
}

// ██                                                                                ██
// ██  Screens: Overdrive Bay                                                        ██
// ██  Adding uses per turn to your Items.                                           ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████

function overdriveBayScreen() {
  const holoCompareBlock = (beforeHTML, afterHTML, cost, cta) =>
    `<div class="holoRow" style="display:flex;` +
    `align-items:center;gap:12px;justify-content:center;width:100%;margin:10px 0">
      <div style="flex:0 0 auto">${beforeHTML}</div>
      <div class="holoMid" style="display:flex;flex:0 0 auto;flex-direction:column;` +
    `align-items:center;justify-content:center;gap:6px">
        <span style="font-size:26px;color:var(--amber);line-height:1">➔</span>
        ${cta}
        <span class="price" style="white-space:nowrap">${cost} coins</span>
      </div>
      <div style="flex:0 0 auto">${afterHTML}</div>
    </div>`;
  const uniqueItemIds = [...new Set(RUN.hero.items)].filter(
    (id) => ITEMS[id] && ITEMS[id].kind !== 'storage' && ITEMS[id].usesPerTurnPerLevel
  );
  const rows = uniqueItemIds
    .map((id) => {
      const item = ITEMS[id];
      const usesLvl = itemUsesLevel(id),
        usesMaxed = usesLvl >= ITEM_MAX_USES_LEVEL;
      const usesCost = usesMaxed ? 0 : itemUsesTuneCost(usesLvl);
      const usesNow = itemUsesCap(item, usesLvl);
      const before = renderStandardItemCard(item, { usesBadgeText: `${usesNow}` });
      let after = before;
      if (!usesMaxed) {
        RUN.itemUsesLevels[id] = usesLvl + 1;
        after = renderStandardItemCard(item, { usesBadgeText: `${itemUsesCap(item, usesLvl + 1)}` });
        RUN.itemUsesLevels[id] = usesLvl;
      }
      const cta = usesMaxed
        ? `<span class="note">Maxed</span>`
        : `<button class="wo-btn amber" data-usesup="${id}" ` +
          `style="padding:6px 10px;font-size:12px;` +
          `white-space:nowrap" ${RUN.chips < usesCost ? 'disabled' : ''}>+1 Use Per Turn</button>`;
      return `<div class="shopcard holoCard" style="padding:14px 16px">
      ${holoCompareBlock(before, after, usesMaxed ? '—' : usesCost, cta)}
      ${
        usesLvl > 0
          ? `<div style="text-align:center"><button class="wo-btn gray" ` +
            `data-usesdown="${id}" style="padding:6px 10px;font-size:12px">Refund</button></div>`
          : ''
      }
    </div>`;
    })
    .join('');
  return (
    `<div id="overdrive-viewport">${noticeHTML()}<div class="wo"><div class="wo-stripe">` +
    `</div><div class="wo-body">
    <h1>Overdrive <em>Bay</em></h1>${currencyBar()}
    <div style="display:flex;gap:8px;margin:10px 0">
      <button class="wo-btn facilityExitBtn" id="leaveOverdriveBtn" ` +
    `style="flex:1">${RETURN_TO_CASTLE_MENU ? 'Back to Compound' : roadExitLabel()}</button>
      <button class="wo-btn purple" id="openRunUpgradeFromOverdriveBtn" style="flex:1">Upgrades</button>
    </div>
    <div style="margin:12px 0">${rows || '<div class="note">No eligible Items equipped.</div>'}</div>
  </div></div></div>`
  );
}
