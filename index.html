/* ========== RENDER + EVENTS ========== */
let MAP_SCROLL_X = 0;
function render(html) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="game-stage">${html}</div>`;
  if (IN_BATTLE) saveBattleState();
  const mw = app.querySelector('.mapwrap');
  if (mw) { mw.scrollLeft = MAP_SCROLL_X; mw.onscroll = () => { MAP_SCROLL_X = mw.scrollLeft; }; if (RUN && mw.querySelector('.mapnode-wrap')) { requestAnimationFrame(()=>{ const row = Math.max(0,RUN.currentRow); const colW = 94; const target = Math.max(0, row*colW - mw.clientWidth*0.38); mw.scrollLeft = target; MAP_SCROLL_X = target; }); } }

  app.querySelectorAll('[data-card]').forEach(el => el.onclick = () => toggleCardSelect(+el.dataset.card));
  app.querySelectorAll('[data-assign]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-clear]') || e.target.closest('[data-unassign]') || e.target.closest('[data-ability]') || e.target.closest('[data-attack]')) return;
    assignSelectedTo(el.dataset.assign);
  });
  app.querySelectorAll('[data-unassign]').forEach(el => el.onclick = (e) => { e.stopPropagation(); const parts = el.dataset.unassign.split('|'); const idx = +parts.pop(); const slotKey = parts.join('|'); removeCardFromSlot(slotKey, idx); });
  app.querySelectorAll('[data-clear]').forEach(el => el.onclick = (e) => { e.stopPropagation(); clearSlot(el.dataset.clear); });
  app.querySelectorAll('[data-ability]').forEach(el => el.onclick = (e) => { e.stopPropagation(); useAbility(el.dataset.ability); });
  app.querySelectorAll('[data-attack]').forEach(el => {
  el.onclick = (e) => {
    e.stopPropagation();
    const match = el.dataset.attack.match(/^(.+)_(\d+)$/);
    if (!match) return;
    executePlayerAttack(match[1], Number(match[2]));
  };
});
  const forfeitRunBtn = document.getElementById('forfeitRunBtn'); if (forfeitRunBtn) forfeitRunBtn.onclick = () => { if (confirm('Forfeit this run? This will count as a loss.')) { IN_BATTLE = false; clearBattleSave(); endRun(false); } };
  const endTurnBtn = document.getElementById('endTurnBtn'); if (endTurnBtn) endTurnBtn.onclick = () => { endTurn(); };
  app.querySelectorAll('[data-detonate]').forEach(el => el.onclick = (e) => { e.stopPropagation(); detonateBurn(); });
  const sortToggleBtn = document.getElementById('sortToggleBtn'); if (sortToggleBtn) sortToggleBtn.onclick = toggleHandSort;
  const scoutBtn = document.getElementById('scoutBtn'); if (scoutBtn) scoutBtn.onclick = scoutOpponent;
  const gemDrawBtn = document.getElementById('gemDrawBtn'); if (gemDrawBtn) gemDrawBtn.onclick = drawWithGem;
  const fuelHealBtn = document.getElementById('fuelHealBtn'); if (fuelHealBtn) fuelHealBtn.onclick = () => {
    const fuelCost=FUEL_HESTORE_COST;
    const healAmount=FUEL_HEAL_AMOUNT+(BATTLE.opponent.fuelHealModifier||OPPONENT_FUEL_HEAL_MODIFIER_DEFAULT);
    if (RUN.fuel < fuelCost || RUN.health >= RUN.maxHealth) return;
    RUN.fuel -= fuelCost; RUN.health = Math.min(RUN.maxHealth, RUN.health + healAmount);
    battleLog(`Used ${FUEL_HESTORE_COST} fuel for +${healAmount} health. Health: ${RUN.health}/${RUN.maxHealth}, Fuel: ${RUN.fuel}/${RUN.maxFuel}.`);
    saveRun(); render(battleScreen());
  };
  const discardSelectedBtn = document.getElementById('discardSelectedBtn'); if (discardSelectedBtn) discardSelectedBtn.onclick = markSelectedForDiscard;
  app.querySelectorAll('[data-undiscard]').forEach(el => el.onclick = () => unmarkDiscard(+el.dataset.undiscard));

  app.querySelectorAll('[data-nodeinfo]').forEach(el => el.onclick = () => { const [r, c] = el.dataset.nodeinfo.split(':').map(Number); MAP_POPUP = { row: r, col: c }; render(mapScreen()); });
  const popupCloseBtn = document.getElementById('popupCloseBtn'); if (popupCloseBtn) popupCloseBtn.onclick = () => { MAP_POPUP = null; render(mapScreen()); };
  const popupGoBtn = document.getElementById('popupGoBtn'); if (popupGoBtn) popupGoBtn.onclick = () => { const p = MAP_POPUP; MAP_POPUP = null; if (p) selectNode(p.row, p.col); };
  const popupReenterBtn = document.getElementById('popupReenterBtn'); if (popupReenterBtn) popupReenterBtn.onclick = () => { const p = MAP_POPUP; MAP_POPUP = null; if (p) reenterCurrentNode(p.row, p.col); };

  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) continueBtn.onclick = () => {
    const won = continueBtn.parentElement.querySelector('.wo-eyebrow').textContent.includes('Won');
    if (won) { commitNode(BATTLE.row, BATTLE.col); if (BATTLE.row === ROWS) endRun(true); else render(mapScreen()); }
    else endRun(false);
  };
  const upgradeContinueBtn = document.getElementById('upgradeContinueBtn');
  const upgradeContinueBtn2 = document.getElementById('upgradeContinueBtn2');
  if (upgradeContinueBtn) upgradeContinueBtn.onclick = () => render(metaScreen());
  if (upgradeContinueBtn2) upgradeContinueBtn2.onclick = () => render(metaScreen());
  const playerNameInput = document.getElementById('playerNameInput');
  if (playerNameInput) playerNameInput.onchange = () => { META.playerName = playerNameInput.value.trim().slice(0, 18); saveMeta(); };
  const viewUpgradesBtn = document.getElementById('viewUpgradesBtn'); if (viewUpgradesBtn) viewUpgradesBtn.onclick = () => render(upgradeScreen());
  const leaveChopShopBtn = document.getElementById('leaveChopShopBtn'); if (leaveChopShopBtn) leaveChopShopBtn.onclick = () => render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
    // 1. Service Station Fuel Purchase (Dynamic 8-coin math check)
  const stationFuelBtn = document.getElementById('stationFuelBtn');
  if (stationFuelBtn) {
    stationFuelBtn.onclick = () => {
      const missingFuel = RUN.maxFuel - RUN.fuel;
      const maxAffordable = Math.floor(RUN.chips / 8);
      const purchaseLimit = Math.min(missingFuel, maxAffordable);
      const totalCost = purchaseLimit * 8;
      if (purchaseLimit > 0 && RUN.chips >= totalCost) {
        RUN.chips -= totalCost;
        RUN.fuel += purchaseLimit;
        saveRun();
        render(garageScreen(`Topped off tank: Added +${purchaseLimit} fuel for ${totalCost} coins.`));
      }
    };
  }

  // 2. Service Station Maintenance Flat Rest Button
  const restBtn = document.getElementById('restBtn'); 
  if (restBtn) {
    restBtn.onclick = () => { 
      RUN.health = Math.min(RUN.maxHealth, RUN.health + 30); 
      saveRun(); 
      render(mapScreen()); 
    };
  }

  // 3. Service Station Exit Back to Map Route
  const leaveStationBtn = document.getElementById('leaveStationBtn');
  if (leaveStationBtn) {
    leaveStationBtn.onclick = () => render(mapScreen());
  }

  // 4. Compound Inn Fuel Purchase (Dynamic 8-coin math check)
  const castleFuelBtn = document.getElementById('castleFuelBtn'); 
  if (castleFuelBtn) {
    castleFuelBtn.onclick = () => { 
      const missingFuel = RUN.maxFuel - RUN.fuel;
      const maxAffordable = Math.floor(RUN.chips / 8);
      const purchaseLimit = Math.min(missingFuel, maxAffordable);
      const totalCost = purchaseLimit * 8;
      if (purchaseLimit > 0 && RUN.chips >= totalCost) { 
        RUN.chips -= totalCost; 
        RUN.fuel += purchaseLimit; 
        saveRun(); 
        render(castleInnScreen(`Topped off tank: Added +${purchaseLimit} fuel for ${totalCost} coins.`)); 
      } 
    };
  }

  // 5. Compound Inn Sleep Button (Flat 30 HP, scaling cost)
  const castleRestBtn = document.getElementById('castleRestBtn'); 
  if (castleRestBtn) {
    castleRestBtn.onclick = () => { 
      const cost = RUN.innSleeps === 0 ? 0 : 20 * RUN.innSleeps; 
      if (RUN.chips < cost || RUN.health >= RUN.maxHealth) return; 
      RUN.chips -= cost; 
      RUN.innSleeps = (RUN.innSleeps || 0) + 1; 
      RUN.health = Math.min(RUN.maxHealth, RUN.health + 30); 
      saveRun(); 
      render(castleInnScreen(`You slept and recovered 30 health${cost ? ` for ${cost} coins` : ''}.`)); 
    };
  }

  app.querySelectorAll('[data-bonusup]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.bonusup];
    const cap = itemLevelCap(item);
    if (cap <= 0) return;
    const lvl = itemLevel(item.id);
    if (lvl >= cap) return;
    const cost = itemTuneCost(item, lvl);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    RUN.itemLevels[item.id] = lvl + 1;
    saveRun();
    render(blacksmithScreen());
  });
  app.querySelectorAll('[data-bonusdown]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.bonusdown];
    const lvl = itemLevel(item.id);
    if (lvl <= 0) return;
    const refund = itemTuneCost(item, lvl - 1);
    RUN.itemLevels[item.id] = lvl - 1;
    RUN.chips += refund;
    saveRun();
    render(blacksmithScreen());
  });
  app.querySelectorAll('[data-usesup]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.usesup];
    const lvl = itemUsesLevel(item.id);
    if (lvl >= ITEM_MAX_USES_LEVEL) return;
    const cost = itemUsesTuneCost(lvl);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    RUN.itemUsesLevels[item.id] = lvl + 1;
    saveRun();
    render(chopShopScreen());
  });
  app.querySelectorAll('[data-usesdown]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.usesdown];
    const lvl = itemUsesLevel(item.id);
    if (lvl <= 0) return;
    const refund = itemUsesTuneCost(lvl - 1);
    RUN.itemUsesLevels[item.id] = lvl - 1;
    RUN.chips += refund;
    saveRun();
    render(chopShopScreen());
  });
  app.querySelectorAll('[data-cardsup]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.cardsup];
    const lvl = itemMaxCardsLevel(item.id);
    if (lvl >= ITEM_MAX_CARDS_BONUS_CAP) return;
    const cost = itemMaxCardsTuneCost(lvl);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    RUN.itemMaxCardsLevels[item.id] = lvl + 1;
    saveRun();
    render(chopShopScreen());
  });
  app.querySelectorAll('[data-cardsdown]').forEach(el => el.onclick = () => {
    const item = ITEMS[el.dataset.cardsdown];
    const lvl = itemMaxCardsLevel(item.id);
    if (lvl <= 0) return;
    const refund = itemMaxCardsTuneCost(lvl - 1);
    RUN.itemMaxCardsLevels[item.id] = lvl - 1;
    RUN.chips += refund;
    saveRun();
    render(chopShopScreen());
  });
  app.querySelectorAll('[data-kindconvert]').forEach(el => el.onclick = () => {
    const itemId = el.dataset.kindconvert; const to = el.dataset.kindto;
    const cost = itemKindConvertCost();
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    RUN.itemKindOverride[`${itemId}_${el.dataset.itemIndex}`] = to;
    saveRun();
    render(chopShopScreen());
  });
  app.querySelectorAll('[data-kindrevert]').forEach(el => el.onclick = () => {
    const itemId = el.dataset.kindrevert;
    const key = el.dataset.itemIndex ? `${itemId}_${el.dataset.itemIndex}` : itemId;
    if (!RUN.itemKindOverride[key]) return;
    delete RUN.itemKindOverride[key];
    RUN.chips += itemKindConvertCost();
    saveRun();
    render(chopShopScreen());
  });

  app.querySelectorAll('[data-runupgrade]').forEach(el => el.onclick = () => {
    const kind = el.dataset.runupgrade;
    const def = RUN_UPGRADE_DEFS[kind];
    const n = RUN.runUpgrades[kind] || 0;
    if (n >= def.cap) return;
    if (kind === 'health' && RUN.health >= RUN.maxHealth) return;
    const cost = runUpgradeCost(kind);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    RUN.runUpgrades[kind] = n + 1;
    if (kind === 'itemSlots') RUN.itemCap = Math.min(MAX_ITEM_CAP, RUN.itemCap + 1);
    else if (kind === 'drawPerTurn') RUN.drawPerTurn += 1;
    else if (kind === 'health') RUN.health = Math.min(RUN.maxHealth, RUN.health + 25);
    saveRun();
    render(runUpgradeScreen());
  });
  const leaveRunUpgradeBtn = document.getElementById('leaveRunUpgradeBtn'); if (leaveRunUpgradeBtn) leaveRunUpgradeBtn.onclick = () => render(
    RUN_UPGRADE_RETURN === 'battle' ? battleScreen() :
    RUN_UPGRADE_RETURN === 'shop' ? shopScreen(RUN_UPGRADE_RETURN_FROMCASTLE) :
    RUN_UPGRADE_RETURN === 'blacksmith' ? blacksmithScreen() :
    RUN_UPGRADE_RETURN === 'rest' ? garageScreen() :
    mapScreen());
  const openRunUpgradeFromMapBtn = document.getElementById('openRunUpgradeFromMapBtn'); if (openRunUpgradeFromMapBtn) openRunUpgradeFromMapBtn.onclick = () => { RUN_UPGRADE_RETURN = 'map'; render(runUpgradeScreen()); };
  const openRunUpgradeFromBattleBtn = document.getElementById('openRunUpgradeFromBattleBtn'); if (openRunUpgradeFromBattleBtn) openRunUpgradeFromBattleBtn.onclick = () => { RUN_UPGRADE_RETURN = 'battle'; render(runUpgradeScreen()); };
  const openRunUpgradeFromShopBtn = document.getElementById('openRunUpgradeFromShopBtn'); if (openRunUpgradeFromShopBtn) openRunUpgradeFromShopBtn.onclick = () => { RUN_UPGRADE_RETURN = 'shop'; RUN_UPGRADE_RETURN_FROMCASTLE = openRunUpgradeFromShopBtn.dataset.fromcastle === '1'; render(runUpgradeScreen()); };
  const openRunUpgradeFromBlacksmithBtn = document.getElementById('openRunUpgradeFromBlacksmithBtn'); if (openRunUpgradeFromBlacksmithBtn) openRunUpgradeFromBlacksmithBtn.onclick = () => { RUN_UPGRADE_RETURN = 'blacksmith'; render(runUpgradeScreen()); };
  const openRunUpgradeFromRestBtn = document.getElementById('openRunUpgradeFromRestBtn'); if (openRunUpgradeFromRestBtn) openRunUpgradeFromRestBtn.onclick = () => { RUN_UPGRADE_RETURN = 'rest'; render(runUpgradeScreen()); };
  app.querySelectorAll('[data-levelup]').forEach(el => el.onclick = () => {
    const u = UPGRADE_DEFS.find(x => x.id === el.dataset.levelup);
    const lvl = META.levels[u.id];
    if (lvl >= MAX_LEVEL) return;
    const cost = upgradeCost(u, lvl);
    if (META.points < cost) return;
    META.points -= cost; META.levels[u.id]++;
    saveMeta();
    render(upgradeScreen());
  });
  app.querySelectorAll('[data-leveldown]').forEach(el => el.onclick = () => {
    const u = UPGRADE_DEFS.find(x => x.id === el.dataset.leveldown);
    const lvl = META.levels[u.id];
    if (lvl <= 0) return;
    const refund = upgradeCost(u, lvl - 1);
    META.levels[u.id]--; META.points += refund;
    saveMeta();
    render(upgradeScreen());
  });

  const castleDungeonNavBtn = document.getElementById('castleDungeonNavBtn'); if (castleDungeonNavBtn) castleDungeonNavBtn.onclick = () => render(castleDungeonScreen());
  const castleWizardNavBtn = document.getElementById('castleWizardNavBtn'); if (castleWizardNavBtn) castleWizardNavBtn.onclick = () => { if (!RUN.castleState) RUN.castleState = {}; render(castleMatchScreen()); };
  const castleBlacksmithNavBtn = document.getElementById('castleBlacksmithNavBtn'); if (castleBlacksmithNavBtn) castleBlacksmithNavBtn.onclick = () => { RETURN_TO_CASTLE_MENU = true; BLACKSMITH_OPTIONS = pickBlacksmithOptions(); BLACKSMITH_VISIT = { primary: null, secondary: null }; render(blacksmithScreen()); };
  const castleChopShopNavBtn = document.getElementById('castleChopShopNavBtn'); if (castleChopShopNavBtn) castleChopShopNavBtn.onclick = () => { RETURN_TO_CASTLE_MENU = true; render(chopShopScreen()); };
  const castleShopNavBtn = document.getElementById('castleShopNavBtn'); if (castleShopNavBtn) castleShopNavBtn.onclick = () => { RETURN_TO_CASTLE_MENU = true; render(shopScreen(true)); };
  const castleInnNavBtn = document.getElementById('castleInnNavBtn'); if (castleInnNavBtn) castleInnNavBtn.onclick = () => render(castleInnScreen());
  const backToCastleMenuBtn = document.getElementById('backToCastleMenuBtn'); if (backToCastleMenuBtn) backToCastleMenuBtn.onclick = () => render(castleMenuScreen());
  const castleBattle1Btn = document.getElementById('castleBattle1Btn'); if (castleBattle1Btn) castleBattle1Btn.onclick = () => { if (!RUN.castleState) RUN.castleState = {}; startBattle(CASTLE_FIRST, 10, 0, 1); };
  const castleBattle2Btn = document.getElementById('castleBattle2Btn'); if (castleBattle2Btn) castleBattle2Btn.onclick = () => { if (!RUN.castleState) RUN.castleState = {}; startBattle(CASTLE_SECOND, 10, 0, 2); };
  const leaveCastleBtn = document.getElementById('leaveCastleBtn'); if (leaveCastleBtn) leaveCastleBtn.onclick = () => render(mapScreen());
  const leaveMatchBtn = document.getElementById('leaveMatchBtn'); if (leaveMatchBtn) leaveMatchBtn.onclick = () => render(castleMenuScreen());
  app.querySelectorAll('[data-match]').forEach(el => el.onclick = () => {
    const i=+el.dataset.match, st=RUN.castleState;
    if (!st || st.matchGuesses<=0 || st.matchPick.includes(i) || st.matchCards[i].flipped || st.matchCards[i].matched) return;
    st.matchPick.push(i); st.matchCards[i].flipped=true;
    if (st.matchPick.length===2) {
      const [a,b]=st.matchPick;
      if (st.matchCards[a].key===st.matchCards[b].key) {
        st.matchCards[a].matched=true; st.matchCards[b].matched=true; st.matchPick=[];
        const reward=Math.random()<0.5 ? {coins:20+Math.floor(Math.random()*21),gems:1} : {coins:15,fuel:8};
        RUN.chips+=reward.coins||0; RUN.gems=Math.min(RUN.maxGems,RUN.gems+(reward.gems||0)); RUN.fuel=Math.min(RUN.maxFuel,RUN.fuel+(reward.fuel||0));
        st.matchGuesses++; saveRun();
        render(castleMatchScreen());
        setTimeout(()=>{ render(castleMenuScreen(`Match! You won ${reward.coins||0} coins${reward.gems?`, ${reward.gems} gem`:''}${reward.fuel?`, ${reward.fuel} fuel`:''}.`)); },900);
      } else {
        st.matchGuesses--;
        render(castleMatchScreen());
        setTimeout(()=>{ st.matchPick.forEach(x=>st.matchCards[x].flipped=false); st.matchPick=[]; render(st.matchGuesses>0?castleMatchScreen():castleMenuScreen('No match. The game is over for this visit.')); },900);
      }
    }
    else render(castleMatchScreen());
  });
  const leaveShopBtn = document.getElementById('leaveShopBtn'); if (leaveShopBtn) leaveShopBtn.onclick = () => render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
  const leaveBlacksmithBtn = document.getElementById('leaveBlacksmithBtn'); if (leaveBlacksmithBtn) leaveBlacksmithBtn.onclick = () => { BLACKSMITH_OPTIONS = null; BLACKSMITH_VISIT = null; render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen()); };
  const leaveTreasureBtn = document.getElementById('leaveTreasureBtn'); if (leaveTreasureBtn) leaveTreasureBtn.onclick = () => render(mapScreen());
  app.querySelectorAll('[data-forge]').forEach(el => el.onclick = () => {
    const i = +el.dataset.forge;
    const opt = BLACKSMITH_OPTIONS[i];
    const b = findBoost(opt);
    const bonus = b ? b.bonus : 0;
    if (bonus >= 9) return;
    const isSecondary = BLACKSMITH_VISIT.primary !== null;
    if (isSecondary && BLACKSMITH_VISIT.secondary !== null) return;
    const cost = tuneCost(bonus, isSecondary, opt.scope);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    boostCard(opt);
    if (!isSecondary) BLACKSMITH_VISIT.primary = i; else BLACKSMITH_VISIT.secondary = i;
    saveRun();
    render(blacksmithScreen());
  });
  app.querySelectorAll('[data-sell]').forEach(el => el.onclick = () => {
    const i = +el.dataset.sell;
    const id = RUN.hero.items[i];
    const it = ITEMS[id];
    if (!it) return;
    const modCost=(itemLevel(id)>0?itemTuneCost(it,Math.max(0,itemLevel(id)-1)):0)+(itemUsesLevel(id)>0?itemUsesTuneCost(itemUsesLevel(id)-1):0)+(itemMaxCardsLevel(id)>0?itemMaxCardsTuneCost(itemMaxCardsLevel(id)-1):0)+(RUN.itemKindOverride[`${id}_${i}`] || RUN.itemKindOverride[id]?itemKindConvertCost():0);
    const sellValue = Math.floor((it.cost+modCost)/2);
    RUN.chips += sellValue;
    RUN.hero.items.splice(i, 1);
    saveRun();
    render(shopScreen());
  });
    app.querySelectorAll('[data-buy]').forEach(el => el.onclick = () => {
    const cost = +el.dataset.cost;
    if (RUN.chips < cost || RUN.hero.items.length >= RUN.itemCap) return;
    RUN.chips -= cost;
    RUN.hero.items.push(el.dataset.buy);
    saveRun();
    render(shopScreen());
  });
  app.querySelectorAll('[data-shopfilter]').forEach(el => el.onclick = () => {
    SHOP_FILTER = el.dataset.shopfilter;
    render(shopScreen());
  });

  const backToMetaBtn = document.getElementById('backToMetaBtn'); if (backToMetaBtn) backToMetaBtn.onclick = () => render(metaScreen());
  const startRunBtn = document.getElementById('startRunBtn'); if (startRunBtn) startRunBtn.onclick = () => { clearRunSave(); render(starterSelectScreen()); };
  const continueRunBtn = document.getElementById('continueRunBtn'); if (continueRunBtn) continueRunBtn.onclick = () => { RUN = loadRunSave(); 
  RUN.maxGems=10+(META.levels.gemCap||0)*2; 
  RUN.maxFuel=20+(META.levels.fuelCap||0)*5; RUN.maxEnergy=20+(META.levels.energyCap||0)*5; 
  RUN.handSize=7+(META.levels.handCap||0)*2; 
  RUN.itemCap=Math.max(RUN.itemCap||0, Math.min(MAX_ITEM_CAP, 3+(META.levels.garage||0))); 
  RUN.runUpgrades=RUN.runUpgrades||{itemSlots:0,drawPerTurn:0,sightRange:0,gemDraw:0,health:0}; 
  RUN.drawPerTurn=2+(META.levels.draw||0)+RUN.runUpgrades.drawPerTurn; 
  RUN.gems=Math.min(RUN.maxGems,RUN.gems||0); 
  RUN.fuel=Math.min(RUN.maxFuel,RUN.fuel||0); 
  RUN.energy=Math.min(RUN.maxEnergy,RUN.energy||0); 
  RUN.itemLevels=RUN.itemLevels||{}; 
  RUN.itemUsesLevels=RUN.itemUsesLevels||{}; 
  RUN.itemKindOverride=RUN.itemKindOverride||{}; 
  Object.keys(RUN.itemKindOverride).filter(k=>!k.includes('_')).forEach(k=>{ if(RUN.hero?.items?.includes(k) && !RUN.itemKindOverride[`${k}_0`]) RUN.itemKindOverride[`${k}_0`]=RUN.itemKindOverride[k]; }); 
  RUN.itemMaxCardsLevels=RUN.itemMaxCardsLevels||{}; 
  RUN.itemUnlockProgress=RUN.itemUnlockProgress||{}; 
 RUN.itemUnlocked=RUN.itemUnlocked||{}; RUN.itemUnlockPending=RUN.itemUnlockPending||{}; 
 RUN.castleState=RUN.castleState||{}; saveRun(); const savedBattle = loadBattleSave(); if (savedBattle) { BATTLE = savedBattle; IN_BATTLE = true; render(battleScreen()); } else { render(mapScreen()); } };
  app.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => initRunWithStarter(el.dataset.pick));
}

/* ========== BOOT ========== */
(function boot() {
  const savedBattle = loadBattleSave();
  const savedRun = loadRunSave();
  if (savedBattle && savedRun) {
    RUN = savedRun;
    BATTLE = savedBattle;
    IN_BATTLE = true;
    render(battleScreen());
    return;
  }
  render(metaScreen());
})();
</script>
