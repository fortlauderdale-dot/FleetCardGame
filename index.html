      return `<div class="card mini ${suitColorClass(c.color, c.suit)}" data-unassign="${slotKey}|${cardHandIdx}"
        onmousedown="startDragSweep('slot','${slotKey}',${cardHandIdx})"
        onmouseenter="if(event.buttons===1)updateDragSweep(${cardHandIdx})"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`;
    }).join('');
    const bonusLine = itemBonusLineHTML(item, level);
    // Lightning items roll a random power multiplier (25%-100%) each time they're loaded up to
    // fire. Roll it as soon as the slot is active - not only once it's actually ready - and show
    // it in the bonus section so the player knows what they're working with before committing cards.
    let lightningRollLine = '';
    if (item.kind === 'lightning' && !frozenState) {
      const rollPct = Math.round(diffLightningRoll() * 100);
      lightningRollLine = `<div class="itemBonusLine hoverTip" style="color:var(--lightning)" data-title="Lightning uses one shared roll. Whoever fires a Lightning attack next, you or the opponent, uses this roll, then it rerolls.">⚡ Shared roll ${rollPct}% power</div>`;
    }
    const drawNPreview = item.drawUsesCardCount ? (cards.length + (item.drawBonusFlat||0) + (item.drawPerLevel||0)*level) : (item.drawAmount ? item.drawAmount + (item.drawPerLevel||0)*level : 0);
    const drawBonusLine = (item.drawAmount || item.drawUsesCardCount) ? `<div class="itemBonusLine hoverTip" data-title="Draws ${drawNPreview} card${drawNPreview===1?'':'s'} immediately after this item is used.">Draw ${drawNPreview} card${drawNPreview===1?'':'s'}</div>` : '';

    const usesBadgeText = isChargingUnlockItem ? '∞' : cap === Infinity ? '∞' : `${Math.max(0, usesLeft)}`;
    const cooldownLeft = item.cooldown != null ? (BATTLE.itemCooldowns?.[slotKey] || 0) : 0;
    const isDepletedThisTurn = !isChargingUnlockItem && cap !== Infinity && usesLeft <= 0;
    return `<div class="itemCard kind-${eKind} ${ready ? 'ready' : ''} ${cursedAmt ? 'cursed' : ''} ${burnedAmt ? 'burned' : ''} ${frozenState ? 'frozenLock' : ''} ${isDepletedThisTurn ? 'depleted-lockout' : ''}" data-assign="${slotKey}" style="border-style:dashed;border-width:2px">
      ${isDepletedThisTurn ? '' : `<div class="usesBadge hoverTip" data-title="Uses left this turn">${usesBadgeText}</div>`}
      <div class="itemCard-sec">
        <div class="hdr" style="font-weight:600">${item.name}${cursedAmt ? ` <span class="vart" style="width:12px;height:12px;font-size:12px;color:var(--purple)">${ICON.curse}</span> cursed` : ''}${burnedAmt ? ` <span class="burnBadge hoverTip" data-title="This Item is on fire. The burn grows by ${(BATTLE.itemBurnStep && BATTLE.itemBurnStep[slotKey]) || 1} each turn. If you fire it, the attack still lands, but you take ${burnedAmt} burn damage.">Burn ${burnedAmt}</span>` : ''}${hexedFlag ? ` <span class="vart" style="width:12px;height:12px;font-size:12px;color:var(--hex)">${ICON.hex}</span> hexed${hexedFlag > 1 ? ` x${hexedFlag}` : ''}` : ''}${frozenState ? ` <span class="vart" style="width:12px;height:12px;font-size:12px;color:var(--ice)">${ICON.ice}</span> frozen` : ''}</div>
        <div class="itemReqLine">${frozenState ? `<span class="hoverTip" data-title="This Item is frozen and can't fire normally. Drop any cards into it - their value counts toward thawing it out.">Frozen: ${Math.max(0, frozenState.threshold - frozenState.progress)} to thaw</span>` : itemRequirementText(item, eKind)}</div>
      </div>
      <div class="itemDivider"></div>
      <div class="itemCard-cards-sec">
        ${bonusLine}
        ${lightningRollLine}
        ${drawBonusLine}
        ${item.unlockThreshold != null ? `<div class="itemBonusLine" style="color:#f5c451;font-weight:700;text-align:center">${item.id === 'impound_release' ? 'Once charged: Draw 4 cards each turn' : 'Draw 4 cards each turn once unlocked'}</div>` : ''}
        ${hypPreviewHTML}
        <div class="vcards">${cardHTML}</div>
      </div>
      <div class="itemCard-footer">
      <div class="itemDivider"></div>
      <div class="itemCard-sec">
      ${cooldownLeft > 0 ? `<div class="note" style="margin:4px 0 0"><span class="hoverTip" data-title="This item can't be used again until its cooldown runs out.">On cooldown: ${cooldownLeft} turn${cooldownLeft > 1 ? 's' : ''} left</span></div>` : ''}
      ${(() => {
        const hasKindAmount = item.flatAmount != null || (item.baseMult ?? 1) > 0;
        const kindTag = eKind==='poison'?`<span class="effectTip poisonText" data-tip="Poison deals its damage at the end of the opponent's turn, then drops by 3 each turn until it's gone.">Poison</span>`
          :eKind==='burn'?`<span class="effectTip burnText" data-tip="Burn sets an Item on fire. The burn grows every turn, so you can detonate it right away for less or let it build. If the Item is fired while it burns, it still attacks, but its owner takes the burn damage.">Burn</span>`
          :eKind==='curse'?`<span class="effectTip curseText" data-tip="Curse goes off if this item isn't fired again before the opponent's next turn.">Curse</span>`
          :eKind==='defense'?`<span class="effectTip" style="color:var(--defense)" data-tip="Armor protects against incoming attacks, absorbing damage equal to the amount shown.">Armor</span>`
          :eKind==='hex'?`<span class="effectTip" style="color:var(--hex)" data-tip="Hex messes with card flow between you and the opponent - firing a hexed Item feeds one of its cards to whoever cast the hex.">Hex</span>`
          :eKind==='ice'?`<span class="effectTip" style="color:var(--ice)" data-tip="${item.freezeThreshold ? `Freezes one of their Items solid. It stays frozen until ${item.freezeThreshold} points of cards have been dropped into it.` : 'Freezes an Item solid so it can\'t fire until it thaws out on its own.'}">${item.freezeThreshold ? `Frozen: ${item.freezeThreshold} to thaw` : 'Freeze'}</span>`
          :eKind==='lightning'?`<span class="effectTip" style="color:var(--lightning)" data-tip="Lightning uses one shared roll between ${Math.round(LIGHTNING_MIN_ROLL * 100)}% and 100%. Whenever anyone fires a Lightning attack, that roll is used and then rerolled.">Lightning</span>`
          :'';
        const effUnlockThreshold = item.id === 'impound_release' ? Math.max(35, (item.unlockThreshold || 45) - utilityLevel('impound_release') * 5) : item.unlockThreshold;
        const unlockText = item.unlockThreshold != null ? (BATTLE.itemUnlocked && BATTLE.itemUnlocked[slotKey] ? '<span class="hoverTip" data-title="Charged for the rest of this battle - playing cards through it now draws 4, once per turn.">Charged: Draw 4/turn</span>' : `<span class="hoverTip" data-title="Locked: This card cannot trigger actions until you drop cards into it to fulfill the listed point total.">Locked</span>: ${Math.max(0, effUnlockThreshold - ((BATTLE.itemUnlockProgress && BATTLE.itemUnlockProgress[slotKey]) || 0))} to charge`) : '';
        if (frozenState) {
          const feedText = cards.length ? `<b>Feeds the ice ${cards.reduce((a,c)=>a+cardValue(c.rank),0)} points</b>` : '<b>Frozen</b> - drop cards in to thaw';
          return `<div class="note" style="margin:4px 0 0">${feedText}</div>`;
        }
        if (cards.length && ready) {
          const kindText = hasKindAmount ? `${previewCalc.breakdown} ${kindTag || '<b>Damage</b>'}` : (kindTag || '<b>Ready</b>');
          return `<div class="note" style="margin:4px 0 0">${kindText}</div>${unlockText?`<div class="note" style="margin:2px 0 0">${unlockText}</div>`:''}`;
        }
        if (cards.length && !ready) return `<div class="note" style="margin:4px 0 0">Requirement not met</div>`;
        const staticKindText = formatKindAmount(item, kindTag);
        return `<div class="note" style="margin:4px 0 0">${staticKindText}</div>${unlockText?`<div class="note" style="margin:2px 0 0">${unlockText}</div>`:''}`;
      })()}
      <div>
        <div style="margin-top:4px">
          ${ready && (usesLeft > 0 || isChargingUnlockItem || frozenState) && cooldownLeft <= 0 ? `<span class="attackChip ${eKind==='defense' ? 'defendChip' : ''}" data-attack="${slotKey}" style="font-size:10px; padding:3px 6px">${frozenState ? 'Feed Cards ▶' : item.unlockThreshold != null ? (isChargingUnlockItem ? 'Deposit Card(s) ▶' : 'Draw ▶') : eKind==='defense' ? 'Defend ▶' : (item.flatAmount==null && (item.baseMult ?? 1)===0 && (item.drawAmount || item.drawUsesCardCount)) ? 'Draw ▶' : 'Attack ▶'}</span>` : ''}
        </div>
      </div>
      </div>
      </div>
    </div>`;
  }).join('');
  const assignedIdx = new Set(Object.values(BATTLE.slots).flat());
  const handHTML = BATTLE.hand.map((c, i) => {
    if (assignedIdx.has(i) || BATTLE.turnDiscard.includes(i) || BATTLE.usedThisTurn.has(i)) return '';
    return `<div class="card ${suitColorClass(c.color, c.suit)} ${selectedIdx.includes(i) ? 'selected' : ''}" data-card="${i}"
      onmousedown="startDragSweep('hand',null,${i})"
      onmouseenter="if(event.buttons===1)updateDragSweep(${i})" style="position:relative">
    ${c.bonus ? `<div style="position:absolute;bottom:1px;right:2px;font-size:8px;color:var(--green)">+${c.bonus}</div>` : ''}
    <div>${rankLabel(c.rank)}</div><div>${c.suit}</div>
  </div>`;
  }).join('');

  return `<div id="battle-viewport">
    <div class="panel">${currencyBar(`<div style="margin-left:auto;display:flex;gap:6px">
        <button class="wo-btn purple" id="openRunUpgradeFromBattleBtn" style="padding:4px 9px;font-size:11px;white-space:nowrap;border-width:1px">Run Upgrade</button>
        <button class="wo-btn gray" id="forfeitRunBtn" style="padding:4px 9px;font-size:11px;white-space:nowrap;border-width:1px;box-shadow:none">Forfeit Run</button>
      </div>`)}</div>
    <div class="panel duelHead">
      <div class="duelSide you"><div class="artZoomTrigger" data-artzoom="you">${art(HEROES[RUN.hero?.heroId] || PLAYER_ART, 72)}</div>
        <div class="sideInfo">
          <h3 style="justify-content:flex-end"><span style="color:var(--blue)">${fleetLabel()}</span></h3>
          <div class="bar-wrap"><div class="bar-fill bar-health" style="width:${healthPct}%"></div><div class="bar-text">${RUN.health} / ${RUN.maxHealth}</div></div>
          <div class="sideRow" style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start">
              ${BATTLE.playerArmor ? `<span class="armorText hoverTip" style="font-weight:800;font-size:13px" data-title="Armor protects against incoming attacks, absorbing damage equal to the amount shown."><span class="vart" style="width:12px;height:12px;font-size:12px">${ICON.shield}</span> ${BATTLE.playerArmor} armor</span>` : ''}
              ${diffLightningChip()}
              ${(BATTLE.playerPoison||[]).length ? `<span class="status poisonStatus hoverTip" data-title="Poison hits you for ${(BATTLE.playerPoison||[]).reduce((a,n)=>a+n,0)} at the end of this turn and skips armor. It weakens by 3 after each tick.">${ICON.poison} ${(BATTLE.playerPoison||[]).reduce((a,n)=>a+n,0)}</span>` : ''}
              ${BATTLE.itemBurns && Object.keys(BATTLE.itemBurns).length ? `<span class="status burnStatus hoverTip" data-title="${Object.entries(BATTLE.itemBurns).map(([k,v])=>`${ITEMS[k.replace(/_\d+$/,'')]?.name||'Item'}: ${v}`).join(' | ')}. Fire a burning Item and the attack still lands, but you take its burn damage.">${ICON.fire} ${Object.keys(BATTLE.itemBurns).length} of your Items burning</span>` : ''}
              ${(BATTLE.playerBurns||[]).length ? `<span class="status burnStatus hoverTip" data-title="Burn hits you for ${BATTLE.playerBurns.reduce((a,x)=>a+(x.stages[x.stageIdx]||0),0)} at the end of this turn, then fades.">${ICON.fire} ${BATTLE.playerBurns.reduce((a,x)=>a+(x.stages[x.stageIdx]||0),0)}</span>` : ''}
              ${BATTLE.itemCurses && Object.keys(BATTLE.itemCurses).length ? `<span class="status curseStatus hoverTip" data-title="One or more of your Items is cursed - fire it before your turn ends or take its curse damage."><span class="vart" style="width:12px;height:12px;font-size:12px">${ICON.curse}</span> ${Object.keys(BATTLE.itemCurses).length} Item${Object.keys(BATTLE.itemCurses).length > 1 ? 's' : ''} cursed</span>` : ''}
              ${BATTLE.itemHexes && Object.keys(BATTLE.itemHexes).length ? `<span class="status hoverTip" style="color:var(--hex);font-weight:800;font-size:13px" data-title="One or more of your Items is hexed - firing it will feed a card to the opponent."><span class="vart" style="width:12px;height:12px;font-size:12px">${ICON.hex}</span> ${Object.keys(BATTLE.itemHexes).length} Item${Object.keys(BATTLE.itemHexes).length > 1 ? 's' : ''} hexed</span>` : ''}
              ${BATTLE.itemFrozen && Object.keys(BATTLE.itemFrozen).length ? `<span class="status hoverTip" style="color:var(--ice);font-weight:800;font-size:13px" data-title="One or more of your Items is frozen - drop cards into it to thaw it."><span class="vart" style="width:12px;height:12px;font-size:12px">${ICON.ice}</span> ${Object.keys(BATTLE.itemFrozen).length} Item${Object.keys(BATTLE.itemFrozen).length > 1 ? 's' : ''} frozen</span>` : ''}
            </div>
            <button class="wo-btn green" id="fuelHealBtn" data-title="Fuel also gets you across the map - spending it here means less for travel." style="padding:6px 10px;font-size:11px;white-space:nowrap" ${RUN.fuel < FUEL_HESTORE_COST || RUN.health >= RUN.maxHealth ? 'disabled' : ''}>Heal ${FUEL_HEAL_AMOUNT} = ${FUEL_HESTORE_COST} ${ICON.fuel}</button>
          </div>
        </div>
      </div>
      <div class="vsMark">vs</div>
      <div class="duelSide opp"><div class="artZoomTrigger" data-artzoom="opp">${art(opp, 72)}</div>
        <div class="sideInfo">
          <h3 style="justify-content:flex-start;gap:6px;flex-wrap:nowrap"><span style="color:var(--red)">${opp.name}</span>${opp.boss ? ` <span class="hoverTip" style="color:var(--red);font-size:13px" data-title="This is a boss fight - taking too long on a turn costs extra health, so don't sit on it.">&#9201;</span>` : ''}
          </h3>
          <div class="bar-wrap"><div class="bar-fill bar-hp" style="width:${hpPct}%"></div><div class="bar-text">${opp.hpNow} / ${opp.hp}</div></div>
          <div class="sideRow" style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            ${BATTLE.opponent.burns?.length ? `<span class="attackChip" data-detonate="1" style="background:var(--amber);color:#062622;border-color:#0d8377;font-size:10px;padding:4px 8px;white-space:nowrap">Detonate for ${BATTLE.opponent.burns.reduce((a,b)=>a+(b.stages[b.stageIdx]||0),0)} now</span>`
              : (opp.special?.type === 'drawOnHit' ? `<span class="hoverTip" style="font-size:12px;font-style:italic;color:var(--dim);font-weight:700" data-title="Every time you land a direct hit on it, it draws ${opp.special.amount || 1} card${(opp.special.amount || 1) > 1 ? 's' : ''} into its hand for its next attack.">*Draws ${opp.special.amount || 1} when hit*</span>` : '<span></span>')}
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              ${opp.armorRegen ? `<span class="hoverTip" style="color:#5a9fe0;font-weight:800;font-size:13px" data-title="Regenerates ${opp.armorRegen} armor at the start of each of its turns, with no limit.">+${opp.armorRegen} armor each turn</span>` : ''}
              ${BATTLE.opponent.armor > 0 ? `<span class="status hoverTip" style="color:#5a7fa8;font-weight:800;font-size:13px" data-title="Armor absorbs damage from your direct attacks before it reaches their health. Poison, burn, and curse damage ignore it.">${ICON.defense || '🛡️'} ${BATTLE.opponent.armor} armor</span>` : ''}
              ${(BATTLE.opponent.poisonStacks||[]).length ? `<span class="status poisonStatus hoverTip" data-title="Poison now: ${(BATTLE.opponent.poisonStacks||[]).reduce((a,n)=>a+n,0)} damage. Next turn: ${(BATTLE.opponent.poisonStacks||[]).map(n=>Math.max(0,n-3)).reduce((a,n)=>a+n,0)} damage.">${ICON.poison} ${(BATTLE.opponent.poisonStacks||[]).reduce((a,n)=>a+n,0)} poison</span>` : ''}
              ${BATTLE.opponent.burns?.length ? (() => { const burns=BATTLE.opponent.burns; const now=burns.reduce((a,b)=>a+(b.stages[b.stageIdx]||0),0); const future=[1,2].map(offset=>burns.reduce((a,b)=>a+(b.stages[b.stageIdx+offset]||0),0)).filter(n=>n>0); const nextText=future.length ? `Next: ${future.join(', ')}` : 'No more burn damage.'; return `<span class="status burnStatus hoverTip" data-title="${nextText}">${ICON.fire} ${now} <b><u>Burn Damage</u></b></span>`; })() : ''}
              ${BATTLE.opponentItemCurses && Object.keys(BATTLE.opponentItemCurses).length ? `<span class="status curseStatus hoverTip" data-title="${Object.entries(BATTLE.opponentItemCurses).map(([k,v])=>`${ITEMS[k.replace(/_\d+$/,'')]?.name||'Item'}: ${v} if not fired`).join(' | ')}">${ICON.curse} ${Object.keys(BATTLE.opponentItemCurses).length} Item${Object.keys(BATTLE.opponentItemCurses).length>1?'s':''} cursed</span>` : ''}
              ${BATTLE.opponentItemBurns && Object.keys(BATTLE.opponentItemBurns).length ? `<span class="status burnStatus hoverTip" data-title="${Object.entries(BATTLE.opponentItemBurns).map(([k,v])=>`${ITEMS[k.replace(/_\d+$/,'')]?.name||'Item'}: ${v} (+${(BATTLE.opponentItemBurnStep&&BATTLE.opponentItemBurnStep[k])||1} each turn)`).join(' | ')}">${ICON.fire} ${Object.keys(BATTLE.opponentItemBurns).length} Item${Object.keys(BATTLE.opponentItemBurns).length>1?'s':''} burned</span>` : ''}
              ${BATTLE.opponentItemHexes && Object.keys(BATTLE.opponentItemHexes).length ? `<span class="status hoverTip" style="color:var(--hex)" data-title="${Object.entries(BATTLE.opponentItemHexes).map(([k,v])=>`${ITEMS[k.replace(/_\d+$/,'')]?.name||'Item'}: steals ${v} card${v>1?'s':''} when fired`).join(' | ')}">${ICON.hex} ${Object.keys(BATTLE.opponentItemHexes).length} Item${Object.keys(BATTLE.opponentItemHexes).length>1?'s':''} hexed</span>` : ''}
              ${BATTLE.opponentItemFrozen && Object.keys(BATTLE.opponentItemFrozen).length ? `<span class="status hoverTip" style="color:var(--ice)" data-title="${Object.entries(BATTLE.opponentItemFrozen).map(([k,v])=>`${ITEMS[k.replace(/_\d+$/,'')]?.name||'Item'}: ${Math.max(0,v.threshold-v.progress)} to thaw`).join(' | ')}">${ICON.ice} ${Object.keys(BATTLE.opponentItemFrozen).length} Item${Object.keys(BATTLE.opponentItemFrozen).length>1?'s':''} frozen</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="duelBoard">
      <div class="panel">
        ${BATTLE.showTutorialBanner ? `<div class="note" style="border:1px solid var(--amber);border-radius:6px;padding:8px 10px;margin-bottom:8px;text-align:center;color:var(--amber)">Click or drag cards from your hand, then click a matching item slot below.</div>` : ''}
        <div class="handWorkspace"><div class="handCapacity hoverTip" data-title="Your Maximum Hand Size. New cards cannot be drawn past this cap.">Max ${RUN.handSize}</div><div class="hand">${handHTML}</div></div>
        ${BATTLE.turnDiscard.length ? `<div class="stagedDiscardPanel" style="margin-top:8px;padding:8px;border:1px dashed var(--dim);border-radius:8px">
          <div class="note" style="margin:0 0 6px;font-weight:700">[ Staged for Discard ]</div>
          <div class="hand">${BATTLE.turnDiscard.map(i => {
            const c = BATTLE.hand[i];
            return `<div class="card ${suitColorClass(c.color, c.suit)}" data-unstage="${i}" data-title="Click to return this card to your hand" style="cursor:pointer;opacity:0.75">
              <div>${rankLabel(c.rank)}</div><div>${c.suit}</div>
            </div>`;
          }).join('')}</div>
        </div>` : ''}
        <div class="playerActionGrid">
          <button class="wo-btn gray" id="sortToggleBtn" style="padding:6px 3px;font-size:10px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sort: ${(RUN.handSortMode || 'value') === 'value' ? 'Value' : 'Suit'}</button>
          ${(() => { const sp = VEHICLE_SPECIALS[RUN.hero.heroId]; if (!sp) return ''; const minNeed = sp.energyCost ?? sp.energyPerUnit; return `<button class="wo-btn amber hoverTip" id="vehicleSpecialBtn" style="padding:6px 3px;font-size:10px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-title="${sp.desc}" ${RUN.energy < minNeed ? 'disabled' : ''}>${sp.name} = ${minNeed} ${ICON.energy}</button>`; })()}
          <button class="wo-btn purple" id="gemDrawBtn" style="padding:6px 3px;font-size:10px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" ${(RUN.gems < 1 || BATTLE.hand.length >= RUN.handSize) ? 'disabled' : ''}>Draw = ${GEM_DRAW_COST} ${ICON.gem}</button>
          <button class="wo-btn gray" id="discardSelectedBtn" style="padding:6px 3px;font-size:10px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-title="Fold selected cards face-down instead of playing them." ${!selectedIdx.length ? 'disabled' : ''}>Discard</button>
    </div>
        
      </div>
      <div class="deckStack" style="flex-direction:column;align-items:center;gap:10px">
        <div style="display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap">
          <span class="hoverTip" style="font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim)" data-title="How many cards you draw at the start of each of your turns.">${RUN.drawPerTurn}</span>
          <div class="card back" style="position:relative"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:700;font-size:16px">${BATTLE.deck.length}</span></div>
          <span class="hoverTip" style="font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim)" data-title="How many new cards this opponent draws at the start of each of its turns.">${opp.drawRate}</span>
        </div>
        <button class="wo-btn red" id="endTurnBtn" style="padding:14px 4px;font-size:13px;font-weight:800;width:100%;max-width:82px;box-sizing:border-box;margin-top:6px" ${BATTLE.pendingTarget ? 'disabled' : ''}>End Turn</button>
      </div>
      <div class="panel">
        <div class="hand">${poolHTML}</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button class="wo-btn amber" id="scoutBtn" style="padding:8px 12px;font-size:12px" ${BATTLE.scoutedThisTurn || RUN.chips < 10 ? 'disabled' : ''}>Reveal a card = 10 ${ICON.coin}</button>
          <button class="wo-btn gray" id="oppSortBtn" style="padding:8px 12px;font-size:12px">Sort: ${oppSortMode === 'value' ? 'Value' : 'Suit'}</button>
        </div>
      </div>
    </div>
        <div class="duelMatchup">
      <div class="matchupSide playerSide">
        ${BATTLE.itemCurses && Object.keys(BATTLE.itemCurses).length ? `<div class="panel curseShield"><div class="note" style="margin:0 0 6px"><b>Active Curse Traps</b> ${Object.keys(BATTLE.itemCurses).map(k => `<span class="curseBadge">Cursed: ${BATTLE.itemCurses[k]}</span>`).join(' ')}</div></div>` : ''}
        <div class="panel">
          <div class="itemGrid">

function pickShopStock() {
  const row = Math.max(0, RUN.currentRow || 0);
  const SUIT_STASH_IDS = ['spade_bag', 'heart_bag', 'club_bag', 'diamond_bag'];
  const SUIT_INFERNO_IDS = ['spade_inferno', 'heart_inferno', 'club_inferno', 'diamond_inferno'];
  const ownedIds = new Set(RUN.hero?.items || []);
  const starterIds = new Set(RUN.starterItemIds || []);
  const pool = Object.values(ITEMS).filter(it => it.cost > 0 && (it.minRow == null || it.minRow <= row)
    && (!ownedIds.has(it.id) || starterIds.has(it.id))
    && (it.kind !== 'storage' || it.id === 'supply_bag' || SUIT_STASH_IDS.includes(it.id)));
  const defensePool = pool.filter(it => it.kind === 'defense');
  const nonDefensePool = pool.filter(it => it.kind !== 'defense');
  const picked = [];
  let suitStashUsed = false;
  let suitInfernoUsed = false;
  const tryAdd = (it) => {
    if (picked.length >= 6 || picked.includes(it)) return;
    if (SUIT_STASH_IDS.includes(it.id)) { if (suitStashUsed) return; suitStashUsed = true; }
    if (SUIT_INFERNO_IDS.includes(it.id)) { if (suitInfernoUsed) return; suitInfernoUsed = true; }
    picked.push(it);
  };
  // Guarantee at least one defense/armor card on the shelves when one is available.
  if (defensePool.length) tryAdd(shuffle([...defensePool])[0]);
  const shuffled = shuffle([...nonDefensePool]);
  for (const it of shuffled) {
    if (picked.length >= 6) break;
    tryAdd(it);
  }
  // The guaranteed defense/armor card was always pushed in first above, which made it land in
  // the same shelf slot every visit - shuffle the final picks so its position (and everything
  // else's) is randomized each time instead of feeling staged.
  return shuffle(picked);
}

function emptyItemSlotHTML(){return `<div class="dealerCardPanel panel"><div class="emptyItemSlot">Open Slot</div><div class="dealerMetaDivider"></div><div class="dealerMeta"></div></div>`;}
function shopScreen(fromCastle=false) {
  // Stock is tied to the specific node you're standing on (row:col), not just "do we have any
  // stock at all" - that way re-entering the same Dealership visit keeps the same 6 items, but
  // arriving at a genuinely different node (a new world's Fleet Compound, a different roadside
  // Dealership) always reshuffles, even via paths that don't explicitly clear RUN.shopStock
  // (like the Fleet Compound's "Visit the Dealership" button).
  const nodeKey = `${RUN.currentRow}:${RUN.currentCol}`;
  if (!RUN.shopStock || RUN.shopStockNodeKey !== nodeKey) {
    RUN.shopStock = pickShopStock().map(it => it.id);

  }
  const options = RUN.shopStock.map(id => ITEMS[id]).filter(Boolean);
  const itemRows = options.map(it => dealerItemCardHTML(it, {
    mode: 'buy',

  })).join('');
  const ownedRows = RUN.hero.items.map((id,i)=>{

    const sell=it.sellValue != null ? it.sellValue + Math.floor(modCost/2) : Math.floor((it.cost+modCost)/2);
    return dealerItemCardHTML(it, { mode: 'sell', sell, index: i });
  }).join('');
  const emptyCount = Math.max(0, RUN.itemCap - equippedItemCount(RUN.hero));
  const emptySlotRows = Array.from({ length: emptyCount }, emptyItemSlotHTML).join('');
  return `${noticeHTML()}

function blacksmithScreen() {
  const rows = BLACKSMITH_OPTIONS.map((opt, i) => {
    const b = findBoost(opt);
    const bonus = b ? b.bonus : 0;
    const count = b ? (b.count || 0) : 0;
    const maxed = count >= SCOPE_TUNE_MAX_STACKS;
    const isPrimary = BLACKSMITH_VISIT.primary === i;
    const isSecondary = BLACKSMITH_VISIT.secondary === i;
    const primaryTaken = BLACKSMITH_VISIT.primary !== null;
    const secondaryTaken = BLACKSMITH_VISIT.secondary !== null;
    const cost = SCOPE_TUNE_COST[opt.scope];
    let btnHTML;
    if (isPrimary || isSecondary) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Upgraded ✓</button>`;
    } else if (maxed) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Maxed out</button>`;
    } else if (!primaryTaken || !secondaryTaken) {
      btnHTML = `<button class="wo-btn amber" data-forge="${i}" style="padding:6px 14px;font-size:14px;font-weight:800" ${RUN.chips < cost ? 'disabled' : ''}>Upgrade</button>`;
    } else {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Visit's extra upgrade used</button>`;
    }
    // All three upgrade options - single card, whole rank, whole suit - use the exact same card
    // shape and background so "every 7" or "every heart" reads as a card upgrade too, not a
    // smaller, differently-styled afterthought next to the one that upgrades a single card.
    const leftVisual = opt.scope === 'card'
      ? `<div class="card ${suitColorClass(SUITS.find(s=>s.s===opt.suit)?.color, opt.suit)}"><div>${rankLabel(opt.rank)}</div><div style="font-size:16px">${opt.suit}</div></div>`
      : opt.scope === 'rank'
        ? `<div class="card"><div>${rankLabel(opt.rank)}</div><div style="font-size:11px;letter-spacing:.02em">All</div></div>`
        : `<div class="card ${suitColorClass(SUITS.find(s=>s.s===opt.suit)?.color, opt.suit)}"><div style="font-size:11px;letter-spacing:.02em">All</div><div style="font-size:16px">${opt.suit}</div></div>`;
    const badge = (amt) => amt > 0 ? `<span style="position:absolute;top:-6px;right:-6px;background:#2fae66;color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 5px;box-shadow:0 0 0 2px #12163a">+${amt}</span>` : '';
    const leftMini = `<div style="position:relative;display:inline-block">${leftVisual}${badge(bonus)}</div>`;
    const rightMini = `<div style="position:relative;display:inline-block">${leftVisual}${badge(maxed ? bonus : bonus + SCOPE_TUNE_DAMAGE[opt.scope])}</div>`;
    return `<div class="shopcard">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap">
        ${leftMini}
        <span style="font-size:20px;color:var(--dim)">➔</span>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          ${btnHTML}
          ${maxed || isPrimary || isSecondary ? '' : `<span class="price" style="font-size:11px">${cost} coins</span>`}
        </div>
        <span style="font-size:20px;color:var(--dim)">➔</span>
        ${rightMini}
      </div>
    </div>`;
  }).join('');
  const equippedChecklist = [...new Set(RUN.hero.items)].map(id => {
    const item = ITEMS[id]; if (!item) return '';
    const lvlCap = itemLevelCap(item);
    if (lvlCap <= 0) return '';
    const lvl = itemLevel(id), maxed = lvl >= lvlCap;
    const cost = maxed ? 0 : itemTuneCost(item, lvl);
    const before = renderStandardItemCard(item, { level: lvl });
    const after = maxed ? before : renderStandardItemCard(item, { level: lvl + 1 });
    return `<div class="shopcard">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap">
        <div>${before}</div>
        <span style="font-size:20px;color:var(--dim)">➔</span>

          ${maxed ? `<span class="wo-btn gray" style="padding:8px 12px;font-size:13px;opacity:0.7">Maxed</span>` : `<button class="wo-btn amber" data-bonusup="${id}" style="padding:6px 14px;font-size:14px;font-weight:800" ${RUN.chips < cost ? 'disabled' : ''}>Level Up</button>`}
          ${maxed ? '' : `<span class="price" style="font-size:11px">${cost} coins</span>`}
          ${lvl > 0 ? `<button class="wo-btn gray" data-bonusdown="${id}" style="padding:3px 8px;font-size:10px;margin-top:2px">Refund</button>` : ''}

// The image goes at /Transitions/world-<fromWorld>-complete.jpg (e.g. Transitions/world-1-complete.jpg
// for the A1A Coastline screen, Transitions/world-2-complete.jpg for Alligator Alley, and so on -

function upgradeScreen() {
  // One long list. The colour stripe and bar show which kind of upgrade it is: red = core stats, teal = resource capacity, blue = situational and utility.
  // Upgrades are in the order they unlock (see UPGRADE_DEFS, unlock.points).
  const TIER_COLOR = { high: 'var(--red)', medium: 'var(--amber)', low: '#5a8fe8' };
  const cardFor = u => {
    const lvl = META.levels[u.id];
    const maxed = lvl >= MAX_LEVEL;
    const unlocked = upgradeUnlocked(u);
    const col = TIER_COLOR[u.tier || 'medium'];
    const cost = maxed ? 0 : upgradeCost(u, lvl);
    const refund = lvl > 0 ? upgradeCost(u, lvl - 1) : 0;
    if (!unlocked) {
      return `<div class="shopcard upgRow" style="opacity:0.6;border-left:5px solid ${col}">
        <div class="hdr" style="margin:0"><span><b>${u.label}</b></span><span class="price">${ICON.lock || '🔒'} Locked</span></div>
        <div class="note" style="margin:2px 0 0;color:var(--red)">Unlock: ${upgradeUnlockText(u)}</div>
      </div>`;
    }
    return `<div class="shopcard upgRow" style="border-left:5px solid ${col}">
      <div class="hdr" style="margin:0"><span><b>${u.label}</b> (Lv ${lvl}/${MAX_LEVEL})</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px">
        <div class="note hoverTip" style="margin:0;font-weight:700;color:var(--ink)" data-title="${u.desc}">Currently: ${u.currentValue(lvl)}</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:nowrap">
          <span class="price" style="white-space:nowrap">${maxed ? 'Max' : cost + ' pts'}</span>
          ${lvl > 0 ? `<button class="wo-btn gray hoverTip" data-leveldown="${u.id}" data-title="Refunds +${refund} points" style="padding:6px 10px;font-size:12px;white-space:nowrap">Refund</button>` : ''}
          ${maxed ? '' : `<button class="wo-btn amber" data-levelup="${u.id}" style="padding:6px 10px;font-size:12px;white-space:nowrap" ${META.points < cost ? 'disabled' : ''}>Level Up</button>`}
        </div>
      </div>
      <div class="upgBar"><i style="width:${(lvl / MAX_LEVEL) * 100}%;background:${col}"></i></div>
    </div>`;
  };
  const legend = `<div style="display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;font-size:12px;color:var(--dim)">
      <span><span class="upgDot" style="background:var(--red)"></span>Core stats</span>
      <span><span class="upgDot" style="background:var(--amber)"></span>Resource capacity</span>
      <span><span class="upgDot" style="background:#5a8fe8"></span>Situational and utility</span></div>`;
  return `
    <div class="wo" style="max-width:820px;margin:16px auto">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1>Spend Your <em>Career Points</em></h1>
        <div class="wo-sub">Career Points: ${META.points} &middot; Earned in total: ${META.lifetimePoints} &middot; High score: ${META.highScore}</div>
        ${legend}
        <button class="wo-btn" id="upgradeContinueBtn" style="width:100%;margin-bottom:6px">Back</button>
        <div style="margin:8px 0">${UPGRADE_DEFS.map(cardFor).join('')}</div>
        <button class="wo-btn" id="upgradeContinueBtn2" style="width:100%;margin-top:12px">Back</button>
      </div>
    </div>
  `;
}

function overdriveBayScreen() {
  const holoCompareBlock = (beforeHTML, afterHTML, cost, cta) => `<div style="display:flex;align-items:center;gap:12px;justify-content:center;width:100%;margin:10px 0">
      <div style="flex:0 0 auto">${beforeHTML}</div>
      <div style="display:flex;flex:0 0 auto;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <span style="font-size:26px;color:var(--amber);line-height:1">➔</span>
        ${cta}
        <span class="price" style="white-space:nowrap">${cost} coins</span>
      </div>
      <div style="flex:0 0 auto">${afterHTML}</div>
    </div>`;
  const uniqueItemIds = [...new Set(RUN.hero.items)].filter(id => ITEMS[id] && ITEMS[id].kind !== 'storage' && ITEMS[id].usesPerTurnPerLevel);
  const rows = uniqueItemIds.map(id => {
    const item = ITEMS[id];
    const usesLvl = itemUsesLevel(id), usesMaxed = usesLvl >= ITEM_MAX_USES_LEVEL;
    const usesCost = usesMaxed ? 0 : itemUsesTuneCost(usesLvl);
    const usesNow = itemUsesCap(item, usesLvl);
    const before = renderStandardItemCard(item, { usesBadgeText: `${usesNow}` });
    let after = before;
    if (!usesMaxed) {
      RUN.itemUsesLevels[id] = usesLvl + 1;
      after = renderStandardItemCard(item, { usesBadgeText: `${itemUsesCap(item, usesLvl + 1)}` });
      RUN.itemUsesLevels[id] = usesLvl;
    }
    const cta = usesMaxed ? `<span class="note">Maxed</span>` : `<button class="wo-btn amber" data-usesup="${id}" style="padding:6px 10px;font-size:12px;white-space:nowrap" ${RUN.chips < usesCost ? 'disabled' : ''}>+1 Use Per Turn</button>`;
    return `<div class="shopcard" style="padding:14px 16px">
      ${holoCompareBlock(before, after, usesMaxed ? '—' : usesCost, cta)}
      ${usesLvl > 0 ? `<div style="text-align:center"><button class="wo-btn gray" data-usesdown="${id}" style="padding:6px 10px;font-size:12px">Refund</button></div>` : ''}
    </div>`;
  }).join('');
  return `<div id="overdrive-viewport">${noticeHTML()}<div class="wo"><div class="wo-stripe"></div><div class="wo-body">
    <h1>Overdrive <em>Bay</em></h1>${currencyBar()}
    <div style="display:flex;gap:8px;margin:10px 0">
      <button class="wo-btn facilityExitBtn" id="leaveOverdriveBtn" style="flex:1">${RETURN_TO_CASTLE_MENU ? 'Back to Compound' : roadExitLabel()}</button>
      <button class="wo-btn purple" id="openRunUpgradeFromOverdriveBtn" style="flex:1">Upgrades</button>
    </div>
    <div style="margin:12px 0">${rows || '<div class="note">No eligible Items equipped.</div>'}</div>
  </div></div></div>`;
}

function chopShopScreen(returnTo) {
  const rows = RUN.hero.items.map((itemId,index)=>{
    const item=ITEMS[itemId]; if(!item) return '';
    if (item.kind === 'storage') return '';
    const instanceKey=`${itemId}_${index}`; const current=RUN.itemKindOverride[instanceKey] || RUN.itemKindOverride[itemId];
    const alreadyModified=!!current;
    const original = renderStandardItemCard(item, {});
    const convertCost = itemKindConvertCost();

    let convertBlockHTML;
    if (alreadyModified) {
      convertBlockHTML = `<div class="note" style="text-align:center;width:100%">Already modified to <b>${current}</b>. No further modification this run.</div>`;
    } else {
      const previewCols = ['poison','burn','curse'].map(k => {
        const previewCard = renderStandardItemCard(item, { kindOverride: k });
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto">
          ${previewCard}
          <button class="wo-btn ${k==='poison'?'green':k==='burn'?'red':'purple'}" data-kindconvert="${itemId}" data-item-index="${index}" data-kindto="${k}" style="padding:6px 10px;font-size:11px" ${RUN.chips<convertCost?'disabled':''}>Convert to ${k[0].toUpperCase()+k.slice(1)}</button>
          <span class="price" style="font-size:13px">${convertCost} coins</span>
        </div>`;
      }).join('');
      convertBlockHTML = `<div style="display:flex;gap:8px;flex-wrap:nowrap">${previewCols}</div>`;
    }

    return `<div class="shopcard">
      <div style="display:flex;align-items:flex-start;gap:12px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;padding-bottom:4px">
        ${original}
        <span style="font-size:20px;color:var(--dim);flex:0 0 auto;align-self:center">➔</span>
        ${convertBlockHTML}
      </div>
    </div>`;
  }).join('');
  const utilityRows = RUN.hero.items.map((id,i) => {
    if (id === 'drawstone') {
      const l = utilityLevel(id), cost = l >= 3 ? 0 : Math.round(60 * Math.pow(2, l));
      return `<div class="shopcard"><b>Drawstone Requirement Upgrade</b><div class="note">Current: ${Math.max(4, 7 - l)}. Upgrade lowers the requirement by 1, down to 4.</div><button class="wo-btn purple" data-utilityup="drawstone" ${l >= 3 || RUN.chips < cost ? 'disabled' : ''}>${l >= 3 ? 'Maxed' : 'Lower Requirement (' + cost + ' coins)'}</button></div>`;
    }
    if (id === 'impound_release') {
      const l = utilityLevel(id), cost = l >= 2 ? 0 : Math.round(75 * Math.pow(2, l));
      return `<div class="shopcard"><b>Impound Release Charge Upgrade</b><div class="note">Current: ${Math.max(35, 45 - l * 5)}. Upgrade lowers the threshold by 5, down to 35.</div><button class="wo-btn purple" data-utilityup="impound_release" ${l >= 2 || RUN.chips < cost ? 'disabled' : ''}>${l >= 2 ? 'Maxed' : 'Lower Charge Threshold (' + cost + ' coins)'}</button></div>`;
    }
    return '';
  }).join('');
  return `<div id="chopshop-viewport">${noticeHTML()}<div class="wo"><div class="wo-stripe"></div><div class="wo-body">
    <h1>Chop <em>Shop</em></h1>${currencyBar()}
    <div style="display:flex;gap:8px;margin:10px 0">
      <button class="wo-btn facilityExitBtn" id="leaveChopShopBtn" style="flex:1">${RETURN_TO_CASTLE_MENU?'Back to Compound':roadExitLabel()}</button>
      <button class="wo-btn purple" id="openRunUpgradeFromChopShopBtn" style="flex:1">Upgrades</button>
    </div>
    <div class="note" style="margin:10px 0">Convert an item to poison, burn, or curse.</div>
    <div style="margin:12px 0">${rows || '<div class="note">No Items available.</div>'}${utilityRows}</div>
  </div></div></div>`;
}

// Stop Details' picture sits to the right of the stats+item-card column (sdLeftCol) and is meant to
// fill exactly that column's height, not the picture's own natural aspect ratio - CSS alone can't
// express "match this sibling's rendered height" reliably here, so this measures sdLeftCol directly
// after every render() and sets the picture's height inline to match. Called on every render since
// only a small fraction of screens have a .stopArtRow at all, so the querySelectorAll is cheap when
// there's nothing to do.
function syncStopArtHeights(root) {
  root.querySelectorAll('.stopArtRow').forEach(row => {
    const leftCol = row.querySelector(':scope > .sdLeftCol');
    const art = row.querySelector(':scope > .stopArtBig');
    if (!leftCol || !art) return;
    const set = () => { const h = leftCol.getBoundingClientRect().height; if (h > 0) art.style.height = h + 'px'; };
    set();
    requestAnimationFrame(set); // catch layout that settles a frame late (e.g. web-font swap)
  });
}
function render(html) {

// Shared by the Run Dashboard (mid-run) and the Run Ended summary, so both show the same

function runUpgradeRows() {

  addRow('Cards Drawn Per Turn', RUN.drawPerTurn, [`Run Upgrades: ${r.drawPerTurn || 0}`, `Career Point Upgrades: ${META.levels.draw || 0}`]);
  addRow('Maximum Hand Size', RUN.handSize, [`Career Point Upgrades: ${META.levels.handCap || 0}`]);
  addRow('Gem Draw', `${1 + (META.levels.gem || 0) + (r.gemDraw || 0)} cards/gem`, [`Run Upgrades: ${r.gemDraw || 0}`, `Career Point Upgrades: ${META.levels.gem || 0}`]);
  Object.entries(RUN.itemLevels || {}).forEach(([id, l]) => l && addRow(ITEMS[id]?.name || id, `Tune Lv ${l}`));
  Object.entries(RUN.itemUsesLevels || {}).forEach(([id, l]) => l && addRow(ITEMS[id]?.name || id, `Uses Lv ${l}`, [`${itemUsesCap(ITEMS[id], l)} uses/turn`]));
  Object.entries(RUN.itemMaxCardsLevels || {}).forEach(([id, l]) => l && addRow(ITEMS[id]?.name || id, `Capacity Lv ${l}`, [`${effectiveMaxCards(ITEMS[id])} cards`]));
  Object.entries(RUN.itemUtilityLevels || {}).forEach(([id, l]) => l && addRow(ITEMS[id]?.name || id, `Utility Lv ${l}`, [id === 'drawstone' ? `Requirement ${Math.max(4, 7 - l)}` : `Threshold ${Math.max(35, 45 - l * 5)}`]));
  Object.entries(RUN.itemKindOverride || {}).forEach(([id, k]) => k && addRow(ITEMS[itemIdFromKey(id)]?.name || id, k));

// A single number for "how many upgrades did I pick up this run" - every Run Upgrade purchase
// and every point of item Tune/Uses/Capacity/Utility level counts as one, plus one per Item
// converted at the Chop Shop. Career Point (permanent, cross-run) upgrades aren't counted here
// since those aren't something this run "obtained."
function runUpgradeCount() {
  const r = RUN.runUpgrades || {};
  const sumLevels = obj => Object.values(obj || {}).reduce((a, l) => a + (l || 0), 0);
  return (r.itemSlots || 0) + (r.drawPerTurn || 0) + (r.gemDraw || 0) + (r.sightRange || 0) + (r.health || 0)
    + sumLevels(RUN.itemLevels) + sumLevels(RUN.itemUsesLevels) + sumLevels(RUN.itemMaxCardsLevels) + sumLevels(RUN.itemUtilityLevels)
    + Object.values(RUN.itemKindOverride || {}).filter(Boolean).length;
}

(function(){
  const tip=document.createElement('div');tip.className='jsFloatTip';document.body.appendChild(tip);
  document.body.classList.add('jsTooltipActive');
  const INTERACTIVE_SEL='.attackChip[data-title],.attackChip[data-tip],#vehicleSpecialBtn[data-title],#vehicleSpecialBtn[data-tip]';
  const STATIC_SEL='.effectTip[data-tip],.hoverTip[data-title],[data-title]';
  let activeEl=null;
  function place(el){
    const r=el.getBoundingClientRect();
    tip.style.display='block';
    const tw=tip.offsetWidth||230, th=tip.offsetHeight||40;
    let left=r.left+r.width/2-tw/2; left=Math.max(6,Math.min(left,window.innerWidth-tw-6));
    let top=r.bottom+6; if(top+th>window.innerHeight-6) top=r.top-th-6;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
  function showTip(el){
    const text=el.getAttribute('data-tip')||el.getAttribute('data-title');
    if(!text)return;
    tip.textContent=text;
    place(el);
  }
  function hideTip(){ tip.style.display='none'; activeEl=null; }
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest(INTERACTIVE_SEL);
    if(!el)return;
    showTip(el);
  });
  document.addEventListener('mouseout',e=>{
    const el=e.target.closest(INTERACTIVE_SEL);
    if(!el)return;
    hideTip();
  });
  document.addEventListener('click',e=>{
    if(e.target.closest(INTERACTIVE_SEL))return;
    const el=e.target.closest(STATIC_SEL);
    // A button's own click handler often re-renders the screen (replacing #app's contents)
    // before this bubbles up here, which leaves `el` detached from the document. A detached
    // element's getBoundingClientRect() is all zeros, which is what was throwing this tooltip
    // into the top-left corner - bail out instead of positioning against a stale node.
    if(!el || !el.isConnected){ hideTip(); return; }
    if(activeEl===el){ hideTip(); return; }
    activeEl=el;
    showTip(el);
    e.stopPropagation();
  });
  document.addEventListener('scroll',()=>{hideTip();},true);
})();
