// ██  Screens: Chop Shop                                                            ██
// ██  Converting Items and adding card slots.                                       ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████

function chopShopScreen(returnTo) {
  const rows = RUN.hero.items
    .map((itemId, index) => {
      const item = ITEMS[itemId];
      if (!item) return '';
      if (item.kind === 'storage') return '';
      const instanceKey = `${itemId}_${index}`;
      const current = RUN.itemKindOverride[instanceKey] || RUN.itemKindOverride[itemId];
      const alreadyModified = !!current;
      const original = renderStandardItemCard(item, {});
      const convertCost = itemKindConvertCost();

      // One row per conversion, same shape as the Overdrive Bay and Tuning Garage: original card, an arrow above
      // the button with the coin price under it, then the converted card. Two cards per row so it fits a phone.
      let convertBlockHTML;
      if (alreadyModified) {
        convertBlockHTML =
          `<div class="note" style="text-align:center;width:100%">Already ` +
          `modified to <b>${current}</b>. No further modification this run.</div>`;
      } else {
        convertBlockHTML = ['poison', 'burn', 'curse']
          .map((k) => {
            const previewCard = renderStandardItemCard(item, { kindOverride: k });
            return (
              `<div class="holoRow" style="display:flex;align-items:center;` +
              `justify-content:center;gap:12px;margin:8px 0">
          <div style="flex:0 0 auto">${original}</div>
          <div class="holoMid" style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto">
            <span style="font-size:24px;color:var(--amber);line-height:1">➔</span>
            <button class="wo-btn ${k === 'poison' ? 'green' : k === 'burn' ? 'red' : 'purple'}" ` +
              `data-kindconvert="${itemId}" data-item-index="${index}" data-kindto="${k}" style="padding:6px ` +
              `10px;font-size:12px" ${RUN.chips < convertCost ? 'disabled' : ''}>Convert to ${k[0].toUpperCase() + k.slice(1)}</button>
            <span class="price" style="font-size:12px;white-space:nowrap">${convertCost} coins</span>
          </div>
          <div style="flex:0 0 auto">${previewCard}</div>
        </div>`
            );
          })
          .join('');
      }

      return `<div class="shopcard holoCard">${convertBlockHTML}</div>`;
    })
    .join('');
  const utilityRows = RUN.hero.items
    .map((id, i) => {
      if (id === 'drawstone') {
        const l = utilityLevel(id),
          cost = l >= 3 ? 0 : Math.round(60 * Math.pow(2, l));
        return (
          `<div class="shopcard"><b>Drawstone Requirement Upgrade</b><div class="note">` +
          `Current: ${Math.max(4, 7 - l)}. Upgrade lowers the requirement by 1, down to 4.</div><button ` +
          `class="wo-btn purple" ` +
          `data-utilityup="drawstone" ${l >= 3 || RUN.chips < cost ? 'disabled' : ''}>${l >= 3 ? 'Maxed' : 'Lower Requirement (' + cost + ' coins)'}</button>` +
          `</div>`
        );
      }
      if (id === 'impound_release') {
        const l = utilityLevel(id),
          cost = l >= 2 ? 0 : Math.round(75 * Math.pow(2, l));
        return (
          `<div class="shopcard"><b>Impound Release Charge Upgrade</b><div class="note">` +
          `Current: ${Math.max(35, 45 - l * 5)}. Upgrade lowers the threshold by 5, down to 35.</div>` +
          `<button class="wo-btn purple" ` +
          `data-utilityup="impound_release" ${l >= 2 || RUN.chips < cost ? 'disabled' : ''}>${
            l >= 2 ? 'Maxed' : 'Lower Charge Threshold ' + '(' + cost + ' coins)'
          }</button>` +
          `</div>`
        );
      }
      return '';
    })
    .join('');
  return (
    `<div id="chopshop-viewport">${noticeHTML()}<div class="wo"><div class="wo-stripe">` +
    `</div><div class="wo-body">
    <h1>Chop <em>Shop</em></h1>${currencyBar()}
    <div style="display:flex;gap:8px;margin:10px 0">
      <button class="wo-btn facilityExitBtn" id="leaveChopShopBtn" ` +
    `style="flex:1">${RETURN_TO_CASTLE_MENU ? 'Back to Compound' : roadExitLabel()}</button>
      <button class="wo-btn purple" id="openRunUpgradeFromChopShopBtn" style="flex:1">Upgrades</button>
    </div>
    <div class="note" style="margin:10px 0">Convert an item to poison, burn, or curse.</div>
    <div style="margin:12px 0">${rows || '<div class="note">No Items available.</div>'}${utilityRows}</div>
  </div></div></div>`
  );
}

function updateLogHTML() {
  return `
    <div class="wo" style="margin-top:14px">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <details open>
          <summary class="hdr" style="cursor:pointer;list-style:none"><span>Update Log</span><span></span></summary>
          ${UPDATE_LOG.slice()
            .reverse()
            .map(
              (entry, i) => `
            <details ${i === 0 ? 'open' : ''} style="margin-top:10px">
              <summary class="note" style="font-weight:800;color:var(--ink);cursor:pointer">${entry.date}</summary>
              ${[
                ...UPDATE_LOG_CATEGORY_ORDER,
                ...Object.keys(entry.categories).filter((c) => !UPDATE_LOG_CATEGORY_ORDER.includes(c)),
              ]
                .filter((cat) => entry.categories[cat] && entry.categories[cat].length)
                .map(
                  (cat) =>
                    `
                <div style="margin-top:8px">
                  <div class="note" style="font-weight:700;color:var(--amber);font-size:12px;` +
                    `letter-spacing:0.03em">${cat}</div>
                  <ul style="margin:3px 0 0 18px;padding:0">
                    ${entry.categories[cat].map((n) => `<li class="note" style="margin:2px 0">${n}</li>`).join('')}
                  </ul>
                </div>
              `
                )
                .join('')}
            </details>
          `
            )
            .join('')}
        </details>
      </div>
    </div>
  `;
}

// Stop Details' picture sits to the right of the stats+item-card column (sdLeftCol) and is meant to
// fill exactly that column's height, not the picture's own natural aspect ratio - CSS alone can't
// express "match this sibling's rendered height" reliably here, so this measures sdLeftCol directly
// after every render() and sets the picture's height inline to match. Called on every render since
// only a small fraction of screens have a .stopArtRow at all, so the querySelectorAll is cheap when
// there's nothing to do.
// Auto-fit art: every opponent, vehicle and node picture is a transparent PNG with its own amount of empty margin
// (and a few are portrait instead of landscape). Instead of cropping with "cover", each picture is shown whole
// ("contain"), then its visible subject is measured once from the alpha channel and scaled up and centered so it
// fills its box without any part of it leaving the box. Round map badges use a circle instead of a rectangle. If
// the browser blocks reading pixels (opening the file straight from disk), pictures just stay fully visible at the
// plain contain size. Hand-tuned vehicle picker portraits are left alone.
const ART_BOUNDS_CACHE = new Map();
function artSubjectBounds(img) {
  const key = img.currentSrc || img.src;
  if (ART_BOUNDS_CACHE.has(key)) return ART_BOUNDS_CACHE.get(key);
  let b = null;
  try {
    const iw = img.naturalWidth,
      ih = img.naturalHeight;
    if (iw && ih) {
      const sc = 96 / Math.max(iw, ih);
      const cw = Math.max(1, Math.round(iw * sc)),
        ch = Math.max(1, Math.round(ih * sc));
      const cv = document.createElement('canvas');
      cv.width = cw;
      cv.height = ch;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(img, 0, 0, cw, ch);
      const d = cx.getImageData(0, 0, cw, ch).data;
      let x0 = cw,
        y0 = ch,
        x1 = -1,
        y1 = -1;
      for (let y = 0; y < ch; y++)
        for (let x = 0; x < cw; x++) {
          if (d[(y * cw + x) * 4 + 3] > 24) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      if (x1 >= x0 && y1 >= y0)
        b = {
          l: Math.max(0, x0 - 1) / cw,
          t: Math.max(0, y0 - 1) / ch,
          r: Math.min(cw, x1 + 2) / cw,
          b: Math.min(ch, y1 + 2) / ch,
        };
    }
  } catch (e) {
    b = null;
  }
  ART_BOUNDS_CACHE.set(key, b);
  return b;
}
function fitArtImg(img) {
  if (!img || !img.naturalWidth || img.closest('.pickPortrait')) return;
  const W = img.clientWidth,
    H = img.clientHeight;
  if (W < 36 || H < 36) return;
  const b = artSubjectBounds(img);
  if (!b) return;
  const iw = img.naturalWidth,
    ih = img.naturalHeight;
  const sc = Math.min(W / iw, H / ih);
  const offX = (W - iw * sc) / 2,
    offY = (H - ih * sc) / 2;
  const sx0 = offX + b.l * iw * sc,
    sx1 = offX + b.r * iw * sc,
    sy0 = offY + b.t * ih * sc,
    sy1 = offY + b.b * ih * sc;
  const sw = sx1 - sx0,
    sh = sy1 - sy0;
  if (sw < 2 || sh < 2) return;
  const node = img.closest('.mapnode');
  let k;
  if (node) {
    const R = Math.min(node.clientWidth, node.clientHeight) / 2 - 3;
    const kHyp = (R * 0.96) / (0.5 * Math.hypot(sw, sh));
    const kSide = (R * 2 * 0.98) / Math.max(sw, sh);
    // fill the circle edge to edge; only the empty corners of the subject's box get clipped
    k = Math.min(3.2, Math.max(0.5, Math.min(kSide, kHyp * 1.28)));
  } else {
    k = Math.min(2.4, Math.max(1, Math.min((0.97 * W) / sw, (0.97 * H) / sh)));
  }
  const tx = -k * ((sx0 + sx1) / 2 - W / 2),
    ty = -k * ((sy0 + sy1) / 2 - H / 2);
  img.style.transformOrigin = '50% 50%';
  img.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${k.toFixed(3)})`;
}
function fitAllArt(root) {
  (root || document).querySelectorAll('.vart > img').forEach((img) => {
    if (img.complete && img.naturalWidth) fitArtImg(img);
    else if (!img.__fitHooked) {
      img.__fitHooked = true;

}

function syncStopArtHeights(root) {

    const leftCol = row.querySelector(':scope > .sdLeftCol');
    const art = row.querySelector(':scope > .stopArtBig');

      if (h > 0) art.style.height = h + 'px';

  Object.entries(RUN.itemUtilityLevels || {}).forEach(

// A single number for "how many upgrades did I pick up this run" - every Run Upgrade purchase
// and every point of item Tune/Uses/Capacity/Utility level counts as one, plus one per Item
// converted at the Chop Shop. Career Point (permanent, cross-run) upgrades aren't counted here
// since those aren't something this run "obtained."
function runUpgradeCount() {
  const r = RUN.runUpgrades || {};
  const sumLevels = (obj) => Object.values(obj || {}).reduce((a, l) => a + (l || 0), 0);
  return (
    (r.itemSlots || 0) +
    (r.drawPerTurn || 0) +
    (r.gemDraw || 0) +
    (r.sightRange || 0) +
    (r.health || 0) +
    sumLevels(RUN.itemLevels) +
    sumLevels(RUN.itemUsesLevels) +
    sumLevels(RUN.itemMaxCardsLevels) +
    sumLevels(RUN.itemUtilityLevels) +
    Object.values(RUN.itemKindOverride || {}).filter(Boolean).length
  );
}

  const targetBox = document.getElementById('combat-training-flow-card');
  if (targetBox) targetBox.remove();
  document.querySelectorAll('.combat-spotlight-focus').forEach((el) => el.classList.remove('combat-spotlight-focus'));
  if (typeof IN_BATTLE === 'undefined' || !IN_BATTLE) {
    window.__combatTrainingStep = null;
    return;
  }
  // The walkthrough follows what is actually on the table, so it stays correct if the player changes their mind:
  // step 1 = pick the two 9s, step 2 = drop them into Fender Bender, step 3 = press Attack, step 4 = End Turn.
  const nineIdx = BATTLE.hand.map((c, i) => (c.rank === 9 ? i : -1)).filter((i) => i >= 0);
  const ninesSelected = nineIdx.length >= 2 && nineIdx.every((i) => selectedIdx.includes(i));
  const slotHasCards = Object.values(BATTLE.slots || {}).some((a) => a && a.length);
  if (step === 1 && (ninesSelected || slotHasCards)) step = slotHasCards ? 3 : 2;
  else if (step === 2 && slotHasCards) step = 3;
  else if (step === 2 && !ninesSelected) step = 1;
  else if (step === 3 && !slotHasCards) step = ninesSelected ? 2 : 1;
  window.__combatTrainingStep = step;
  const tutorialBox = document.createElement('div');
  tutorialBox.id = 'combat-training-flow-card';
  tutorialBox.className = 'combat-training-box';
  const fenderCard =
    document.querySelector('.itemCard[data-assign^="fender_bender"]') ||
    document.querySelector('.playerSide .itemGrid');
  if (step === 1) {
    const targetHand = document.querySelector('.handWorkspace');
    if (targetHand) {
      targetHand.classList.add('combat-spotlight-focus');
      const rect = targetHand.getBoundingClientRect();
      tutorialBox.style.left = Math.max(8, rect.left + rect.width / 2 - 140) + 'px';
      tutorialBox.style.top = rect.bottom + 20 + 'px';
      tutorialBox.innerHTML =
        `<div class="wo-eyebrow">Step 1 of 4</div><h3>Using Your ` +
        `Cards</h3><p>Tap cards in your hand, then click any matching item slot to load them in. Start ` +
        `by tapping the two 9s.</p>`;
      document.body.appendChild(tutorialBox);
    } else {
      window.renderCombatTrainingStep(2);
    }
  } else if (step === 2) {
    if (fenderCard) {
      fenderCard.classList.add('combat-spotlight-focus');
      const rect = fenderCard.getBoundingClientRect();
      tutorialBox.style.left = Math.max(8, rect.left + rect.width / 2 - 140) + 'px';
      tutorialBox.style.top = rect.top - 190 + 'px';
      if (rect.top - 190 < 60) tutorialBox.style.top = rect.bottom + 16 + 'px';
      tutorialBox.innerHTML =
        `<div class="wo-eyebrow">Step 2 of 4</div><h3>Your Item Cards</h3>` +
        `<p>These dashed panels are your equipped item cards. Each one shows the exact hand you need to ` +
        `fire it. Fender Bender likes a Pair, so click it to drop your two 9s into place.</p>`;
      document.body.appendChild(tutorialBox);
    } else {
      window.renderCombatTrainingStep(3);
    }
  } else if (step === 3) {
    const firstAttackChip = document.querySelector('.attackChip');
    const targetPanel = (firstAttackChip && firstAttackChip.closest('.itemCard')) || fenderCard;
    if (targetPanel) {
      targetPanel.classList.add('combat-spotlight-focus');
      const rect = targetPanel.getBoundingClientRect();
      tutorialBox.style.left = rect.right + 24 + 'px';
      tutorialBox.style.top = rect.top - 10 + 'px';
      if (rect.right + 300 > window.innerWidth) tutorialBox.style.left = Math.max(8, rect.left - 304) + 'px';
      tutorialBox.innerHTML =
        `<div class="wo-eyebrow">Step 3 of 4</div><h3>Firing an Item</h3>` +
        `<p>Once the cards you've loaded satisfy an item's requirement, its Attack button lights up. ` +
        `Click it to fire that item.</p>`;
      document.body.appendChild(tutorialBox);
    } else {
      window.renderCombatTrainingStep(4);
    }
  } else if (step === 4) {
    const endTurnBtn = document.getElementById('endTurnBtn');
    if (endTurnBtn) {
      endTurnBtn.classList.add('combat-spotlight-focus');
      const rect = endTurnBtn.getBoundingClientRect();
      tutorialBox.style.left = Math.max(8, rect.left + rect.width / 2 - 140) + 'px';
      tutorialBox.style.top = rect.bottom + 24 + 'px';
      tutorialBox.innerHTML =
        `<div class="wo-eyebrow">Step 4 of 4</div><h3>Ending Your ` +
        `Turn</h3><p>When you can't fire any more of your item cards, or just want to save what's left ` +
        `for next turn, click End Turn.</p>`;
      document.body.appendChild(tutorialBox);
    } else {
      window.__combatTrainingStep = null;
    }
  }
};
window.finishCombatTraining = function () {
  const box = document.getElementById('combat-training-flow-card');
  if (box) box.remove();
  document.querySelectorAll('.combat-spotlight-focus').forEach((el) => el.classList.remove('combat-spotlight-focus'));
  window.__combatTrainingStep = null;
};
(function boot() {
  const savedBattle = loadBattleSave();
  const savedRun = loadRunSave();
  if (savedBattle && savedRun) {
    RUN = savedRun;
    BATTLE = savedBattle;
    IN_BATTLE = true;
    render(battleScreen());
    return;
  }
  render(metaScreen());
})();
</script>
</body>
</html>
