<html lang="en">
<head>

<title>Fleet Duel</title>

<style>

  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:16px}
  button{font-family:var(--disp);cursor:pointer}
  #app{max-width:1180px;margin:0 auto;padding:14px 18px 100px}
  .game-stage{}

  .treasure-modal .wo{max-width:560px;width:100%;margin:0}
  .map-popup-overlay{position:fixed;inset:0;background:#12163acc;display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:14px;padding-top:90px}
  .map-popup-overlay .wo{max-width:400px;width:100%;margin:0}
  .treasure-prize{font-size:28px;font-weight:800;color:var(--blue-dark);text-align:center;margin:16px 0}

  .wo{background:var(--white);color:var(--ink);border:3px solid var(--blue);border-radius:12px;box-shadow:6px 6px 0 var(--blue-dark);padding:0;margin:16px 0;overflow:hidden}
  .wo-stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 16px,var(--blue) 16px 32px)}
  .wo-body{padding:20px 22px 24px}
  .wo-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .wo h1{margin:6px 0 2px;font-size:clamp(24px,5.5vw,34px);line-height:1.05;font-weight:700;color:var(--blue-dark)}
  .wo h1 em{font-style:normal;color:var(--amber)}
  .wo-sub{font-family:var(--mono);font-size:13px;color:var(--dim);margin:8px 0 14px}
  .wo-btn{padding:12px 18px;font-size:15px;font-weight:700;letter-spacing:.01em;
    background:var(--blue);color:#fff;border:3px solid var(--blue-dark);border-radius:8px;box-shadow:3px 3px 0 var(--blue-dark)}
  .wo-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--blue-dark)}
  .wo-btn.amber{background:var(--amber);border-color:#c97600}
  .wo-btn.gray{background:#8a90ab;border-color:#5c6280}
  .wo-btn.purple{background:var(--purple);border-color:#5c2ea0}
  .wo-btn.green{background:var(--green);border-color:#1f7a48}
  .wo-btn:disabled{opacity:.4;cursor:default}
  .wo-btn.half{width:48%}

  .panel{background:var(--white);border:2px solid var(--blue-light);border-radius:10px;padding:14px;margin-bottom:12px}
  .hdr{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;
    letter-spacing:.02em;color:var(--dim);margin-bottom:8px}
  .bar-wrap{height:14px;background:var(--blue-light);border-radius:7px;overflow:hidden;border:1px solid var(--blue-light)}
  .bar-fill{height:100%;transition:width .25s}
  .bar-hp{background:var(--red)} .bar-health{background:var(--blue)}

  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .currencies{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11.5px}
  .cur{border:1px solid var(--blue-light);border-radius:6px;padding:4px 8px}
  .cur.gem{color:var(--purple);border-color:var(--purple);background:#f5effd} .cur.fuel{color:var(--green);border-color:var(--green);background:#eef9ee} .cur.energy{color:#8a6d00;border-color:var(--gold);background:#fff9df} .cur.chip{color:#a35f00;border-color:var(--amber);background:#fff4e0} .cur.pts{color:var(--blue-dark);border-color:var(--blue-dark);background:var(--blue-light)} .cur.health{color:var(--red);border-color:var(--red);background:#fdecec}
  .cur{position:relative;cursor:help}.cur[title]:hover::after,.hoverTip[title]:hover::after{content:attr(title);position:absolute;z-index:50;left:50%;transform:translateX(-50%);top:calc(100% + 6px);width:max-content;max-width:220px;background:#12163a;color:#fff;padding:7px 9px;border-radius:6px;font:12px var(--disp);white-space:normal;box-shadow:3px 3px 0 #173aa8;text-align:left}.bossPreview{border:2px solid var(--red);background:#fff7f7}.mapboss{font-size:12px;font-family:var(--mono);color:var(--dim);margin-top:8px}
  .hoverTip{position:relative;cursor:help;text-decoration:underline dotted;text-underline-offset:2px}
  .upgradeNum{color:var(--amber)}

  .duelHead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .duelSide{display:flex;align-items:center;gap:8px}
  .duelSide .sideInfo{flex:1;min-width:0}
  .duelSide h3{margin:0 0 4px;font-size:18px;color:var(--blue-dark);height:22px;display:flex;align-items:center;overflow:visible;position:relative}
  .duelSide .rewardRow{position:absolute;right:0;top:0;transform:translateY(-1px)}
  .duelSide.opp{flex-direction:row-reverse;text-align:right}
  .duelSide .bar-wrap{height:10px}
  .rewardRow{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
  .rewardRow .cur{font-size:9px;padding:2px 5px;white-space:nowrap}
  .vsMark{font-family:var(--mono);font-weight:800;color:var(--dim);font-size:13px}
  .bigicon{font-size:30px;line-height:1}

  .duelBoard{display:grid;grid-template-columns:1fr 100px 1fr;gap:8px;align-items:start}
  @media (max-width:700px){ .duelBoard{grid-template-columns:1fr} .duelHead{grid-template-columns:1fr 1fr} .vsMark{display:none} }
  .deckStack{text-align:center;padding-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px}.deckStack .card.back{cursor:default;pointer-events:none}
  .deckStack .card.back::after{content:none}
  .wo-btn.red{background:var(--red);border-color:#a83236}

  .duelMatchup {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}
.matchupSide {
  min-width: 0;
}
.playerSide {
  border-left: 4px solid var(--blue);
}
.opponentSide {
  border-right: 4px solid var(--red);
}
@media (max-width: 800px) {
  .duelMatchup {
    grid-template-columns: 1fr;
  }
}
  .vslot{border:2px dashed var(--blue-light);border-radius:8px;padding:10px;width:160px;background:var(--bg);cursor:pointer}
  .vslot.filled{border-style:solid;border-color:var(--amber)}
  .vslot.ready{border-color:var(--green)}
  .vslot.defense{border-color:#4a7fd8}
  .vslot.poison{border-color:#5a8a3a}
  .vslot .vname{font-weight:700;font-size:15px;color:var(--blue-dark)}
  .vslot .vreq{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:3px 0}
  .vslot .vcards{display:flex;gap:3px;flex-wrap:wrap;min-height:30px;margin-top:6px}

  .itemGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .itemCard{border-radius:8px;padding:6px 4px;background:var(--bg);min-height:172px;display:flex;flex-direction:column;align-items:center;text-align:center;box-sizing:border-box;font-size:12px;position:relative}
  .usesBadge{position:absolute;top:4px;right:4px;font-size:9px;font-weight:800;background:var(--blue-light);color:var(--blue-dark);border-radius:5px;padding:1px 5px;line-height:1.4}
  .usesBadge.depleted{background:#eee;color:var(--dim)}
  .itemCard.ready{border-color:var(--green) !important}
  .itemCard .hdr{width:100%;justify-content:center;text-align:center}
  .itemCard .vcards{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:26px;margin-top:4px}
  .itemReqLine{font-size:12px;font-weight:700;color:var(--ink);margin:4px 0 2px;line-height:1.25}
  .itemBonusLine{font-size:10.5px;color:var(--purple);margin:1px 0 0;line-height:1.25}
  .itemBonusLine b{font-weight:800;cursor:help;position:relative}

  .card{width:48px;height:64px;border-radius:5px;background:var(--white);color:var(--ink);display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;
    font-size:17px;border:2px solid var(--blue);cursor:pointer;user-select:none;flex-shrink:0;gap:1px}
  .card div:last-child{font-size:23px;line-height:1}
  .card.red{color:var(--red)}
  .card.selected{outline:3px solid var(--amber);transform:translateY(-6px)}
  .card.matched{outline:3px solid var(--green)}
  .card.cursed{outline:2px solid var(--purple)}
  .card.mini{width:37px;height:52px;font-size:14px;cursor:pointer;gap:0}
  .card.mini div:last-child{font-size:18px !important;line-height:1}
  .card.back{background:var(--blue);color:transparent;position:relative}
  .card.back::after{content:'?';color:var(--white);position:absolute;font-size:16px}
  .card.back.mini::after{font-size:12px}

  .hand{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
  .note{color:var(--dim);font-size:12px;margin:6px 0;font-family:var(--mono)}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--blue-light);font-family:var(--mono);font-size:12.5px}
  .kv b{color:var(--blue-dark)}
  .price{color:var(--amber);font-weight:700}
  .log{font-family:var(--mono);font-size:11.5px;color:var(--dim);max-height:110px;overflow-y:auto;
    border-top:1px dashed var(--blue-light);padding-top:8px;margin-top:8px}
  .log div{padding:2px 0}

  .mapwrap{position:relative;margin:0 auto;overflow-x:auto;overflow-y:visible;background:linear-gradient(180deg,#dfead7,#edf4e8);border:2px solid #c8d8bf;border-radius:12px;padding:10px}.mapnode-wrap{position:absolute;transform:translate(-50%,-50%)}
  .mapnode-wrap{position:absolute;transform:translate(-50%,-50%)}
  .mapnode-wrap:hover .tooltip{display:block}.mapnode-wrap .tooltip{top:120%;bottom:auto}
  .tooltip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-family:var(--mono);font-size:10.5px;line-height:1.5;
    padding:7px 10px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:2px 3px 6px #0004;text-align:left}
  .mapnode{position:relative;width:40px;height:40px;border-radius:50%;
    font-size:19px;display:flex;align-items:center;justify-content:center;border:2px solid;background:var(--white)}
  .mapnode.future{background:var(--blue-light);border-color:var(--blue-light);color:#9aa1c4;cursor:default;opacity:.85}
  .mapnode.farfuture{background:var(--blue-light);border-color:var(--blue-light);color:#c3cae8;cursor:default;opacity:.5}
  .mapnode.avail{background:var(--white);border-color:var(--amber);box-shadow:0 0 0 5px #ff9f1c33;cursor:pointer}
  .mapnode.done{background:var(--green);border-color:var(--green);color:#fff;cursor:default}
  .mapnode.current{background:var(--blue);border-color:var(--blue-dark);color:#fff;cursor:default;box-shadow:0 0 0 5px #2451e055;animation:herePulse 1.4s ease-in-out infinite}
  @keyframes herePulse{0%,100%{box-shadow:0 0 0 4px #2451e055}50%{box-shadow:0 0 0 9px #2451e022}}
  .hereTag{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;
    background:var(--blue-dark);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;
    padding:2px 6px;border-radius:4px;pointer-events:none}
  .hereTag::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--blue-dark)}

  .shopcard{border:1px solid var(--blue-light);background:var(--bg);border-radius:6px;padding:10px;margin-bottom:8px}
  .shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .shopGrid .shopcard{margin-bottom:0}
  @media (max-width:600px){.shopGrid{grid-template-columns:1fr}}
  .pickcard{border:2px solid var(--blue-light);background:var(--bg);border-radius:10px;padding:16px;width:160px;text-align:center}
  .pickcard .picon{font-size:46px;display:flex;align-items:center;justify-content:center}
  .pname{font-weight:700;font-size:17px;letter-spacing:.01em;color:var(--blue-dark)}
  .pickcard .ptag{font-family:var(--mono);font-size:11px;color:var(--dim);margin:4px 0 10px}
  .pickcard.locked{opacity:.55}
  .pickcard.locked .picon{filter:grayscale(1)}
  .levelbar{height:8px;background:var(--blue-light);border-radius:4px;overflow:hidden;margin:6px 0}
  .levelbar i{display:block;height:100%;background:var(--gold)}

  .ic{width:1em;height:1em;vertical-align:-0.15em;display:inline-block}
  .vart{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1;flex-shrink:0}
  .vart img{width:100%;height:100%;object-fit:contain;display:block}
  .fleetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:700px){ .fleetgrid{grid-template-columns:1fr} }
  .vslot[draggable]{transition:box-shadow .12s,border-color .12s}
  .vslot.dragover{box-shadow:0 0 0 3px var(--amber);border-color:var(--amber)}
  .card[draggable]{cursor:grab}
  .card.dragging{opacity:.4}
  .attackChip{display:inline-block;margin-top:6px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;
    background:var(--green);color:#fff;border-radius:6px;cursor:pointer;border:2px solid #1e8a4f}
  .attackChip:active{transform:translate(1px,1px)}
  .resourceRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
  .resourceAction{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;min-height:68px}
  .resourceCount{font-size:12px;font-weight:800;letter-spacing:.03em}
  .resourceAction.gemAction{border-color:#5c2ea0}
  .resourceAction.fuelAction{border-color:#1f7a48}
  .itemDivider{border-top:1px solid rgba(20,20,40,0.15);margin:5px 0 4px;width:100%}
  .itemCard.kind-poison{background:#eef9ee;border-color:#8fbd8f !important}
  .itemCard.kind-burn{background:#fff0ed;border-color:#e5a39a !important}
  .itemCard.kind-curse{background:#f5effd;border-color:#b89add !important}
  .itemCard.kind-defense{background:var(--defense-light);border-color:var(--defense-border) !important}
  .itemCard.kind-defense .hdr{color:var(--defense) !important}
  .defenseText,.armorText{color:var(--defense) !important}
  .defenseText{font-weight:800}
  .attackChip.defendChip{background:var(--defense);border-color:#075e57}
  .itemCard.kind-damage{background:#fff8ec;border-color:#e8c07a !important}
  .effectTip{font-weight:800;text-decoration:underline dotted;cursor:help;position:relative}
  .effectTip:hover::after{content:attr(data-tip);position:absolute;z-index:60;left:50%;transform:translateX(-50%);top:calc(100% + 5px);width:230px;background:#12163a;color:#fff;padding:8px;border-radius:6px;font:11px var(--disp);text-align:left;box-shadow:3px 3px 0 #173aa8}
  .log{font-family:var(--mono);font-size:11.5px;color:var(--dim);height:240px;max-height:240px;overflow-y:auto;
    border-top:1px dashed var(--blue-light);padding:8px 6px;margin-top:8px}
  .log div{padding:4px 0;border-bottom:1px solid #edf0f8}
  .status{font-weight:800}.poisonText{color:#3f8f4f}.burnText{color:#c53d2f}.curseText{color:#7a45b5}.poisonStatus{color:#3f8f4f}.burnStatus{color:#c53d2f}.curseStatus{color:#7a45b5}
  .club-card{color:#0b6b3a !important;border:3px solid #16834a !important;background:#e8f7ee;box-shadow:inset 0 0 0 1px #8bd0a8}
  .mapnode.type-battle{background:#fff1f1;border-color:#e5484d;color:#a52328}
  .mapnode.type-shop{background:#fff9df;border-color:#e1b400}
  .mapnode.type-treasure{background:#effbf1;border-color:#4cae68}
  .mapnode.type-rest{background:#fff9df;border-color:#d5b24a}
  .mapnode.type-blacksmith,.mapnode.type-chopshop{background:#fff8e9;border-color:#d99a30}
  .mapnode.type-castle{background:#f2edff;border-color:#8a4fe0}
  @media (max-width:700px){.resourceRow{grid-template-columns:1fr}}
  .castleMenu{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .castleBtn{display:block;width:100%;text-align:center;padding:16px;font-family:var(--disp);font-size:16px;font-weight:700;color:#4a2f14;
    background:linear-gradient(180deg,#ecd6ab,#d8b077);border:2px solid #8a5a2b;border-radius:8px;box-shadow:0 3px 0 #6b431d}
  .castleBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b431d}
  .castleBtn:disabled{opacity:.5;cursor:default}
</style>

<body>
<div id="app"></div>
<script>
/* ========== CARD MODEL ========== */
const SUITS = [{ s: '♦', color: 'red' }, { s: '♣', color: 'blk' }, { s: '♥', color: 'red' }, { s: '♠', color: 'blk' }];
const RANK_LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
function rankLabel(r) { return RANK_LABEL[r] || String(r); }
function cardValue(r) { if (r === 14) return 11; if (r >= 11) return 10; return r; }
function freshDeck() {
  const d = [];
  for (const su of SUITS) for (let r = 2; r <= 14; r++) d.push({ rank: r, suit: su.s, color: su.color, revealed: false });
  return d;
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* ========== HAND EVALUATION ========== */
const TIERS = ['High Card', 'Pair', 'Two Pair', 'Three of a Kind', 'Straight', 'Flush', 'Full House', 'Four of a Kind', 'Straight Flush'];
const TIER_MULT = [1.0, 1.5, 1.7, 2.0, 2.5, 2.8, 3.2, 4.0, 5.0];
function evaluateHand(cards) {
  if (!cards.length) return { tier: 0, label: 'No Cards', mult: 0 };
  const ranks = cards.map(c => c.rank);
  const rankCounts = {}; for (const r of ranks) rankCounts[r] = (rankCounts[r] || 0) + 1;
  const counts = Object.values(rankCounts).sort((a, b) => b - a);
  const suitSet = new Set(cards.map(c => c.suit));
  const isFlush = cards.length >= 3 && suitSet.size === 1;
  const uniqueRanks = [...new Set(ranks)].sort((a, b) => a - b);
  const isStraight = cards.length >= 3 && uniqueRanks.length === cards.length && (uniqueRanks[uniqueRanks.length - 1] - uniqueRanks[0] === cards.length - 1);
  let tier = 0;
  if (counts[0] === 4) tier = 7;
  else if (cards.length === 5 && counts[0] === 3 && counts[1] === 2) tier = 6;
  else if (isFlush && isStraight) tier = 8;
  else if (isFlush) tier = 5;
  else if (isStraight) tier = 4;
  else if (counts[0] === 3) tier = 3;
  else if (counts[0] === 2 && counts[1] === 2) tier = 2;
  else if (counts[0] === 2) tier = 1;
  else tier = 0;
  return { tier, label: TIERS[tier], mult: TIER_MULT[tier] };
}
function combinations(arr, k) {
  const results = [];
  function helper(start, combo) { if (combo.length === k) { results.push(combo.slice()); return; } for (let i = start; i < arr.length; i++) { combo.push(arr[i]); helper(i + 1, combo); combo.pop(); } }
  helper(0, []); return results;
}
const OPPONENT_USES_PER_TURN_DEFAULT = 1; // how many times an opponent attacks per turn, unless opp.usesPerTurn overrides it
function opponentMaxCards(opp) { return opp.maxCards ?? (opp.minTier === 0 ? 1 : 5); } // "Any 1 card" opponents are capped at exactly 1 unless given a wider maxCards
function bestHandFromPool(pool, maxCards) {
  if (!pool.length) return { cards: [], tier: -1, label: 'Nothing', mult: 0 };
  const cap = Math.min(maxCards, pool.length);
  if (pool.length <= cap) { const ev = evaluateHand(pool); return { cards: pool, ...ev }; }
  let best = null;
  for (const combo of combinations(pool, cap)) {
    const ev = evaluateHand(combo);
    const rankSum = combo.reduce((a, c) => a + c.rank, 0);
    if (!best || ev.tier > best.tier || (ev.tier === best.tier && rankSum > best.rankSum)) best = { cards: combo, ...ev, rankSum };
  }
  return best;
}
function bestFiveFromPool(pool) { return bestHandFromPool(pool, 5); } // kept for anything still calling the old name
function damageFor(cards, mult) { return Math.round(cards.reduce((a, c) => a + cardValue(c.rank) + (c.bonus || 0), 0) * mult); }
function isConsecutive(cards) {
  if (cards.length < 2) return false;
  const ranks = [...new Set(cards.map(c => c.rank))].sort((a, b) => a - b);
  if (ranks.length !== cards.length) return false;
  return ranks[ranks.length - 1] - ranks[0] === cards.length - 1;
}
function straightMult(len) { return 1 + (len - 2) * 0.45; }

/* ========== ICON SYSTEM (no emoji) ========== */

/* ========== CONDITION ENGINE ==========
   Every Item's `condition` is checked through this ONE function. Add a new condition
   type here once and every Item (present or future) can use it — nothing else needs
   to change. `cards` is whatever was actually played into that Item's slot.
   Returns { met, label, sum, count } — sum/count feed items that scale with them. */
function checkCondition(cond, cards) {
  let result;
  if (!cond || cond.type === 'any') result = { met: cards.length > 0, label: '' };
  else if (cond.type === 'exactCount') result = { met: cards.length === cond.count, label: `Exactly ${cond.count} card${cond.count === 1 ? '' : 's'}` };
  else if (cond.type === 'pokerTier') {
    const ev = evaluateHand(cards);
    result = { met: ev.tier >= cond.tier, label: ev.label, mult: ev.mult };
  }
  else if (cond.type === 'straightLen') {
    const ok = cards.length === cond.len && isConsecutive(cards);
    result = { met: ok, label: `${cond.len}-Card Straight` };
  }
  else if (cond.type === 'suitCount') {
    const n = cards.filter(c => c.suit === cond.suit).length;
    result = { met: n >= cond.count, label: `${n} of ${cond.suit}`, count: n };
  }
  else if (cond.type === 'colorCount') {
    const n = cards.filter(c => c.color === cond.color).length;
    result = { met: n >= cond.count, label: `${n} ${cond.color === 'red' ? 'Red' : 'Black'}`, count: n };
  }
  else if (cond.type === 'allSuits') {
    const suits = new Set(cards.map(c => c.suit));
    result = { met: suits.size === 4, label: 'One of Each Suit' };
  }
  else if (cond.type === 'cardIn') {
    const hit = cards.find(c => cond.cards.some(cc => cc.rank === c.rank && cc.suit === c.suit));
    result = { met: !!hit, label: hit ? `${rankLabel(hit.rank)}${hit.suit}` : '' };
  }
  else if (cond.type === 'parity') {
    const isEven = c => c.rank % 2 === 0;
    const matchFn = cond.parity === 'even' ? isEven : (c => !isEven(c));
    const n = cards.filter(matchFn).length;
    if (cond.mode === 'all') result = { met: cards.length > 0 && n === cards.length, label: `All ${cond.parity}`, count: n };
    else result = { met: n >= cond.count, label: `${n} ${cond.parity}`, count: n };
  }
  else if (cond.type === 'exactRank') {
    const n = cards.filter(c => c.rank === cond.rank).length;
    if (cond.requireAll) result = { met: cards.length > 0 && n === cards.length, label: `All ${rankLabel(cond.rank)}s`, count: n };
    else result = { met: n > 0, label: `Has a ${rankLabel(cond.rank)}`, count: n };
  }
  else if (cond.type === 'sumThreshold') {
    const sum = cards.reduce((a, c) => a + cardValue(c.rank) + (c.bonus || 0), 0);
    result = { met: cards.length > 0 && sum >= cond.min, label: `Σ${sum}`, sum };
  }
  else if (cond.type === 'sumExact') {
    const sum = cards.reduce((a, c) => a + cardValue(c.rank) + (c.bonus || 0), 0);
    result = { met: cards.length > 0 && sum === cond.value, label: `Σ${sum}`, sum };
  }
  else result = { met: false, label: '' };
  // exactCount can ride along on ANY condition type above (e.g. "flush AND exactly 5 cards") —
  // set it on the condition object alongside its normal fields to AND it into the result.
  if (cond && cond.exactCount != null) result.met = result.met && cards.length === cond.exactCount;
  return result;
}

// (see META.itemLevels — permanent, tuned via the Upgrades screen). Items with `flatAmount` ignore card value entirely (used for
// threshold-style poison: "any hand summing to X+ does exactly Y", not a multiplier).
function describeCondition(cond) {
  if (!cond || cond.type === 'any') return 'Any cards';
  if (cond.type === 'exactCount') return `exactly ${cond.count} cards`;
  if (cond.type === 'pokerTier') return cond.tier === 0 ? 'Any card' : TIERS[cond.tier];
  if (cond.type === 'straightLen') return `a ${cond.len}-card straight`;
  if (cond.type === 'suitCount') return `${cond.count}+ ${cond.suit}`;
  if (cond.type === 'colorCount') return `${cond.count}+ ${cond.color === 'red' ? 'Red' : 'Black'} cards`;
  if (cond.type === 'allSuits') return 'one of each suit';
  if (cond.type === 'cardIn') return cond.cards.map(c => `${rankLabel(c.rank)}${c.suit}`).join(' or ');
  if (cond.type === 'parity') return cond.mode === 'all' ? `all ${cond.parity}` : `${cond.count}+ ${cond.parity} cards`;
  if (cond.type === 'exactRank') return cond.requireAll ? `all ${rankLabel(cond.rank)}s` : `a ${rankLabel(cond.rank)}`;
  if (cond.type === 'sumThreshold') return `Σ${cond.min}+`;
  if (cond.type === 'sumExact') return `Σ = ${cond.value} exactly`;

};
const STARTERS = ['sidebyside', 'admin', 'interstate', 'convoy', 'comingsoon1', 'comingsoon2'];
// Short, hand-written attack/bonus text for the Pick Your Vehicle screen — one entry per
// starter item currently in use. Add an entry here whenever a new starter item is introduced.
const UPGRADE_AT_ITEM_MASTERY = 'Can be upgraded at the Tuning Garage (Item Upgrades) for the rest of that run.';
const STARTER_ITEM_DISPLAY = {
  fender_bender: { req: 'Up to 2 cards', bonusPre: '', bonusNum: '+50%', bonusPost: ' bonus if Pair', upgradeNote: UPGRADE_AT_ITEM_MASTERY },
  pair_draw:     { req: 'Pair', bonusPre: 'Draw ', bonusNum: '2', bonusPost: ' cards immediately', upgradeNote: null },
  escort_wall:   { req: 'Pair', bonus: 'Blocks damage equal to Σ of cards played (Defense)' },
  moto_escort:   { req: '4-card Straight', bonus: 'Damage scales with the straight' },
  card_draw:     { req: 'Pair', bonusPre: 'Draw ', bonusNum: '2', bonusPost: ' additional cards (no damage)', upgradeNote: UPGRADE_AT_ITEM_MASTERY },
  triple_threat: { req: 'Three of a Kind', bonusPre: '', bonusNum: '+100%', bonusPost: ' damage', upgradeNote: UPGRADE_AT_ITEM_MASTERY },
};
function heroAttacksHTML(hero) {
  return (hero.starterItems || []).map(iid => {
    const item = ITEMS[iid];
    const d = STARTER_ITEM_DISPLAY[iid];
    if (!item || !d) return '';
    const numHTML = d.bonusNum ? (d.upgradeNote ? `<b class="hoverTip" title="${d.upgradeNote}">${d.bonusNum}</b>` : `<b>${d.bonusNum}</b>`) : '';
    const bonusHTML = d.bonusNum ? `${d.bonusPre || ''}${numHTML}${d.bonusPost || ''}` : (d.bonus || '');
    return `<div style="margin:6px 0"><b>${item.name}</b><div class="note" style="margin:2px 0 0">${d.req}</div><div class="note" style="margin:2px 0 0">${bonusHTML}</div></div>`;
  }).join('');
}
function isStarterUnlocked(id) {
  if (id === 'sidebyside' || id === 'admin') return true;
  if (id === 'interstate') return META.lifetimePoints >= 150;
  if (id === 'convoy') return META.bestRun >= ROWS + 1;
  return false;
}
function starterLockNote(id) {
  if (id === 'interstate') return `Unlocks at 150 lifetime Career Points (${Math.min(META.lifetimePoints, 150)}/150)`;
  if (id === 'convoy') return `Unlocks after clearing a full route`;
  if (id === 'comingsoon1' || id === 'comingsoon2') return `Coming soon`;
  return '';
}

/* ========== MONSTER REPURPOSING SCALER ==========
   Pass an existing monster object from World 1 along with a world difficulty modifier 
   (e.g., 1.5 for World 2, 2.2 for World 3). Automatically rescales stats seamlessly. */
function scaleMonsterForNewWorld(baseMonster, worldMultiplier) {
  const scaled = JSON.parse(JSON.stringify(baseMonster)); // Deep copy the blueprint
  
  scaled.hp = Math.round(scaled.hp * worldMultiplier);
  scaled.name = `${scaled.name} (Sector ${Math.ceil(worldMultiplier)})`;
  
  if (scaled.lockAttack) scaled.lockAttack = Math.round(scaled.lockAttack * worldMultiplier);
  if (scaled.lockThreshold) scaled.lockThreshold = Math.round(scaled.lockThreshold * (1 + (worldMultiplier - 1) * 0.4));

  if (scaled.attacks) {
    scaled.attacks.forEach(a => {
      if (a.autoFire) a.autoFire.damage = Math.round(a.autoFire.damage * worldMultiplier);
      if (a.sumThreshold) a.sumThreshold.damage = Math.round(a.sumThreshold.damage * worldMultiplier);
      if (a.fewCardsThreshold) a.fewCardsThreshold.damage = Math.round(a.fewCardsThreshold.damage * worldMultiplier);
      if (a.perFaceCard) a.perFaceCard.damage = Math.round(a.perFaceCard.damage * worldMultiplier);
      if (a.suitPunish) a.suitPunish.base = Math.round((a.suitPunish.base || 0) * worldMultiplier);
    });
  }
  return scaled;
}
function generateMap() {
  const nodes = [], edges = [];
  const tierForRow = r => Math.min(OPPONENT_TIERS.length - 1, Math.floor(r / 3));
  const castleRow = 10;
  const rowCounts = [1,3,3,3,4,4,4,3,3,2,1];

  // Global world multiplier configuration
  // Set to 1.0 for World 1, can be hooked into a menu later for World 2 (1.5), World 3 (2.0), etc.
  const worldMultiplier = RUN.worldMultiplier || 1.0; 

  for (let r=0;r<rowCounts.length;r++) {
    const row=[];
    // Pull the raw layout pool
    const pool=shuffle([...(OPPONENT_TIERS[tierForRow(r)])]);
    for(let c=0;c<rowCounts[r];c++) {
      // Use your new scaler to smoothly modify the base stats based on the world multiplier
      const baseOpp = pool[c%pool.length];
      row.push({type:'pending', opponent: scaleMonsterForNewWorld(baseOpp, worldMultiplier)});
    }
    nodes.push(row);
  }
  
  //=====Guaranteed Stops=====
  nodes[0][0].type='battle';
  nodes[1].forEach(n=>n.type='battle');
  nodes[2][0]={type:'shop'};
  nodes[5][0]={type:'rest'};
  nodes[castleRow][0]={type:'castle'};

  const eligible=[];
  for(let r=0;r<nodes.length;r++) for(let c=0;c<nodes[r].length;c++)
    if(nodes[r][c].type==='pending') eligible.push({r,c});
  shuffle(eligible);
  
  // Set standard battles dynamically using the scaled versions
  const needBattles=29-3; 
  eligible.slice(0,needBattles).forEach(({r,c})=> {
    const baseOpp = OPPONENT_TIERS[tierForRow(r)][Math.floor(Math.random()*OPPONENT_TIERS[tierForRow(r)].length)];
    nodes[r][c]={type:'battle', opponent: scaleMonsterForNewWorld(baseOpp, worldMultiplier)};
  });
  
  eligible.slice(needBattles).forEach(({r,c})=>{
    const t=pickNodeType();
    if (t==='battle') {
      const baseOpp = OPPONENT_TIERS[tierForRow(r)][Math.floor(Math.random()*OPPONENT_TIERS[tierForRow(r)].length)];
      nodes[r][c]={type:'battle', opponent: scaleMonsterForNewWorld(baseOpp, worldMultiplier)};
    } else {
      nodes[r][c]={type:t};
    }
  });
  
  // Scale the final world Boss object as well
  nodes.push([{type:'battle', opponent: scaleMonsterForNewWorld(BOSS, worldMultiplier)}]);

  // Dense, cross-lane connections.
  for(let r=0;r<nodes.length-1;r++){
    const cur=nodes[r], next=nodes[r+1];
    const add=(a,b)=>{if(!edges.some(e=>e.fromRow===r&&e.fromCol===a&&e.toRow===r+1&&e.toCol===b))edges.push({fromRow:r,fromCol:a,toRow:r+1,toCol:b});};
    if(r===0){ for(let b=0;b<next.length;b++) add(0,b); }
    else if(r===1 && next.length===1){ cur.forEach((_,a)=>add(a,0)); }
    else {
      cur.forEach((_,a)=>{
        const choices=new Set([Math.floor(Math.random()*next.length), Math.min(next.length-1,a), Math.min(next.length-1,a+1)]);
        if(next.length>=3 && Math.random()<0.55) choices.add(Math.floor(Math.random()*next.length));
        choices.forEach(b=>add(a,b));
      });
      for(let b=0;b<next.length;b++) if(!edges.some(e=>e.fromRow===r&&e.toCol===b)) add(Math.min(cur.length-1,Math.floor(Math.random()*cur.length)),b);
    }
  }
  return {nodes,edges};
}

function payTravelCost() {
  RUN.fuel -= FUEL_COST_PER_MOVE;
  RUN.energy = Math.min(RUN.maxEnergy, RUN.energy + ENERGY_PER_MOVE);
  RUN.innSleeps = 0; 
  if (RUN.fuel < 0) {
    RUN.fuel = 0; // Keep the tank clamped at zero
    
    // Out of gas: Player suffers a physical breakdown penalty instead of losing score points
    RUN.health = Math.max(0, RUN.health - 10);
    RUN.lastNotice = `Out of fuel! Pushing your fleet manually to the next stop cost you 10 HP.`;
    
    // Immediate check: If the travel toll drops them to zero, the run crashes out right here
    if (RUN.health <= 0) {
      RUN.lastNotice = `Out of fuel and out of health! Your fleet collapsed on the open highway.`;
      saveRun();
      endRun(false); // Triggers the Run Lost summary screen
      return;
    }
  }
}


function commitNode(row, col) { RUN.currentRow = row; RUN.currentCol = col; RUN.path.push({ row, col }); saveRun(); }
function selectNode(row, col) {
  payTravelCost();
  const node = RUN.map.nodes[row][col];
  if (node.type === 'battle') { startBattle(node.opponent, row, col); return; }
  commitNode(row, col);
  if (node.type === 'castle') render(castleMenuScreen());
  else if (node.type === 'shop') { RETURN_TO_CASTLE_MENU = false; RUN.shopStock = null; render(shopScreen()); }
  else if (node.type === 'rest') render(garageScreen());
  else if (node.type === 'blacksmith') { RETURN_TO_CASTLE_MENU = false; BLACKSMITH_OPTIONS = pickBlacksmithOptions(); BLACKSMITH_VISIT = { primary: null, secondary: null }; render(blacksmithScreen()); }
  else if (node.type === 'chopshop') { RETURN_TO_CASTLE_MENU = false; render(chopShopScreen('map')); }
  else if (node.type === 'treasure') { const found = rollTreasure(); render(treasureScreen(found)); }
}

function reenterCurrentNode(row, col) {
  const node = RUN.map.nodes[row][col];
  if (node.type === 'castle') { render(castleMenuScreen()); return; }
  if (node.type === 'shop') { RETURN_TO_CASTLE_MENU = false; RUN.shopStock = null; render(shopScreen()); return; }
  if (node.type === 'rest') { render(garageScreen()); return; }
  if (node.type === 'blacksmith') { RETURN_TO_CASTLE_MENU = false; BLACKSMITH_OPTIONS = pickBlacksmithOptions(); BLACKSMITH_VISIT = { primary: null, secondary: null }; render(blacksmithScreen()); return; }
  if (node.type === 'chopshop') { RETURN_TO_CASTLE_MENU = false; render(chopShopScreen('map')); return; }
  // Battles and Supply Caches aren't re-enterable stops — nothing to do for those here.
  render(mapScreen());
}

let BLACKSMITH_OPTIONS = null;
let BLACKSMITH_VISIT = null; // { primary: idx|null, secondary: idx|null } — one paid upgrade, plus one optional paid add-on, per visit
function scopeCostMult(scope) { return scope === 'card' ? 1 : scope === 'rank' ? 3 : 4; } // rank hits 4 cards, suit hits 13 — priced for how many cards benefit
function tuneCost(bonus, isSecondary, scope) { const base = 20 * Math.pow(2, bonus / 3) * scopeCostMult(scope); return Math.round(isSecondary ? base * 1.5 : base); }
function pickBlacksmithOptions() {
  // One of each kind every visit: a specific card, every card of a rank, every card of a suit.
  const su1 = SUITS[Math.floor(Math.random() * SUITS.length)];
  const r1 = 2 + Math.floor(Math.random() * 13);
  const r2 = 2 + Math.floor(Math.random() * 13);
  const su3 = SUITS[Math.floor(Math.random() * SUITS.length)];
  return shuffle([
    { scope: 'card', rank: r1, suit: su1.s, label: `${rankLabel(r1)}${su1.s}`, desc: `Just this one card.` },
    { scope: 'rank', rank: r2, label: `Every ${rankLabel(r2)}`, desc: `Any ${rankLabel(r2)} you draw, any suit.` },
    { scope: 'suit', suit: su3.s, label: `Every ${su3.s}`, desc: `Any card of that suit you draw.` },
  ]);
}
function findBoost(opt) { return RUN.cardBoosts.find(b => b.scope === opt.scope && b.rank === opt.rank && b.suit === opt.suit); }
function boostCard(opt) {
  let b = findBoost(opt);
  if (!b) { b = { scope: opt.scope, rank: opt.rank, suit: opt.suit, bonus: 0 }; RUN.cardBoosts.push(b); }
  if (b.bonus >= 9) return;
  b.bonus += 3;
  saveRun();
}
function rollTreasure() {
  const choices = [
    { kind:'coins', label:'Coins', amount:20 + Math.floor(Math.random()*31), icon: ICON.coin },
    { kind:'fuel', label:'Fuel', amount:6 + Math.floor(Math.random()*7), icon: ICON.fuel },
    { kind:'gems', label:'Gems', amount:1 + Math.floor(Math.random()*2), icon: ICON.gem },
    { kind:'energy', label:'Energy', amount:5 + Math.floor(Math.random()*6), icon: ICON.energy },
    { kind:'points', label:'Career Points', amount:10 + Math.floor(Math.random()*16), icon: ICON.star }
  ];
  const prize = choices[Math.floor(Math.random()*choices.length)];
  let actual = prize.amount;
  if (prize.kind === 'coins') { const before=RUN.chips; RUN.chips=Math.min(999, RUN.chips+prize.amount); actual=RUN.chips-before; }
  if (prize.kind === 'fuel') { const before=RUN.fuel; RUN.fuel=Math.min(RUN.maxFuel, RUN.fuel+prize.amount); actual=RUN.fuel-before; }
  if (prize.kind === 'gems') { const before=RUN.gems; RUN.gems=Math.min(RUN.maxGems, RUN.gems+prize.amount); actual=RUN.gems-before; }
  if (prize.kind === 'energy') { const before=RUN.energy; RUN.energy=Math.min(RUN.maxEnergy, RUN.energy+prize.amount); actual=RUN.energy-before; }
  if (prize.kind === 'points') { earnPoints(prize.amount); }
  saveRun();
  return { ...prize, amount: actual };
}
function endRun(won) {
  IN_BATTLE = false; clearBattleSave();
  const bonus = Math.round(RUN.path.length * (won ? 5 : 2) + (won ? 40 : 0));
  earnPoints(bonus);
  META.bestRun = Math.max(META.bestRun, RUN.path.length);
  META.highScore = Math.max(META.highScore, RUN.scoreThisRun);
  META.runsPlayed++;
  saveMeta();
  clearRunSave();
  render(runEndScreen(won, bonus));
}

/* ========== BATTLE LOGIC ========== */
function startBattle(opponentDef, row, col, castleStage=0) {
  IN_BATTLE = true;
  BATTLE = {
    opponent: { ...opponentDef, hpNow: opponentDef.hp, poisonStacks: [], lockProgress: 0 }, row, col, castleStage,
    deck: shuffle(freshDeck()), discard: [],
    oppDeck: shuffle(freshDeck()), oppDiscard: [],
    hand: [], oppPool: [], usedThisTurn: new Set(), scoutedThisTurn: false, abilityUsedThisTurn: false, opponentStunned: false, itemCooldowns: {},
    playerArmor: 0, turn: 1, slots: {}, turnDiscard: [], logLines: [],
  };
  BATTLE.deck.forEach(c => {
    let total = 0;
    RUN.cardBoosts.forEach(b => {
      if (b.scope === 'card' && b.rank === c.rank && b.suit === c.suit) total += b.bonus;
      else if (b.scope === 'rank' && b.rank === c.rank) total += b.bonus;
      else if (b.scope === 'suit' && b.suit === c.suit) total += b.bonus;
    });
    if (total) c.bonus = total;
  });
  drawCards(Math.min(5 + (RUN.drawPerTurn - 2), RUN.handSize));
  resortHandAndRelink(RUN.handSortMode);
  drawOpponentCards();
  for (let i = 0; i < 1 + META.levels.reveal; i++) {
    const hidden = BATTLE.oppPool.filter(c => !c.revealed);
    if (!hidden.length) break;
    hidden[(Math.random() * hidden.length) | 0].revealed = true;
  }
  render(battleScreen());
}
function drawCards(n) {
  for (let i = 0; i < n && BATTLE.hand.length < RUN.handSize; i++) {
    if (!BATTLE.deck.length) { if (!BATTLE.discard.length) break; BATTLE.deck = shuffle(BATTLE.discard); BATTLE.discard = []; }
    BATTLE.hand.push(BATTLE.deck.pop());
  }
}
function drawOpponentCards() {
  BATTLE.scoutedThisTurn = false; BATTLE.abilityUsedThisTurn = false;
  for (let i = 0; i < BATTLE.opponent.drawRate; i++) {
    if (!BATTLE.oppDeck.length) { if (!BATTLE.oppDiscard.length) break; BATTLE.oppDeck = shuffle(BATTLE.oppDiscard); BATTLE.oppDiscard = []; }
    const c = BATTLE.oppDeck.pop();
    c.revealed = Math.random() < revealFraction(BATTLE.row);
    BATTLE.oppPool.push(c);
    if (BATTLE.opponent.locked) BATTLE.opponent.lockProgress += cardValue(c.rank);
  }
}
function battleLog(msg) { BATTLE.logLines.push(msg); if (BATTLE.logLines.length > 60) BATTLE.logLines.shift(); }

// Every opponent already carries a hand-tuned turnLimit (6-10, scaling with difficulty) that
// was never actually wired to anything — battles could stall out indefinitely behind armor or
// poison with zero consequence. This makes that data do something: past their turnLimit, an
// opponent "enrages," hitting +12% harder for each turn over, capped at +100%. Rewards playing
// to close a fight out instead of turtling forever.
function enrageMultiplier(opp, turn) {
  if (!opp || !opp.turnLimit) return 1;
  const over = Math.max(0, turn - opp.turnLimit);
  return 1 + Math.min(1.0, over * 0.12);
}

// Curse: an opponent can curse 1, 2, 3, or a random number of cards currently in the player's hand.
// If the player hasn't played a cursed card by the end of the turn it was checked, it deals its damage and clears.
function tryApplyCurse() {
  const spec = BATTLE.opponent.curse;
  if (!spec) return;
  if (Math.random() > (spec.chance ?? 1)) return;
  // Curse targets equipped Items (never storage — cursing something that can't attack would be an unwinnable trap).
  const eligible = RUN.hero.items.map((id, i) => `${id}_${i}`).filter(key => {
    const item = ITEMS[key.replace(/_\d+$/, '')];
    return item && item.kind !== 'storage' && !(BATTLE.itemCurses && BATTLE.itemCurses[key]);
  });
  if (!eligible.length) return;
  const count = spec.count === 'random' ? 1 + Math.floor(Math.random() * Math.min(3, eligible.length)) : Math.min(spec.count, eligible.length);
  const chosen = shuffle([...eligible]).slice(0, count);
  BATTLE.itemCurses = BATTLE.itemCurses || {};
  chosen.forEach(key => { BATTLE.itemCurses[key] = spec.amount; });
  const names = chosen.map(key => ITEMS[key.replace(/_\d+$/, '')].name).join(', ');
  battleLog(`${BATTLE.opponent.name} curses your ${names} — fire it this turn or take ${spec.amount} damage.`);
}
// Burn: a decaying 3-turn damage-over-time effect. The player can detonate it early for whatever
// the current stage is worth, forfeiting the smaller remaining ticks.
function detonateBurn() {
  if (!BATTLE || !BATTLE.opponent.burns?.length) return;
  const dmg = BATTLE.opponent.burns.reduce((a, b) => a + (b.stages[b.stageIdx] || 0), 0);
  const detBefore=BATTLE.opponent.hpNow; BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - dmg); if (dmg === detBefore && detBefore > 0) BATTLE.exactKill = true;
  battleLog(`Detonated the burn early for ${dmg} damage, forfeiting the remaining ticks.`);
  BATTLE.opponent.burns = [];
  saveRun();
  if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }
  render(battleScreen());
}

function toggleCardSelect(i) { const pos = selectedIdx.indexOf(i); if (pos === -1) selectedIdx.push(i); else selectedIdx.splice(pos, 1); render(battleScreen()); }
function assignSelectedTo(slotKey) {
  if (!selectedIdx.length) return;
  const match = slotKey.match(/^(.+)_(\d+)$/);
  if (!match) return;
  const itemId = match[1];
  const item = ITEMS[itemId];
  if (!item) return;

  if (!BATTLE.slots[slotKey]) BATTLE.slots[slotKey] = [];
  const cap = effectiveMaxCards(item);
  const room = cap - BATTLE.slots[slotKey].length;
  if (room <= 0) return;

  let candidates = selectedIdx.filter(i => !BATTLE.usedThisTurn.has(i)).filter(i => !BATTLE.slots[slotKey].includes(i));
  if (item.kind === 'storage' && item.acceptFilter) {
    candidates = candidates.filter(i => {
      const c = BATTLE.hand[i];
      if (item.acceptFilter.suit && c.suit !== item.acceptFilter.suit) return false;
      if (item.acceptFilter.color && c.color !== item.acceptFilter.color) return false;
      if (item.acceptFilter.parity) { const isEven = c.rank % 2 === 0; if ((item.acceptFilter.parity === 'even') !== isEven) return false; }
      return true;
    });
  }
  const take = candidates.slice(0, room);

  BATTLE.slots[slotKey].push(...take);
  selectedIdx = [];

  render(battleScreen());
}
function removeCardFromSlot(slotKey, idx) { if (!BATTLE.slots[slotKey]) return; BATTLE.slots[slotKey] = BATTLE.slots[slotKey].filter(i => i !== idx); render(battleScreen()); }
function clearSlot(slotKey) { BATTLE.slots[slotKey] = []; render(battleScreen()); }
function markSelectedForDiscard() {
  if (!selectedIdx.length) return;
  selectedIdx.forEach(i => { if (!BATTLE.turnDiscard.includes(i)) BATTLE.turnDiscard.push(i); });
  selectedIdx = [];
  render(battleScreen());
}
function unmarkDiscard(i) { BATTLE.turnDiscard = BATTLE.turnDiscard.filter(x => x !== i); render(battleScreen()); }

// Sorting BATTLE.hand reorders the array, which would silently corrupt any indices
// sitting in item slots (especially storage, which survives across turns) unless we
// relink them afterward by card object identity — same fix as the end-of-turn splice.
function resortHandAndRelink(mode) {
  mode = mode || 'value';
  const preserved = {};
  Object.entries(BATTLE.slots).forEach(([key, idxs]) => { if (idxs.length) preserved[key] = idxs.map(i => BATTLE.hand[i]); });
  const preservedSelection = (typeof selectedIdx !== 'undefined' ? selectedIdx : []).map(i => BATTLE.hand[i]);
  const suitOrder = {'♠':0,'♥':1,'♦':2,'♣':3};
  BATTLE.hand.sort((a,b)=> mode==='suit' ? ((suitOrder[a.suit]-suitOrder[b.suit]) || (a.rank-b.rank)) : ((a.rank-b.rank) || (suitOrder[a.suit]-suitOrder[b.suit])));
  Object.entries(preserved).forEach(([key, cards]) => { BATTLE.slots[key] = cards.map(c => BATTLE.hand.indexOf(c)).filter(i => i !== -1); });
  if (typeof selectedIdx !== 'undefined') selectedIdx = preservedSelection.map(c => BATTLE.hand.indexOf(c)).filter(i => i !== -1);
}
function sortHand(mode) {
  RUN.handSortMode = mode; saveRun();
  resortHandAndRelink(mode);
  selectedIdx=[]; render(battleScreen());
}
function toggleHandSort() {
  sortHand((RUN.handSortMode || 'value') === 'value' ? 'suit' : 'value');
}

function scoutOpponent() {
  const cost = 10;
  if (RUN.chips < cost || BATTLE.scoutedThisTurn) return;
  RUN.chips -= cost; BATTLE.scoutedThisTurn = true;
  const hidden = BATTLE.oppPool.filter(c => !c.revealed);
  const revealCount = Math.max(1, Math.ceil(BATTLE.oppPool.length / 2));
  shuffle(hidden).slice(0, revealCount).forEach(c => c.revealed = true);
  battleLog(`Scouted the ${BATTLE.opponent.name}.`);
  saveRun(); render(battleScreen());
}
function drawWithGem() {
  if (RUN.gems < 1) return;
  RUN.gems -= 1;
  const n = 1 + META.levels.gem + (RUN.runUpgrades?.gemDraw || 0);
  for (let i = 0; i < n; i++) {
    if (!BATTLE.deck.length) { if (!BATTLE.discard.length) break; BATTLE.deck = shuffle(BATTLE.discard); BATTLE.discard = []; }
    BATTLE.hand.push(BATTLE.deck.pop());
  }
  const drawn = BATTLE.hand.slice(-n).map(c => `${rankLabel(c.rank)}${c.suit}`).join(' ');
  battleLog(`Spent a gem: Drew ${drawn || 'no cards'}.`);
  resortHandAndRelink(RUN.handSortMode);
  saveRun(); render(battleScreen());
}
// NOTE: no Item currently defines a Stun-style ability. If you want one, give an Item
// an `ability: {cost, name}` field and wire a handler the same shape as useAbility used to be.

function executePlayerAttack(itemId, index) {
  const item = ITEMS[itemId];
  const slotKey = `${itemId}_${index}`;
  const idxs = BATTLE.slots[slotKey] || [];

  if (item.kind === 'storage') { render(battleScreen()); return; } // storage never attacks

  if (!idxs.length) {
    battleLog(`${item.name} has no cards assigned.`);
    render(battleScreen());
    return;
  }

  // Enforce this Item's uses-per-turn cap (default 1, raised only via the Chop Shop — never by power tuning).
  BATTLE.itemUses = BATTLE.itemUses || {};
  const level = itemLevel(itemId);
  const cap = itemUsesCap(item, itemUsesLevel(itemId));
  if ((BATTLE.itemUses[slotKey] || 0) >= cap) {
    battleLog(`${item.name} has already fired ${cap} time${cap > 1 ? 's' : ''} this turn.`);
    render(battleScreen());
    return;
  }

  // Cooldown items (not used by anything yet — set item.cooldown to a turn count to opt an
  // item into this). BATTLE.itemCooldowns[slotKey] counts down by 1 at the start of each of
  // the player's turns (see endTurn) and blocks firing while above 0.
  if (item.cooldown != null && (BATTLE.itemCooldowns?.[slotKey] || 0) > 0) {
    battleLog(`${item.name} is on cooldown for ${BATTLE.itemCooldowns[slotKey]} more turn${BATTLE.itemCooldowns[slotKey] > 1 ? 's' : ''}.`);
    render(battleScreen());
    return;
  }

  // Prevent cards already used this turn from being used again.
  if (idxs.some(i => BATTLE.usedThisTurn.has(i))) {
    battleLog(`One or more cards in ${item.name} were already used this turn.`);
    render(battleScreen());
    return;
  }

  const cards = idxs.map(i => BATTLE.hand[i]);
  const condResult = checkCondition(item.condition, cards);

  if (!condResult.met) {
    battleLog(`${item.name} — ${condResult.label || 'requirement unmet'}.`);
    render(battleScreen());
    return;
  }

  const { amount, breakdown } = computeItemAmount(item, cards, level, condResult);
  const eKind = effectiveKind(item, index);
  const cardsStr = cards.map(c => `${rankLabel(c.rank)}${c.suit}`).join(' ');

  // Kind effect (damage/defense/poison/burn/curse) and the draw effect are independent —
  // an item can do one, the other, or both (e.g. deal damage AND draw cards). A pure-draw
  // item like Quick Draw just has baseMult 0, so its kind effect amount is 0 and gets skipped.
  if (amount > 0 || item.flatAmount != null) {
    if (eKind === 'defense') {
      BATTLE.playerArmor += amount;
      battleLog(`${item.name} [${cardsStr}] — ${condResult.label}! +${amount} armor (${breakdown}).`);
    } else if (eKind === 'poison') {
      BATTLE.opponent.poisonStacks = BATTLE.opponent.poisonStacks || [];
      BATTLE.opponent.poisonStacks.push(amount);
      battleLog(`${item.name} [${cardsStr}] — ${condResult.label}! Applied ${amount} poison (${breakdown}).`);
    } else if (eKind === 'burn') {
      const stages = [amount, Math.round(amount / 2), Math.round(amount / 4)];
      BATTLE.opponent.burns = BATTLE.opponent.burns || [];
      BATTLE.opponent.burns.push({ stages, stageIdx: 0 });
      battleLog(`${item.name} [${cardsStr}] — ${condResult.label}! Burn applied for ${stages.join(' + ')} damage (${breakdown}, stacks with any existing burn).`);
    } else if (eKind === 'curse') {
      BATTLE.opponent.curseFromPlayer = (BATTLE.opponent.curseFromPlayer || 0) + amount;
      battleLog(`${item.name} [${cardsStr}] — ${condResult.label}! Cursed them for ${amount} (${breakdown}) — it lands if they fail to attack next turn.`);
    } else {
      const atkBefore = BATTLE.opponent.hpNow;
      BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - amount);
      if (amount === atkBefore && atkBefore > 0) BATTLE.exactKill = true;
      battleLog(`${item.name} [${cardsStr}] — ${condResult.label}! ${amount} damage (${breakdown}).`);
    }
  }

  if (item.drawAmount || item.drawUsesCardCount) {
    const drawN = item.drawUsesCardCount
      ? cards.length + (item.drawBonusFlat || 0) + (item.drawPerLevel || 0) * level
      : item.drawAmount + (item.drawPerLevel || 0) * level;
    const drawn=[];
    for(let i=0;i<drawN;i++){
      if(!BATTLE.deck.length){ if(!BATTLE.discard.length) break; BATTLE.deck=shuffle(BATTLE.discard); BATTLE.discard=[]; }
      if(BATTLE.deck.length){ const c=BATTLE.deck.pop(); BATTLE.hand.push(c); drawn.push(c); }
    }
    battleLog(`${item.name} — Drew ${drawn.map(c=>rankLabel(c.rank)+c.suit).join(' ') || 'no cards'}.`);
    resortHandAndRelink(RUN.handSortMode);
  }

  // Impound Release-style "unlock" items: progress accumulates from damage dealt (persists for
  // the whole run via RUN, not just this battle). Crossing unlockThreshold flags a one-time
  // bonus draw of 4 for the item's NEXT use, after which it just attacks normally forever.
  if (item.unlockThreshold != null) {
    RUN.itemUnlockProgress = RUN.itemUnlockProgress || {};
    RUN.itemUnlocked = RUN.itemUnlocked || {};
    RUN.itemUnlockPending = RUN.itemUnlockPending || {};
    if (RUN.itemUnlockPending[slotKey]) {
      delete RUN.itemUnlockPending[slotKey];
      const bonusDrawn=[];
      for(let i=0;i<4;i++){
        if(!BATTLE.deck.length){ if(!BATTLE.discard.length) break; BATTLE.deck=shuffle(BATTLE.discard); BATTLE.discard=[]; }
        if(BATTLE.deck.length){ const c=BATTLE.deck.pop(); BATTLE.hand.push(c); bonusDrawn.push(c); }
      }
      battleLog(`${item.name} — Unlock bonus! Drew ${bonusDrawn.map(c=>rankLabel(c.rank)+c.suit).join(' ') || 'no cards'}.`);
      resortHandAndRelink(RUN.handSortMode);
    } else if (!RUN.itemUnlocked[slotKey]) {
      RUN.itemUnlockProgress[slotKey] = (RUN.itemUnlockProgress[slotKey] || 0) + amount;
      if (RUN.itemUnlockProgress[slotKey] >= item.unlockThreshold) {
        RUN.itemUnlocked[slotKey] = true;
        RUN.itemUnlockPending[slotKey] = true;
        battleLog(`${item.name} is unlocked! Its next use will also draw 4 cards.`);
      }
    }
  }

  // Resolve the Item's effect.
  // This Item fired — clears any curse on it, and counts against its uses-per-turn cap.
  if (BATTLE.itemCurses && BATTLE.itemCurses[slotKey]) { delete BATTLE.itemCurses[slotKey]; battleLog(`${item.name}'s curse cleared.`); }
  BATTLE.itemUses[slotKey] = (BATTLE.itemUses[slotKey] || 0) + 1;
  if (item.cooldown != null) {
    BATTLE.itemCooldowns = BATTLE.itemCooldowns || {};
    BATTLE.itemCooldowns[slotKey] = item.cooldown;
  }

  // These cards have now been used this turn.
  idxs.forEach(i => BATTLE.usedThisTurn.add(i));

  // Remove the cards from this Item's slot.
  BATTLE.slots[slotKey] = [];

  saveRun();

  // If the attack killed the opponent, finish the battle immediately.
  if (BATTLE.opponent.hpNow <= 0) {
    winBattle();
    return;
  }

  // Otherwise, the turn continues.
  render(battleScreen());
}
function resolveOpponentAttackEffect(attack, oppDmg) {
  if (!attack) return '';
  if (attack.discardHand) {
    const n = Math.min(attack.discardHand.count || 1, BATTLE.hand.length);
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.random() * BATTLE.hand.length);
      const [card] = BATTLE.hand.splice(idx, 1);
      BATTLE.discard.push(card);
    }
    resortHandAndRelink(RUN.handSortMode);
    return n ? ` Knocked ${n} card${n>1?'s':''} out of your hand.` : ' Tried to knock a card loose, but your hand was empty.';
  }
  if (attack.effect === 'damage') return '';
  if (attack.effect === 'burn') {
    const amount=Math.max(3,Math.round(oppDmg*0.45));
    BATTLE.opponent.burns=BATTLE.opponent.burns||[]; BATTLE.opponent.burns.push({stages:[amount,Math.round(amount/2),Math.round(amount/4)],stageIdx:0});
    return ` Applied ${amount} burn.`;
  }
  if (attack.effect === 'poison') {
    const amount=Math.max(2,Math.round(oppDmg*0.35));
    BATTLE.opponent.poisonStacks=BATTLE.opponent.poisonStacks||[]; BATTLE.opponent.poisonStacks.push(amount);
    return ` Applied ${amount} poison.`;
  }
  if (attack.effect === 'curse') {
    tryApplyCurse(); return ' Applied a curse.';
  }
  if (attack.effect === 'stun') { BATTLE.opponentStunned=true; return ' Stunned your fleet for the next counter-attack.'; }
  if (attack.effect === 'heal') {
    const heal=Math.max(3,Math.round(oppDmg*0.4)); BATTLE.opponent.hpNow=Math.min(BATTLE.opponent.hp,BATTLE.opponent.hpNow+heal); return ` Recovered ${heal} HP.`;
  }
  if (attack.effect === 'stealFuel') {
    const n=Math.min(RUN.fuel,1); RUN.fuel-=n; return n?` Stole ${n} fuel.`:' Tried to steal fuel, but you had none.';
  }
  if (attack.effect === 'draw') {
    if(BATTLE.oppDeck.length){ const c=BATTLE.oppDeck.pop(); c.revealed=false; BATTLE.oppPool.push(c); return ' Drew an extra card.'; }
  }
  return '';
}
function endTurn() {
  // Resolve any Items the opponent cursed last turn: fired this turn, curse already cleared
  // in executePlayerAttack; never fired, it deals its damage now.
  if (BATTLE.itemCurses) {
    Object.entries(BATTLE.itemCurses).forEach(([slotKey, amount]) => {
      const itemId = slotKey.replace(/_\d+$/, '');
      const item = ITEMS[itemId];
      RUN.health = Math.max(0, RUN.health - amount);
      battleLog(`${item ? item.name : 'Cursed item'} never fired — you take ${amount} damage! Health: ${RUN.health}/${RUN.maxHealth}.`);
    });
    BATTLE.itemCurses = {};
  }

  if (BATTLE.turnDiscard.length) battleLog(`Discarded ${BATTLE.turnDiscard.length} card${BATTLE.turnDiscard.length > 1 ? 's' : ''}.`);

  // Storage Items keep their cards turn to turn — remember them by object identity so we
  // can relink them to their new array positions after the hand gets spliced below.
  const preservedStorage = {};
  Object.entries(BATTLE.slots).forEach(([key, idxs]) => {
    const itemId = key.replace(/_\d+$/, '');
    const item = ITEMS[itemId];
    if (item && item.kind === 'storage' && idxs.length) preservedStorage[key] = idxs.map(i => BATTLE.hand[i]);
  });

  const allRemove = new Set([...BATTLE.usedThisTurn, ...BATTLE.turnDiscard]);
  const sorted = [...allRemove].sort((a, b) => b - a);
  for (const i of sorted) {
    BATTLE.discard.push(BATTLE.hand[i]);
    BATTLE.hand.splice(i, 1);
  }

  BATTLE.slots = {};
  Object.entries(preservedStorage).forEach(([key, cards]) => {
    BATTLE.slots[key] = cards.map(c => BATTLE.hand.indexOf(c)).filter(i => i !== -1);
  });
  BATTLE.turnDiscard = [];
  BATTLE.usedThisTurn = new Set();
  BATTLE.itemUses = {};
  if (BATTLE.itemCooldowns) {
    Object.keys(BATTLE.itemCooldowns).forEach(key => {
      BATTLE.itemCooldowns[key] = Math.max(0, BATTLE.itemCooldowns[key] - 1);
      if (BATTLE.itemCooldowns[key] === 0) delete BATTLE.itemCooldowns[key];
    });
  }
  selectedIdx = [];

  if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }

  // Poison ticks down over time.
  if (BATTLE.opponent.poisonStacks?.length) {
    const pdmg = BATTLE.opponent.poisonStacks.reduce((a,n)=>a+n,0);
    const poisonBefore=BATTLE.opponent.hpNow; BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - pdmg); if (pdmg === poisonBefore && poisonBefore > 0) BATTLE.exactKill = true;
    battleLog(`Poison ticks for ${pdmg}.`);
    BATTLE.opponent.poisonStacks = BATTLE.opponent.poisonStacks.map(n=>Math.max(0,n-3)).filter(n=>n>0);
  }
  // Burn ticks down too, and can stack: each application is its own independently-decaying instance,
  // so a fresh 30-burn landing on top of an existing 15-tick burn hits for 45 that turn.
  if (BATTLE.opponent.burns?.length) {
    const bdmg = BATTLE.opponent.burns.reduce((a, b) => a + (b.stages[b.stageIdx] || 0), 0);
    const burnBefore=BATTLE.opponent.hpNow; BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - bdmg); if (bdmg === burnBefore && burnBefore > 0) BATTLE.exactKill = true;
    battleLog(`Burn ticks for ${bdmg}.`);
    BATTLE.opponent.burns.forEach(b => b.stageIdx++);
    BATTLE.opponent.burns = BATTLE.opponent.burns.filter(b => b.stageIdx < b.stages.length);
  }
  if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }

  let opponentLandedHit = false;
  if (BATTLE.opponentStunned) {
    battleLog(`${BATTLE.opponent.name} is stunned and doesn't counter-attack.`);
    BATTLE.opponentStunned = false;
  } else if (BATTLE.opponent.locked) {
    if (BATTLE.opponent.turnLimit && BATTLE.turn === BATTLE.opponent.turnLimit + 1 && !BATTLE.enrageNotified) {
      BATTLE.enrageNotified = true;
      battleLog(`${BATTLE.opponent.name} is enraged from the drawn-out fight — its attacks hit harder from here on.`);
    }
    if (BATTLE.opponent.lockProgress >= BATTLE.opponent.lockThreshold) {
      let oppDmg = Math.round(BATTLE.opponent.lockAttack * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      if (BATTLE.playerArmor > 0) {
        const blocked = Math.min(BATTLE.playerArmor, oppDmg);
        BATTLE.playerArmor -= blocked; oppDmg -= blocked;
        battleLog(`Your armor absorbed ${blocked} damage.`);
      }
      RUN.health = Math.max(0, RUN.health - oppDmg);
      battleLog(`${BATTLE.opponent.name} clears the lock and hits for a flat ${oppDmg}! It locks back up. Your health: ${RUN.health}/${RUN.maxHealth}.`);
      BATTLE.opponent.lockProgress = 0;
      BATTLE.oppPool = [];
      opponentLandedHit = true;
    } else {
      battleLog(`${BATTLE.opponent.name} is still locked (${BATTLE.opponent.lockProgress}/${BATTLE.opponent.lockThreshold}). No attack yet.`);
    }
  } else {
    const attackTimes = BATTLE.opponent.usesPerTurn ?? OPPONENT_USES_PER_TURN_DEFAULT;
    const maxCards = opponentMaxCards(BATTLE.opponent);
    let anyAttack = false;
    let attackDef = null;
    if (BATTLE.opponent.turnLimit && BATTLE.turn === BATTLE.opponent.turnLimit + 1 && !BATTLE.enrageNotified) {
      BATTLE.enrageNotified = true;
      battleLog(`${BATTLE.opponent.name} is enraged from the drawn-out fight — its attacks hit harder from here on.`);
    }
    for (let swing = 0; swing < attackTimes; swing++) {
      const choices=(BATTLE.opponent.attacks&&BATTLE.opponent.attacks.length?BATTLE.opponent.attacks:[{}]);
      // Left-to-right selection: try each attack in card order and use the FIRST one that's
      // viable, rather than picking whichever scores highest. This means the leftmost attack
      // should be the hardest to trigger (its "signature" move) and attacks get easier moving
      // right, so a great hand fires the big one, a mediocre hand falls through to something
      // easier, and a truly empty pool means no attack at all this swing.
      let pick = null;
      for (const a of choices) {
        const best = a.autoFire ? { cards: [], tier: 999, label: 'Auto', mult: 0 } : bestHandFromPool(BATTLE.oppPool, a.maxCards ?? maxCards);
        if (a.minTurn != null && BATTLE.turn < a.minTurn) continue;
        let viable;
        if (a.autoFire) viable = true;
        else if (a.sumThreshold) viable = best.cards.reduce((s,c)=>s+cardValue(c.rank),0) >= a.sumThreshold.min;
        else if (a.fewCardsThreshold) viable = best.cards.length > 0 && best.cards.length <= a.fewCardsThreshold.max;
        else if (a.perFaceCard) viable = best.cards.length > 0;
        else if (a.discardHand) viable = best.cards.length > 0;
        else viable = best.tier >= (a.minTier ?? BATTLE.opponent.minTier);
        if (viable) { pick = { a, best }; break; }
      }
      if (!pick) break;
      const { a: attackDefPicked, best } = pick;
      attackDef = attackDefPicked;
      anyAttack = true;
      let oppDmg;
      if (attackDef.autoFire) {
        oppDmg = Math.round(attackDef.autoFire.damage * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      } else if (attackDef.sumThreshold) {
        oppDmg = Math.round(attackDef.sumThreshold.damage * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      } else if (attackDef.fewCardsThreshold) {
        oppDmg = Math.round(attackDef.fewCardsThreshold.damage * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      } else if (attackDef.perFaceCard) {
        const faceCount = best.cards.filter(c => c.rank >= 11 && c.rank <= 13).length;
        oppDmg = Math.round(faceCount * attackDef.perFaceCard.damage * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      } else if (attackDef.discardHand) {
        oppDmg = 0;
      } else if (attackDef.suitPunish) {
        const suitCount = BATTLE.discard.filter(c => c.suit === attackDef.suitPunish.suit).length;
        const base = attackDef.suitPunish.base || 0;
        oppDmg = Math.round((base + suitCount * attackDef.suitPunish.perCard) * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      } else {
        oppDmg = Math.round(damageFor(best.cards, best.mult) * enrageMultiplier(BATTLE.opponent, BATTLE.turn));
      }
      if (BATTLE.playerArmor > 0) {
        const blocked = Math.min(BATTLE.playerArmor, oppDmg);
        BATTLE.playerArmor -= blocked; oppDmg -= blocked;
        battleLog(`Your armor absorbed ${blocked} damage.`);
      }
      RUN.health = Math.max(0, RUN.health - oppDmg);
      const usedText = best.cards.map(c => `${rankLabel(c.rank)}${c.suit}`).join(' ');
      let specialLog = resolveOpponentAttackEffect(attackDef, oppDmg);
      const spec = BATTLE.opponent.special;
      if (spec?.type === 'lifesteal') {
        const healAmt = Math.round(oppDmg * (spec.pct ?? 0.5));
        if (healAmt > 0) {
          BATTLE.opponent.hpNow = Math.min(BATTLE.opponent.hp, BATTLE.opponent.hpNow + healAmt);
          specialLog = ` It heals ${healAmt}.`;
        }
      } else if (spec?.type === 'redSteal') {
        const redCount = best.cards.filter(c => c.color === 'red').length;
        if (redCount >= (spec.redThreshold ?? 3)) {
          const fuelStolen = Math.min(RUN.fuel, spec.fuelSteal ?? 1);
          RUN.fuel -= fuelStolen;
          for (let i = 0; i < (spec.extraDraw ?? 1); i++) {
            if (!BATTLE.oppDeck.length) { if (!BATTLE.oppDiscard.length) break; BATTLE.oppDeck = shuffle(BATTLE.oppDiscard); BATTLE.oppDiscard = []; }
            const c = BATTLE.oppDeck.pop(); c.revealed = Math.random() < revealFraction(BATTLE.row); BATTLE.oppPool.push(c);
          }
          specialLog = ` It steals ${fuelStolen} fuel and draws an extra card!`;
        }
      }
      battleLog(attackDef.autoFire
        ? `${BATTLE.opponent.name}'s ${attackDef.name || 'attack'} kicks in — ${oppDmg} damage.${specialLog} Your health: ${RUN.health}/${RUN.maxHealth}.`
        : `${BATTLE.opponent.name} used ${attackDef.name || best.label} with ${best.label} (${usedText}) — ${oppDmg} damage.${specialLog} Your health: ${RUN.health}/${RUN.maxHealth}.`);
      BATTLE.oppPool = BATTLE.oppPool.filter(c => !best.cards.includes(c));
      if (RUN.health <= 0) break;
    }
    if (!anyAttack) battleLog(`${BATTLE.opponent.name} didn't have enough to attack this turn.`);
    else opponentLandedHit = true;
    if (!attackDef || attackDef.effect !== 'curse') tryApplyCurse();
  }

  if (BATTLE.opponent.curseFromPlayer) {
    if (opponentLandedHit) {
      battleLog(`${BATTLE.opponent.name} shakes off your curse this time.`);
    } else {
      const curseDmg = BATTLE.opponent.curseFromPlayer;
      const curseBefore=BATTLE.opponent.hpNow; BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - curseDmg); if (curseDmg === curseBefore && curseBefore > 0) BATTLE.exactKill = true;
      battleLog(`Your curse lands for ${curseDmg} damage — ${BATTLE.opponent.name} failed to attack!`);
    }
    BATTLE.opponent.curseFromPlayer = 0;
    if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }
  }

  if (RUN.health <= 0) { IN_BATTLE = false; clearBattleSave(); render(nodeResultScreen(false, {})); return; }

  BATTLE.turn++;
  drawCards(RUN.drawPerTurn);
  resortHandAndRelink(RUN.handSortMode);
  drawOpponentCards();
  battleLog(`— Turn ${BATTLE.turn} —`);
  render(battleScreen());
}
function winBattle(outlast) {
  IN_BATTLE = false; clearBattleSave();
  if (BATTLE.castleStage) {
    const stage = BATTLE.castleStage;
    const reward = stage === 1
      ? { coins: 30, gems: 2, fuel: 6 }
      : { coins: 70, gems: 4, fuel: 10 };
    RUN.chips += reward.coins;
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + reward.gems);
    RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + reward.fuel);
    if (!RUN.castleState) RUN.castleState = {};
    if (stage === 1) RUN.castleState.firstDone = true;
    if (stage === 2) RUN.castleState.secondDone = true;
    saveRun();
    render(castleDungeonScreen(`You won Battle ${stage}. Reward: +${reward.coins} coins, +${reward.gems} gems, +${reward.fuel} fuel.`));
    return;
  }
  const scale = outlast ? 0.7 : 1;
  let chipReward = Math.round((22 + BATTLE.opponent.hp / 7) * scale);
  const gemReward = 2 + BATTLE.row;
  const fuelReward = 3 + BATTLE.row;
  let pointsReward = Math.round((5 + BATTLE.row * 3) * scale);
  const exactKillBonus = BATTLE.exactKill && !outlast;
  if (exactKillBonus) { chipReward += 25; pointsReward += 15; }
  RUN.chips += chipReward; RUN.gems = Math.min(RUN.maxGems, RUN.gems + gemReward); RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + fuelReward);
  earnPoints(pointsReward);
  battleLog(outlast ? `You outlasted the ${BATTLE.opponent.name}!` : `${BATTLE.opponent.name} is done for!`);
  if (exactKillBonus) battleLog(`Perfect Win Bonus: +25 coins, +15 Career Points!`);
  battleLog(`+${chipReward} coins, +${gemReward} gems, +${fuelReward} fuel, +${pointsReward} Career Points.`);
  render(nodeResultScreen(true, { chipReward, gemReward, fuelReward, pointsReward, exactKillBonus }));
}

  if (node.type === 'blacksmith') return { title: 'Tuning Garage', art: glyph(ICON.hammer), rows: [], extra: '<div class="note">Spend coins to permanently boost a card (or a whole rank/suit), for this run only.</div>', actionLabel: 'Go Here' };
  if (node.type === 'chopshop') return { title: 'Chop Shop', art: glyph(ICON.curse), rows: [], extra: '<div class="note">Spend coins to modify your equipped Items for this run: raise a bonus %, add uses per turn, add card slots, or convert a regular attack into poison, burn, or curse.</div>', actionLabel: 'Go Here' };
  if (node.type === 'treasure') return { title: 'Supply Cache', art: glyph(ICON.gift), rows: [], extra: '<div class="note">One random reward: coins, fuel, gems, energy, or Career Points.</div>', actionLabel: 'Go Here' };
  return { title: 'Fleet Compound', art: glyph(ICON.castle), rows: [], extra: '<div class="note">Battles, the Dealership, refueling, a card match game, and more.</div>', actionLabel: 'Go Here' };
}

    const title=!showReal?'Unscouted':(node.type==='battle'?node.opponent.name:NODE_TITLE[node.type]);

/* ========== RUN-SCOPED UPGRADES (paid with coins, last only for this run) ==========
const MAX_ITEM_CAP = 9; // 3 rows of 3 — hard ceiling regardless of how many slot upgrades stack
const RUN_UPGRADE_DEFS = {
  itemSlots:   { label: 'Item Slot',        desc: '+1 Item slot, this run only.', baseCost: 100, mult: 2, cap: 6 },
  drawPerTurn: { label: 'Cards Drawn/Turn', desc: '+1 card drawn at the start of each turn, this run only.', baseCost: 60, mult: 2, cap: 5 },

  gemDraw:     { label: 'Gem Draw',         desc: '+1 card drawn per gem spent, this run only.', baseCost: 50, mult: 2, cap: 4 },

function runUpgradeCost(kind) {

function handleCardDrop(e, slotKey, maxSlot) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const idx = +e.dataTransfer.getData('text/plain');
  if (Number.isNaN(idx)) return;
  if (BATTLE.usedThisTurn.has(idx) || BATTLE.turnDiscard.includes(idx)) return;
  const itemId = slotKey.replace(/_\d+$/, '');
  const item = ITEMS[itemId];
  if (item && item.kind === 'storage' && item.acceptFilter) {
    const c = BATTLE.hand[idx];
    if (item.acceptFilter.suit && c.suit !== item.acceptFilter.suit) return;
    if (item.acceptFilter.color && c.color !== item.acceptFilter.color) return;
    if (item.acceptFilter.parity) { const isEven = c.rank % 2 === 0; if ((item.acceptFilter.parity === 'even') !== isEven) return; }
  }
  if (!BATTLE.slots[slotKey]) BATTLE.slots[slotKey] = [];
  if (BATTLE.slots[slotKey].includes(idx)) return;
  if (BATTLE.slots[slotKey].length >= maxSlot) return;
  Object.keys(BATTLE.slots).forEach(k => { BATTLE.slots[k] = BATTLE.slots[k].filter(i => i !== idx); });
  BATTLE.slots[slotKey].push(idx);
  selectedIdx = selectedIdx.filter(i => i !== idx);
  render(battleScreen());
}

  endTurn();

function pickShopStock() {
  const row = Math.max(0, RUN.currentRow || 0);

  // Always include at least one storage bag option so hold-card items stay purchasable.
  if (bags.length) stock.push(shuffle([...bags])[0]);
  return stock;
}

function blacksmithScreen() {
  const rows = BLACKSMITH_OPTIONS.map((opt, i) => {
    const b = findBoost(opt);
    const bonus = b ? b.bonus : 0;
    const maxed = bonus >= 9;
    const isPrimary = BLACKSMITH_VISIT.primary === i;
    const isSecondary = BLACKSMITH_VISIT.secondary === i;
    const primaryTaken = BLACKSMITH_VISIT.primary !== null;
    const secondaryTaken = BLACKSMITH_VISIT.secondary !== null;
    let btnHTML;
    if (isPrimary || isSecondary) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Upgraded ✓</button>`;
    } else if (maxed) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Maxed out</button>`;
    } else if (!primaryTaken) {
      const cost = tuneCost(bonus, false, opt.scope);
      btnHTML = `<button class="wo-btn amber" data-forge="${i}" style="padding:8px 12px;font-size:13px" ${RUN.chips < cost ? 'disabled' : ''}>Upgrade (+3, ${cost} coins)</button>`;
    } else if (!secondaryTaken) {
      const cost = tuneCost(bonus, true, opt.scope);
      btnHTML = `<button class="wo-btn purple" data-forge="${i}" style="padding:8px 12px;font-size:13px" ${RUN.chips < cost ? 'disabled' : ''}>Also upgrade (+3, ${cost} coins)</button>`;
    } else {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Visit's extra upgrade used</button>`;
    }
    const visual = opt.scope === 'card'
      ? `<div class="card ${SUITS.find(s=>s.s===opt.suit)?.color === 'red' ? 'red' : ''}"><div>${rankLabel(opt.rank)}</div><div style="font-size:16px">${opt.suit}</div></div>`
      : `<span class="vart" style="width:38px;height:52px;font-size:22px;border:2px solid var(--blue);border-radius:5px;background:var(--white)">${opt.scope === 'rank' ? rankLabel(opt.rank) : opt.suit}</span>`;
    return `<div class="shopcard">
      <div class="hdr"><span>Tune: ${opt.label} ${bonus ? `(currently +${bonus})` : ''}</span><span></span></div>
      <div style="margin:6px 0">${visual}</div>
      <div class="note" style="margin:0 0 6px">${opt.desc} ${opt.scope === 'card' ? `Adds +3 damage to attacks that use ${rankLabel(opt.rank)}${opt.suit}.` : `Adds +3 damage to attacks using ${opt.scope === 'rank' ? rankLabel(opt.rank) : opt.suit}.`}</div>
      ${btnHTML}
    </div>`;
  }).join('');
  const seenItemIds = new Set();
  const itemLevelRows = RUN.hero.items.map(itemId => {
    if (seenItemIds.has(itemId)) return '';
    seenItemIds.add(itemId);
    const item = ITEMS[itemId];
    if (!item) return '';
    const cap = itemLevelCap(item);
    if (cap <= 0) return '';
    const lvl = itemLevel(itemId);
    const maxed = lvl >= cap;
    const cost = maxed ? 0 : itemTuneCost(item, lvl);
    const refund = lvl > 0 ? itemTuneCost(item, lvl - 1) : 0;
    const currentText = item.bonus
      ? `Currently +${Math.round((item.bonus.base + item.bonus.perLevel * lvl) * 100)}% bonus`
      : `Currently draws ${item.drawAmount + (item.drawPerLevel||0)*lvl} card${(item.drawAmount + (item.drawPerLevel||0)*lvl) === 1 ? '' : 's'}`;
    return `<div class="shopcard">
      <div class="hdr"><span><b>${item.name}</b> (Lv ${lvl}/${cap})</span><span class="price">${maxed ? 'MAX' : cost + ' coins'}</span></div>

        ${maxed ? '' : `<button class="wo-btn amber" data-bonusup="${itemId}" style="padding:6px 10px;font-size:12px" ${RUN.chips < cost ? 'disabled' : ''}>Level Up</button>`}
      </div>
    </div>`;
  }).filter(Boolean).join('');
  const seenForCapacity = new Set();
  const capacityRows = RUN.hero.items.map(itemId => {
    if (seenForCapacity.has(itemId)) return '';
    seenForCapacity.add(itemId);
    const item = ITEMS[itemId]; if (!item) return '';
    const lvl = itemMaxCardsLevel(itemId);
    const maxed = lvl >= ITEM_MAX_CARDS_BONUS_CAP;
    const cost = maxed ? 0 : itemMaxCardsTuneCost(lvl);
    const refund = lvl > 0 ? itemMaxCardsTuneCost(lvl - 1) : 0;
    const label = item.kind === 'storage' ? 'cards it can hold' : 'cards it can use at once';
    return `<div class="shopcard">
      <div class="hdr"><span><b>${item.name}</b> (Lv ${lvl}/${ITEM_MAX_CARDS_BONUS_CAP})</span><span class="price">${maxed ? 'MAX' : cost + ' coins'}</span></div>

      <div style="display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap">
        ${lvl > 0 ? `<button class="wo-btn gray" data-cardsdown="${itemId}" style="padding:6px 10px;font-size:12px">Refund (+${refund})</button>` : ''}
        ${maxed ? '' : `<button class="wo-btn amber" data-cardsup="${itemId}" style="padding:6px 10px;font-size:12px" ${RUN.chips < cost ? 'disabled' : ''}>+1 Capacity</button>`}
      </div>
    </div>`;
  }).filter(Boolean).join('');
  const seenForUses = new Set();
  const usesRows = RUN.hero.items.map(itemId => {
    if (seenForUses.has(itemId)) return '';
    seenForUses.add(itemId);
    const item = ITEMS[itemId]; if (!item || item.kind === 'storage' || !item.usesPerTurnPerLevel) return '';
    const lvl = itemUsesLevel(itemId);
    const maxed = lvl >= ITEM_MAX_USES_LEVEL;
    const cost = maxed ? 0 : itemUsesTuneCost(lvl);
    const refund = lvl > 0 ? itemUsesTuneCost(lvl - 1) : 0;

      <div class="hdr"><span><b>${item.name}</b> (Lv ${lvl}/${ITEM_MAX_USES_LEVEL})</span><span class="price">${maxed ? 'MAX' : cost + ' coins'}</span></div>
      <div class="note" style="margin:0 0 6px">Currently ${itemUsesCap(item, lvl)} use${itemUsesCap(item, lvl) > 1 ? 's' : ''} per turn.</div>
      <div style="display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap">
        ${lvl > 0 ? `<button class="wo-btn gray" data-usesdown="${itemId}" style="padding:6px 10px;font-size:12px">Refund (+${refund})</button>` : ''}
        ${maxed ? '' : `<button class="wo-btn amber" data-usesup="${itemId}" style="padding:6px 10px;font-size:12px" ${RUN.chips < cost ? 'disabled' : ''}>+1 Use Per Turn</button>`}
      </div>
    </div>`;
  }).filter(Boolean).join('');
  const visitNote = BLACKSMITH_VISIT.primary === null
    ? `Pick one card to pay for a main upgrade. You can pay a bit more to also upgrade a second card in the same visit.`
    : (BLACKSMITH_VISIT.secondary === null ? `You can pay extra to also upgrade one more card this visit, or move on.` : `You've used both upgrades this visit. Come back another time to tune more.`);
  return `${noticeHTML()}
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <div class="wo-eyebrow">Tuning Garage &middot; Run Upgrade (resets next run)</div>
        <h1>Tune Your <em>Fleet</em></h1>
        <div class="wo-sub">${visitNote}</div>
        ${currencyBar()}
        <div style="margin:12px 0">${rows}</div>
        ${itemLevelRows ? `<div class="hdr" style="margin-top:14px"><span>Item Upgrades</span><span>Not limited by this visit</span></div><div style="margin:6px 0 12px">${itemLevelRows}</div>` : ''}
        ${capacityRows ? `<div class="hdr" style="margin-top:14px"><span>Capacity Upgrades</span><span>Up to +${ITEM_MAX_CARDS_BONUS_CAP}</span></div><div style="margin:6px 0 12px">${capacityRows}</div>` : ''}
        ${usesRows ? `<div class="hdr" style="margin-top:14px"><span>Uses Per Turn Upgrades</span><span>Up to +${ITEM_MAX_USES_LEVEL}</span></div><div style="margin:6px 0 12px">${usesRows}</div>` : ''}
        <button class="wo-btn" id="leaveBlacksmithBtn">Back on the Road</button>
        <button class="wo-btn gray" id="openRunUpgradeFromBlacksmithBtn" style="margin-top:8px">Upgrades</button>
      </div>
    </div>
  `;
}
