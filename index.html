<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fleet Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2451e0; --blue-dark:#173aa8; --blue-light:#e8edfd;
    --white:#ffffff; --bg:#eef1fb; --ink:#12163a; --dim:#5c6280;
    --amber:#ff9f1c; --red:#e5484d; --green:#2fae66; --purple:#8a4fe0; --gold:#d4af00;
    --disp:'Aptos','Aptos Display',ui-sans-serif,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:16px}
  button{font-family:var(--disp);cursor:pointer}
  #app{max-width:1180px;margin:0 auto;padding:14px 18px 100px}
  .game-stage{}
  .treasure-modal{position:fixed;inset:0;background:#12163acc;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .treasure-modal .wo{max-width:560px;width:100%;margin:0}
  .treasure-prize{font-size:28px;font-weight:800;color:var(--blue-dark);text-align:center;margin:16px 0}

  .wo{background:var(--white);color:var(--ink);border:3px solid var(--blue);border-radius:12px;box-shadow:6px 6px 0 var(--blue-dark);padding:0;margin:16px 0;overflow:hidden}
  .wo-stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 16px,var(--blue) 16px 32px)}
  .wo-body{padding:20px 22px 24px}
  .wo-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  .wo h1{margin:6px 0 2px;font-size:clamp(24px,5.5vw,34px);line-height:1.05;font-weight:700;color:var(--blue-dark)}
  .wo h1 em{font-style:normal;color:var(--amber)}
  .wo-sub{font-family:var(--mono);font-size:13px;color:var(--dim);margin:8px 0 14px}
  .wo-btn{padding:12px 18px;font-size:15px;font-weight:700;letter-spacing:.01em;
    background:var(--blue);color:#fff;border:3px solid var(--blue-dark);border-radius:8px;box-shadow:3px 3px 0 var(--blue-dark)}
  .wo-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--blue-dark)}
  .wo-btn.amber{background:var(--amber);border-color:#c97600}
  .wo-btn.gray{background:#8a90ab;border-color:#5c6280}
  .wo-btn.purple{background:var(--purple);border-color:#5c2ea0}
  .wo-btn:disabled{opacity:.4;cursor:default}
  .wo-btn.half{width:48%}

  .panel{background:var(--white);border:2px solid var(--blue-light);border-radius:10px;padding:14px;margin-bottom:12px}
  .hdr{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;
    letter-spacing:.02em;color:var(--dim);margin-bottom:8px}
  .bar-wrap{height:14px;background:var(--blue-light);border-radius:7px;overflow:hidden;border:1px solid var(--blue-light)}
  .bar-fill{height:100%;transition:width .25s}
  .bar-hp{background:var(--red)} .bar-health{background:var(--blue)}

  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .currencies{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
  .cur{background:var(--bg);border:1px solid var(--blue-light);border-radius:6px;padding:4px 8px}
  .cur.gem{color:var(--purple)} .cur.fuel{color:var(--green)} .cur.energy{color:var(--gold)} .cur.chip{color:var(--amber)} .cur.pts{color:var(--blue-dark)}
  .cur{position:relative;cursor:help}.cur[title]:hover::after{content:attr(title);position:absolute;z-index:50;left:0;top:calc(100% + 6px);min-width:180px;background:#12163a;color:#fff;padding:7px 9px;border-radius:6px;font:11px var(--mono);white-space:normal;box-shadow:3px 3px 0 #173aa8}.bossPreview{border:2px solid var(--red);background:#fff7f7}.mapboss{font-size:12px;font-family:var(--mono);color:var(--dim);margin-top:8px}

  .duelHead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .duelSide h3{margin:0 0 4px;font-size:20px;color:var(--blue-dark)}
  .duelSide.opp{text-align:right}
  .vsMark{font-family:var(--mono);font-weight:800;color:var(--dim);font-size:13px}
  .bigicon{font-size:30px;line-height:1}

  .duelBoard{display:grid;grid-template-columns:1fr 66px 1fr;gap:8px;align-items:start}
  @media (max-width:700px){ .duelBoard{grid-template-columns:1fr} .duelHead{grid-template-columns:1fr 1fr} .vsMark{display:none} }
  .deckStack{text-align:center;padding-top:36px}.deckStack .card.back{cursor:default;pointer-events:none}
  .deckStack .card.back::after{content:none}

  .duelMatchup {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}
.matchupSide {
  min-width: 0;
}
.playerSide {
  border-left: 4px solid var(--blue);
}
.opponentSide {
  border-right: 4px solid var(--red);
}
@media (max-width: 800px) {
  .duelMatchup {
    grid-template-columns: 1fr;
  }
}
  .vslot{border:2px dashed var(--blue-light);border-radius:8px;padding:10px;width:160px;background:var(--bg);cursor:pointer}
  .vslot.filled{border-style:solid;border-color:var(--amber)}
  .vslot.ready{border-color:var(--green)}
  .vslot.defense{border-color:#4a7fd8}
  .vslot.poison{border-color:#5a8a3a}
  .vslot .vname{font-weight:700;font-size:15px;color:var(--blue-dark)}
  .vslot .vreq{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:3px 0}
  .vslot .vcards{display:flex;gap:3px;flex-wrap:wrap;min-height:30px;margin-top:6px}

  .card{width:38px;height:52px;border-radius:5px;background:var(--white);color:var(--ink);display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;
    font-size:14px;border:2px solid var(--blue);cursor:pointer;user-select:none;flex-shrink:0}
  .card.red{color:var(--red)}
  .card.selected{outline:3px solid var(--amber);transform:translateY(-6px)}
  .card.cursed{outline:2px solid var(--purple)}
  .card.mini{width:26px;height:36px;font-size:10px;cursor:pointer}
  .card.back{background:var(--blue);color:transparent;position:relative;margin:0 auto}
  .card.back::after{content:'?';color:var(--white);position:absolute;font-size:16px}
  .card.back.mini::after{font-size:12px}

  .hand{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
  .note{color:var(--dim);font-size:12px;margin:6px 0;font-family:var(--mono)}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--blue-light);font-family:var(--mono);font-size:12.5px}
  .kv b{color:var(--blue-dark)}
  .price{color:var(--amber);font-weight:700}
  .log{font-family:var(--mono);font-size:11.5px;color:var(--dim);max-height:110px;overflow-y:auto;
    border-top:1px dashed var(--blue-light);padding-top:8px;margin-top:8px}
  .log div{padding:2px 0}

  .mapwrap{position:relative;margin:0 auto;overflow-x:auto;overflow-y:visible;background:linear-gradient(180deg,#dfead7,#edf4e8);border:2px solid #c8d8bf;border-radius:12px;padding:10px}.mapnode-wrap{position:absolute;transform:translate(-50%,-50%)}
  .mapnode-wrap{position:absolute;transform:translate(-50%,-50%)}
  .mapnode-wrap:hover .tooltip{display:block}.mapnode-wrap .tooltip{top:120%;bottom:auto}
  .tooltip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-family:var(--mono);font-size:10.5px;line-height:1.5;
    padding:7px 10px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:2px 3px 6px #0004;text-align:left}
  .mapnode{position:relative;width:40px;height:40px;border-radius:50%;
    font-size:19px;display:flex;align-items:center;justify-content:center;border:2px solid;background:var(--white)}
  .mapnode.future{background:var(--blue-light);border-color:var(--blue-light);color:#9aa1c4;cursor:default;opacity:.85}
  .mapnode.farfuture{background:var(--blue-light);border-color:var(--blue-light);color:#c3cae8;cursor:default;opacity:.5}
  .mapnode.avail{background:var(--white);border-color:var(--amber);box-shadow:0 0 0 5px #ff9f1c33;cursor:pointer}
  .mapnode.done{background:var(--green);border-color:var(--green);color:#fff;cursor:default}

  .shopcard{border:1px solid var(--blue-light);background:var(--bg);border-radius:6px;padding:10px;margin-bottom:8px}
  .pickcard{border:2px solid var(--blue-light);background:var(--bg);border-radius:10px;padding:16px;width:160px;text-align:center}
  .pickcard .picon{font-size:46px}
  .pickcard .pname{font-weight:700;font-size:16px;color:var(--blue-dark);margin-top:6px}
  .pickcard .ptag{font-family:var(--mono);font-size:11px;color:var(--dim);margin:4px 0 10px}
  .pickcard.locked{opacity:.55}
  .pickcard.locked .picon{filter:grayscale(1)}
  .levelbar{height:8px;background:var(--blue-light);border-radius:4px;overflow:hidden;margin:6px 0}
  .levelbar i{display:block;height:100%;background:var(--gold)}

  .ic{width:1em;height:1em;vertical-align:-0.15em;display:inline-block}
  .vart{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1;flex-shrink:0}
  .vart img{width:100%;height:100%;object-fit:contain;display:block}
  .fleetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:700px){ .fleetgrid{grid-template-columns:1fr} }
  .vslot[draggable]{transition:box-shadow .12s,border-color .12s}
  .vslot.dragover{box-shadow:0 0 0 3px var(--amber);border-color:var(--amber)}
  .card[draggable]{cursor:grab}
  .card.dragging{opacity:.4}
  .attackChip{display:inline-block;margin-top:6px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.04em;
    background:var(--green);color:#fff;border-radius:6px;cursor:pointer;border:2px solid #1e8a4f}
  .attackChip:active{transform:translate(1px,1px)}
  .resourceRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .castleMenu{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .castleBtn{display:block;width:100%;text-align:center;padding:16px;font-family:var(--disp);font-size:16px;font-weight:700;color:#4a2f14;
    background:linear-gradient(180deg,#ecd6ab,#d8b077);border:2px solid #8a5a2b;border-radius:8px;box-shadow:0 3px 0 #6b431d}
  .castleBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b431d}
  .castleBtn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========== CARD MODEL ========== */
const SUITS = [{ s: '♦', color: 'red' }, { s: '♣', color: 'blk' }, { s: '♥', color: 'red' }, { s: '♠', color: 'blk' }];
const RANK_LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
function rankLabel(r) { return RANK_LABEL[r] || String(r); }
function cardValue(r) { if (r === 14) return 11; if (r >= 11) return 10; return r; }
function freshDeck() {
  const d = [];
  for (const su of SUITS) for (let r = 2; r <= 14; r++) d.push({ rank: r, suit: su.s, color: su.color, revealed: false });
  return d;
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* ========== HAND EVALUATION ========== */
const TIERS = ['High Card', 'Pair', 'Two Pair', 'Three of a Kind', 'Straight', 'Flush', 'Full House', 'Four of a Kind', 'Straight Flush'];
const TIER_MULT = [1.0, 1.5, 1.7, 2.0, 2.5, 2.8, 3.2, 4.0, 5.0];
function evaluateHand(cards) {
  if (!cards.length) return { tier: 0, label: 'No Cards', mult: 0 };
  const ranks = cards.map(c => c.rank);
  const rankCounts = {}; for (const r of ranks) rankCounts[r] = (rankCounts[r] || 0) + 1;
  const counts = Object.values(rankCounts).sort((a, b) => b - a);
  const suitSet = new Set(cards.map(c => c.suit));
  const isFlush = cards.length >= 3 && suitSet.size === 1;
  const uniqueRanks = [...new Set(ranks)].sort((a, b) => a - b);
  const isStraight = cards.length >= 3 && uniqueRanks.length === cards.length && (uniqueRanks[uniqueRanks.length - 1] - uniqueRanks[0] === cards.length - 1);
  let tier = 0;
  if (counts[0] === 4) tier = 7;
  else if (cards.length === 5 && counts[0] === 3 && counts[1] === 2) tier = 6;
  else if (isFlush && isStraight) tier = 8;
  else if (isFlush) tier = 5;
  else if (isStraight) tier = 4;
  else if (counts[0] === 3) tier = 3;
  else if (counts[0] === 2 && counts[1] === 2) tier = 2;
  else if (counts[0] === 2) tier = 1;
  else tier = 0;
  return { tier, label: TIERS[tier], mult: TIER_MULT[tier] };
}
function combinations(arr, k) {
  const results = [];
  function helper(start, combo) { if (combo.length === k) { results.push(combo.slice()); return; } for (let i = start; i < arr.length; i++) { combo.push(arr[i]); helper(i + 1, combo); combo.pop(); } }
  helper(0, []); return results;
}
function bestFiveFromPool(pool) {
  if (!pool.length) return { cards: [], tier: -1, label: 'Nothing', mult: 0 };
  if (pool.length <= 5) { const ev = evaluateHand(pool); return { cards: pool, ...ev }; }
  let best = null;
  for (const combo of combinations(pool, 5)) {
    const ev = evaluateHand(combo);
    const rankSum = combo.reduce((a, c) => a + c.rank, 0);
    if (!best || ev.tier > best.tier || (ev.tier === best.tier && rankSum > best.rankSum)) best = { cards: combo, ...ev, rankSum };
  }
  return best;
}
function damageFor(cards, mult) { return Math.round(cards.reduce((a, c) => a + cardValue(c.rank) + (c.bonus || 0), 0) * mult); }
function isConsecutive(cards) {
  if (cards.length < 2) return false;
  const ranks = [...new Set(cards.map(c => c.rank))].sort((a, b) => a - b);
  if (ranks.length !== cards.length) return false;
  return ranks[ranks.length - 1] - ranks[0] === cards.length - 1;
}
function straightMult(len) { return 1 + (len - 2) * 0.45; }

/* ========== ICON SYSTEM (no emoji) ========== */
// Small inline SVGs for currencies and UI glyphs, so nothing depends on an external image file.
const ICON = {
  coin:   `<svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="11" font-family="Arial" fill="currentColor">$</text></svg>`,
  gem:    `<svg viewBox="0 0 24 24" class="ic"><path d="M4 9l4-6h8l4 6-10 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 9h16M8 3l2 6-2 12M16 3l-2 6 2 12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`,
  fuel:   `<svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="11" height="17" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h3" stroke="currentColor" stroke-width="2"/><path d="M15 8h2a2 2 0 0 1 2 2v7a1.5 1.5 0 0 0 3 0v-5l-2-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  energy: `<svg viewBox="0 0 24 24" class="ic"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>`,
  star:   `<svg viewBox="0 0 24 24" class="ic"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7L5.8 21l1.6-7-5.4-4.8 7.1-.7z" fill="currentColor"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" class="ic"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  poison: `<svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="7.3" cy="9" r="1.5" fill="currentColor"/><circle cx="16.7" cy="9" r="1.5" fill="currentColor"/><circle cx="7.3" cy="15" r="1.5" fill="currentColor"/><circle cx="16.7" cy="15" r="1.5" fill="currentColor"/></svg>`,
  lock:   `<svg viewBox="0 0 24 24" class="ic"><rect x="5" y="11" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  gift:   `<svg viewBox="0 0 24 24" class="ic"><rect x="3" y="9" width="18" height="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M12 9v12" stroke="currentColor" stroke-width="2"/><path d="M12 9c-2-4-8-4-8 0M12 9c2-4 8-4 8 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  wrench: `<svg viewBox="0 0 24 24" class="ic"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  hammer: `<svg viewBox="0 0 24 24" class="ic"><path d="M3 21l6-6M13 8l3-3 3 3-3 3M9 12l-3 3 3 3 3-3-3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  cart:   `<svg viewBox="0 0 24 24" class="ic"><path d="M3 4h2l2 11h11l2-8H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="19" r="1.4" fill="currentColor"/><circle cx="16" cy="19" r="1.4" fill="currentColor"/></svg>`,
  castle: `<svg viewBox="0 0 24 24" class="ic"><path d="M4 21V9l2-2v2h2V7l2-2 2 2v2h2V7l2 2v12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  fog:    `<svg viewBox="0 0 24 24" class="ic"><path d="M12 7a4 4 0 1 0-3.6 5.8M4 15h16M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  truck:  `<svg viewBox="0 0 24 24" class="ic"><path d="M2 6h11v10H2zM13 10h5l3 3v3h-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="18" r="1.6" fill="currentColor"/><circle cx="17" cy="18" r="1.6" fill="currentColor"/></svg>`,
  fire:   `<svg viewBox="0 0 24 24" class="ic"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c1.5 1 2 3 2 4.5A5.5 5.5 0 0 1 6 15.5C6 9 12 8 12 2z" fill="currentColor"/></svg>`,
  curse:  `<svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
};
// Renders vehicle/opponent art. If `entity.image` fails to load (because the PNG hasn't been
// added yet), it swaps itself out for entity.icon so nothing ever shows a broken image icon.
function art(entity, px) {
  const fb = (entity && entity.icon) || ICON.truck;
  if (entity && entity.image) {
    return `<span class="vart" style="width:${px}px;height:${px}px;font-size:${px}px" data-fb="${fb.replace(/"/g,'&quot;')}"><img src="${entity.image}" alt="" onerror="this.outerHTML=this.closest('.vart').dataset.fb"></span>`;
  }
  return `<span class="vart" style="width:${px}px;height:${px}px;font-size:${px}px">${fb}</span>`;
}
const PLAYER_ART = { name: 'Your Fleet', icon: '🚚', image: 'vehicles/work-truck.png' };
function fleetLabel() { return META.playerName ? `${META.playerName}'s Fleet` : 'Your Fleet'; }
// Read-only box(es) showing what the opponent can attack with — mirrors the player's vslot UI.
// Supports a future opp.attacks array (multiple named attacks); falls back to their single generic attack.
function opponentAttackBoxHTML(opp) {
  if (opp.locked) {
    const remaining = Math.max(0, opp.lockThreshold - opp.lockProgress);
    return `<div class="vslot" style="cursor:default">
      <div class="vname">${art(opp, 18)} ${opp.name}</div>
      <div class="vreq">
        <span class="vart" style="width:12px;height:12px;font-size:12px">${ICON.lock}</span>
        Locked - ${remaining} more card value clears it
      </div>
      <div class="note" style="margin-top:4px">Then hits for ${opp.lockAttack} damage</div>
    </div>`;
  }

  const attacks = (opp.attacks && opp.attacks.length)
    ? opp.attacks
    : [{ name: opp.name, minTier: opp.minTier, straightLen: opp.straightLen }];

  return attacks.map(a => {
    let reqText = '';
    let damageText = '';

    if (a.straightLen) {
      reqText = `Any ${a.straightLen} cards in a row`;
      damageText = `Damage: Straight value`;
    } else if (a.minTier === 0) {
      reqText = 'Any 1 card';
      damageText = 'Damage: Card value';
    } else {
      reqText = `${TIERS[a.minTier]} or better`;
      damageText = `Damage: Hand value`;
    }

    return `<div class="vslot" style="cursor:default">
      <div class="vname">${art(opp, 18)} ${a.name}</div>
      <div class="vreq">${reqText}</div>
      <div class="note" style="margin-top:4px">${damageText}</div>

/* ========== MAP GENERATION (21-space horizontal route with a central Fleet Castle) ========== */
const ROWS = 19;
const WORLD_COUNT = 1;
function pickNodeType(forcedType) {
  if (forcedType) return forcedType;
  const r = Math.random();
  if (r < 0.58) return 'battle';
  if (r < 0.72) return 'rest';
  if (r < 0.84) return 'blacksmith';
  return 'treasure';
}
function generateMap() {
  const nodes = [];
  const edges = [];
  const tierForRow = r => Math.min(OPPONENT_TIERS.length - 1, Math.floor(r / 3));

  // World 1: 20 regular spaces, then the boss = 21 total spaces.
  // The first three spaces are always battles. Shops are fixed to one in each half.
  const shopRows = new Set([5, 15]);
  const castleRow = 10;
  const rowCounts = [
    1,2,2,2,2,2,2,3,2,2,1,2,2,2,2,2,3,2,2,2
  ];

  for (let r = 0; r < ROWS; r++) {
    const count = rowCounts[r];
    const row = [];
    const tierPool = shuffle([...(OPPONENT_TIERS[tierForRow(r)])]);

    for (let c = 0; c < count; c++) {
      let type;
      if (r <= 2) type = 'battle';
      else if (r === castleRow) type = 'castle';
      else if (shopRows.has(r)) type = 'shop';
      else type = pickNodeType();

      row.push(type === 'battle'
        ? { type, opponent: tierPool[c % tierPool.length] }
        : { type });
    }
    nodes.push(row);
  }

  nodes.push([{ type: 'battle', opponent: BOSS }]);

  // Every node connects forward. Connections are deliberately local and visible,
  // so the player can understand exactly which choices lead to which next spaces.
  for (let r = 0; r < nodes.length - 1; r++) {
    const cur = nodes[r], next = nodes[r + 1];
    for (let c = 0; c < cur.length; c++) {
      const target = next.length === 1 ? 0 : Math.min(next.length - 1, Math.round(c * (next.length - 1) / Math.max(1, cur.length - 1)));
      edges.push({ fromRow:r, fromCol:c, toRow:r+1, toCol:target });
      if (next.length > 1 && cur.length === 1) {
        for (let nc = 0; nc < next.length; nc++) {
          if (!edges.some(e => e.fromRow===r && e.fromCol===c && e.toRow===r+1 && e.toCol===nc))
            edges.push({ fromRow:r, fromCol:c, toRow:r+1, toCol:nc});
        }
      }
    }
    // Ensure every next node has a parent.
    for (let nc = 0; nc < next.length; nc++) {
      if (!edges.some(e => e.toRow===r+1 && e.toCol===nc)) {
        const from = Math.min(cur.length-1, Math.round(nc * (cur.length-1) / Math.max(1,next.length-1)));
        edges.push({ fromRow:r, fromCol:from, toRow:r+1, toCol:nc });
      }
    }
  }
  return { nodes, edges };
}

function availableNextNodes() {
  if (RUN.currentRow === -1) return [{ row: 0, col: 0 }];
  return RUN.map.edges.filter(e => e.fromRow === RUN.currentRow && e.fromCol === RUN.currentCol).map(e => ({ row: e.toRow, col: e.toCol }));
}
function payTravelCost() {
  RUN.fuel -= FUEL_COST_PER_MOVE;
  RUN.energy = Math.min(RUN.maxEnergy, RUN.energy + ENERGY_PER_MOVE);
  if (RUN.fuel < 0) {
    RUN.fuel = 0;
    const reduction = META.levels.fuelpen * 2;
    const loss = Math.max(3, BASE_GAS_PENALTY - reduction);
    META.points = Math.max(0, META.points - loss);
    RUN.scoreThisRun = Math.max(0, RUN.scoreThisRun - loss);
    saveMeta();
    RUN.lastNotice = `Ran out of fuel — lost ${loss} points getting towed to the next stop.`;
  }
}
function commitNode(row, col) { RUN.currentRow = row; RUN.currentCol = col; RUN.path.push({ row, col }); saveRun(); }
function selectNode(row, col) {
  payTravelCost();
  const node = RUN.map.nodes[row][col];
  if (node.type === 'battle') { startBattle(node.opponent, row, col); return; }
  commitNode(row, col);
  if (node.type === 'castle') render(castleMenuScreen());
  else if (node.type === 'shop') { RETURN_TO_CASTLE_MENU = false; render(shopScreen()); }
  else if (node.type === 'rest') render(garageScreen());

  else if (node.type === 'treasure') { const found = rollTreasure(); render(treasureScreen(found)); }
}

    <div class="note" style="margin:10px 0">Match a pair to win a random reward. A wrong guess uses one of your attempts.</div>
    <button class="wo-btn gray" id="leaveMatchBtn">Back to Castle</button>
  </div></div>`;
}

let BLACKSMITH_OPTIONS = null;
let BLACKSMITH_VISIT = null; // { primary: idx|null, secondary: idx|null } — one paid upgrade, plus one optional paid add-on, per visit
function tuneCost(bonus, isSecondary) { const base = 20 * Math.pow(2, bonus / 3); return Math.round(isSecondary ? base * 1.5 : base); }
function pickBlacksmithOptions() {
  const all = [];
  for (const su of SUITS) for (let r = 2; r <= 14; r++) all.push({ rank: r, suit: su.s, color: su.color });
  return shuffle(all).slice(0, 3);
}
function findBoost(rank, suit) { return RUN.cardBoosts.find(b => b.rank === rank && b.suit === suit); }
function boostCard(rank, suit) {
  let b = findBoost(rank, suit);
  if (!b) { b = { rank, suit, bonus: 0 }; RUN.cardBoosts.push(b); }
  if (b.bonus >= 9) return;
  b.bonus += 3;
  saveRun();
}
function rollTreasure() {
  const choices = [
    { kind:'coins', label:'Coins', amount:20 + Math.floor(Math.random()*31), icon: ICON.coin },
    { kind:'fuel', label:'Fuel', amount:6 + Math.floor(Math.random()*7), icon: ICON.fuel },
    { kind:'gems', label:'Gems', amount:1 + Math.floor(Math.random()*2), icon: ICON.gem },
    { kind:'energy', label:'Energy', amount:5 + Math.floor(Math.random()*6), icon: ICON.energy },
    { kind:'points', label:'Points', amount:10 + Math.floor(Math.random()*16), icon: ICON.star }
  ];
  const prize = choices[Math.floor(Math.random()*choices.length)];
  let actual = prize.amount;
  if (prize.kind === 'coins') { const before=RUN.chips; RUN.chips=Math.min(999, RUN.chips+prize.amount); actual=RUN.chips-before; }
  if (prize.kind === 'fuel') { const before=RUN.fuel; RUN.fuel=Math.min(RUN.maxFuel, RUN.fuel+prize.amount); actual=RUN.fuel-before; }
  if (prize.kind === 'gems') { const before=RUN.gems; RUN.gems=Math.min(RUN.maxGems, RUN.gems+prize.amount); actual=RUN.gems-before; }
  if (prize.kind === 'energy') { const before=RUN.energy; RUN.energy=Math.min(RUN.maxEnergy, RUN.energy+prize.amount); actual=RUN.energy-before; }
  if (prize.kind === 'points') { earnPoints(prize.amount); }
  saveRun();
  return { ...prize, amount: actual };
}
function endRun(won) {
  const bonus = Math.round(RUN.path.length * (won ? 5 : 2) + (won ? 40 : 0));
  earnPoints(bonus);
  META.bestRun = Math.max(META.bestRun, RUN.path.length);
  META.highScore = Math.max(META.highScore, RUN.scoreThisRun);
  META.runsPlayed++;
  saveMeta();
  clearRunSave();
  render(runEndScreen(won, bonus));
}

/* ========== BATTLE LOGIC ========== */
function startBattle(opponentDef, row, col) {
  BATTLE = {
    opponent: { ...opponentDef, hpNow: opponentDef.hp, poisonStacks: [], lockProgress: 0 }, row, col, castleStage: CASTLE_STATE?.stage || 0,
    deck: shuffle(freshDeck()), discard: [],
    oppDeck: shuffle(freshDeck()), oppDiscard: [],
    hand: [], oppPool: [], usedThisTurn: new Set(), scoutedThisTurn: false, abilityUsedThisTurn: false, opponentStunned: false,
    playerArmor: 0, turn: 1, slots: {}, turnDiscard: [], logLines: [],
  };
  BATTLE.deck.forEach(c => { const b = RUN.cardBoosts.find(x => x.rank === c.rank && x.suit === c.suit); if (b) c.bonus = b.bonus; });
  drawCards(Math.min(5, RUN.handSize));
  drawOpponentCards();
  for (let i = 0; i < 1 + META.levels.reveal; i++) {
    const hidden = BATTLE.oppPool.filter(c => !c.revealed);
    if (!hidden.length) break;
    hidden[(Math.random() * hidden.length) | 0].revealed = true;
  }
  render(battleScreen());
}
function drawCards(n) {
  for (let i = 0; i < n && BATTLE.hand.length < RUN.handSize; i++) {
    if (!BATTLE.deck.length) { if (!BATTLE.discard.length) break; BATTLE.deck = shuffle(BATTLE.discard); BATTLE.discard = []; }
    BATTLE.hand.push(BATTLE.deck.pop());
  }
}
function drawOpponentCards() {
  BATTLE.scoutedThisTurn = false; BATTLE.abilityUsedThisTurn = false;
  for (let i = 0; i < BATTLE.opponent.drawRate; i++) {
    if (!BATTLE.oppDeck.length) { if (!BATTLE.oppDiscard.length) break; BATTLE.oppDeck = shuffle(BATTLE.oppDiscard); BATTLE.oppDiscard = []; }
    const c = BATTLE.oppDeck.pop();
    c.revealed = Math.random() < revealFraction(BATTLE.row);
    BATTLE.oppPool.push(c);
    if (BATTLE.opponent.locked) BATTLE.opponent.lockProgress += cardValue(c.rank);
  }
}
function battleLog(msg) { BATTLE.logLines.unshift(msg); if (BATTLE.logLines.length > 30) BATTLE.logLines.pop(); }

// Curse: an opponent can curse 1, 2, 3, or a random number of cards currently in the player's hand.
// If the player hasn't played a cursed card by the end of the turn it was checked, it deals its damage and clears.
function tryApplyCurse() {
  const spec = BATTLE.opponent.curse;
  if (!spec) return;
  if (Math.random() > (spec.chance ?? 1)) return;
  const eligible = BATTLE.hand.filter(c => !c.curse);
  if (!eligible.length) return;
  const count = spec.count === 'random' ? 1 + Math.floor(Math.random() * Math.min(3, eligible.length)) : Math.min(spec.count, eligible.length);
  const chosen = shuffle([...eligible]).slice(0, count);
  chosen.forEach(c => { c.curse = spec.amount; });
  battleLog(`${BATTLE.opponent.name} curses ${count} card${count > 1 ? 's' : ''} in your hand — play ${count > 1 ? 'them' : 'it'} next turn or take ${spec.amount} damage each.`);
}
// Burn: a decaying 3-turn damage-over-time effect. The player can detonate it early for whatever
// the current stage is worth, forfeiting the smaller remaining ticks.
function detonateBurn() {
  if (!BATTLE || !BATTLE.opponent.burn) return;
  const b = BATTLE.opponent.burn;
  const dmg = b.stages[b.stageIdx] || 0;
  BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - dmg);
  battleLog(`Detonated the burn early for ${dmg} damage, forfeiting the remaining ticks.`);
  BATTLE.opponent.burn = null;
  saveRun();
  if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }
  render(battleScreen());
}

function toggleCardSelect(i) { const pos = selectedIdx.indexOf(i); if (pos === -1) selectedIdx.push(i); else selectedIdx.splice(pos, 1); render(battleScreen()); }
function assignSelectedTo(slotKey) {
  if (!selectedIdx.length) return;

  const parts = slotKey.split(':');
  const instanceId = parts[0];
  const attackPart = parts.slice(1).join(':');
  const match = attackPart.match(/^(.+)_(\d+)$/);

  if (!match) return;

  const attId = match[1];
  const att = ATTACKS[attId];

  if (!att) return;

  if (!BATTLE.slots[slotKey]) BATTLE.slots[slotKey] = [];

  const room = att.slot - BATTLE.slots[slotKey].length;
  if (room <= 0) return;

  const take = selectedIdx
    .filter(i => !BATTLE.usedThisTurn.has(i))
    .filter(i => !BATTLE.slots[slotKey].includes(i))
    .slice(0, room);

  BATTLE.slots[slotKey].push(...take);
  selectedIdx = [];

  render(battleScreen());
}
function removeCardFromSlot(vId, idx) { if (!BATTLE.slots[vId]) return; BATTLE.slots[vId] = BATTLE.slots[vId].filter(i => i !== idx); render(battleScreen()); }
function clearSlot(vId) { BATTLE.slots[vId] = []; render(battleScreen()); }
function markSelectedForDiscard() {
  if (!selectedIdx.length) return;
  selectedIdx.forEach(i => { if (!BATTLE.turnDiscard.includes(i)) BATTLE.turnDiscard.push(i); });
  selectedIdx = [];
  render(battleScreen());
}
function unmarkDiscard(i) { BATTLE.turnDiscard = BATTLE.turnDiscard.filter(x => x !== i); render(battleScreen()); }

function sortHand(mode) {
  const suitOrder = {'♠':0,'♥':1,'♦':2,'♣':3};
  BATTLE.hand.sort((a,b)=> mode==='suit' ? ((suitOrder[a.suit]-suitOrder[b.suit]) || (a.rank-b.rank)) : ((a.rank-b.rank) || (suitOrder[a.suit]-suitOrder[b.suit])));
  selectedIdx=[]; render(battleScreen());
}

function scoutOpponent() {
  const cost = 10;
  if (RUN.chips < cost || BATTLE.scoutedThisTurn) return;
  RUN.chips -= cost; BATTLE.scoutedThisTurn = true;
  const hidden = BATTLE.oppPool.filter(c => !c.revealed);
  const revealCount = Math.max(1, Math.ceil(BATTLE.oppPool.length / 2));
  shuffle(hidden).slice(0, revealCount).forEach(c => c.revealed = true);
  battleLog(`Scouted the ${BATTLE.opponent.name}.`);
  saveRun(); render(battleScreen());
}
function drawWithGem() {
  if (RUN.gems < 1) return;
  RUN.gems -= 1;
  const n = 1 + META.levels.gem;
  for (let i = 0; i < n; i++) {
    if (!BATTLE.deck.length) { if (!BATTLE.discard.length) break; BATTLE.deck = shuffle(BATTLE.discard); BATTLE.discard = []; }
    BATTLE.hand.push(BATTLE.deck.pop());
  }
  battleLog(`Spent a gem, drew ${n} card${n > 1 ? 's' : ''}.`);
  saveRun(); render(battleScreen());
}
function useAbility(vId) {
  const v = VEHICLES[vId];
  if (!v.ability || BATTLE.abilityUsedThisTurn || RUN.energy < v.ability.cost) return;
  RUN.energy -= v.ability.cost;
  BATTLE.abilityUsedThisTurn = true;
  BATTLE.opponentStunned = true;
  battleLog(`${v.name} used ${v.ability.name}! They won't counter-attack this turn.`);
  saveRun(); render(battleScreen());
}
function executePlayerAttack(instance, attId, index) {
  const v = VEHICLES[instance.vehicleId];
  const att = ATTACKS[attId];
  const slotKey = `${instance.instanceId}:${attId}_${index}`;
  const idxs = BATTLE.slots[slotKey] || [];

  if (!idxs.length) {
    battleLog(`${v.name} [${att.name}] has no cards assigned.`);
    render(battleScreen());
    return;
  }

  // Prevent cards already used this turn from being used again.
  if (idxs.some(i => BATTLE.usedThisTurn.has(i))) {
    battleLog(`One or more cards in ${att.name} were already used this turn.`);
    render(battleScreen());
    return;
  }

  const cards = idxs.map(i => BATTLE.hand[i]);

  let ready = false;
  let label = '';
  let mult = 0;

  if (att.straightLen) {
    ready = cards.length === att.straightLen && isConsecutive(cards);
    label = ready
      ? `${att.straightLen}-Card Straight`
      : 'Not a straight';
    mult = straightMult(att.straightLen);
  } else {
    const evalRes = evaluateHand(cards);
    ready = evalRes.tier >= att.minTier;
    label = evalRes.label;
    mult = evalRes.mult;
  }

  if (!ready) {
    battleLog(`${v.name} [${att.name}] — ${label || 'invalid play'}. Requirement unmet.`);
    render(battleScreen());
    return;
  }

  let amount = damageFor(cards, mult || 1);

  // Admin Vehicle Pair Bonus
  if (att.bonusType === 'admin') {
    if (cards.length === 2 && evaluateHand(cards).tier === 1) {
      const pairBonus = 1.5 + (RUN.adminTuneLvl || 0) * 0.5;
      amount = Math.round(amount * pairBonus);
    }
  }

  // Resolve the attack's effect.
  if (att.kind === 'defense') {
    BATTLE.playerArmor += amount;
    battleLog(`${v.name} [${att.name}] — ${label}! +${amount} armor.`);

  } else if (att.kind === 'poison') {
    const poisonAmount = Math.round(amount / 2);
    BATTLE.opponent.poisonStacks = BATTLE.opponent.poisonStacks || [];
    BATTLE.opponent.poisonStacks.push(poisonAmount);
    battleLog(`${v.name} [${att.name}] — ${label}! Applied ${poisonAmount} poison.`);

  } else if (att.kind === 'burn') {
    const stages = [amount, Math.round(amount / 2), Math.round(amount / 4)];
    BATTLE.opponent.burn = { stages, stageIdx: 0 };
    battleLog(`${v.name} [${att.name}] — ${label}! Burn applied for ${stages.join(' + ')} damage.`);

  } else {
    BATTLE.opponent.hpNow = Math.max(0, BATTLE.opponent.hpNow - amount);
    battleLog(`${v.name} [${att.name}] — ${label}! ${amount} damage.`);
  }

  // These cards have now been used this turn.
  idxs.forEach(i => BATTLE.usedThisTurn.add(i));

  // Remove the cards from this attack slot.
  BATTLE.slots[slotKey] = [];

  saveRun();

  // If the attack killed the opponent, finish the battle immediately.
  if (BATTLE.opponent.hpNow <= 0) {
    winBattle();
    return;
  }

  // Otherwise, the turn continues.
  render(battleScreen());
}
function endTurn() {
  // Resolve any cards the opponent cursed on a previous turn: played it, curse clears; left it, take the hit.
  BATTLE.hand.forEach((c, i) => {
  if (c.curse) {
    if (BATTLE.usedThisTurn.has(i)) {
      battleLog(`Cursed ${rankLabel(c.rank)}${c.suit} played — curse cleared.`);
    } else {
      RUN.health = Math.max(0, RUN.health - c.curse);
      battleLog(`Cursed ${rankLabel(c.rank)}${c.suit} left unplayed — you take ${c.curse} damage! Health: ${RUN.health}/${RUN.maxHealth}.`);
    }
    delete c.curse;
  }
});

  if (BATTLE.turnDiscard.length) battleLog(`Discarded ${BATTLE.turnDiscard.length} card${BATTLE.turnDiscard.length > 1 ? 's' : ''}.`);
  const evvanUsed = (BATTLE.slots.evvan || []).length > 0 && evaluateHand((BATTLE.slots.evvan || []).map(i => BATTLE.hand[i])).tier >= VEHICLES.evvan.minTier;
  const allRemove = new Set([...BATTLE.usedThisTurn, ...BATTLE.turnDiscard]);
  const sorted = [...allRemove].sort((a, b) => b - a);
  let refunded = false;
  for (const i of sorted) {
    if (evvanUsed && !refunded && usedIdx.has(i)) { refunded = true; continue; }
    BATTLE.discard.push(BATTLE.hand[i]);
    BATTLE.hand.splice(i, 1);
  }
  BATTLE.slots = {};
BATTLE.turnDiscard = [];
BATTLE.usedThisTurn = new Set();
selectedIdx = [];

  if (BATTLE.opponent.hpNow <= 0) { winBattle(); return; }

  if (BATTLE.opponentStunned) {
    battleLog(`${BATTLE.opponent.name} is stunned and doesn't counter-attack.`);
    BATTLE.opponentStunned = false;
  } else if (BATTLE.opponent.locked) {
    if (BATTLE.opponent.lockProgress >= BATTLE.opponent.lockThreshold) {
      let oppDmg = BATTLE.opponent.lockAttack;
      if (BATTLE.playerArmor > 0) {
        const blocked = Math.min(BATTLE.playerArmor, oppDmg);
        BATTLE.playerArmor -= blocked; oppDmg -= blocked;
        battleLog(`Your armor absorbed ${blocked} damage.`);
      }
      RUN.health = Math.max(0, RUN.health - oppDmg);
      battleLog(`${BATTLE.opponent.name} clears the lock and hits for a flat ${oppDmg}! It locks back up. Your health: ${RUN.health}/${RUN.maxHealth}.`);
      BATTLE.opponent.lockProgress = 0;
      BATTLE.oppPool = [];
    } else {
      battleLog(`${BATTLE.opponent.name} is still locked (${BATTLE.opponent.lockProgress}/${BATTLE.opponent.lockThreshold}). No attack yet.`);
    }
  } else {
    const best = bestFiveFromPool(BATTLE.oppPool);
    if (best.tier >= BATTLE.opponent.minTier) {
      let oppDmg = damageFor(best.cards, best.mult);
      if (BATTLE.playerArmor > 0) {
        const blocked = Math.min(BATTLE.playerArmor, oppDmg);
        BATTLE.playerArmor -= blocked; oppDmg -= blocked;
        battleLog(`Your armor absorbed ${blocked} damage.`);
      }
      RUN.health = Math.max(0, RUN.health - oppDmg);
      const usedText = best.cards.map(c => `${rankLabel(c.rank)}${c.suit}`).join(' ');
      let specialLog = '';
      const spec = BATTLE.opponent.special;
      if (spec?.type === 'lifesteal') {
        const healAmt = Math.round(oppDmg * (spec.pct ?? 0.5));
        if (healAmt > 0) {
          BATTLE.opponent.hpNow = Math.min(BATTLE.opponent.hp, BATTLE.opponent.hpNow + healAmt);
          specialLog = ` It heals ${healAmt}.`;
        }
      } else if (spec?.type === 'redSteal') {
        const redCount = best.cards.filter(c => c.color === 'red').length;
        if (redCount >= (spec.redThreshold ?? 3)) {
          const fuelStolen = Math.min(RUN.fuel, spec.fuelSteal ?? 1);
          RUN.fuel -= fuelStolen;
          for (let i = 0; i < (spec.extraDraw ?? 1); i++) {
            if (!BATTLE.oppDeck.length) { if (!BATTLE.oppDiscard.length) break; BATTLE.oppDeck = shuffle(BATTLE.oppDiscard); BATTLE.oppDiscard = []; }
            const c = BATTLE.oppDeck.pop(); c.revealed = Math.random() < revealFraction(BATTLE.row); BATTLE.oppPool.push(c);
          }
          specialLog = ` It steals ${fuelStolen} fuel and draws an extra card!`;
        }
      }
      battleLog(`${BATTLE.opponent.name} played ${best.label} (${usedText}) — ${oppDmg} damage.${specialLog} Your health: ${RUN.health}/${RUN.maxHealth}.`);
      BATTLE.oppPool = BATTLE.oppPool.filter(c => !best.cards.includes(c));
    } else { battleLog(`${BATTLE.opponent.name} didn't have enough to attack this turn.`); }
    tryApplyCurse();
  }

  if (RUN.health <= 0) { render(nodeResultScreen(false, {})); return; }

  BATTLE.turn++;
  drawCards(RUN.drawPerTurn);
  drawOpponentCards();
  battleLog(`— Turn ${BATTLE.turn} —`);
  render(battleScreen());
}
function winBattle(outlast) {
  if (BATTLE.castleStage || CASTLE_STATE?.stage) {
    const stage = CASTLE_STATE?.stage || BATTLE.castleStage;
    const reward = stage === 1
      ? { coins: 30, gems: 2, fuel: 6 }
      : { coins: 70, gems: 4, fuel: 10 };
    RUN.chips += reward.coins;
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + reward.gems);
    RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + reward.fuel);
    if (stage === 1) CASTLE_STATE.firstDone = true;
    if (stage === 2) CASTLE_STATE.secondDone = true;
    saveRun();
    render(castleDungeonScreen(`You won Battle ${stage}. Reward: +${reward.coins} coins, +${reward.gems} gems, +${reward.fuel} fuel.`));
    return;
  }
  const scale = outlast ? 0.7 : 1;
  let chipReward = Math.round((22 + BATTLE.opponent.hp / 7) * scale);
  const gemReward = 2 + BATTLE.row;
  const fuelReward = 3 + BATTLE.row;
  let pointsReward = Math.round((5 + BATTLE.row * 3) * scale);
  const exactKillBonus = BATTLE.exactKill && !outlast;
  if (exactKillBonus) { chipReward += 25; pointsReward += 15; }
  RUN.chips += chipReward; RUN.gems = Math.min(RUN.maxGems, RUN.gems + gemReward); RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + fuelReward);
  earnPoints(pointsReward);
  battleLog(outlast ? `You outlasted the ${BATTLE.opponent.name}!` : `${BATTLE.opponent.name} is done for!`);
  if (exactKillBonus) battleLog(`Perfect elimination — exact kill bonus: +25 coins, +15 points!`);
  battleLog(`+${chipReward} coins, +${gemReward} gems, +${fuelReward} fuel, +${pointsReward} points.`);
  render(nodeResultScreen(true, { chipReward, gemReward, fuelReward, pointsReward, exactKillBonus }));
}

function mapScreen() {
  const rows = RUN.map.nodes;
  const colW = 118, rowY = [170, 90, 250];
  const totalW = rows.length * colW + 50;
  const totalH = 420;
  const avail = availableNextNodes();
  const visibleRange = 3 + META.levels.range;
  let svgLines = '';

  for (const e of RUN.map.edges) {
    const x1 = 25 + e.fromRow * colW + colW/2;
    const x2 = 25 + e.toRow * colW + colW/2;
    const y1 = rowY[Math.min(e.fromCol,rowY.length-1)];
    const y2 = rowY[Math.min(e.toCol,rowY.length-1)];
    const traveled = RUN.path.some(p=>p.row===e.fromRow&&p.col===e.fromCol) &&
                     RUN.path.some(p=>p.row===e.toRow&&p.col===e.toCol);
    svgLines += `<path d="M ${x1} ${y1} C ${x1+28} ${y1}, ${x2-28} ${y2}, ${x2} ${y2}"
      fill="none" stroke="${traveled?'#ff9f1c':'#7f9180'}" stroke-width="${traveled?5:3}" stroke-linecap="round"/>`;
  }

  let nodesHTML='';
  const NODE_ICON={shop:ICON.cart,rest:ICON.wrench,blacksmith:ICON.hammer,treasure:ICON.gift,castle:ICON.castle};
  const NODE_TITLE={shop:'Dealership',rest:'Pit Stop',blacksmith:'Tuning Garage',treasure:'Supply Cache',castle:'Fleet Castle'};
  for(let r=0;r<rows.length;r++) for(let c=0;c<rows[r].length;c++){
    const node=rows[r][c], x=25+r*colW+colW/2, y=rowY[Math.min(c,rowY.length-1)];
    const isDone=RUN.path.some(p=>p.row===r&&p.col===c);
    const isAvail=avail.some(n=>n.row===r&&n.col===c);
    const isBoss=r===rows.length-1;
    const withinSight=r<=RUN.currentRow+visibleRange;
    const showReal=isBoss||isDone||isAvail||withinSight;
    const cls=isDone?'done':isAvail?'avail':withinSight?'future':'farfuture';
    const icon=!showReal?`<span class="vart" style="width:19px;height:19px;font-size:19px">${ICON.fog}</span>`:(node.type==='battle'?art(node.opponent,19):`<span class="vart" style="width:19px;height:19px;font-size:19px">${NODE_ICON[node.type]}</span>`);
    const title=!showReal?'Unscouted':(node.type==='battle'?node.opponent.name:NODE_TITLE[node.type]);
    let tip;
    if(!showReal) tip='Move closer to scout this stop.';
    else if(node.type==='battle'){
      const o=node.opponent;
      tip=`${o.name}<br>HP: ${o.hp}<br>Needs ${TIERS[o.minTier]}+<br>Draws ${o.drawRate}/turn${o.attackInfo?`<br>${o.attackInfo}`:''}${o.boss?'<br><b>World Boss</b>':''}`;
    } else if(node.type==='shop') tip='Buy vehicles with coins. World 1 has only two shops.';
    else if(node.type==='rest') tip='Restore 30 health.';
    else if(node.type==='blacksmith') tip='Upgrade a card or tune your Admin Vehicle.';
    else if(node.type==='castle') tip='Choose battles, shopping, refueling, a matching game, or other rewards.';
    else tip='Find coins, fuel, and gems.';

    nodesHTML+=`<div class="mapnode-wrap ${isBoss?'bossnode ':''}${c===0?'toprow':c===1?'midrow':'bottomrow'}" style="left:${(x/totalW*100)}%;top:${y}px">
      <button class="mapnode ${cls}" ${showReal?`data-nodeinfo="${r}:${c}"`:''} ${showReal?'':'disabled'}>${icon}</button>
      <div class="tooltip"><b>${title}</b><br>${tip}</div>
    </div>`;
  }

  return `${noticeHTML()}
  <div class="panel">
    <div class="hdr"><span>Health: ${RUN.health}/${RUN.maxHealth}</span><span>Vehicles: ${RUN.ownedVehicles.length}/${RUN.vehicleCap}</span></div>
    ${currencyBar()}
    <div class="hdr" style="margin-top:8px"><span>World 1 - City Fleet (21 spaces)</span><span>Tap a stop to see details.</span></div>
    <div class="mapwrap" style="width:100%;height:${totalH}px;overflow-x:auto;overflow-y:hidden">
      <div style="position:relative;width:${totalW}px;height:${totalH}px">
        <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="position:absolute;left:0;top:0;pointer-events:none">${svgLines}</svg>
        ${nodesHTML}
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="wo-btn amber" id="mapUpgradeBtn">View Upgrades</button>
    </div>
  </div>
  ${MAP_POPUP ? nodePopupScreen(MAP_POPUP.row, MAP_POPUP.col) : ''}`;
}

function battleScreen() {

  const vehicleHTML = RUN.ownedVehicles.map(instance => {
    const v = VEHICLES[instance.vehicleId];
    const instanceId = instance.instanceId;
    const liveAttacks = instance.attacks || v.starterAttacks || [];
    // Render each individual attack fitted onto this vehicle hull
    const attacksHTML = liveAttacks.map((attId, index) => {
      const att = ATTACKS[attId];
      if (!att) return `<div class="attack-slot error">Missing Attack Data: ${attId}</div>`;
        
      // Dynamic unique compound key allowing multiple copies of the same attack type
      const slotKey = `${instanceId}:${attId}_${index}`;
      const idxs = BATTLE.slots[slotKey] || [];
      const cards = idxs.map(i => BATTLE.hand[i]);
      
      let ready = false, label = '', mult = 0;

      } else {

        ready = evalRes && evalRes.tier >= att.minTier;

        mult = evalRes ? evalRes.mult : 0;
      }

      let preview = 0;
      if (ready) {

          preview = Math.round(preview * (1.5 + (RUN.adminTuneLvl || 0) * 0.5));

  const assignedIdx = new Set(Object.values(BATTLE.slots).flat());

  const discardStagedHTML = BATTLE.turnDiscard.map(i => {

          <button class="wo-btn" id="endTurnBtn" style="padding:8px 16px;font-size:12px;font-weight:700">END TURN</button>
    </div>
        ${BATTLE.turnDiscard.length ? `<div class="note" style="margin-top:8px">Discarding this turn (tap to undo):</div><div class="hand">${discardStagedHTML}</div>` : ''}
      </div>
      <div class="deckStack"><div class="card back" style="position:relative"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:700;font-size:13px">${BATTLE.deck.length}</span></div></div>
      <div class="panel">
        <div class="hdr"><span>${opp.name}'s Cards</span><span></span></div>
        <div class="hand">${poolHTML}</div>
        <button class="wo-btn amber" id="scoutBtn" style="padding:8px 12px;font-size:12px" ${BATTLE.scoutedThisTurn || RUN.chips < 10 ? 'disabled' : ''}>Reveal a Card (-10 coins)</button>

        <div class="duelMatchup">

function handleCardDrop(e, vId) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const idx = +e.dataTransfer.getData('text/plain');
  if (Number.isNaN(idx)) return;
  const v = VEHICLES[vId];
  if (!BATTLE.slots[vId]) BATTLE.slots[vId] = [];
  if (BATTLE.slots[vId].includes(idx) || BATTLE.turnDiscard.includes(idx)) return;
  if (BATTLE.slots[vId].length >= v.slot) return;
  Object.keys(BATTLE.slots).forEach(k => { BATTLE.slots[k] = BATTLE.slots[k].filter(i => i !== idx); });
  BATTLE.slots[vId].push(idx);
  selectedIdx = selectedIdx.filter(i => i !== idx);
  render(battleScreen());
}

function blacksmithScreen() {

  const rows = BLACKSMITH_OPTIONS.map((c, i) => {
    const b = findBoost(c.rank, c.suit);
    const bonus = b ? b.bonus : 0;
    const maxed = bonus >= 9;
    const isPrimary = BLACKSMITH_VISIT.primary === i;
    const isSecondary = BLACKSMITH_VISIT.secondary === i;
    const primaryTaken = BLACKSMITH_VISIT.primary !== null;
    const secondaryTaken = BLACKSMITH_VISIT.secondary !== null;
    let btnHTML;
    if (isPrimary || isSecondary) {

    } else if (maxed) {
      btnHTML = `<button class="wo-btn gray" disabled style="padding:8px 12px;font-size:13px">Maxed out</button>`;
    } else if (!primaryTaken) {
      const cost = tuneCost(bonus, false);
      btnHTML = `<button class="wo-btn amber" data-forge="${i}" style="padding:8px 12px;font-size:13px" ${RUN.chips < cost ? 'disabled' : ''}>Upgrade (+3, ${cost} coins)</button>`;
    } else if (!secondaryTaken) {
      const cost = tuneCost(bonus, true);
      btnHTML = `<button class="wo-btn purple" data-forge="${i}" style="padding:8px 12px;font-size:13px" ${RUN.chips < cost ? 'disabled' : ''}>Also upgrade (+3, ${cost} coins)</button>`;

    : (BLACKSMITH_VISIT.secondary === null ? `You can pay extra to also upgrade one more card this visit, or move on.` : `You've used both upgrades this visit. Come back another time to tune more.`);

  return `
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <div class="wo-eyebrow">${won ? 'Route Complete' : 'Run Ended'}</div>
        <h1>${won ? 'Route <em>Cleared</em>' : 'Back to <em>Base</em>'}</h1>
        <div class="wo-sub">Reached stop ${RUN.path.length} of 21. This run's score: ${RUN.scoreThisRun} (+${bonus} completion bonus). High score: ${META.highScore}.</div>
        <button class="wo-btn" id="backToMetaBtn">Back to Home Base</button>
      </div>
    </div>
  `;
}

function starterSelectScreen() {
  const cards = STARTERS.map(id => {
    const v = VEHICLES[id];
    const unlocked = isStarterUnlocked(id);
    return `<div class="pickcard ${unlocked ? '' : 'locked'}">
      <div class="picon">${unlocked ? art(v, 46) : `<span class="vart" style="width:46px;height:46px;font-size:46px">${ICON.lock}</span>`}</div>
      <div class="pname">${v.name}</div>
      <div class="ptag">${unlocked ? v.note : starterLockNote(id)}</div>
      ${unlocked ? `<button class="wo-btn amber" data-pick="${v.id}" style="padding:8px 12px;font-size:13px;width:100%">Choose</button>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <div class="wo-eyebrow">Before You Roll Out</div>
        <h1>Pick Your <em>Starter</em></h1>
        <div class="wo-sub">Each vehicle fights one way. More unlock permanently as you play.</div>
        <div class="grid" style="margin:12px 0">${cards}</div>
      </div>
    </div>
  `;
}

function upgradeScreen(returnTo) {
  const rows = UPGRADE_DEFS.filter(u => u.id !== 'adminTune').map(u => {
    const lvl = META.levels[u.id];
    const maxed = lvl >= MAX_LEVEL;
    const cost = maxed ? 0 : upgradeCost(u, lvl);
    const refund = lvl > 0 ? upgradeCost(u, lvl - 1) : 0;
    const desc = u.id === 'reveal'
      ? `Start every battle with ${1 + lvl} opponent card${1 + lvl > 1 ? 's' : ''} already revealed.`
      : u.desc;
    return `<div class="shopcard">
      <div class="hdr"><span>${u.label} (Lv ${lvl}/${MAX_LEVEL})</span><span class="price">${maxed ? 'MAX' : cost + ' pts'}</span></div>
      <div class="note" style="margin:0 0 4px">${desc}</div>
      <div class="levelbar"><i style="width:${(lvl / MAX_LEVEL) * 100}%"></i></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="wo-btn gray" id="sortSuitBtn" style="padding:8px 12px;font-size:12px">Sort: Suit</button>
  <button class="wo-btn gray" id="sortValueBtn" style="padding:8px 12px;font-size:12px">Sort: Value</button>
  <button class="wo-btn gray" id="discardSelectedBtn" style="padding:8px 12px;font-size:12px" title="Fold selected cards face-down instead of playing them." ${!selectedIdx.length ? 'disabled' : ''}>Discard Selected</button>
  <button class="wo-btn" id="endTurnBtn" style="padding:8px 16px;font-size:12px;font-weight:700">END TURN</button>
</div>
    </div>`;
  }).join('');
  return `
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <div class="wo-eyebrow">Upgrades</div>
        <h1>Spend Your <em>Points</em></h1>
        <div class="wo-sub">Points: ${META.points} &middot; Lifetime: ${META.lifetimePoints} &middot; High score: ${META.highScore}</div>
        <button class="wo-btn" id="upgradeContinueBtn" data-return="${returnTo}" style="width:100%;margin-bottom:10px">${returnTo === 'map' ? 'Continue Route' : 'Back'}</button>
        <div style="margin:12px 0">${rows}</div>
        <button class="wo-btn" id="upgradeContinueBtn2" data-return="${returnTo}" style="width:100%">${returnTo === 'map' ? 'Continue Route' : 'Back'}</button>
      </div>
    </div>
  `;
}

function metaScreen() {
  const hasSave = !!loadRunSave();
  return `
    <div class="wo">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <div class="wo-eyebrow">Home Base</div>
        <h1>Fleet <em>Duel</em></h1>
        <div class="wo-sub">Points: ${META.points} &middot; Best route: ${META.bestRun}/21 &middot; High score: ${META.highScore} &middot; Runs played: ${META.runsPlayed}</div>
        <div class="panel" style="margin-bottom:10px">
          <div class="hdr"><span>Fleet Name</span><span></span></div>
          <input id="playerNameInput" type="text" maxlength="18" placeholder="Your name" value="${(META.playerName||'').replace(/"/g,'&quot;')}" style="width:100%;padding:9px 10px;border:2px solid var(--blue-light);border-radius:6px;font-family:var(--disp);font-size:15px;color:var(--ink)">
        </div>
        <button class="wo-btn amber" id="viewUpgradesBtn" style="width:100%;margin-bottom:10px">View Upgrades</button>
        ${hasSave ? `<button class="wo-btn" id="continueRunBtn" style="margin-bottom:10px;width:100%">Continue Run</button>` : ''}
        <button class="wo-btn ${hasSave ? 'gray' : ''}" id="startRunBtn" style="width:100%">${hasSave ? 'Start New Run (overwrites save)' : 'Start Run'}</button>
      </div>
    </div>
  `;
}

/* ========== RENDER + EVENTS ========== */
function render(html) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="game-stage">${html}</div>`;

  app.querySelectorAll('[data-card]').forEach(el => el.onclick = () => toggleCardSelect(+el.dataset.card));
  app.querySelectorAll('[data-assign]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-clear]') || e.target.closest('[data-unassign]') || e.target.closest('[data-ability]') || e.target.closest('[data-attack]')) return;
    assignSelectedTo(el.dataset.assign);
  });
  app.querySelectorAll('[data-unassign]').forEach(el => el.onclick = (e) => { e.stopPropagation(); const [vId, idx] = el.dataset.unassign.split(':'); removeCardFromSlot(vId, +idx); });
  app.querySelectorAll('[data-clear]').forEach(el => el.onclick = (e) => { e.stopPropagation(); clearSlot(el.dataset.clear); });
  app.querySelectorAll('[data-ability]').forEach(el => el.onclick = (e) => { e.stopPropagation(); useAbility(el.dataset.ability); });
  app.querySelectorAll('[data-attack]').forEach(el => {
  el.onclick = (e) => {
    e.stopPropagation();

    const parts = el.dataset.attack.split(':');
    const instanceId = parts[0];
    const attackPart = parts.slice(1).join(':');
    const match = attackPart.match(/^(.+)_(\d+)$/);

    if (!match) return;

    const attId = match[1];
    const index = Number(match[2]);

    const instance = RUN.ownedVehicles.find(v => v.instanceId === instanceId);
    if (!instance) return;

    executePlayerAttack(instance, attId, index);
  };
});
  app.querySelector('#endTurnBtn').onclick = () => {
  endTurn();
};
  app.querySelectorAll('[data-detonate]').forEach(el => el.onclick = (e) => { e.stopPropagation(); detonateBurn(); });
  const sortSuitBtn = document.getElementById('sortSuitBtn'); if (sortSuitBtn) sortSuitBtn.onclick = () => sortHand('suit');
  const sortValueBtn = document.getElementById('sortValueBtn'); if (sortValueBtn) sortValueBtn.onclick = () => sortHand('value');
  const scoutBtn = document.getElementById('scoutBtn'); if (scoutBtn) scoutBtn.onclick = scoutOpponent;
  const gemDrawBtn = document.getElementById('gemDrawBtn'); if (gemDrawBtn) gemDrawBtn.onclick = drawWithGem;
  const discardSelectedBtn = document.getElementById('discardSelectedBtn'); if (discardSelectedBtn) discardSelectedBtn.onclick = markSelectedForDiscard;
  app.querySelectorAll('[data-undiscard]').forEach(el => el.onclick = () => unmarkDiscard(+el.dataset.undiscard));

  app.querySelectorAll('[data-nodeinfo]').forEach(el => el.onclick = () => { const [r, c] = el.dataset.nodeinfo.split(':').map(Number); MAP_POPUP = { row: r, col: c }; render(mapScreen()); });
  const popupCloseBtn = document.getElementById('popupCloseBtn'); if (popupCloseBtn) popupCloseBtn.onclick = () => { MAP_POPUP = null; render(mapScreen()); };
  const popupGoBtn = document.getElementById('popupGoBtn'); if (popupGoBtn) popupGoBtn.onclick = () => { const p = MAP_POPUP; MAP_POPUP = null; if (p) selectNode(p.row, p.col); };

  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) continueBtn.onclick = () => {
    const won = continueBtn.parentElement.querySelector('.wo-eyebrow').textContent.includes('Won');
    if (won) { commitNode(BATTLE.row, BATTLE.col); if (BATTLE.row === ROWS) endRun(true); else render(mapScreen()); }
    else endRun(false);
  };
  const upgradeBtn = document.getElementById('upgradeBtn');
  if (upgradeBtn) upgradeBtn.onclick = () => { commitNode(BATTLE.row, BATTLE.col); render(upgradeScreen('map')); };
  const upgradeContinueBtn = document.getElementById('upgradeContinueBtn');
  const upgradeContinueBtn2 = document.getElementById('upgradeContinueBtn2');
  const upgradeContinueHandler = (btn) => () => {
    const ret = btn.dataset.return;
    if (ret === 'map') { if (RUN.currentRow === ROWS) endRun(true); else render(mapScreen()); }
    else render(metaScreen());
  };
  if (upgradeContinueBtn) upgradeContinueBtn.onclick = upgradeContinueHandler(upgradeContinueBtn);
  if (upgradeContinueBtn2) upgradeContinueBtn2.onclick = upgradeContinueHandler(upgradeContinueBtn2);
  const playerNameInput = document.getElementById('playerNameInput');
  if (playerNameInput) playerNameInput.onchange = () => { META.playerName = playerNameInput.value.trim().slice(0, 18); saveMeta(); };
  const viewUpgradesBtn = document.getElementById('viewUpgradesBtn'); if (viewUpgradesBtn) viewUpgradesBtn.onclick = () => render(upgradeScreen('home'));
  app.querySelectorAll('[data-levelup]').forEach(el => el.onclick = () => {
    const u = UPGRADE_DEFS.find(x => x.id === el.dataset.levelup);
    const lvl = META.levels[u.id];
    if (lvl >= MAX_LEVEL) return;
    const cost = upgradeCost(u, lvl);
    if (META.points < cost) return;
    META.points -= cost; META.levels[u.id]++;
    saveMeta();
    const ret = document.getElementById('upgradeContinueBtn')?.dataset.return || 'home';
    render(upgradeScreen(ret));
  });
  app.querySelectorAll('[data-leveldown]').forEach(el => el.onclick = () => {
    const u = UPGRADE_DEFS.find(x => x.id === el.dataset.leveldown);
    const lvl = META.levels[u.id];
    if (lvl <= 0) return;
    const refund = upgradeCost(u, lvl - 1);
    META.levels[u.id]--; META.points += refund;
    saveMeta();
    const ret = document.getElementById('upgradeContinueBtn')?.dataset.return || 'home';
    render(upgradeScreen(ret));
  });

  const mapUpgradeBtn = document.getElementById('mapUpgradeBtn'); if (mapUpgradeBtn) mapUpgradeBtn.onclick = () => render(upgradeScreen('map'));
  const castleDungeonNavBtn = document.getElementById('castleDungeonNavBtn'); if (castleDungeonNavBtn) castleDungeonNavBtn.onclick = () => render(castleDungeonScreen());
  const castleWizardNavBtn = document.getElementById('castleWizardNavBtn'); if (castleWizardNavBtn) castleWizardNavBtn.onclick = () => { CASTLE_STATE = CASTLE_STATE || {}; CASTLE_STATE.matchCards = null; render(castleMatchScreen()); };
  const castleBlacksmithNavBtn = document.getElementById('castleBlacksmithNavBtn'); if (castleBlacksmithNavBtn) castleBlacksmithNavBtn.onclick = () => { RETURN_TO_CASTLE_MENU = true; BLACKSMITH_OPTIONS = pickBlacksmithOptions(); BLACKSMITH_VISIT = { primary: null, secondary: null }; render(blacksmithScreen()); };
  const castleShopNavBtn = document.getElementById('castleShopNavBtn'); if (castleShopNavBtn) castleShopNavBtn.onclick = () => { RETURN_TO_CASTLE_MENU = true; render(shopScreen(true)); };
  const castleInnNavBtn = document.getElementById('castleInnNavBtn'); if (castleInnNavBtn) castleInnNavBtn.onclick = () => render(castleInnScreen());
  const backToCastleMenuBtn = document.getElementById('backToCastleMenuBtn'); if (backToCastleMenuBtn) backToCastleMenuBtn.onclick = () => render(castleMenuScreen());
  const castleBattle1Btn = document.getElementById('castleBattle1Btn'); if (castleBattle1Btn) castleBattle1Btn.onclick = () => { CASTLE_STATE = CASTLE_STATE || {}; CASTLE_STATE.stage=1; startBattle(CASTLE_FIRST, 10, 0); };
  const castleBattle2Btn = document.getElementById('castleBattle2Btn'); if (castleBattle2Btn) castleBattle2Btn.onclick = () => { CASTLE_STATE = CASTLE_STATE || {}; CASTLE_STATE.stage=2; startBattle(CASTLE_SECOND, 10, 0); };
  const castleFuelBtn = document.getElementById('castleFuelBtn'); if (castleFuelBtn) castleFuelBtn.onclick = () => { if (RUN.chips>=5) { RUN.chips-=5; RUN.fuel=Math.min(RUN.maxFuel,RUN.fuel+10); saveRun(); render(castleInnScreen('You refueled for 5 coins.')); } };
  const castleRestBtn = document.getElementById('castleRestBtn'); if (castleRestBtn) castleRestBtn.onclick = () => { RUN.health=Math.min(RUN.maxHealth,RUN.health+20); saveRun(); render(castleInnScreen('You rested and recovered 20 health.')); };
  const leaveCastleBtn = document.getElementById('leaveCastleBtn'); if (leaveCastleBtn) leaveCastleBtn.onclick = () => render(mapScreen());
  const leaveMatchBtn = document.getElementById('leaveMatchBtn'); if (leaveMatchBtn) leaveMatchBtn.onclick = () => render(castleMenuScreen());
  app.querySelectorAll('[data-match]').forEach(el => el.onclick = () => {
    const i=+el.dataset.match, st=CASTLE_STATE;
    if (!st || st.matchGuesses<=0 || st.matchPick.includes(i) || st.matchCards[i].flipped) return;
    st.matchPick.push(i); st.matchCards[i].flipped=true;
    if (st.matchPick.length===2) {
      const [a,b]=st.matchPick;
      if (st.matchCards[a].suit===st.matchCards[b].suit) {
        const reward=Math.random()<0.5 ? {coins:20+Math.floor(Math.random()*21),gems:1} : {coins:15,fuel:8};
        RUN.chips+=reward.coins||0; RUN.gems=Math.min(RUN.maxGems,RUN.gems+(reward.gems||0)); RUN.fuel=Math.min(RUN.maxFuel,RUN.fuel+(reward.fuel||0));
        st.matchDone=true; saveRun(); render(castleMenuScreen(`Match! You won ${reward.coins||0} coins${reward.gems?`, ${reward.gems} gem`:''}${reward.fuel?`, ${reward.fuel} fuel`:''}.`));
      } else {
        st.matchGuesses--;
        setTimeout(()=>{ st.matchPick.forEach(x=>st.matchCards[x].flipped=false); st.matchPick=[]; render(st.matchGuesses>0?castleMatchScreen():castleMenuScreen('No match. The game is over for this visit.')); },350);
      }
    }
    else render(castleMatchScreen());
  });
  const leaveShopBtn = document.getElementById('leaveShopBtn'); if (leaveShopBtn) leaveShopBtn.onclick = () => render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
  const adminTuneBtn = document.getElementById('adminTuneBtn'); if (adminTuneBtn) adminTuneBtn.onclick = () => { const lvl=RUN.adminTuneLvl||0; const cost=40*Math.pow(2,lvl); if(RUN.chips<cost)return; RUN.chips-=cost; RUN.adminTuneLvl=lvl+1; saveRun(); render(blacksmithScreen()); };
  const leaveBlacksmithBtn = document.getElementById('leaveBlacksmithBtn'); if (leaveBlacksmithBtn) leaveBlacksmithBtn.onclick = () => { BLACKSMITH_OPTIONS = null; BLACKSMITH_VISIT = null; render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen()); };
  const leaveTreasureBtn = document.getElementById('leaveTreasureBtn'); if (leaveTreasureBtn) leaveTreasureBtn.onclick = () => render(mapScreen());
  app.querySelectorAll('[data-forge]').forEach(el => el.onclick = () => {
    const i = +el.dataset.forge;
    const c = BLACKSMITH_OPTIONS[i];
    const b = findBoost(c.rank, c.suit);
    const bonus = b ? b.bonus : 0;
    if (bonus >= 9) return;
    const isSecondary = BLACKSMITH_VISIT.primary !== null;
    if (isSecondary && BLACKSMITH_VISIT.secondary !== null) return;
    const cost = tuneCost(bonus, isSecondary);
    if (RUN.chips < cost) return;
    RUN.chips -= cost;
    boostCard(c.rank, c.suit);
    if (!isSecondary) BLACKSMITH_VISIT.primary = i; else BLACKSMITH_VISIT.secondary = i;
    saveRun();
    render(blacksmithScreen());
  });
    app.querySelectorAll('[data-buy]').forEach(el => el.onclick = () => {
    const cost = +el.dataset.cost;
    if (RUN.chips < cost || RUN.ownedVehicles.length >= RUN.vehicleCap) return;
    
    RUN.chips -= cost;
    
    const vehicleId = el.dataset.buy;
    const baseV = VEHICLES[vehicleId];
    
    RUN.ownedVehicles.push({
      instanceId: 'v_shop_' + Math.random().toString(36).substr(2, 4),
      vehicleId: vehicleId,
      attacks: [...baseV.starterAttacks]
    });

    saveRun(); 
    render(shopScreen());
  });


  const restBtn = document.getElementById('restBtn'); if (restBtn) restBtn.onclick = () => { RUN.health = Math.min(RUN.maxHealth, RUN.health + 30); saveRun(); render(mapScreen()); };
  const backToMetaBtn = document.getElementById('backToMetaBtn'); if (backToMetaBtn) backToMetaBtn.onclick = () => render(metaScreen());
  const startRunBtn = document.getElementById('startRunBtn'); if (startRunBtn) startRunBtn.onclick = () => { clearRunSave(); render(starterSelectScreen()); };
  const continueRunBtn = document.getElementById('continueRunBtn'); if (continueRunBtn) continueRunBtn.onclick = () => { RUN = loadRunSave(); RUN.maxGems=10; RUN.maxFuel=20; RUN.maxEnergy=20; RUN.handSize=7+(META.levels.handCap||0)*2; RUN.drawPerTurn=2+(META.levels.draw||0); RUN.gems=Math.min(RUN.maxGems,RUN.gems||0); RUN.fuel=Math.min(RUN.maxFuel,RUN.fuel||0); RUN.energy=Math.min(RUN.maxEnergy,RUN.energy||0); saveRun(); render(mapScreen()); };
  app.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => initRunWithStarter(el.dataset.pick));
}

/* ========== BOOT ========== */
render(metaScreen());
</script>
</body>
</html>
