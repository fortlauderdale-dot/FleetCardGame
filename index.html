// The Fleet Compound's Carnival Matching Game is limited to one play per world, like Plinko, Blackjack,
// Poker and Auction, and resets with them here.
function resetMatchPlayedState() {
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.matchPlayed = false;
}
// Applies a finished Plinko run's haul into the actual run economy (coins/gems/fuel are capped
// the same way every other reward source in the game caps them), marks the board played for
// this world, and drops the player back on the Fleet Compound menu.
function applyPlinkoHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.plinkoPlayed = true;
  if (!haul.lost) {
    if (haul.coins) RUN.chips += haul.coins;
    if (haul.gems) RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems);
    if (haul.fuel) RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel);
    if (haul.coins || haul.gems || haul.fuel)
      RUN.lastNotice = `Plinko haul banked: ${[haul.coins ? `${haul.coins} coins` : '', haul.gems ? `${haul.gems} gem${haul.gems > 1 ? 's' : ''}` : '', haul.fuel ? `${haul.fuel} fuel` : ''].filter(Boolean).join(', ')}.`;
  }
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}


// ████████████████████████████████████████████████████████████████████████████████████
// ██                                                                                ██
// ██  Fleet Plinko                                                                  ██
// ██  Fleet Compound bonus game. Drop chips for coins, gems or fuel.                ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████
// Drop chips down a peg board for coins/gems/fuel, or wipe the board on a bad landing. Opened with
// openFleetPlinko({ onComplete(haul) }); reward weights live in FLEET_PLINKO_CONFIG below.

const FLEET_PLINKO_CONFIG = {
  // 8 board columns. None of these are "loss" by default any more - which columns are Game
  // Over is computed live from the current round (see activeLossCount/currentSlots below), so
  // the danger zone can move and grow instead of sitting fixed in one spot forever.
  rewardTemplates: [
    { id: 'coins_small', label: '+8 Coins', type: 'coins', amount: 8 },
    { id: 'fuel', label: '+1 Fuel', type: 'fuel', amount: 1 },
    { id: 'coins_medium', label: '+15 Coins', type: 'coins', amount: 15 },
    { id: 'gems', label: '+1 Gem', type: 'gems', amount: 1 },
    { id: 'coins_large', label: '+25 Coins', type: 'coins', amount: 25 },
    { id: 'fuel_big', label: '+2 Fuel', type: 'fuel', amount: 2 },
    { id: 'premium', label: '+2 Gems', type: 'gems', amount: 2 },
    { id: 'coins_small2', label: '+8 Coins', type: 'coins', amount: 8 },
  ],
  boardWidth: 720,
  boardHeight: 460,
  // Pegs are packed 3 per bucket (pegsPerRow = slotCount*3 + 1) so every bucket divider sits directly
  // under a peg column, and the rows are much closer together so a chip keeps bouncing the whole way
  // down instead of bouncing once or twice and then dropping straight through.
  pegRows: 13,
  pegsPerRow: 25,
  pegRadius: 4,
  pegRowSpacing: 24,
  // Left/right/center drops sit exactly over peg columns 5, 12 and 19 of 24 (a peg in the first row).
  dropSlotFractions: [5 / 24, 0.5, 19 / 24],
  // Slowed earlier for suspense; raised again now that the pegs are packed tighter and the chip bounces much more
  // on the way down. time over the pegs, which reads as more suspenseful than the chip just blipping straight down.
  gravity: 0.3,
  bounce: 0.62,
  horizontalFriction: 0.995,
  chipRadius: 7,
  dropStartY: 24,
  // wallInset tracks the peg field's own edge instead of a flat number, so a chip cannot get stuck
  // bouncing between the wall and the first peg column. wallBounce and wallNudge are stronger than the peg
  // bounce and nudge, so a wall hit throws the chip back toward the middle of the board.
  wallBounce: 0.85,
  wallNudge: 1.3,
};
function openFleetPlinko(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetPlinkoOverlay');
  if (old) old.remove();

  const state = {
    drops: 0,
    round: 0,
    displayRound: 1,
    animating: false,
    finished: false,
    currentSlot: null,
    haul: { coins: 0, gems: 0, fuel: 0 },
    rewardHistory: [],
    chip: null,
    animationId: null,
  };

  const overlay = document.createElement('div');
  overlay.id = 'fleetPlinkoOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML =
    `
    <div class="wo wide" style="max-width:760px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1 style="margin:2px 0 0">Fleet <em>Plinko</em></h1>
        <div class="note" style="margin-top:2px">Pick a slot to drop from, or take your haul. ` +
    `Game Over spots move to new places on every drop, and more of the board turns Game Over the ` +
    `longer you keep pushing your luck.</div>
        <div id="fleetPlinkoStats">
          <div class="fleet-plinko-stat"><div class="fleet-plinko-stat-label">Current Haul</div>` +
    `<div class="fleet-plinko-stat-value" id="fleetPlinkoHaul">0</div></div>
          <div class="fleet-plinko-stat"><div class="fleet-plinko-stat-label">Drops</div><div ` +
    `class="fleet-plinko-stat-value" id="fleetPlinkoDrops">0</div></div>
        </div>
        <div id="fleetPlinkoCanvasWrap"><canvas id="fleetPlinkoCanvas" ` +
    `width="${FLEET_PLINKO_CONFIG.boardWidth}" height="${FLEET_PLINKO_CONFIG.boardHeight}"></canvas></div>
        <div id="fleetPlinkoMessage">Pick a drop slot to send a chip down the board.</div>
        <div id="fleetPlinkoRewardList"></div>
        <div id="fleetPlinkoDropSlots" style="display:flex;justify-content:center;gap:10px;` +
    `padding-top:10px;flex-wrap:wrap">
          <button class="wo-btn green" id="fleetPlinkoDropSlot0">Drop Left</button>
          <button class="wo-btn green" id="fleetPlinkoDropSlot1">Drop Center</button>
          <button class="wo-btn green" id="fleetPlinkoDropSlot2">Drop Right</button>
        </div>
        <div id="fleetPlinkoControls">
          <button class="wo-btn amber fleet-plinko-hidden" id="fleetPlinkoTakeBtn">Take Haul</button>
          <button class="wo-btn gray" id="fleetPlinkoExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const canvas = document.getElementById('fleetPlinkoCanvas');
  const ctx = canvas.getContext('2d');
  const dropSlotBtns = [
    document.getElementById('fleetPlinkoDropSlot0'),
    document.getElementById('fleetPlinkoDropSlot1'),
    document.getElementById('fleetPlinkoDropSlot2'),
  ];
  const takeBtn = document.getElementById('fleetPlinkoTakeBtn');
  const exitBtn = document.getElementById('fleetPlinkoExitBtn');
  const message = document.getElementById('fleetPlinkoMessage');
  const haulDisplay = document.getElementById('fleetPlinkoHaul');
  const dropsDisplay = document.getElementById('fleetPlinkoDrops');
  const rewardList = document.getElementById('fleetPlinkoRewardList');

  const W = FLEET_PLINKO_CONFIG.boardWidth;
  const H = FLEET_PLINKO_CONFIG.boardHeight;
  const slotCount = FLEET_PLINKO_CONFIG.rewardTemplates.length;
  const slotHeight = 78;
  const slotTop = H - slotHeight;
  const sidePadding = 22;
  const slotWidth = (W - sidePadding * 2) / slotCount;
  // Divider posts between the prize buckets stick up above the bucket tops and collide with the chip (see
  // collideDividers in runPhysics). The chip settles on the bucket floor and cannot drift across a bucket
  // boundary.
  const dividerThickness = 4;
  const dividerHeight = 14;
  const dividerXs = [];
  for (let i = 1; i < slotCount; i++) dividerXs.push(sidePadding + i * slotWidth);

  // Full-width peg field: every row spans the board edge to edge, with alternating rows offset by half a
  // gap. This avoids empty side margins where a chip could slide down with no peg contact.
  const pegs = [];
  const pegTop = 60;
  const pegRows = FLEET_PLINKO_CONFIG.pegRows;
  const pegsPerRow = FLEET_PLINKO_CONFIG.pegsPerRow;
  const pegR = FLEET_PLINKO_CONFIG.pegRadius;
  const rowSpacing = FLEET_PLINKO_CONFIG.pegRowSpacing;
  const colGap = (W - sidePadding * 2) / (pegsPerRow - 1);
  // Even rows have a peg at every column, including the two on the side walls. Odd rows sit half a
  // gap over, and their first and last pegs are left out so there is never a tight gap between a
  // wall and a peg (a chip could wedge there). The last row is an even row, so a peg sits right above
  // every bucket divider and the chip is always nudged to one side of a divider instead of resting on it.
  for (let row = 0; row < pegRows; row++) {
    const y = pegTop + row * rowSpacing;
    const staggered = row % 2 === 1;
    if (!staggered) {
      for (let col = 0; col < pegsPerRow; col++) pegs.push({ x: sidePadding + col * colGap, y, r: pegR });
    } else {
      for (let col = 1; col < pegsPerRow - 2; col++) pegs.push({ x: sidePadding + (col + 0.5) * colGap, y, r: pegR });
    }
  }
  // The 3 discrete drop slots at the top of the board the player picks from before releasing a chip.
  function dropSlotX(i) {
    const usableWidth = W - sidePadding * 2;
    return sidePadding + usableWidth * FLEET_PLINKO_CONFIG.dropSlotFractions[i];
  }

  // How many board columns are Game Over for a given round (rounds are 1-indexed: the very
  // first drop is round 1). Starts at 1, becomes 2 after the first drop, then adds one more
  // every 2 rounds after that until the whole board is Game Over.
  function activeLossCount(round) {
    if (round <= 1) return 1;
    if (round === 2) return 2;
    return Math.min(slotCount, 2 + Math.ceil((round - 2) / 2));
  }
  // Which columns are Game Over is picked at random for each round, then remembered so the
  // preview shown while deciding is exactly what the next drop plays against.
  const lossByRound = {};
  function lossSetForRound(round) {
    if (!lossByRound[round]) {
      const idx = [];
      for (let i = 0; i < slotCount; i++) idx.push(i);
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = idx[i];
        idx[i] = idx[j];
        idx[j] = t;
      }
      lossByRound[round] = new Set(idx.slice(0, activeLossCount(round)));
    }
    return lossByRound[round];
  }
  // The slot layout for a specific round. settleChip() resolves a drop against state.round, while
  // drawBoard() renders state.displayRound, which is bumped one round ahead right after a drop
  // settles so the board previews the next drop's Game Over columns while the player decides.
  function slotsForRound(round) {
    const lossIdx = lossSetForRound(round);
    return FLEET_PLINKO_CONFIG.rewardTemplates.map((tpl, i) =>
      lossIdx.has(i) ? { id: `loss_${i}`, label: 'Game Over', type: 'loss', amount: 0 } : coinifyReward(tpl)
    );
  }
  function formatHaul() {
    const parts = [];
    if (state.haul.coins > 0) parts.push(`${state.haul.coins} Coins`);
    if (state.haul.gems > 0) parts.push(`${state.haul.gems} Gem${state.haul.gems > 1 ? 's' : ''}`);
    if (state.haul.fuel > 0) parts.push(`${state.haul.fuel} Fuel`);
    return parts.length ? parts.join(' + ') : '0';
  }
  function numericHaulValue() {
    return state.haul.coins + state.haul.gems * 25 + state.haul.fuel * 10;
  }
  function updateUI() {
    haulDisplay.textContent = formatHaul();
    dropsDisplay.textContent = state.drops;
    rewardList.innerHTML = state.rewardHistory
      .map((entry) => `<div class="fleet-plinko-reward-pill">${entry}</div>`)
      .join('');
  }
  function setMessage(text, type) {
    message.textContent = text;
    message.className = '';
    if (type) message.classList.add(type);
  }
  function hideButtons() {
    dropSlotBtns.forEach((b) => b.classList.add('fleet-plinko-hidden'));
    takeBtn.classList.add('fleet-plinko-hidden');
    exitBtn.classList.add('fleet-plinko-hidden');
  }
  function showDecisionButtons() {
    dropSlotBtns.forEach((b) => b.classList.remove('fleet-plinko-hidden'));
    takeBtn.classList.remove('fleet-plinko-hidden');
    exitBtn.classList.remove('fleet-plinko-hidden');
  }
  function closeGame() {
    if (state.animationId) {
      cancelAnimationFrame(state.animationId);
      state.animationId = null;
    }
    overlay.remove();
  }
  function finishWithHaul() {
    if (state.finished) return;
    state.finished = true;
    hideButtons();
    const finalHaul = { coins: state.haul.coins, gems: state.haul.gems, fuel: state.haul.fuel, drops: state.drops };
    setMessage(`Haul secured: ${formatHaul()}`, 'positive');
    setTimeout(() => {
      closeGame();
      onComplete(finalHaul);
    }, 550);
  }

  function drawBoard() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e1726');
    bg.addColorStop(1, '#0b0f19');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(31,182,166,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (const peg of pegs) {
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, peg.r + 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(31,182,166,0.10)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, peg.r, 0, Math.PI * 2);
      ctx.fillStyle = '#4fb8ae';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(peg.x - 1.5, peg.y - 1.5, 1.7, 0, Math.PI * 2);
      ctx.fillStyle = '#e7fbf8';
      ctx.fill();
    }
    const displaySlots = slotsForRound(state.displayRound || 1);
    for (let i = 0; i < slotCount; i++) {
      const slot = displaySlots[i];
      const x = sidePadding + i * slotWidth;
      const isLoss = slot.type === 'loss';
      ctx.fillStyle = isLoss ? 'rgba(229,72,77,0.22)' : 'rgba(31,182,166,0.14)';
      ctx.fillRect(x + 2, slotTop + 2, slotWidth - 4, slotHeight - 4);
      ctx.strokeStyle = isLoss ? 'rgba(229,72,77,0.4)' : 'rgba(31,182,166,0.30)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 1, slotTop + 1, slotWidth - 2, slotHeight - 2);
      ctx.fillStyle = isLoss ? '#ff9a9d' : '#bfeee8';
      ctx.font = 'bold 10px Aptos, Arial';
      ctx.textAlign = 'center';
      const words = slot.label.split(' ');
      if (words.length > 1) {
        ctx.fillText(words[0], x + slotWidth / 2, slotTop + 32);
        ctx.fillText(words.slice(1).join(' '), x + slotWidth / 2, slotTop + 47);
      } else ctx.fillText(slot.label, x + slotWidth / 2, slotTop + 40);
    }
    ctx.strokeStyle = 'rgba(191,238,232,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sidePadding, pegTop - 10);
    ctx.lineTo(sidePadding, slotTop);
    ctx.moveTo(W - sidePadding, pegTop - 10);
    ctx.lineTo(W - sidePadding, slotTop);
    ctx.stroke();
    // Divider posts between buckets - drawn as small walls (matching the peg palette) that stick
    // up above the bucket tops so it's visually obvious the chip can't cross between buckets once
    // it's down in this zone. They double as real collision walls in runPhysics.
    for (const dx of dividerXs) {
      const postTop = slotTop - dividerHeight;
      ctx.fillStyle = 'rgba(191,238,232,0.9)';
      ctx.fillRect(dx - dividerThickness / 2, postTop, dividerThickness, dividerHeight + slotHeight - 4);
      ctx.beginPath();
      ctx.arc(dx, postTop, dividerThickness, 0, Math.PI * 2);
      ctx.fillStyle = '#e7fbf8';
      ctx.fill();
    }
    // Clearly flag the 3 drop lanes at the top of the board so it's obvious which button drops
    // from where, instead of leaving the player to guess at an unmarked gap above the pegs.
    const dropLabels = ['L', 'C', 'R'];
    for (let i = 0; i < FLEET_PLINKO_CONFIG.dropSlotFractions.length; i++) {
      const x = dropSlotX(i);
      ctx.beginPath();
      ctx.moveTo(x - 7, pegTop - 14);
      ctx.lineTo(x + 7, pegTop - 14);
      ctx.lineTo(x, pegTop - 4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,196,77,0.85)';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,196,77,0.9)';
      ctx.font = 'bold 11px Aptos, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(dropLabels[i], x, pegTop - 20);
      ctx.strokeStyle = 'rgba(255,196,77,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, pegTop - 4);
      ctx.lineTo(x, pegTop + 10);
      ctx.stroke();
    }
    if (state.chip) {
      const chip = state.chip;
      ctx.beginPath();
      ctx.arc(chip.x, chip.y, chip.r + 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(31,182,166,0.20)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(chip.x, chip.y, chip.r, 0, Math.PI * 2);
      const chipGradient = ctx.createRadialGradient(chip.x - 2, chip.y - 2, 1, chip.x, chip.y, chip.r);
      chipGradient.addColorStop(0, '#eafffb');
      chipGradient.addColorStop(0.4, '#6fe8d9');
      chipGradient.addColorStop(1, '#0d8377');
      ctx.fillStyle = chipGradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(230,255,250,0.85)';
      ctx.stroke();
    }
  }

  function startDrop(slotIndex) {
    if (state.animating || state.finished) return;
    state.animating = true;
    state.drops++;
    state.round++;
    state.displayRound = state.round;
    state.currentSlot = null;
    state.physicsFrames = 0;
    const dropX = dropSlotX(slotIndex);
    state.chip = {
      x: dropX + (Math.random() - 0.5) * 14,
      y: FLEET_PLINKO_CONFIG.dropStartY,
      vx: (Math.random() - 0.5) * 1.4,
      vy: 0,
      r: FLEET_PLINKO_CONFIG.chipRadius,
    };
    hideButtons();
    setMessage('The chip is in motion...', '');
    updateUI();
    runPhysics();
  }
  // Walls sit at sidePadding - chipRadius + 2, just past the edge peg's center. A peg correction there
  // pushes the chip toward the middle instead of back into the wall, and the empty corridor beside the
  // wall in the staggered rows is mostly closed.
  const wallInset = sidePadding;
  function clampToWalls(chip) {
    if (chip.x - chip.r < wallInset) chip.x = wallInset + chip.r;
    if (chip.x + chip.r > W - wallInset) chip.x = W - wallInset - chip.r;
  }
  // Bucket-divider collision - only matters once the chip has dropped low enough to reach the
  // divider posts. Pushes the chip back to whichever side of the post it was already on and
  // kills its sideways speed, so once a chip has committed to a bucket it settles there instead
  // of bouncing back and forth across the boundary.
  const dividerZoneTop = slotTop - dividerHeight;
  function collideDividers(chip) {
    if (chip.y + chip.r < dividerZoneTop) return;
    const halfW = dividerThickness / 2 + chip.r;
    for (const dx0 of dividerXs) {
      const dx = chip.x - dx0;
      if (Math.abs(dx) < halfW) {
        chip.x = dx0 + (dx < 0 ? -halfW : halfW);
        chip.vx *= -0.3;
      }
    }
  }
  function runPhysics() {
    const chip = state.chip;
    chip.vy += FLEET_PLINKO_CONFIG.gravity;
    chip.vx *= FLEET_PLINKO_CONFIG.horizontalFriction;
    chip.x += chip.vx;
    chip.y += chip.vy;
    // A wall hit now kicks noticeably harder than a peg-to-peg bounce (wallBounce/wallNudge
    // instead of the weaker peg bounce/nudge) and always adds a little extra downward push, so
    // the chip can't stall out purely oscillating side to side against a wall - every wall touch
    // is guaranteed some real vertical progress on top of the stronger sideways kick.
    let hitWall = false;
    if (chip.x - chip.r < wallInset) {
      chip.x = wallInset + chip.r;
      chip.vx = Math.abs(chip.vx) * FLEET_PLINKO_CONFIG.wallBounce + Math.random() * FLEET_PLINKO_CONFIG.wallNudge;
      hitWall = true;
    }
    if (chip.x + chip.r > W - wallInset) {
      chip.x = W - wallInset - chip.r;
      chip.vx = -Math.abs(chip.vx) * FLEET_PLINKO_CONFIG.wallBounce - Math.random() * FLEET_PLINKO_CONFIG.wallNudge;
      hitWall = true;
    }
    if (hitWall) chip.vy += 0.15;
    for (const peg of pegs) {
      const dx = chip.x - peg.x,
        dy = chip.y - peg.y;
      const minDistance = chip.r + peg.r;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared < minDistance * minDistance) {
        const distance = Math.sqrt(distanceSquared) || 0.001;
        const nx = dx / distance,
          ny = dy / distance;
        const overlap = minDistance - distance;
        chip.x += nx * overlap;
        chip.y += ny * overlap;
        const dot = chip.vx * nx + chip.vy * ny;
        chip.vx = chip.vx - 2 * dot * nx;
        chip.vy = chip.vy - 2 * dot * ny;
        chip.vx += (Math.random() - 0.5) * 0.35;
        chip.vx *= FLEET_PLINKO_CONFIG.bounce;
        chip.vy *= FLEET_PLINKO_CONFIG.bounce;
      }
    }
    // Re-clamp after the peg pass so a peg correction can never shove the chip back out past a
    // wall it just bounced off in this same frame.
    clampToWalls(chip);
    collideDividers(chip);
    // The chip now actually falls into its bucket and rests on the floor there, instead of being
    // credited and vanishing the instant it reaches the top of the bucket row - the divider posts
    // (collideDividers above) keep it boxed inside whichever bucket it entered on the way down.
    // A frame-count safety valve forces a settle if a chip ever gets stuck oscillating between a
    // peg and a divider post right at the edge of the bucket zone for an unreasonably long time,
    // so a rare unlucky bounce pattern can never leave the board stuck forever.
    state.physicsFrames = (state.physicsFrames || 0) + 1;
    if (chip.y >= H - chip.r - 4 || state.physicsFrames > 900) {
      chip.y = H - chip.r - 4;
      drawBoard();
      settleChip();
      return;
    }
    drawBoard();
    state.animationId = requestAnimationFrame(runPhysics);
  }
  function settleChip() {
    state.animating = false;
    let index = Math.floor((state.chip.x - sidePadding) / slotWidth);
    index = Math.max(0, Math.min(slotCount - 1, index));
    const slot = slotsForRound(state.round)[index];
    state.currentSlot = slot;
    state.chip.x = sidePadding + index * slotWidth + slotWidth / 2;
    state.chip.y = slotTop + 20;
    drawBoard();
    if (slot.type === 'loss') {
      handleLoss();
      return;
    }
    handleReward(slot);
  }
  function handleReward(slot) {
    const amount = slot.amount || 0;
    if (slot.type === 'coins') {
      state.haul.coins += amount;
      state.rewardHistory.push(`+${amount} Coins`);
    } else if (slot.type === 'gems') {
      state.haul.gems += amount;
      state.rewardHistory.push(`+${amount} Gem${amount === 1 ? '' : 's'}`);
    } else if (slot.type === 'fuel') {
      state.haul.fuel += amount;
      state.rewardHistory.push(`+${amount} Fuel`);
    }
    updateUI();
    setMessage(`Landed on ${slot.label}.`, 'positive');
    playSfx('open');
    // Preview next round's Game Over columns now, while the player is deciding whether to drop
    // again - the escalation should be visible information to plan around, not a hidden trap
    // that only reveals itself once they've already committed to the next drop.
    state.displayRound = state.round + 1;
    drawBoard();
    showDecisionButtons();
  }
  function handleLoss() {
    const lostText = formatHaul();
    state.haul = { coins: 0, gems: 0, fuel: 0 };
    state.rewardHistory = [];
    updateUI();
    setMessage(`Total loss - ${lostText} was lost.`, 'danger');
    playSfx('lose');
    dropSlotBtns.forEach((b) => b.classList.add('fleet-plinko-hidden'));
    takeBtn.classList.add('fleet-plinko-hidden');
    setTimeout(finishAfterLoss, 1100);
  }
  function finishAfterLoss() {
    if (state.finished) return;
    state.finished = true;
    hideButtons();
    setTimeout(() => {
      closeGame();

    }, 250);
  }

  dropSlotBtns.forEach((btn, i) => btn.addEventListener('click', () => startDrop(i)));
  takeBtn.addEventListener('click', () => {
    if (!state.animating && !state.finished) finishWithHaul();
  });
  exitBtn.addEventListener('click', () => {
    if (state.animating || state.finished) return;
    if (numericHaulValue() > 0) finishWithHaul();
    else closeGame();
  });

  updateUI();
  drawBoard();
}


// ████████████████████████████████████████████████████████████████████████████████████
// ██                                                                                ██
// ██  Fleet Blackjack                                                               ██
// ██  Fleet Compound bonus game. Three hands against a real dealer.                 ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████
// Three EMPTY hands and a real dealer. Each hand's reward is locked in and shown before a single card is dealt,
// but there are no starting cards - hitting draws 3 cards you freely allocate across whichever hands are still
// live (including onto a hand with zero cards), so even the very first hit is a real placement decision. A hand
// that busts forfeits its reward; a hand that hits exactly 21 locks (no more cards can go to it). The dealer shows
// one card face-up and one face-down from the start for a bit of real strategy, then plays a standard hit-to-17
// hand once you Stand - each surviving hand only pays out if it beats the dealer's final total (a push pays
// nothing, same convention as Fleet Poker). Opened with openFleetBlackjack({ onComplete(haul) }); reward weights
// live in FLEET_BLACKJACK_CONFIG below.

const FLEET_BLACKJACK_CONFIG = {
  handCount: 3,
  drawSize: 3,
  // Bigger payouts than the first version (10 coins was too small to matter). Each hand rolls one
  // of these before any card is dealt, and only pays if that hand beats its dealer hand.
  rewardSlots: [
    { id: 'coins_small', label: '+25 Coins', type: 'coins', amount: 25, weight: 20 },
    { id: 'coins_medium', label: '+40 Coins', type: 'coins', amount: 40, weight: 14 },
    { id: 'coins_large', label: '+60 Coins', type: 'coins', amount: 60, weight: 6 },
    { id: 'fuel', label: '+2 Fuel', type: 'fuel', amount: 2, weight: 12 },
    { id: 'fuel_big', label: '+3 Fuel', type: 'fuel', amount: 3, weight: 6 },
    { id: 'gems', label: '+1 Gem', type: 'gems', amount: 1, weight: 10 },
    { id: 'gems_big', label: '+2 Gems', type: 'gems', amount: 2, weight: 5 },
  ],
};
// Standard soft-ace blackjack scoring: Aces count as 11 unless that would bust the hand, in
// which case they drop to 1 one at a time until the hand is 21 or under (or still busted).
function blackjackHandValue(cards) {
  let total = 0,
    aces = 0;
  for (const c of cards) {
    if (c.rank === 14) {
      aces++;
      total += 11;
    } else if (c.rank >= 11) total += 10;
    else total += c.rank;
  }
  let softAces = aces;
  while (total > 21 && softAces > 0) {
    total -= 10;
    softAces--;
  }
  return { total, soft: softAces > 0, busted: total > 21 };
}
function weightedBlackjackReward() {
  const slots = FLEET_BLACKJACK_CONFIG.rewardSlots;
  let totalWeight = 0;
  for (const s of slots) totalWeight += Math.max(0, s.weight || 0);
  let roll = Math.random() * totalWeight;
  for (const s of slots) {
    roll -= Math.max(0, s.weight || 0);
    if (roll <= 0) return coinifyReward(s);
  }
  return coinifyReward(slots[slots.length - 1]);
}
function applyBlackjackHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.blackjackPlayed = true;
  const parts = [];
  if (!haul.lost) {
    if (haul.coins) {
      RUN.chips += haul.coins;
      parts.push(`${haul.coins} coins`);
    }
    if (haul.gems) {
      RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems);
      parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`);
    }
    if (haul.fuel) {
      RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel);
      parts.push(`${haul.fuel} fuel`);
    }
  }
  RUN.lastNotice = parts.length
    ? `Blackjack haul banked: ${parts.join(', ')}.`
    : 'Blackjack: nothing banked this ' + 'round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetBlackjack(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetBlackjackOverlay');
  if (old) old.remove();

  // Locks Blackjack for the world the moment it's opened (not just on completion) - the
  // starting hands and reward slots are randomized and visible immediately, so without this
  // a player could back out before drawing and re-open for a better starting deal for free.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.blackjackPlayed = true;
  saveRun();

  let deck = shuffle(freshDeck());
  function drawCard() {
    if (!deck.length) deck = shuffle(freshDeck());
    return deck.pop();
  }

  const state = {
    hands: Array.from({ length: FLEET_BLACKJACK_CONFIG.handCount }, () => ({
      cards: [],
      reward: weightedBlackjackReward(),
    })),
    // The dealer plays three hands too, one facing each of yours. Each shows one card face up and one face down.
    dealerHands: Array.from({ length: FLEET_BLACKJACK_CONFIG.handCount }, () => ({ cards: [drawCard(), drawCard()] })),
    dealerRevealed: false,

  }

  }
  function liveHands() {
    return state.hands.filter(canReceiveCard);
  }
  function anyStillStanding() {

  }

  const overlay = document.createElement('div');
  overlay.id = 'fleetBlackjackOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML =
    `
    <div class="wo wide" style="max-width:820px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body fleetGame">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Blackjack</em></h1>
        <div class="note fleetGameNote" style="text-align:center">Each of your hands plays the ` +
    `dealer hand above it and pays its reward if it wins. Hit to place cards, Stand when you're happy.</div>
        <div id="fleetBjMessage" style="min-height:18px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetBjHands" class="fleetBjHands fleetTwoOne"></div>
        <div id="fleetBjPoolWrap" class="fleetMiniPoolWrap" style="display:none">
          <div class="note" style="text-align:center;margin:4px 0 4px">Tap a card, then tap a hand to place it.</div>
          <div id="fleetBjPool" style="display:flex;justify-content:center;gap:8px"></div>
        </div>
        <div id="fleetBjResult"></div>
        <div id="fleetBjControls" style="display:flex;justify-content:center;gap:10px;` +
    `padding-top:10px;flex-wrap:wrap">
          <button class="wo-btn green" id="fleetBjDrawBtn">Hit (Draw 3)</button>
          <button class="wo-btn amber" id="fleetBjBankBtn">Stand</button>
          <button class="wo-btn gray" id="fleetBjExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const handsWrap = document.getElementById('fleetBjHands');
  const poolWrap = document.getElementById('fleetBjPoolWrap');
  const poolEl = document.getElementById('fleetBjPool');
  const message = document.getElementById('fleetBjMessage');
  const drawBtn = document.getElementById('fleetBjDrawBtn');
  const bankBtn = document.getElementById('fleetBjBankBtn');
  const exitBtn = document.getElementById('fleetBjExitBtn');

  let selectedPoolIdx = null;
  function cardHTML(c) {
    return (
      `<div class="card sm ${suitColorClass(c.color, c.suit)}">` +
      `<div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
    );
  }
  function cardBackHTML() {
    return `<div class="card back sm"></div>`;
  }
  function dealerStatus(dh) {
    const v = blackjackHandValue(dh.cards);
    return { total: v.total, soft: v.soft, busted: v.busted, natural: dh.cards.length === 2 && v.total === 21 };
  }
  function renderDealer() {
    renderHands();
  }

  function renderHands() {
    handsWrap.innerHTML = state.hands
      .map((hand, i) => {
        const st = handStatus(hand);
        const dh = state.dealerHands[i];
        const canTarget = state.pool.length > 0 && selectedPoolIdx != null && canReceiveCard(hand);
        const statusLabel = st.busted
          ? 'Bust'
          : st.natural
            ? 'Blackjack!'
            : st.total === 21
              ? '21 (locked)'
              : hand.cards.length
                ? String(st.total) + (st.soft ? ' (soft)' : '')
                : 'Empty';
        const statusClass = st.busted ? 'bjBust' : st.natural || st.total === 21 ? 'bjLocked' : '';
        let dealerCards,
          dealerLabel,
          dealerClass = '';
        if (state.dealerRevealed) {
          const ds = dealerStatus(dh);
          dealerCards = dh.cards.map(cardHTML).join('');
          dealerLabel = ds.busted ? 'Bust' : ds.natural ? 'Blackjack!' : String(ds.total);
          dealerClass = ds.busted ? 'bjBust' : '';
        } else {
          dealerCards = cardHTML(dh.cards[0]) + cardBackHTML();
          dealerLabel = 'Showing ' + rankLabel(dh.cards[0].rank);
        }
        const resultLabel = hand.outcome
          ? `<div class="fleetBjHandOutcome ${hand.outcome}">${hand.outcome === 'win' ? 'Win' : hand.outcome === 'push' ? 'Push' : 'Lose'}</div>`
          : '';
        return (
          `<div class="fleetBjHand ${st.busted ? 'busted' : ''} ${canTarget ? 'targetable' : ''}" ` +
          `data-bjhand="${i}">
        <div class="fleetBjHandReward">${hand.reward.label}</div>
        <div class="bjLine"><span>Dealer</span><b class="${dealerClass}">${dealerLabel}</b></div>
        <div class="fleetBjHandCards sm ${dh.cards.length > 3 ? 'many' : ''}">${dealerCards}</div>
        <div class="bjLine you"><span>You</span><b class="${statusClass}">${statusLabel}</b></div>
        <div class="fleetBjHandCards ` +
          `sm ${hand.cards.length > 3 ? 'many' : ''}">${hand.cards.map(cardHTML).join('')}</div>
        ${resultLabel}
      </div>`
        );
      })
      .join('');
    handsWrap.querySelectorAll('[data-bjhand]').forEach((el) => {
      el.onclick = () => {
        if (selectedPoolIdx == null) return;
        placeCard(+el.dataset.bjhand);
      };
    });
  }
  function renderPool() {
    if (!state.pool.length) {
      poolWrap.style.display = 'none';
      poolEl.innerHTML = '';
      return;
    }
    poolWrap.style.display = '';
    poolEl.innerHTML = state.pool
      .map(
        (c, i) =>
          `<div class="card sm ` +
          `pick ${suitColorClass(c.color, c.suit)} ${selectedPoolIdx === i ? 'selected' : ''}" ` +
          `data-poolcard="${i}"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
      )
      .join('');
    poolEl.querySelectorAll('[data-poolcard]').forEach((el) => {
      el.onclick = () => {

        renderHands();
      };
    });
  }
  function updateControls() {
    const dealing = state.pool.length > 0;
    drawBtn.style.display = dealing ? 'none' : '';
    bankBtn.style.display = dealing ? 'none' : '';
    exitBtn.style.display = dealing ? 'none' : '';
    drawBtn.disabled = liveHands().length === 0;
    // Stand only pays out hands that survived a real hit - with no starting cards, every hand
    // is empty (and un-busted) until you hit at least once, so without this a player could open
    // Blackjack and Stand for free with 3 empty "0" hands that can never actually beat a dealer.
    bankBtn.disabled = !state.hasDrawnOnce;
    bankBtn.textContent = state.hasDrawnOnce ? 'Stand' : 'Stand (hit first)';
  }

  function placeCard(handIdx) {
    const hand = state.hands[handIdx];
    if (!canReceiveCard(hand)) return;
    const card = state.pool.splice(selectedPoolIdx, 1)[0];
    hand.cards.push(card);
    selectedPoolIdx = null;
    const st = handStatus(hand);
    if (st.busted) {
      playSfx('lose');
      message.textContent = `Hand ${handIdx + 1} busted - reward forfeited.`;
    } else if (st.total === 21) {
      playSfx('open');
      message.textContent = `Hand ${handIdx + 1} locked at 21.`;
    } else {

    // to put them - discard the rest and force the round to a close instead of stranding cards.
    if (state.pool.length && liveHands().length === 0) {
      state.pool = [];
      message.textContent = 'No hands left to draw for.';

    renderHands();
    renderDealer();

    selectedPoolIdx = null;
    message.textContent = 'Assign all 3 cards before hitting again.';
    renderPool();
    renderHands();
    renderDealer();
    updateControls();
  }

  function formatBjHaul(h) {
    const parts = [];
    if (h.coins) parts.push(`${h.coins} Coins`);
    if (h.gems) parts.push(`${h.gems} Gem${h.gems > 1 ? 's' : ''}`);

    // Guards against a bank/exit that happens before any hit ever occurred - with no starting
    // cards, every hand is empty (and un-busted) until you hit at least once, so without this
    // check every hand would still read as "standing" and pay out for free against the dealer.
    if (!state.hasDrawnOnce) {
      message.textContent = 'Nothing to Stand on.';
      haul.lost = true;
      showResultPopup(haul, 'Nothing to Stand on', 'You left without hitting, so nothing was banked.');
      return;
    }

    // Reveal every dealer hand's hidden card. Each dealer hand then plays a standard hit-to-17 -
    // but only if the player hand facing it is still alive (no point drawing against a bust).
    state.dealerRevealed = true;
    state.hands.forEach((hand, i) => {
      const dh = state.dealerHands[i];
      if (handStatus(hand).busted || !hand.cards.length) return;

      while (dv.total < 17) {

        dv = blackjackHandValue(dh.cards);
      }
    });

    let dealerWins = 0;
    state.hands.forEach((hand, i) => {
      const st = handStatus(hand);
      const ds = dealerStatus(state.dealerHands[i]);
      if (st.busted || !hand.cards.length) hand.outcome = 'lose';
      else if (ds.busted) hand.outcome = 'win';
      // A real blackjack (21 on the first two cards) beats a dealer 21 built from more cards, and
      // only ties a dealer blackjack. A plain 21 loses to a dealer blackjack.
      else if (st.natural && !ds.natural) hand.outcome = 'win';
      else if (ds.natural && !st.natural) hand.outcome = 'lose';
      else if (st.total > ds.total) hand.outcome = 'win';
      else if (st.total < ds.total) hand.outcome = 'lose';
      else hand.outcome = 'push';
      if (hand.outcome === 'lose') dealerWins++;
      if (hand.outcome === 'win') {
        if (hand.reward.type === 'coins') haul.coins += hand.reward.amount;
        else if (hand.reward.type === 'gems') haul.gems += hand.reward.amount;
        else if (hand.reward.type === 'fuel') haul.fuel += hand.reward.amount;
      }

    haul.lost = haul.coins === 0 && haul.gems === 0 && haul.fuel === 0;
    const wins = state.hands.filter((h) => h.outcome === 'win').length;
    const dealerLabel = `You won ${wins} of ${state.hands.length} hands.`;
    message.textContent = '';
    playSfx(haul.lost ? 'lose' : 'open');
    showResultPopup(
      haul,
      dealerLabel,
      haul.lost ? 'No hand beat the dealer. Nothing banked.' : `You won ${formatBjHaul(haul)}.`
    );
  }

  // the round only closes when the player clicks Collect.
  function showResultPopup(haul, headline, detail) {
    const box = document.getElementById('fleetBjResult');
    if (!box || document.getElementById('fleetBjCollectBtn')) return;
    box.innerHTML =
      `<div class="fleetResultBox ${haul.lost ? 'lose' : 'win'}">
      <div style="font-size:12px;color:var(--dim)">${headline}</div>
      <div style="font-size:15px;font-weight:700;margin:2px 0 8px">${detail}</div>
      <button class="wo-btn ${haul.lost ? 'gray' : 'green'}" ` +
      `id="fleetBjCollectBtn">${haul.lost ? 'Close' : 'Collect'}</button></div>`;
    document.getElementById('fleetBjCollectBtn').onclick = () => {
      overlay.remove();
      onComplete(haul);
    };
  }

  drawBtn.onclick = startDraw;
  bankBtn.onclick = finishRound;
  exitBtn.onclick = finishRound;

  renderHands();
  renderPool();
  renderDealer();
  updateControls();
}


// ████████████████████████████████████████████████████████████████████████████████████
// ██                                                                                ██
// ██  Fleet Poker                                                                   ██
// ██  Fleet Compound bonus game. Hold'em with three hole cards.                     ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████
// Texas Hold'em, but you get 3 hole cards instead of 2. Build three 3-hole-card hands from nine dealt cards (3
// cards x 3 deals), assigning each card to one of your three hands as it's dealt - once placed, a card can never
// be moved. Three hidden computer hands (3 hole cards each) are generated up front; each of your hands has its own
// visible reward, revealed before a single card is dealt. Once all nine of your cards are placed, a single shared
// community board deals out - flop, then turn, then river - right on this same screen. Once the river lands, all
// three computer hands and all three outcomes (best 5-of-8 using the game's existing evaluateHand tiers via
// bestHandFromPool) reveal together, not one at a time. Opened with openFleetPoker({ onComplete(haul) }).

const FLEET_POKER_CONFIG = { handCount: 3, cardsPerHand: 3, deals: 3, cardsPerDeal: 3, communityCount: 5 };
function pokerHandRewards() {
  const ownedIds = new Set(RUN.hero?.items || []);
  const itemPool = Object.values(ITEMS).filter((it) => it.cost > 0 && !ownedIds.has(it.id));
  const itemId = itemPool.length ? shuffle([...itemPool])[0].id : 'supply_bag';
  const item = ITEMS[itemId] || ITEMS['supply_bag'];
  const currencyOptions = shuffle([
    { type: 'coins', amount: 25, label: '+25 Coins' },
    { type: 'coins', amount: 45, label: '+45 Coins' },
    { type: 'gems', amount: 1, label: '+1 Gem' },
    { type: 'gems', amount: 2, label: '+2 Gems' },
    { type: 'fuel', amount: 2, label: '+2 Fuel' },
    { type: 'fuel', amount: 3, label: '+3 Fuel' },
  ]);
  return shuffle([{ type: 'item', itemId: item.id, label: item.name }, currencyOptions[0], currencyOptions[1]]).map(
    coinifyReward
  );
}
function applyPokerHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.pokerPlayed = true;
  const parts = [];
  if (haul.coins) {
    RUN.chips += haul.coins;
    parts.push(`${haul.coins} coins`);
  }
  if (haul.gems) {
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems);
    parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`);
  }
  if (haul.fuel) {
    RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel);
    parts.push(`${haul.fuel} fuel`);
  }
  if (haul.itemIds && haul.itemIds.length) {
    for (const id of haul.itemIds) {
      if (!ITEMS[id]) continue;
      // Prize items cannot push you past your Item capacity. With no open slot, the item pays out its sell
      // value in coins instead.
      if (!ITEMS[id].weightless && equippedItemCount(RUN.hero) >= RUN.itemCap) {
        const coinsBack = Math.floor((ITEMS[id].cost || 40) / 2);
        RUN.chips += coinsBack;
        parts.push(`no open Item slot, so ${ITEMS[id].name} paid ${coinsBack} coins instead`);
      } else {
        RUN.hero.items.push(id);
        parts.push(`${ITEMS[id].name} added to your Fleet`);
      }
    }
  }
  RUN.lastNotice = parts.length ? `Poker haul banked: ${parts.join(', ')}.` : 'Poker: no matches won this round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetPoker(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetPokerOverlay');
  if (old) old.remove();

  // See openFleetBlackjack's note - locked the moment it opens so the visible computer-hand
  // rewards can't be scummed by backing out and reopening for a better set.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.pokerPlayed = true;
  saveRun();

  let deck = shuffle(freshDeck());
  function drawCard() {
    if (!deck.length) deck = shuffle(freshDeck());
    return deck.pop();
  }

  const rewards = pokerHandRewards();
  const state = {
    playerHands: Array.from({ length: FLEET_POKER_CONFIG.handCount }, (_, i) => ({
      cards: [],
      reward: rewards[i],
      outcome: null,
    })),
    computerHands: Array.from({ length: FLEET_POKER_CONFIG.handCount }, () => ({
      cards: Array.from({ length: FLEET_POKER_CONFIG.cardsPerHand }, () => drawCard()),
    })),
    community: [],
    pool: [],
    dealsUsed: 0,
    finished: false,
  };
  const haul = { coins: 0, gems: 0, fuel: 0, itemIds: [] };

  const overlay = document.createElement('div');
  overlay.id = 'fleetPokerOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML =
    `
    <div class="wo wide" style="max-width:900px;width:100%;overflow:clip">
      <div class="wo-stripe"></div>
      <div class="wo-body fleetGame">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Poker</em></h1>
        <div class="note fleetGameNote" style="text-align:center">Hold'em with 3 hole cards. ` +
    `Build three hands from nine cards. Once a card is placed, it's locked in.</div>
        <div id="fleetPokerMessage" style="min-height:18px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetPokerPoolWrap" class="fleetTray">

          <div id="fleetPokerPool" style="display:flex;justify-content:center;gap:8px"></div>

    `margin-top:6px">Reveal the Flop</button>
        </div>
        <div id="fleetPokerHands" class="fleetPokerHands fleetTwoOne"></div>
        <div id="fleetPokerControls" style="display:flex;justify-content:center;gap:10px;` +
    `padding-top:10px;flex-wrap:wrap">

  document.body.appendChild(overlay);

  const handsWrap = document.getElementById('fleetPokerHands');
  const poolWrap = document.getElementById('fleetPokerPoolWrap');
  const poolEl = document.getElementById('fleetPokerPool');
  const communityWrap = document.getElementById('fleetPokerCommunity');
  const boardLabelEl = document.getElementById('fleetPokerBoardLabel');
  const boardCardsEl = document.getElementById('fleetPokerBoardCards');
  const trayNote = document.getElementById('fleetPokerTrayNote');
  const message = document.getElementById('fleetPokerMessage');
  const controlsWrap = document.getElementById('fleetPokerControls');
  const dealBtn = document.getElementById('fleetPokerDealBtn');
  const revealBtn = document.getElementById('fleetPokerRevealBtn');
  const exitBtn = document.getElementById('fleetPokerExitBtn');

  let selectedPoolIdx = null;
  function cardHTML(c) {
    return (
      `<div class="card sm ${suitColorClass(c.color, c.suit)}">` +
      `<div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
    );
  }
  function cardBackHTML() {
    return `<div class="card back sm"></div>`;
  }
  // Item rewards get the same dotted underline as other tap-for-info text, and tapping one pops up the real item
  // card. An item prize is grayed out, with a note, when you have no open Item slot to keep it in.
  function noSlotFor(reward) {
    const it = ITEMS[reward.itemId];
    return !!it && !it.weightless && equippedItemCount(RUN.hero) >= RUN.itemCap;
  }
  function rewardLabelFor(reward) {
    if (reward.type !== 'item') return reward.label;
    const blocked = noSlotFor(reward);
    return (
      `🚚 <span class="hoverTip" ` +
      `data-pkitem="${reward.itemId}" ${blocked ? 'style="opacity:.5"' : ''}>${reward.label}</span>${
        blocked
          ? '<div style="font-size:10px;font-weight:600;' +
            'color:var(--dim);line-height:1.2">No open Item slot. Add a slot to keep it.</div>'
          : ''
      }`
    );
  }
  function showItemPreview(id) {
    const item = ITEMS[id];

    const pop = document.createElement('div');
    pop.style.cssText =
      'position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.72);' +
      'display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:pointer';
    pop.innerHTML =
      `<div style="zoom:1.6;background:var(--white);border-radius:10px;` +
      `padding:6px">${renderStandardItemCard(item, {})}</div><div style="color:#fff;font-size:13px">` +
      `Tap anywhere to close</div>`;
    pop.onclick = () => pop.remove();
    document.body.appendChild(pop);
  }

  // The computer's hole cards show face up from the moment all nine of yours are placed, and stay up through the
  // showdown.
  function laneLine(label, right, cls) {
    return `<div class="bjLine ${cls || ''}"><span>${label}</span>` + `<b>${right || ''}</b></div>`;
  }
  function renderHands() {
    handsWrap.innerHTML = state.playerHands
      .map((hand, i) => {
        const full = hand.cards.length >= FLEET_POKER_CONFIG.cardsPerHand;
        const canTarget = state.pool.length > 0 && selectedPoolIdx != null && !full;
        const placeholders = Array.from({ length: FLEET_POKER_CONFIG.cardsPerHand - hand.cards.length })
          .map(() => cardBackHTML())
          .join('');
        const showdown = !!hand.outcome;
        const compHTML = state.allPlaced
          ? `${laneLine('Computer', showdown ? hand.cBest.label : '', 'you')}
        <div class="fleetPokerHandCards sm">${state.computerHands[i].cards.map(cardHTML).join('')}</div>`
          : '';

          ? `<div class="fleetPokerOutcome ${hand.outcome}">${hand.outcome === 'win' ? `Win: ${rewardLabelFor(hand.reward)}` : hand.outcome === 'lose' ? 'Lose' : 'Push'}</div>`
          : '';
        return `<div class="fleetPokerHand ${full ? 'full' : ''} ${canTarget ? 'targetable' : ''}" data-pkhand="${i}">
        <div class="fleetPokerHandReward">${rewardLabelFor(hand.reward)}</div>
        ${state.allPlaced ? laneLine('You', showdown ? hand.pBest.label : '') : ''}
        <div class="fleetPokerHandCards sm">${hand.cards.map(cardHTML).join('')}${placeholders}</div>
        ${compHTML}
        ${outcomeHTML}
      </div>`;
      })
      .join('');
    handsWrap.querySelectorAll('[data-pkitem]').forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        showItemPreview(el.dataset.pkitem);
      };
    });
    handsWrap.querySelectorAll('[data-pkhand]').forEach((el) => {
      el.onclick = () => {
        if (selectedPoolIdx == null) return;
        placeCard(+el.dataset.pkhand);
      };
    });
  }
  function renderPool() {
    poolEl.innerHTML = state.pool
      .map(
        (c, i) =>
          `<div class="card sm ` +
          `pick ${suitColorClass(c.color, c.suit)} ${selectedPoolIdx === i ? 'selected' : ''}" ` +
          `data-poolcard="${i}"><div>${rankLabel(c.rank)}</div><div>${c.suit}</div></div>`
      )
      .join('');
    poolEl.querySelectorAll('[data-poolcard]').forEach((el) => {
      el.onclick = () => {
        selectedPoolIdx = +el.dataset.poolcard;
        renderPool();
        renderHands();
      };
    });
  }
  // The tray at the top holds whatever you are placing: the Deal button when it's time for the next
  // cards, or the three dealt cards while you place them. It keeps the same height either way so
  // the hands below never jump around.
  function updateControls() {
    const dealing = state.pool.length > 0;
    const dealsLeft = state.dealsUsed < FLEET_POKER_CONFIG.deals;
    poolWrap.style.display = state.allPlaced ? 'none' : '';
    dealBtn.style.display = !dealing && dealsLeft ? '' : 'none';
    poolEl.style.display = dealing ? 'flex' : 'none';
    trayNote.textContent = dealing
      ? 'Tap a card, then tap a hand to place it.'
      : dealsLeft
        ? `Round ${state.dealsUsed + 1} ` + `of ${FLEET_POKER_CONFIG.deals}`
        : '';
    exitBtn.style.display = dealing || state.allPlaced ? 'none' : '';
  }

  function placeCard(handIdx) {
    const hand = state.playerHands[handIdx];
    if (hand.cards.length >= FLEET_POKER_CONFIG.cardsPerHand) return;
    const card = state.pool.splice(selectedPoolIdx, 1)[0];
    hand.cards.push(card);
    selectedPoolIdx = null;
    renderPool();
    renderHands();
    if (!state.pool.length) {
      if (state.dealsUsed >= FLEET_POKER_CONFIG.deals) {
        updateControls();
        startReveal();
        return;
      } else message.textContent = 'Deal the next 3 cards when ready.';
    }
    updateControls();
  }
  function startDeal() {
    if (state.pool.length || state.dealsUsed >= FLEET_POKER_CONFIG.deals) return;
    for (let i = 0; i < FLEET_POKER_CONFIG.cardsPerDeal; i++) state.pool.push(drawCard());
    state.dealsUsed++;
    selectedPoolIdx = null;
    message.textContent = `Round ${state.dealsUsed} of ${FLEET_POKER_CONFIG.deals} - place all 3 cards.`;
    renderPool();
    renderHands();
    updateControls();
  }

  // Community board reveals in stages (flop, turn, river) right on this same screen, then every
  // hand's outcome shows at once - no clicking through matches one at a time.
  function communityCardsHTML() {
    const slots = [];
    for (let i = 0; i < FLEET_POKER_CONFIG.communityCount; i++)
      slots.push(state.community[i] ? cardHTML(state.community[i]) : cardBackHTML());
    return slots.join('');
  }
  // One row of five small cards with the Reveal button right under it. It sticks to the top of the
  // screen so the board is always visible while you read the hands below.
  function renderCommunityStrip(label) {
    communityWrap.style.display = '';
    boardLabelEl.textContent = label;
    boardCardsEl.innerHTML = communityCardsHTML();
  }
  // Community board reveal is now player-paced: the deal/placement controls hide once all hole
  // cards are placed, and a single "Reveal" button steps through flop -> turn -> river -> showdown.
  // No player action is possible while waiting (there's nothing left to place), but pacing it out
  // one click at a time gives them a beat to read the board and think about what they need before
  // the next card lands, instead of everything flashing up at once.
  let revealStage = 0;
  function startReveal() {
    revealStage = 0;
    state.allPlaced = true;
    updateControls();
    renderHands();
    renderCommunityStrip('Hole cards locked in.');
    message.textContent = 'Ready when you are.';
    revealBtn.textContent = 'Reveal the Flop';
    revealBtn.style.display = '';
    revealBtn.disabled = false;
  }
  function revealNextStage() {
    revealBtn.disabled = true;
    if (revealStage === 0) {
      state.community.push(drawCard(), drawCard(), drawCard());
      renderCommunityStrip('Flop');
      renderHands();
      playSfx('open');
      message.textContent = '';
      revealStage = 1;
      revealBtn.textContent = 'Reveal the Turn';
      revealBtn.disabled = false;
    } else if (revealStage === 1) {
      state.community.push(drawCard());
      renderCommunityStrip('Turn');
      renderHands();
      playSfx('open');
      message.textContent = '';
      revealStage = 2;
      revealBtn.textContent = 'Reveal the River';
      revealBtn.disabled = false;
    } else if (revealStage === 2) {
      state.community.push(drawCard());
      renderCommunityStrip('River');
      renderHands();
      playSfx('open');
      message.textContent = '';
      revealStage = 3;
      revealBtn.textContent = 'Show Hands';
      revealBtn.disabled = false;
    } else {
      revealBtn.style.display = 'none';
      resolveShowdown();
    }
  }
  revealBtn.onclick = revealNextStage;
  function resolveShowdown() {
    state.playerHands.forEach((hand, i) => {
      const cHand = state.computerHands[i];
      const pBest = bestHandFromPool([...hand.cards, ...state.community], 5);
      const cBest = bestHandFromPool([...cHand.cards, ...state.community], 5);
      const pSum = pBest.cards.reduce((a, c) => a + c.rank, 0);
      const cSum = cBest.cards.reduce((a, c) => a + c.rank, 0);
      let outcome;
      if (pBest.tier > cBest.tier) outcome = 'win';
      else if (pBest.tier < cBest.tier) outcome = 'lose';
      else if (pSum > cSum) outcome = 'win';
      else if (pSum < cSum) outcome = 'lose';
      else outcome = 'push';
      hand.outcome = outcome;
      hand.pBest = pBest;
      hand.cBest = cBest;
      if (outcome === 'win') {
        if (hand.reward.type === 'item') haul.itemIds.push(hand.reward.itemId);
        else if (hand.reward.type === 'coins') haul.coins += hand.reward.amount;
        else if (hand.reward.type === 'gems') haul.gems += hand.reward.amount;
        else if (hand.reward.type === 'fuel') haul.fuel += hand.reward.amount;
      }
    });
    message.textContent = '';
    renderCommunityStrip('Community Cards');
    renderHands();
    playSfx(state.playerHands.some((h) => h.outcome === 'win') ? 'open' : 'lose');
    controlsWrap.style.display = '';
    controlsWrap.innerHTML =
      `<button class="wo-btn amber" id="fleetPokerFinishBtn" ` + `style="width:100%">Collect Winnings</button>`;
    communityWrap.scrollIntoView({ block: 'nearest' });
    document.getElementById('fleetPokerFinishBtn').onclick = finishPoker;
  }
  function finishPoker() {
    if (state.finished) return;
    state.finished = true;
    overlay.remove();
    onComplete(haul);
  }

  dealBtn.onclick = startDeal;
  exitBtn.onclick = () => {
    overlay.remove();
    onComplete({ coins: 0, gems: 0, fuel: 0, itemIds: [] });
  };

  renderHands();
  renderPool();
  updateControls();
}


// ████████████████████████████████████████████████████████████████████████████████████
// ██                                                                                ██
// ██  Fleet Auction                                                                 ██
// ██  Fleet Compound bonus game. Bid on mystery lots against two bidders.           ██
// ██                                                                                ██
// ████████████████████████████████████████████████████████████████████████████████████
// Three mystery lots, bid on one at a time against two computer bidders with different behavior. Pay a flat coin
// fee to inspect a lot before bidding on it, or bid blind. Passing walks away from that lot for free at any point.
// A lot resolves the moment no bidder wants to raise further - if that's you, it's yours for the current bid; if
// it's a computer, it's gone. Opened with openFleetAuction({ onComplete(haul) }).

const FLEET_AUCTION_CONFIG = {
  inspectCost: 5,
  bidIncrement: 5,
  // Computer bidders never bid past a lot's real value (blind ranges sit well under it, revealed
  // ranges top out at exactly its value), so a lot can never cost the player more than it is
  // worth from the bots' pushing alone. Each bot also skips a random share of lots outright and has a
  // small coin pool, which is what leaves real deals on the table. blindRange / revealedRange are
  // fractions of the lot's value, rolled fresh per lot; skipChance is the odds the bot ignores a lot.
  bidders: [
    {
      id: 'steady',
      name: 'Steady Eddie',
      blindRange: [0.35, 0.6],
      revealedRange: [0.5, 0.75],
      skipChance: 0.3,
      chipsRange: [40, 70],
      style: 'Bids cautiously - never pays more than the lot is worth, and sits out some lots entirely.',
    },
    {
      id: 'bigspender',
      name: 'Big Spender',
      blindRange: [0.3, 0.5],
      revealedRange: [0.7, 1.0],
      skipChance: 0.2,
      chipsRange: [60, 95],
      style: "Lowballs a mystery lot, but will pay up to a revealed lot's full value - never more.",
    },
  ],
};
function auctionLotPool() {
  const ownedIds = new Set(RUN.hero?.items || []);
  const allItems = Object.values(ITEMS).filter((it) => it.cost > 0 && !ownedIds.has(it.id));
  // One lot is always a real Item, and it leans toward the better ones (60+ coin value) when any are left.
  const goodItems = allItems.filter((it) => it.cost >= 60);
  const itemPool = goodItems.length ? goodItems : allItems;
  const itemId = itemPool.length ? shuffle([...itemPool])[0].id : 'supply_bag';
  const item = ITEMS[itemId] || ITEMS['supply_bag'];
  const currencyOptions = shuffle([
    { type: 'coins', amount: 60, label: '+60 Coins', value: 60 },
    { type: 'coins', amount: 90, label: '+90 Coins', value: 90 },
    { type: 'gems', amount: 3, label: '+3 Gems', value: 75 },
    { type: 'fuel', amount: 5, label: '+5 Fuel', value: 40 },
  ]);
  const itemLot = { type: 'item', itemId: item.id, label: item.name, value: item.cost || 50 };
  return shuffle([itemLot, currencyOptions[0], currencyOptions[1]]).map(coinifyReward);
}
// Opening bids start low (about a fifth of the lot's value) so there is room to actually win a deal.
function startingBidFor(lot) {
  return Math.max(5, Math.round((lot.value * 0.2 + Math.random() * 8) / 5) * 5);
}
function applyAuctionHaul(haul) {
  if (!RUN) return;
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.auctionPlayed = true;
  const parts = [];
  if (haul.coins) {
    RUN.chips += haul.coins;
    parts.push(`${haul.coins} coins`);
  }
  if (haul.gems) {
    RUN.gems = Math.min(RUN.maxGems, RUN.gems + haul.gems);
    parts.push(`${haul.gems} gem${haul.gems > 1 ? 's' : ''}`);
  }
  if (haul.fuel) {
    RUN.fuel = Math.min(RUN.maxFuel, RUN.fuel + haul.fuel);
    parts.push(`${haul.fuel} fuel`);
  }
  if (haul.itemIds && haul.itemIds.length) {
    for (const id of haul.itemIds) {
      if (!ITEMS[id]) continue;
      // Prize items cannot push you past your Item capacity. With no open slot, the item pays out its sell
      // value in coins instead.
      if (!ITEMS[id].weightless && equippedItemCount(RUN.hero) >= RUN.itemCap) {
        const coinsBack = Math.floor((ITEMS[id].cost || 40) / 2);
        RUN.chips += coinsBack;
        parts.push(`no open Item slot, so ${ITEMS[id].name} paid ${coinsBack} coins instead`);
      } else {
        RUN.hero.items.push(id);
        parts.push(`${ITEMS[id].name} added to your Fleet`);
      }
    }
  }
  // The Fleet Auction shows its own results screen first, so this top-bar notice is only a short recap.
  RUN.lastNotice = parts.length ? `Auction lots won: ${parts.join(', ')}.` : 'Auction: no lots won this round.';
  saveRun();
  render(RETURN_TO_CASTLE_MENU ? castleMenuScreen() : mapScreen());
}
function openFleetAuction(options) {
  options = options || {};
  const onComplete = typeof options.onComplete === 'function' ? options.onComplete : function () {};
  const old = document.getElementById('fleetAuctionOverlay');
  if (old) old.remove();

  // See openFleetBlackjack's note - locked the moment it opens for the same scumming reason.
  if (!RUN.castleState) RUN.castleState = {};
  RUN.castleState.auctionPlayed = true;
  saveRun();

  // Each computer bidder gets its own coin pool for this auction (random within its configured range) that
  // depletes when it wins a lot.
  const bidderChips = {};
  for (const b of FLEET_AUCTION_CONFIG.bidders)
    bidderChips[b.id] = Math.round(b.chipsRange[0] + Math.random() * (b.chipsRange[1] - b.chipsRange[0]));

  const state = {
    lots: auctionLotPool().map((reward) => {
      const startBid = startingBidFor(reward);
      // Each bot's hidden willingness to pay for this specific lot, rolled once: blind, revealed, and
      // whether it is interested at all. Always at or under the lot's value.
      const caps = {};
      for (const b of FLEET_AUCTION_CONFIG.bidders) {
        const roll = (r) => Math.min(reward.value, Math.round(reward.value * (r[0] + Math.random() * (r[1] - r[0]))));
        caps[b.id] = {
          blind: roll(b.blindRange),
          revealed: roll(b.revealedRange),
          interested: Math.random() >= b.skipChance,
        };
      }
      return {
        reward,
        startBid,
        currentBid: startBid,
        highBidder: null,
        revealed: false,
        resolved: false,
        won: false,
        caps,
      };
    }),
    lotIndex: 0,
    haul: { coins: 0, gems: 0, fuel: 0, itemIds: [] },
    bidderChips,
    totalSpent: 0,
    finished: false,
  };

  const overlay = document.createElement('div');
  overlay.id = 'fleetAuctionOverlay';
  overlay.className = 'map-popup-overlay';
  overlay.style.paddingTop = '20px';
  overlay.innerHTML =
    `
    <div class="wo wide" style="max-width:820px;width:100%">
      <div class="wo-stripe"></div>
      <div class="wo-body">
        <h1 style="margin:2px 0 0;text-align:center">Fleet <em>Auction</em></h1>
        <div class="note" style="margin-top:2px;text-align:center">Three mystery lots, and one ` +
    `is always an Item. Inspect before you bid, or take the gamble blind.</div>
        <div id="fleetAuctionBidders" class="fleetAuctionBidders"></div>
        <div id="fleetAuctionLots" class="fleetAuctionLots"></div>
        <div id="fleetAuctionMessage" style="min-height:22px;text-align:center;font-size:13px;color:var(--dim)"></div>
        <div id="fleetAuctionControls" style="display:flex;justify-content:center;gap:10px;` +
    `padding-top:10px;flex-wrap:wrap"></div>
        <div style="display:flex;justify-content:center;padding-top:10px">
          <button class="wo-btn gray" id="fleetAuctionExitBtn">Back to Compound</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const lotsWrap = document.getElementById('fleetAuctionLots');
  const biddersWrap = document.getElementById('fleetAuctionBidders');
  const message = document.getElementById('fleetAuctionMessage');
  const controls = document.getElementById('fleetAuctionControls');
  const exitBtn = document.getElementById('fleetAuctionExitBtn');

  function bidderDef(id) {
    return FLEET_AUCTION_CONFIG.bidders.find((x) => x.id === id);
  }
  function bidderName(id) {
    const b = bidderDef(id);
    return b ? b.name : id;
  }
  function rewardLabelFor(reward) {
    return reward.type === 'item' ? `🚚 ${reward.label}` : reward.label;
  }
  function currentLot() {
    return state.lots[state.lotIndex];
  }

  // Shows each computer bidder's name, live remaining coin pool, and a one-line description of
  // how it decides whether to raise - so it's clear who you're bidding against and why, instead
  // of an invisible cap with no explanation.
  function renderBidders() {
    const youBox =
      `
      <div class="fleetAuctionBidder fleetAuctionYou">
        <div class="fleetAuctionBidderName">You</div>
        <div class="fleetAuctionBidderChips" style="color:var(--amber);` +
      `font-weight:800">${ICON.coin} ${RUN.chips} coins</div>
      </div>`;
    biddersWrap.innerHTML =
      youBox +
      FLEET_AUCTION_CONFIG.bidders
        .map(
          (b) => `
      <div class="fleetAuctionBidder hoverTip" data-title="${b.style}">
        <div class="fleetAuctionBidderName">${b.name}</div>
        <div class="fleetAuctionBidderChips">${ICON.coin} ${state.bidderChips[b.id]} coins left</div>
      </div>`
        )
        .join('');
  }

  function renderLots() {
    lotsWrap.innerHTML = state.lots
      .map((lot, i) => {
        const isActive = i === state.lotIndex && !lot.resolved;
        // A lot's contents show once it resolves, even if it was never inspected.
        const contents = lot.revealed || lot.resolved ? rewardLabelFor(lot.reward) : '???';
        const status = lot.resolved
          ? lot.won
            ? `Won for ${lot.currentBid} coins!`
            : lot.highBidder
              ? `Went to ${bidderName(lot.highBidder)} ` + `for ${lot.currentBid} coins`
              : 'Passed'
          : lot.highBidder
            ? `High bid: ${lot.currentBid} ` + `(${lot.highBidder === 'player' ? 'You' : bidderName(lot.highBidder)})`
            : `Starting bid: ${lot.startBid}`;
        return `<div class="fleetAuctionLot ${isActive ? 'active' : ''} ${lot.resolved ? 'resolved' : ''}">
        <div class="fleetAuctionLotTitle">Lot ${i + 1}</div>
        <div class="fleetAuctionLotContents">${contents}</div>
        <div class="fleetAuctionLotStatus">${status}</div>
      </div>`;
      })
      .join('');
    renderBidders();
  }
  function renderControls() {
    const lot = currentLot();
    if (!lot || lot.resolved) {
      controls.innerHTML = '';
      return;
    }
    const canInspect = !lot.revealed && RUN.chips >= FLEET_AUCTION_CONFIG.inspectCost;
    const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
    const canBid = RUN.chips >= nextBid;
    controls.innerHTML =
      `
      <button class="wo-btn teal" ` +
      `id="fleetAuctionInspectBtn" ${lot.revealed || !canInspect ? 'disabled' : ''}>${
        lot.revealed ? 'Inspected' : `Inspect (${FLEET_AUCTION_CONFIG.inspectCost} ` + `coins)`
      }</button>
      <button class="wo-btn green" id="fleetAuctionBidBtn" ${!canBid ? 'disabled' : ''}>Bid ${nextBid} Coins</button>
      <button class="wo-btn gray" id="fleetAuctionPassBtn">Pass</button>
    `;
    const inspectBtn = document.getElementById('fleetAuctionInspectBtn');
    if (inspectBtn) inspectBtn.onclick = doInspect;
    document.getElementById('fleetAuctionBidBtn').onclick = doBid;
    document.getElementById('fleetAuctionPassBtn').onclick = doPass;
  }

  function doInspect() {
    const lot = currentLot();
    if (!lot || lot.revealed || RUN.chips < FLEET_AUCTION_CONFIG.inspectCost) return;
    RUN.chips -= FLEET_AUCTION_CONFIG.inspectCost;
    lot.revealed = true;
    playSfx('buy');
    message.textContent = `Lot ${state.lotIndex + 1} revealed: ${rewardLabelFor(lot.reward)}.`;
    saveRun();
    renderLots();
    renderControls();
  }
  function computerRespond(lot) {
    let best = null;
    for (const bidder of FLEET_AUCTION_CONFIG.bidders) {
      if (lot.highBidder === bidder.id) continue;
      if (!lot.caps[bidder.id].interested) continue;
      const cap = lot.revealed ? lot.caps[bidder.id].revealed : lot.caps[bidder.id].blind;
      const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
      // A bidder also needs the coins in its own remaining pool to raise, not just to stay under its
      // willingness-to-pay cap.
      if (nextBid <= cap && nextBid <= state.bidderChips[bidder.id]) {
        if (!best || nextBid > best.nextBid) best = { bidder, nextBid };
      }
    }
    if (best) {
      lot.currentBid = best.nextBid;
      lot.highBidder = best.bidder.id;
      return best.bidder;
    }
    return null;
  }
  function doBid() {
    const lot = currentLot();
    if (!lot) return;
    const nextBid = lot.currentBid + FLEET_AUCTION_CONFIG.bidIncrement;
    if (RUN.chips < nextBid) return;
    lot.currentBid = nextBid;
    lot.highBidder = 'player';
    playSfx('buy');
    const counter = computerRespond(lot);
    if (counter) {
      message.textContent = `${counter.name} counters at ${lot.currentBid} coins.`;
      renderLots();
      renderControls();
    } else {
      message.textContent = `No other bidders. Lot ${state.lotIndex + 1} is yours for ${lot.currentBid} coins!`;
      winLot(lot);
    }
  }
  function doPass() {
    const lot = currentLot();
    if (!lot) return;
    lot.resolved = true;
    lot.won = false;
    lot.revealed = true;
    if (lot.highBidder) {
      // The winning bidder actually pays for the lot out of its own pool now, so its remaining
      // coins shown for the rest of the auction reflect what it really has left to spend.
      state.bidderChips[lot.highBidder] = Math.max(0, state.bidderChips[lot.highBidder] - lot.currentBid);
      message.textContent =
        `Lot ${state.lotIndex + 1} went to ${bidderName(lot.highBidder)} ` +
        `for ${lot.currentBid} coins - it was ${rewardLabelFor(lot.reward)}.`;
    } else {
      message.textContent = `Lot ${state.lotIndex + 1} passed - it was ${rewardLabelFor(lot.reward)}.`;
    }
    playSfx('lose');
    renderLots();
    setTimeout(advanceLot, 900);
  }
  function winLot(lot) {
    RUN.chips -= lot.currentBid;
    state.totalSpent += lot.currentBid;
    lot.resolved = true;
    lot.won = true;
    lot.revealed = true;
    if (lot.reward.type === 'item') state.haul.itemIds.push(lot.reward.itemId);
    else if (lot.reward.type === 'coins') state.haul.coins += lot.reward.amount;
    else if (lot.reward.type === 'gems') state.haul.gems += lot.reward.amount;
    else if (lot.reward.type === 'fuel') state.haul.fuel += lot.reward.amount;
    saveRun();
    renderLots();
    setTimeout(advanceLot, 900);
  }
  function advanceLot() {
    state.lotIndex++;
    if (state.lotIndex >= state.lots.length) {
      finishAuction();
      return;
    }
    message.textContent = '';
    renderLots();
    renderControls();
  }
  // Auction Results screen: every lot's contents and outcome, what was paid, and a coins-in and coins-out
  // breakdown.
  function finishAuction() {
    if (state.finished) return;
    state.finished = true;
    controls.innerHTML = '';
    message.textContent = '';
    const rows = state.lots
      .map((lot, i) => {
        const contents = rewardLabelFor(lot.reward);
        let outcome;
        if (lot.won) outcome = `<span style="color:var(--green)">Won for ${lot.currentBid} coins</span>`;
        else if (lot.highBidder)
          outcome =
            `<span style="color:var(--dim)">Went ` +
            `to ${bidderName(lot.highBidder)} for ${lot.currentBid} coins</span>`;
        else outcome = `<span style="color:var(--dim)">Passed</span>`;
        return `<div class="fleetAuctionResultRow"><span>Lot ${i + 1}: ${contents}</span>${outcome}</div>`;
      })
      .join('');
    const coinsGained = state.haul.coins || 0;
    const netCoins = coinsGained - state.totalSpent;
    const otherWins = [];
    if (state.haul.gems) otherWins.push(`${state.haul.gems} Gem${state.haul.gems > 1 ? 's' : ''}`);
    if (state.haul.fuel) otherWins.push(`${state.haul.fuel} Fuel`);
    if (state.haul.itemIds.length) otherWins.push(...state.haul.itemIds.map((id) => (ITEMS[id] ? ITEMS[id].name : id)));
    lotsWrap.innerHTML = '';
    biddersWrap.innerHTML = '';
    message.innerHTML =
      `
      <div style="text-align:left;max-width:420px;margin:0 auto">
        ${rows}
        <div class="fleetAuctionResultTotals">
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Coins ` +
      `spent bidding</span><span>${state.totalSpent}</span></div>
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Coins ` +
      `won from lots</span><span>${coinsGained}</span></div>
          <div class="fleetAuctionResultRow" style="border-top:none;padding-top:0"><span>Net ` +
      `coins</span><span style="color:${netCoins >= 0 ? 'var(--green)' : 'var(--red)'}">${netCoins >= 0 ? '+' : ''}${netCoins}</span>` +
      `</div>
          ${
            otherWins.length
              ? `<div class="fleetAuctionResultRow" style="border-top:none;` +
                `padding-top:0"><span>Also won</span><span>${otherWins.join(', ')}</span></div>`
              : ''
          }
        </div>
      </div>`;
    controls.innerHTML =
      `<button class="wo-btn amber" id="fleetAuctionResultsDoneBtn" ` +
      `style="width:100%;max-width:420px">Back to Compound</button>`;
    document.getElementById('fleetAuctionResultsDoneBtn').onclick = () => {
      overlay.remove();
      onComplete(state.haul);
    };
    exitBtn.style.display = 'none';
  }

  exitBtn.onclick = () => {
    const lot = currentLot();
    if (lot && !lot.resolved) {
      lot.resolved = true;
      lot.won = false;
      lot.revealed = true;
    }
    finishAuction();
  };

  renderLots();
  renderControls();
}

                ['♦', '20 coins', 'r'],

                    `<div style="display:flex;align-items:center;gap:5px;min-width:0"><span ` +

  if (MATCH_POPUP && MATCH_POPUP.outOfAttempts) {
    return (
      `${board}<div class="match-modal"><div class="wo" style="max-width:360px"><div ` +
      `class="wo-stripe"></div><div class="wo-body" style="text-align:center"><div class="wo-eyebrow">` +
      `Out of Attempts</div><h1>Thanks for <em>Playing!</em></h1><div class="note" ` +
      `style="margin-top:4px">Here's what you won this visit.</div>` +
      `<div>${matchVisitTallyLabel(st)}</div><div class="note" style="margin-top:8px">Any pairs you ` +
      `found are saved - come back another time to keep going.</div><button class="wo-btn amber" ` +
      `id="matchPopupContinueBtn" style="width:100%;margin-top:10px;pointer-events:auto">OK</button></div></div></div>`

  }
  if (MATCH_POPUP) {
    return (
      `${board}<div class="match-modal"><div class="wo" style="max-width:360px"><div ` +
      `class="wo-stripe"></div><div class="wo-body" style="text-align:center"><div ` +
      `class="wo-eyebrow">${MATCH_POPUP.jackpot ? 'Board Cleared' : 'Pair Matched'}</div>` +
      `<h1>${MATCH_POPUP.suitLabel} <em>${MATCH_POPUP.jackpot ? 'Jackpot!' : 'Pair!'}</em>` +

      `pointer-events:auto">Nice!</button></div></div></div>`
